levels.level.chasm_desc=لا يمكنك رؤية القاع.
levels.level.water_desc=إذا احترقت, ادخل الماء لإخماد النار.
levels.level.entrance_desc=الدرجات تؤدي إلى العمق الأعلى.
levels.level.exit_desc=الدرجات تؤدي إلى العمق الأدنى.
levels.level.embers_desc=الجمر يغطي الأرض.
levels.level.high_grass_desc=نبات كثيف يحجب الرؤية.
levels.level.locked_door_desc=هذا الباب مغلق, تحتاج إلى مفتاح مطابق لفتحه.
levels.level.crystal_door_desc=هذا الباب المغلق مصنوع من بلورة سحرية. يمكنك الرؤية من خلاله, لكنك ستحتاج إلى مفتاح بلوري لفتحه.
levels.level.locked_exit_desc=قضبان ثقيلة تحجب الدرج المؤدي إلى الأسفل.
levels.level.barricade_desc=المتاريس الخشبية مثبتة بإحكام لكنها جفت عبر السنين. هل يمكن أن تحترق?
levels.level.inactive_trap_desc=تم تفعيل هذا الفخ من قبل ولم يعد خطيرًا.
levels.level.statue_desc=أراد أحدهم تزيين هذا المكان, لكنه فشل, بشكل واضح.
levels.level.alchemy_desc=هذا الوعاء مملوء بماء سحري. يمكن خلط العناصر فيه لصنع شيء جديد!
levels.level.empty_well_desc=جفّ البئر.

