levels.caveslevel.exit_desc=السلم يؤدي إلى العمق الأدنى.
levels.caveslevel.high_grass_desc=فطريات ضخمة تحجب الرؤية.
levels.caveslevel.wall_deco_desc=عرق من معدن ما يظهر على الجدار. ذهب?
levels.caveslevel.bookshelf_desc=من يحتاج إلى رف كتب في كهف?
levels.caveslevel.region_deco_name=هيكل معدني
levels.caveslevel.region_deco_desc=هيكل كبير معدني بالكامل, بناه الأقزام على الأرجح عندما كانوا يستخرجون المعادن من هنا. يبدو لك أنك ترى مسارات عربات مناجم قديمة تمتد على طوله.

levels.citylevel.water_name=ماء مشبوه اللون
levels.citylevel.high_grass_name=أزهار متفتحة طويلة
levels.citylevel.entrance_desc=منحدر يؤدي إلى العمق الأعلى.
levels.citylevel.exit_desc=منحدر يؤدي إلى العمق الأدنى.
levels.citylevel.deco_desc=بعض البلاطات مفقودة هنا.
levels.citylevel.statue_desc=التمثال يصور قزمًا واقفًا بوضعية بطولية.
levels.citylevel.bookshelf_desc=صفوف الكتب في مختلف المجالات تملأ رف الكتب.
levels.citylevel.region_deco_name=قاعدة مشتعلة
levels.citylevel.region_deco_desc=قاعدة مرتفعة تتوجها لهب سحري أخضر ساطع. اللهب كثيف لدرجة يبدو معها صلبًا.

