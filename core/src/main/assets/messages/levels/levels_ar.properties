levels.level$feeling.chasm_desc=تتردد خطواتك في أرجاء الزنزانة.
levels.level$feeling.water_desc=تسمع رشاش الماء من حولك.
levels.level$feeling.grass_desc=رائحة النباتات تفوح بكثافة في الهواء.
levels.level$feeling.dark_desc=تسمع الأعداء يتحركون في الظلام.
levels.level$feeling.large_desc=يبدو هذا الطابق من الزنزانة واسعًا بشكل غير معتاد.
levels.level$feeling.traps_desc=تبدو الأرض هنا خطيرة بشكل خاص.
levels.level$feeling.secrets_desc=يوحي الجو بأن هذا الطابق يخفي أسرارًا كثيرة.

levels.mininglevel.wall_desc=جدار صخري أملس ليّن قليلًا مقارنة بالمعتاد. يمكنك التنقيب عبره بفأسك, لكن ذلك سيكلفك بعض الجهد ويزيد جوعك قليلًا.
levels.mininglevel.gold_extra_desc=على الأرجح يمكنك استخراجه بفأسك.
levels.mininglevel.crystal_name=شوكة بلورية
levels.mininglevel.boulder_name=صخرة ضخمة
levels.mininglevel.crystal_desc=هناك نتوء بلوري كبير وملون. هذه البلورات هشة ويمكن كسرها بسهولة بفأس, أو ستنكسر إذا تم التنقيب بجوارها.
levels.mininglevel.boulder_desc=هناك صخرة ضخمة تعترض الطريق. من السهل نسبيًا كسرها بفأس.
levels.mininglevel.barricade_desc=الحاجز الخشبي مثبت بإحكام ويعمل كدعامة للسقف.\n\nربما شُيّد هذا من قِبل الغنولز لتوفير بعض الحماية من تساقط الصخور. ستكون أي خلايا مجاورة محمية من فخاخ وهجمات تساقط الصخور.\n\nيبدو أنه سيحترق بنفس كفاءة أي حاجز آخر.

levels.prisonlevel.water_name=ماء بارد داكن
levels.prisonlevel.empty_deco_desc=هناك بقع دم قديمة على الأرض.
levels.prisonlevel.bookshelf_desc=هذا على الأرجح بقايا مكتبة السجن. هل يمكن أن تحترق?
levels.prisonlevel.region_deco_name=قفص سجن
levels.prisonlevel.region_deco_desc=قفص معدني كبير بما يكفي لشخص واحد. يبدو مثبتًا بالأرض بطريقة ما, لا يمكنك تحريكه.
levels.prisonlevel.region_deco_alt_name=قفص معلّق
levels.prisonlevel.region_deco_alt_desc=قفص معدني كبير بما يكفي لشخص واحد. إنه معلق فوق هاوية عميقة بسلسلة.

levels.sewerlevel.water_name=ماء عكر
levels.sewerlevel.empty_deco_desc=طحلب أصفر رطب يغطي الأرض.
levels.sewerlevel.bookshelf_desc=رف الكتب ممتلئ بكتب رخيصة لا فائدة منها. هل يمكن أن يحترق?
levels.sewerlevel.region_deco_name=برميل تخزين
levels.sewerlevel.region_deco_desc=برميل متين يكاد يكون بحجمك. لا بد أنه مملوء بشيء ما, إنه ثقيل جدًا لا يمكن تحريكه.

levels.vaultlevel$vaultflametrap.name=فتحة لهب الخزنة
levels.vaultlevel$vaultflametrap.desc=يبدو أن هذه الفتحة تُطلق دفعات من اللهب الأخضر على فترات منتظمة. يمكنك رؤية اللهب يبدأ بالاشتعال قبل أن يشتعل. عادةً ما يمكن تجنب اللهب, ولكن أي شيء يُمكّنك من مقاومة النار أو التأثيرات المرتبطة بمنطقة معينة يكون فعالاً أيضاً.



###Tiles
tiles.custom.carpet.name=سجادة
tiles.custom.carpet.desc=سجادة سميكة تغطي الأرض. لا بد أنها عولجت بطريقة ما, فهي غير قابلة للاشتعال.
