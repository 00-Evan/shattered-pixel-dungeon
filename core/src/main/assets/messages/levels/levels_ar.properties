###features
levels.features.chasm.chasm=الهاوية
levels.features.chasm.yes=نعم, أنا أعرف ما أفعله
levels.features.chasm.no=لا لقد غيرت راي
levels.features.chasm.jump=هل تريد حقا القفز إلى الهاوية? السقوط من ذلك الارتفاع سيكون مؤلما.
levels.features.chasm.ondeath=لقد سقطت حتى الموت...
levels.features.chasm.rankings_desc=مات عند الاصطدام



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=تمثال الفأر
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=الوسادة الملكية
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=تمثال على هيئة ملك الفئران. من صنع هذا?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=هذه الوسادة الأرجوانية المنتفخة ستكون صغيرة جدًا بالنسبة لك كسرير, لكنها الحجم المثالي لأهم فأر في العالم

levels.rooms.special.magicalfireroom$eternalfire.desc=جدارٌ من نارٍ خضراء كثيفة ساطعة هنا, يبدو أنه ناتج عن سحر. كثافته عالية لدرجة أنك لا تستطيع المرور من خلاله, وهو يُشعل أي شيء يقترب منه. لا يبدو أنه سينطفئ تلقائيًا, ستحتاج إلى استخدام شيء لإطفائه.

levels.rooms.special.sentryroom$sentry.name=حارس أحمر
levels.rooms.special.sentryroom$sentry.desc=بدو أن هذا الحارس ذو اللون الأحمر القاني متمركز هنا لحراسة الكنز الموجود في الطرف الآخر من هذه الغرفة. سيطلق عليك أشعة سحرية مدمرة إذا دخلت المنطقة التي يحميها.\n\nإنه محصن ضد جميع التأثيرات الضارة ويمكنه الرؤية من خلال الاختفاء, لكن يبدو أنه يستغرق بعض الوقت للشحن قبل أن يبدأ في إطلاق النار.\n\nبطريقة ما, لا يريد الحارس إلا إطلاق النار عليك, كما لو أنه يعلم أن سكان الزنزانة لا يشكلون تهديدًا للكنز
levels.rooms.special.sentryroom$sentry.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الدهليز.

levels.rooms.special.toxicgasroom$toxicvent.name=فوهة سامة
levels.rooms.special.toxicgasroom$toxicvent.desc=لا بد أن مغامرًا مهملًا قد فعّل هذا الفخ منذ زمن بعيد. فرغم أنه غير نشط, إلا أنه لا يزال ينفث غازًا سامًا في الغرفة, ولا يبدو أنه سيتوقف. ستحتاج إلى وسيلة ما لتجنب أضرار هذا الغاز إذا كنت ترغب في استكشاف هذه الغرفة.

levels.rooms.special.weakfloorroom$hiddenwell.name=بئر بعيد
levels.rooms.special.weakfloorroom$hiddenwell.desc=بالكاد يمكنك ملاحظة بئر في الأعماق أسفلك, ربما يوجد هناك شيء?

levels.rooms.quest.ambitiousimproom$questentrance.name=مدخل الخزنة
levels.rooms.quest.ambitiousimproom$questentrance.desc=يبدو أن هذه الحفرة المخيفة هي مدخل إلى خزنة قزمية قديمة. حاجز سحري يمنع الدخول, لكن يمكنك المشي فوقه كأنه أرضية هنا.

levels.rooms.quest.blacksmithroom$questentrance.name=مدخل المنجم
levels.rooms.quest.blacksmithroom$questentrance.desc=تقود هذه السلم إلى منجم قديم أسفل ورشة الحداد مباشرة.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=الحدادة
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=حدادة صغيرة أنشأها الحداد الترول, مجهزة بصينية فحم, وموقد, وحوض ماء يبدو قذر تماما.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=علامة المراسم
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=علامة مرسومة من أجل مراسم ما المظلمة, وعادة ما توضع الشموع في الأركان الأربعة.
levels.rooms.quest.ritualsiteroom$table.name=الطاولة المشؤومة
levels.rooms.quest.ritualsiteroom$table.desc=تبدو هذه الطاولة الثقيلة كأنها عُدلت بطريقة خشنة لتصبح نوعا من أداة التعذيب.

levels.rooms.quest.massgraveroom$massgravedeco.name=القبر الجماعي
levels.rooms.quest.massgraveroom$massgravedeco.desc=العظام مبعثرة على الأرضية, ماذا حدث هنا?

levels.rooms.quest.mineentrance$questexit.name=مخرج المنجم
levels.rooms.quest.mineentrance$questexit.desc=تقود هذه السلم خارج المنجم, عائدة إلى ورشة الحداد.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=المنصة
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=هذه المنصة الكبيرة بنفس حجم الحفرة فوقك. على الأرجح تشارك هذه المنصة في آلية مصعد ما عند الوصول إلى الخزنة بشكل طبيعي.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=بمجرد دخولك إلى الغرفة الكبيرة, يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\nأظن أنك دخلتَ الغرفة الأخيرة من الخزنة, تمثالي موجودٌ خلفها مباشرةً! أنا متأكد من وجود فخٍّ أو حارسٍ ما, ولا أظن أنك استكشفتَ الخزنة بالكامل بعد, لذا عليكَ الاستعداد جيدًا قبل المضي قدمًا! أريدك أن تحصل على جائزتي, لا أن تموت وأنت تحاول!
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=بمجرد دخولك إلى الغرفة الكبيرة, يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\nحسنًا, أعتقد أنك في الغرفة الأخيرة من الخزنة, يجب أن يكون تمثالي الصغير خلفها مباشرة! أنا متأكد من وجود نوع من الفخاخ أو الحارس الخبيث, تبدو مستعدًا جيدًا, لكن تأكد من أنك جاهز لمعركة كبيرة! أريدك أن تحصل على جائزتي بالفعل, لا أن تموت وأنت تحاول.
levels.rooms.quest.vault.vaultfinalroom.final_warning=تسمع شيئا يتراكم طاقته, خطوة أخرى للأمام ستُفعّل شيئا ما!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=علامة عملاقة
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=يبدو هذا النمط في بلاط الأرضية كنسخة عملاقة من علامة استدعاء من السجن.\n\nتهاوِ الأرضية كلها بالطاقة, وكأن قوة عظيمة بانتظار أن تُطلق.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=الذهب مكدس على الأرضية هنا, من المؤسف أنك لا تستطيع حمله معك خارج الخزنة.
levels.rooms.quest.vault.vaultfinalroom$finalroomdoor.desc=على هذا الباب رموز تشبه العلامة الموجودة على أرضية هذه الغرفة. ربما كانت مترابطة بطريقة ما?
levels.rooms.quest.vault.vaultfinalroom$finalroomdoor.desc_locked=الرموز على الباب تتوهج وتُصدر الطاقة نفسها التي يُصدرها العنصر الأكبر.\n\nلا يمكنك فتح الباب ما دامت طاقة العنصر تسري فيه.

###traps
levels.traps.alarmtrap.name=فخ الإنذار
levels.traps.alarmtrap.alarm=يُصدر الفخ صوتًا حادًا يتردد صداه في كل الزنزانة!
levels.traps.alarmtrap.desc=يبدو هذا الفخ مرتبطًا بآلية إنذار صاخبة. تفعيله سيُنبّه على الأرجح كل شيء في هذا المستوى.

levels.traps.blazingtrap.name=فخ اللهب
levels.traps.blazingtrap.desc=الدوس على هذا الفخ سيشعل مزيجًا كيميائيًا قويًا, أحرقًا مساحة واسعة.

levels.traps.burningtrap.name=فخ الاشتعال
levels.traps.burningtrap.desc=الدوس على هذا الفخ سيشعل مزيجًا كيميائيًا, مشعلًا المنطقة المحيطة.

levels.traps.chillingtrap.name=فخ التبريد
levels.traps.chillingtrap.desc=عند التفعيل, ستجوّد المواد الكيميائية في هذا الفخ الهواء المحيط بموقعه بسرعة.

levels.traps.confusiontrap.name=فخ غاز التشوش
levels.traps.confusiontrap.desc=تفعيل هذا الفخ سيُطلق سحابة من غاز التشوش في المنطقة المجاورة المباشرة.

levels.traps.cursingtrap.name=فخ اللعنة
levels.traps.cursingtrap.curse=أصبحت أدواتك المستهلَكة ملعونة!
levels.traps.cursingtrap.desc=يحتوي هذا الفخ على نفس السحر الخبيث الموجود في الأدوات الملعونة. تفعيله سيُلعّن بعض العناصر في المنطقة المجاورة.

levels.traps.disarmingtrap.name=فخ سلب السلاح
levels.traps.disarmingtrap.disarm=تم نقل سلاحك نقلًا مكانيًا!
levels.traps.disarmingtrap.desc=يحتوي هذا الفخ على سحر انتقال مكاني دقيق, ينقل سلاح ضحيته إلى موقع آخر.

levels.traps.disintegrationtrap.name=فخ التحلل
levels.traps.disintegrationtrap.one=حلّل الفخ %s الخاص بك!
levels.traps.disintegrationtrap.some=يتسبب الفخ في تفكيك بعض %s التي تحملها!
levels.traps.disintegrationtrap.ondeath=لقد قُتلتَ بفخ التفتيت...
levels.traps.disintegrationtrap.desc=عند تفعيله, سيخترق هذا الفخ أقرب هدف بأشعة التفتيت, مما يلحق ضررًا كبيرًا ويدمر العناصر.\n\nلحسن الحظ, آلية التفعيل ليست مخفية.

levels.traps.distortiontrap.name=فخ التشويه
levels.traps.distortiontrap.desc=مبني بسحر غريب من أصل غير معروف, سيستدعي هذا الفخ كل أنواع المخلوقات إلى هذا المكان.

levels.traps.explosivetrap.name=فخ متفجر
levels.traps.explosivetrap.desc=يحتوي هذا الفخ على مسحوق متفجر وآلية تفعيل. تفعيله سيؤدي إلى انفجار في المنطقة القريبة.

levels.traps.flashingtrap.name=فخ وامض
levels.traps.flashingtrap.desc=عند تفعيل هذا الفخ, سيشعل مسحوقًا قويًا متوهجًا مخزنًا بداخله, مما يؤدي إلى إصابة الضحية بالعمى المؤقت, والشلل, والإصابة.\n\nيجب أن يحتوي الفخ على مخزون كبير من البارود, لأنه يمكن تفعيله عدة مرات دون أن يتعطل

levels.traps.flocktrap.name=فخ القطيع
levels.traps.flocktrap.desc=ربما مزحة من ساحر هاوٍ, تفعيل هذا الفخ سيخلق قطيعًا من الأغنام السحرية.

levels.traps.frosttrap.name=فخ الصقيع
levels.traps.frosttrap.desc=عند تفعيله, ستجمد المواد الكيميائية في هذا الفخ الهواء بسرعة في نطاق واسع حول مكانه.

levels.traps.gatewaytrap.name=فخ البوابة
levels.traps.gatewaytrap.desc=هذا الفخ الخاص للنقل الآني يمكن تفعيله عددًا لا نهائيًا من المرات, وينقل دائمًا إلى الموقع نفسه.

levels.traps.geysertrap.name=فخ الينبوع
levels.traps.geysertrap.desc=عند تفعيله, سيؤدي هذا الفخ إلى اندفاع نافورة ماء, مما يلحق الضرر بالأعداء الناريين, ويدفع كل الشخصيات القريبة, ويخمد الحرائق, ويحول التضاريس المحيطة إلى ماء.

levels.traps.gnollrockfalltrap.name=فخ انهيار صخور الغنول
levels.traps.gnollrockfalltrap.desc=هذا الفخ الصخري مصنوع بمساعدة سحرية ما. عند تفعيله, يتسبب في تفكك الصخور وسقوطها فورًا من الأعلى في منطقة محيطة به مساحتها 5x5. نظرًا لأن الصخور في المنطقة أكثر ليونة, فلن يُلحق هذا الفخ ضررًا كبيرًا مقارنةً بالفخ الصخري العادي, كما أن دروعك لن تكون فعالة ضده. لن تسقط الصخور أيضًا في المواقع المجاورة لحاجز, لأن هذه الحواجز تُساعد في تثبيت السقف.\n\nهذا الفخ لا يفرق بين الصديق والعدو, ولذلك فهو ضارٌّ بالغول بنفس القدر الذي هو ضارٌّ بك

levels.traps.grimtrap.name=الفخ الكئيب
levels.traps.grimtrap.ondeath=لقد قُتلتَ بانفجار الفخ الكئيب...
levels.traps.grimtrap.desc=يحتوي هذا الفخ على سحر مدمر بالغ القوة, يكفي لقتل جميع الأبطال باستثناء الأقوياء منهم فورًا. سيؤدي تفعيله إلى إطلاق موجة سحرية قاتلة بعيدة المدى باتجاه أقرب شخصية.\n\nلحسن الحظ, آلية التشغيل ليست مخفية.

levels.traps.grippingtrap.name=فخ الإمساك
levels.traps.grippingtrap.desc=يعلق هذا الفخ بأقدام من يفعله, فيلحق الضرر به ويبطئ حركته.\n\nوبفضل بساطته, يمكن تفعيل هذا الفخ عدة مرات دون أن ينكسر.

levels.traps.guardiantrap.name=فخ الحارس
levels.traps.guardiantrap.alarm=يصدر الفخ صوتًا حادًا يتردد صداه في أرجاء الزنزانة!
levels.traps.guardiantrap.desc=هذا الفخ مرتبط بآلية سحرية غريبة, ستستدعي حراسًا وتنبه جميع الأعداء في الطابق.
levels.traps.guardiantrap$guardian.name=حراس مستدعين
levels.traps.guardiantrap$guardian.desc=يبدو هذا الشبح الأزرق صدى مستدعى لأحد حراس الزنزانة الحجريين.
levels.traps.guardiantrap$guardian.desc_weapon=بالرغم من أن التمثال نفسه شبه غير مادي, فإن _%s_ الذي يحمله يبدو حقيقيًا.
levels.traps.guardiantrap$guardian.discover_hint=يمكنك العثور على هذا العدو مع فخ محدد.

levels.traps.oozetrap.name=فخ الوحل
levels.traps.oozetrap.desc=سيقذف هذا الفخ وحلًا كاويًا عند تفعيله, وسيستمر في الحرق حتى يُغسل.

levels.traps.pitfalltrap.name=فخ الحفرة
levels.traps.pitfalltrap.triggered_hero=تبدأ الأرضية في الانهيار من حولك!
levels.traps.pitfalltrap.triggered=تبدأ الأرض بالانهيار حول الفخ المُفعّل!
levels.traps.pitfalltrap.no_pit=الأرض صلبة جدًا ليعمل فخ الحفرة هنا.
levels.traps.pitfalltrap.desc=هذا الفخ متصل بآلية باب مصيدة كبيرة, وبعد تشغيله بفترة وجيزة, سينزلق أي شيء قريب منه عبر الأرض ويسقط! لكنه لن يعمل في المناطق ذات الأرضيات الصلبة بشكل خاص

levels.traps.poisondarttrap.name=فخ السهم المسموم
levels.traps.poisondarttrap.ondeath=لقد قُتلتَ بفخ السهم المسموم...
levels.traps.poisondarttrap.desc=يجب أن تكون هناك آلية صغيرة لإطلاق السهام مخبأة في مكان قريب. تفعيل هذا الفخ سيجعلها تطلق سهمًا مسمومًا نحو أقرب هدف.\n\nلحسن الحظ, آلية التفعيل ليست مخفية.

levels.traps.rockfalltrap.name=فخ انهيار الصخور
levels.traps.rockfalltrap.ondeath=سُحقتَ بفخ انهيار الصخور...
levels.traps.rockfalltrap.desc=هذا الفخ متصل بسلسلة من الصخور المتناثرة في الأعلى, وتفعيله سيؤدي إلى سقوطها على الغرفة بأكملها! إذا لم يكن الفخ في غرفة محددة, فستسقط الصخور في منطقة حوله.\n\nلحسن الحظ, آلية التشغيل ليست مخفية.

levels.traps.shockingtrap.name=فخ الصعق
levels.traps.shockingtrap.desc=آلية مخزنة قدرًا هائلًا من الطاقة. تفعيل هذا الفخ سيطلق تلك الطاقة في مجال حوله.

levels.traps.stormtrap.name=فخ العاصفة
levels.traps.stormtrap.desc=آلية مخزنة قدرًا ضخمًا من الطاقة. تفعيل هذا الفخ سيطلق تلك الطاقة في عاصفة كهربائية كبيرة.

levels.traps.summoningtrap.name=فخ الاستدعاء
levels.traps.summoningtrap.desc=تفعيل هذا الفخ سيستدعي عددًا من وحوش هذه المنطقة إلى هذا الموقع.

levels.traps.teleportationtrap.name=فخ الانتقال المكاني
levels.traps.teleportationtrap.desc=كلما فُعّل هذا الفخ, سيُنقل كل ما حوله إلى مواقع عشوائية في هذا الطابق.

levels.traps.tengudarttrap.desc=من الواضح أن تينغو كان يستعد للمعركة. سيُفعّل هذا الفخ جهاز نفخ سهام مخفيًا, والذي سيطلق سهمًا مسمومًا على أقرب شيء ليس تينغو.\n\nالفخ متقن الصنع لدرجة أن آلية تشغيله يستحيل اكتشافها دون مساعدة سحرية. ومع ذلك, يظهر الفخ للحظة أثناء نصبه.

levels.traps.toxictrap.name=فخ الغاز السام
levels.traps.toxictrap.desc=تفعيل هذا الفخ سيطلق سحابة من الغاز السام في المنطقة المحيطة.

levels.traps.trap.discover_hint=يمكنك العثور على هذا الفخ عشوائيًا في الزنزانة. لكل منطقة فخوخها الخاصة التي قد تظهر.
levels.traps.trap.rankings_desc=قُتل بواسطة: %s

levels.traps.corrosiontrap.name=فخ الغاز الأكال
levels.traps.corrosiontrap.desc=تفعيل هذا الفخ سيطلق سحابة من غاز حمضي قاتل في المنطقة القريبة.

levels.traps.warpingtrap.name=فخ الالتواء
levels.traps.warpingtrap.desc=هذا الفخ مشابه لفخ النقل الآني, لكنه سيجعل البطل يفقد معرفته بتخطيط الطابق!

levels.traps.weakeningtrap.name=فخ الإضعاف
levels.traps.weakeningtrap.desc=يمتص السحر الأسود في هذا الفخ الطاقة من أي شيء يلمسه. قد تقاوم الأعداء الأقوياء هذا التأثير.

levels.traps.worndarttrap.name=فخ السهم البالي
levels.traps.worndarttrap.ondeath=لقد قُتلتَ بفخ السهم البالي...
levels.traps.worndarttrap.desc=يجب أن تكون هناك آلية صغيرة لإطلاق السهام مخبأة في مكان قريب. تفعيل هذا الفخ سيجعلها تطلق نحو أقرب هدف.\n\nلكنه بسبب قدمه لا يلحق ضررًا يذكر, بل إنه ليس مخفيًا حتى...



###levels
levels.cavesbosslevel.wires_name=أسلاك مكشوفة
levels.cavesbosslevel.wires_desc=الأرض محفورة جزئياً هنا, وتظهر بعض الأسلاك الكبيرة المكشوفة. لا بد أنها تربط مختلف الآلات الكهربائية ببعضها البعض.\n\nيجب أن يمر تيار كهربائي عبر الأسلاك. إذا وصل جهاز DM-300 إلى هذه النقطة, فقد يتمكن من سحب الطاقة منها.
levels.cavesbosslevel.energy_desc=الأرض هنا تتطاير منها شرارات الكهرباء, والسير عليها ضار. _يبدو أن الشرارات تنجذب في اتجاه معين..._ ربما تقود إلى مصدر الطاقة?
levels.cavesbosslevel.gate_name=بوابة معدنية
levels.cavesbosslevel.gate_desc=بوابة معدنية ضخمة تسد الطريق إلى مدينة الأقزام. يصدر الصندوق المعدني في المنتصف طنيناً عالياً, لا بد أنه متصل بالدوائر الكهربائية والآلات القريبة. ربما يؤدي تدمير DM-300 إلى فتح البوابة?
levels.cavesbosslevel.gate_desc_broken=لا بد أن البوابة كانت مرتبطة بـ DM-300 بطريقة ما, إذ انفجرت عندما هُزم DM-300. لم يتبقَّ الآن سوى قطع محطمة.
levels.cavesbosslevel.water_desc=مع كل هذه الكهرباء هنا, قد لا يكون الماء آمنًا دائمًا...

levels.citybosslevel.throne_name=اشواك
levels.citybosslevel.throne_desc=هذا العرش الضخم المثير للإعجاب هو مقر إمبراطورية الأقزام, التي استولى عليها الآن ساحر أموات متعطش للسلطة.\n\nيبدو أن هناك بعض الأجزاء السحرية أو الميكانيكية للعرش, وقد يتمتع ملك الأقزام بقوة إضافية عند الجلوس عليه.
levels.citybosslevel.summoning_name=قاعدة الاستدعاء
levels.citybosslevel.summoning_desc=تحتوي هذه القاعدة على فتحة كبيرة في المنتصف, تكاد تشع بطاقة مظلمة.\n\nيستخدم ملك الأقزام هذه القواعد كنقاط ارتكاز لسحره الأسود, ويستطيع استدعاء أتباعه إليها. يجب شحن القاعدة لبضع جولات قبل ظهور التابع, ويُستدل على نوع التابع المُستدعى من خلال القوة السحرية المتراكمة.

levels.caveslevel.grass_name=طحلب متوهج
levels.caveslevel.high_grass_name=فطر متوهج
levels.caveslevel.water_name=ماء مثلج بارد
