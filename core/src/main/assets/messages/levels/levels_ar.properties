levels.hallslevel.water_desc=يبدو كالحمم, لكنه بارد ومن المحتمل أن لمسه آمن.
levels.hallslevel.statue_desc=العمود مصنوع من جماجم بشرية حقيقية. رائع.
levels.hallslevel.bookshelf_desc=كتب بلغات قديمة تتصاعد منها الأدخنة في رف الكتب.
levels.hallslevel.region_deco_name=كتلة أنقاض
levels.hallslevel.region_deco_desc=قطعة حجرية ضخمة يبدو أنها انفصلت عن السقف أو جدار قريب.


