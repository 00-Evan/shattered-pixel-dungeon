###blobs
actors.blobs.blizzard.name=عاصفة ثلجية
actors.blobs.blizzard.desc=عاصفة ثلجية عنيفة تدور هنا.

actors.blobs.confusiongas.name=غاز إرباك
actors.blobs.confusiongas.desc=سحابة من غاز الإرباك تدور هنا.

actors.blobs.electricity.name=كهرباء
actors.blobs.electricity.desc=ميدان من الكهرباء يتلألأ ببريق ساطع هنا.
actors.blobs.electricity.rankings_desc=صعق كهربي
actors.blobs.electricity.ondeath=لقد صُعقت حتى الموت

actors.blobs.fire.name=نار
actors.blobs.fire.desc=نار تشتعل بعنف هنا.

actors.blobs.foliage.name=غطاء نباتي
actors.blobs.foliage.desc=أشعة من الضوء تخترق عتمة الحديقة الموجودة تحت الأرض.

actors.blobs.freezing.name=هواء مجمد
actors.blobs.freezing.desc=الهواء شديد البرودة بشكل غير طبيعي هنا.

actors.blobs.goowarn.name=طاقة مظلمة
actors.blobs.goowarn.desc=ذرات من الطاقة المظلمة تزحف هنا!

actors.blobs.inferno.name=جحيم
actors.blobs.inferno.desc=جحيم يشتعل بعنف هنا.

actors.blobs.paralyticgas.name=غاز شلل
actors.blobs.paralyticgas.desc=سحابة من غاز الشلل تدور هنا.

actors.blobs.regrowth.name=نمو مجدد

actors.blobs.sacrificialfire.name=نار التضحية
actors.blobs.sacrificialfire.desc=يوجد هنا مذبحٌ تعلوه نارٌ قربانية. أي مخلوق يُقتل هنا سيُستهلك كقربانٍ لأرواح الزنزانة.   ربما تُمنح مكافأة إذا تم تقديم تضحيات كافية?
actors.blobs.sacrificialfire.worthy=النار تستهلك قربانك وتزداد قوة.
actors.blobs.sacrificialfire.unworthy=النار تستهلك قربانك, لكنها لا تتغير.
actors.blobs.sacrificialfire.reward=النار تشتعل بشدة ثم تتلاشى, تاركة وراءها مكافأة!

actors.blobs.smokescreen.name=ستار دخان
actors.blobs.smokescreen.desc=سحابة من الدخان الأسود الكثيف تدور هنا.

actors.blobs.stenchgas.name=غاز نتنة
actors.blobs.stenchgas.desc=سحابة من النتنة الفاسدة تدور هنا.

actors.blobs.stormcloud.name=سحب عاصفة
actors.blobs.stormcloud.desc=سحابة من بخار الماء المتموج تدور هنا.

actors.blobs.toxicgas.name=غاز سام
actors.blobs.toxicgas.desc=سحابة خضراء من الغاز السام تدور هنا.
actors.blobs.toxicgas.rankings_desc=اختناق
actors.blobs.toxicgas.ondeath=لقيت حتفك بسبب الغاز السام...

actors.blobs.corrosivegas.name=غاز متعد
actors.blobs.corrosivegas.desc=سحابة من غاز متعد قاتل تدور هنا.

actors.blobs.waterofawareness.name=ماء اليقظة
actors.blobs.waterofawareness.procced=بمجرد أن تشرب رشفة, تشعر بالعلم يتدفق إلى عقلك.
actors.blobs.waterofawareness.desc=تنبعث قوة المعرفة من مياه هذا البئر. الشرب من البئر سيكشف لك جميع العناصر المجهزة, ويحدد اللعنات الموجودة على جميع العناصر في مخزونك, ويكشف جميع العناصر الموجودة في الطابق الحالي

actors.blobs.waterofhealth.name=ماء الصحة
actors.blobs.waterofhealth.procced=بمجرد أن تشرب رشفة, تشعر بجروحك تلتئم تماما.
actors.blobs.waterofhealth.desc=قوة الصحة تنبعث من ماء هذا البئر. الشرب من هذا البئر سيلم جروحك, ويشبع جوعك, وينظف اللعنات عن أي أغراض ترتديها.

actors.blobs.web.name=شبكة العنكبوت
actors.blobs.web.desc=شبكة كثيفة تغطي كل شيء هنا. أي شيء يلمسها أو يرمى عبرها سيكسرها, لكنه سيعلق في مكانه أيضا.



###buffs
actors.buffs.adrenaline.name=ادرينالين
actors.buffs.adrenaline.desc=اندفاع من القوة البدنية, إذ رفع الأدرينالين سرعة الهجوم والحركة.\n\nيسمح الأدرينالين لهدفه بالركض بسرعة 2x, والهجوم بسرعة 1.5x.\n\nالأدوار المتبقية: %s.

actors.buffs.adrenalinesurge.name=تعزيز القوه
actors.buffs.adrenalinesurge.desc=اندفاع من قوة عظيمة, لكنه للأسف ليس دائما.\n\nتعزيز القوة: +%d.\nالأدوار حتى يضعف التعزيز: %s.

actors.buffs.amok.name=همج
actors.buffs.amok.desc=يُسبب الهياج حالة من الغضب الشديد والارتباك لدى هدفه.   عندما يتعرض مخلوق ما للدخان, فإنه سيهاجم أي شيء قريب منه, سواء كان صديقًا أم عدوًا.   عدد دورات الهياج المتبقية: %s

actors.buffs.arcanearmor.name=درع سحري
actors.buffs.arcanearmor.desc=درع رقيق يحيط بك, يصد جزءا من الضرر الناجم عن الهجمات السحرية.\n\nدرعك السحري معزز حاليا بمقدار: 0-%d.\n\nالأدوار حتى يضعف الدرع السحري: %s.

actors.buffs.artifactrecharge.name=إعادة شحن الأثر
actors.buffs.artifactrecharge.desc=تتدفق الطاقة عبر جسدك, مما يزيد من معدل شحن القطع الأثرية المجهزة لديك \n\nكل قطعة أثرية تتأثر بشكل مختلف قليلاً, لكنها جميعًا ستكتسب الشحنة بشكل أسرع بكثير من المعتاد \n\nعدد الأدوار المتبقية: %s

actors.buffs.ascensionchallenge.name=لعنة الطلسم
actors.buffs.ascensionchallenge.desc=بطريقة ما, يحافظ يوغز على نفوذه في هذا العالم من خلال التميمة, ويحاول إيقاف صعودك!   قوة يوغز تجعل الزنزانة أكثر خطورة, إذ تزيد من عدد الأعداء وتجعلهم أقوى! ستستمر هذه القوة في التزايد إن لم تُضبط, ويمكن إضعافها بهزيمة الأعداء الذين تم تعزيزهم بقوة يوغز
actors.buffs.ascensionchallenge.desc_clear=الطاقة المظلمة المنبعثة من الطلسم قد ضعفت قدر الإمكان حتى الآن.
actors.buffs.ascensionchallenge.desc_beckon=الطلسم ينادي حاليا _الأعداء البعيدين,_ معلما إياهم على موقعك.
actors.buffs.ascensionchallenge.desc_haste=الطلسم يعجل حاليا _الأعداء البعيدين,_ مما يسمح لهم ببلوغك أسرع!
actors.buffs.ascensionchallenge.desc_slow=الطلسم _يبطئك حاليا,_ ويلغي تأثيرات تعزيز السرعة!
actors.buffs.ascensionchallenge.desc_damage=أصبحت الطاقة القادمة من الطلسم بالغة القوة لدرجة أنها _تؤذيك مباشرة!_
actors.buffs.ascensionchallenge.beckon=الطلسم يبدأ بنداء الأعداء البعيدين.
actors.buffs.ascensionchallenge.haste=الطلسم يبدأ بتسريع الأعداء البعيدين!
actors.buffs.ascensionchallenge.slow=بدأ الطلسم يشعر وكأنه ثقل رصاص في حقيبتك!
actors.buffs.ascensionchallenge.damage=الطلسم يبدأ بانبعاث الطاقة المظلمة. إنها تحرقك!
actors.buffs.ascensionchallenge.weaken_info=يمكن إضعاف لعنة الطلسم بهزيمة المزيد من الأعداء.
actors.buffs.ascensionchallenge.weaken_info_no_kills=إذا هزمت أعداء فستضعف لعنة الطلسم!
actors.buffs.ascensionchallenge.weaken=تشعر بلعنة الطلسم تضعف قليلا.
actors.buffs.ascensionchallenge.break=تتأنى لحظة لتعيد أنفاسك وتشعر بجروحك تبدأ بالالتئام!
actors.buffs.ascensionchallenge.almost=تشعر بأن قبضة يوج على الطلسم بدأت تضعف, أنت على وشك الوصول!
actors.buffs.ascensionchallenge.on_kill=الطاقة المظلمة تبتلعك...

actors.buffs.barkskin.name=جلد اللحاء
actors.buffs.barkskin.desc=جلدك متصلب, وملمسه خشن وصلب كالقشرة.   يزيد الجلد المقوى من فعالية درعك, مما يسمح لك بالدفاع بشكل أفضل ضد الهجمات الجسدية.   تم زيادة درعك حاليًا بمقدار: 0- %d .  يتحول حتى يضعف غلاف اللحاء: %s .   إذا تلقيت جلد اللحاء من مصادر متعددة, فسيتم تطبيق الأقوى منها فقط.

actors.buffs.barrier.name=حاجز
actors.buffs.barrier.desc=فقاعة قوة متينة تمنع كل الأضرار.\nسيتعرض الحاجز للتلف مهما كان ما يحميه طالما بقي منه درع. كما سيتلاشى هذا الدرع تدريجيًا مع مرور الوقت \nالحماية المتبقية: %d

actors.buffs.berserk.angered=غاضب
actors.buffs.berserk.berserk=توحش
actors.buffs.berserk.exhausted=مرهق
actors.buffs.berserk.recovering=استعاده
actors.buffs.berserk.angered_desc=تُعزز شدة إصابات المحارب البربري قوة ضرباته. ومع تلقيه للأذى الجسدي, يزداد غضبه, مما يمنحه ضررًا إضافيًا. ويُحتسب الضرر الذي يحجبه الدرع ضمن تراكم الغضب.   سيتلاشى الغضب بمرور الوقت. كلما انخفضت صحة المحارب, طالت مدة استمراره.   عند 100 %% عند الغضب, يستطيع المحارب الهائج أن ينتابه شعور بالهياج, مما يمنحه درعًا يعتمد على مستوى درعه ومستوى صحته المفقودة. أثناء الهياج, يتلاشى درعه تدريجيًا, وعندما ينفد, سيتعين عليه الراحة قبل أن يستعيد شعوره بالهياج مجددًا.   الغضب الحالي: _ %1$.0f %% _  _+ %2$.0f %% _ ضرر   درع بيرسيرك عند مستوى الدرع ونقاط الصحة الحالية: _ %3$d _
actors.buffs.berserk.berserk_desc=يتلاشى الخوف والشك, ولا يبقى سوى الغضب. في هذه الحالة, يصبح المحارب البربري قويًا للغاية, حيث يُلحق ضررًا قدره +50 %% الضرر واكتساب دروع إضافية, ولكن أيضًا فقدان الدروع في كل دور.   عندما تنخفض جميع دروعه إلى الصفر, سينتهي الهياج.   بعد الغضب, سيحتاج المحارب إلى التعافي قبل أن يتمكن من بناء الغضب مرة أخرى.   الدرع المتبقي: %d
actors.buffs.berserk.recovering_desc=للقوة الداخلية حدودها. يجب على المتوحش أن يستريح قبل أن يستخدم غضبه مرة أخرى.\n\nأثناء التعافي لا يكتسب المتوحش أي غضب من تلقيه الضرر.
actors.buffs.berserk.recovering_desc_turns=الأدوار حتى التعافي: _%d_
actors.buffs.berserk.recovering_desc_levels=المستويات حتى التعافي: _%.2f_
actors.buffs.berserk.rankings_desc=توحش حتى الموت
actors.buffs.berserk.action_name=هائج
actors.buffs.berserk.no_seal=تحتاج إلى ختمك المكسور لتتوحش!

actors.buffs.bleeding.name=نزيف
actors.buffs.bleeding.ondeath=نزفت حتى الموت...
actors.buffs.bleeding.heromsg=أنت تنزف!
actors.buffs.bleeding.rankings_desc=نزف حتى الموت
actors.buffs.bleeding.desc=هذا الجرح ينزف كمية مقلقة من الدم \n\nيُسبب النزيف ضرراً في كل دور. وفي كل دور, يتناقص الضرر بمقدار عشوائي, حتى يتوقف النزيف في النهاية \n\nالضرر الناتج عن النزيف الحالي: %d

actors.buffs.bless.name=مباركه
actors.buffs.bless.desc=يقول البعض إنها لحظة تركيز هائلة, مستوحاة من الآلهة.   تزيد البركة من الدقة والمراوغة بنسبة 25 %% مما يجعل المباركين أكثر فعالية في القتال.   عدد مرات البركة المتبقية: %s

actors.buffs.blindness.name=اعمي
actors.buffs.blindness.heromsg=لقد فقدت بصرك!
actors.buffs.blindness.desc=يُحوّل العمى العالم المحيط إلى ضباب داكن.   عندما يُصاب الشخص بالعمى, يتقلص مدى رؤيته إلى مربع واحد, مما يجعل الهجمات بعيدة المدى عديمة الجدوى, ويُسهّل عليه فقدان أثر الأعداء البعيدين. إضافةً إلى ذلك, لا يستطيع البطل الأعمى قراءة المخطوطات أو الكتب.   عدد دورات العمى المتبقية: %s .

actors.buffs.buff.heromsg=

actors.buffs.burning.name=يحترق
actors.buffs.burning.heromsg=اشتعلت فيك النار!
actors.buffs.burning.burnsup=%s يحترق!
actors.buffs.burning.ondeath=احترقت حتى الموت...
actors.buffs.burning.rankings_desc=احتراق حتى الرماد
actors.buffs.burning.desc=قلما يوجد شيء أكثر إيلاماً من أن تغمرك النيران.   ستُلحق النار ضرراً في كل دورة حتى تُطفأ بالماء أو تنطفئ. يمكن إطفاء النار بالوقوف في الماء, أو برذاذ جرعة مُحطِّمة.   بالإضافة إلى ذلك, قد يتسبب الحريق في اشتعال التضاريس أو الأشياء القابلة للاشتعال التي يلامسها.   عدد دورات الاحتراق المتبقية: %s .

actors.buffs.championenemy.warn=تشعر بحضور مميت.
actors.buffs.championenemy$blazing.name=بطل ملتهب
actors.buffs.championenemy$blazing.desc=يُلحق الأبطال المشتعلون ضررًا إضافيًا بنسبة 25% في الهجمات القريبة, ويُشعلون النار في الأعداء الذين يهاجمونهم, وهم محصنون ضد النار, وينشرون النار حولهم عند موتهم. مع ذلك, لا يمكنهم نشر النار على الماء
actors.buffs.championenemy$projecting.name=بطل مقذف
actors.buffs.championenemy$projecting.desc=الأبطال المقذفون يسببون ضررا قريبا أكبر بنسبة 25% ونطاق هجومهم +3.
actors.buffs.championenemy$antimagic.name=بطل مضاد للسحر
actors.buffs.championenemy$antimagic.desc=الأبطال المضادون للسحر يتلقون ضررا أقل بنسبة 50% ومحصون تماما من التأثيرات السحرية.
actors.buffs.championenemy$giant.name=بطل عملاق
actors.buffs.championenemy$giant.desc=الأبطال العمالقة يتلقون ضررا أقل بنسبة 80% ولهما مدى هجوم +1, لكنهما لا يستطيعان التحرك عبر الأماكن المغلقة.
actors.buffs.championenemy$blessed.name=بطل مبارك
actors.buffs.championenemy$blessed.desc=الأبطال المباركون يملكون دقة وتفاديا بمقدار 4x.
actors.buffs.championenemy$growing.name=بطل متنام
actors.buffs.championenemy$growing.desc=يكتسب الأبطال المتنامون زيادة مستمرة في الدقة والتفادي والضرر البدني, مع خفض للضرر المتلقى.\n\nتعزيز الدقة/التفادي/الضرر الحالي: %1$d%%\nخفض الضرر الحالي: %2$d%%

actors.buffs.charm.name=سحر الفتن
actors.buffs.charm.heromsg=أنت مفتون!
actors.buffs.charm.cant_attack=أنت مفتون بذلك العدو ولا تستطيع مهاجمته.
actors.buffs.charm.desc=التعويذة هي سحر تلاعب يمكنه أن يجعل الأعداء يعشقون بعضهم البعض مؤقتًا.   الشخصيات المتأثرة بالسحر لا تستطيع مهاجمة العدو المسحور مباشرةً, لكن مهاجمة أهداف أخرى تبقى ممكنة. يُقلل ألم الصدمة من مدة السحر.   بعض اللحظات الساحرة المتبقية: %s

actors.buffs.chill.name=مثلج
actors.buffs.chill.freezes=%sتجمد
actors.buffs.chill.desc=لم يتجمد تماماً, لكنه لا يزال بارداً جداً.   تُنفّذ الأهداف المُجمدة جميع الإجراءات ببطء أكبر, وذلك بحسب عدد الأدوار المتبقية في التأثير. وفي أسوأ الأحوال, يُعادل هذا إبطاء الحركة.   عدد لفات التبريد المتبقية: %1$s .  يتم تقليل السرعة عن طريق: %2$s %%

actors.buffs.combo.name=كومبو
actors.buffs.combo.action_name=هجوم متسلسل
actors.buffs.combo.combo=سلسلة من %d ضربة!
actors.buffs.combo.bad_target=يجب أن تستهدف عدوا في مدى الهجوم.
actors.buffs.combo.prompt=اختر هدفا للهجوم.
actors.buffs.combo.desc=يكتسب المصارع زخمًا مع كل ضربة ناجحة. تزيد كل هجمة عداد الضربات المتتالية بمقدار واحد, لكن التأخر في الضربات يُعيد عداد الضربات المتتالية إلى الصفر. وطالما أن المصارع لديه سلسلة ضربات متتالية, فإن أي درع لديه من ختمه المكسور لن يبدأ بالتلاشي.   يُتيح بناء سلسلة الضربات المتتالية تنفيذ هجمات متتالية خاصة لا يمكن تفويتها! يتم فتح هجمة مختلفة عند الوصول إلى 2, 4, 6, 8, و10 ضربات متتالية. بعض الحركات تُعيد ضبط سلسلة الضربات المتتالية, وبعضها لا, ولكن لا يمكن استخدام كل حركة إلا مرة واحدة في كل جلسة ضربات متتالية.   التشكيلة الحالية: %1$d .   يستمر في التناوب حتى يخسر سلسلة الضربات المتتالية: %2$s .
actors.buffs.combo$combomove.clobber.name=ضربة قاصمة
actors.buffs.combo$combomove.clobber.desc=يدفع عدوا للخلف بمقدار 2 مربعات, لكنه لا يسبب ضررا ولا يمكنه دفعه إلى الحفر. يزيد السلسلة بمقدار 1.
actors.buffs.combo$combomove.clobber.empower_desc=يدفع عدوا للخلف _مقدار 3 مربعات, ويصيبه بدوار, ويمكنه دفعه إلى الحفر,_ لكنه لا يسبب ضررا. يزيد السلسلة بمقدار 1.
actors.buffs.combo$combomove.slam.name=ضربة ساحقة
actors.buffs.combo$combomove.slam.desc=يسبب %d%% (combo*20%%) من قوة صدك الضررية كضرر إضافي. يعيد ضبط السلسلة عند الاستخدام.
actors.buffs.combo$combomove.slam.empower_desc=_يقفز حتى %1$d مربع_ ويسبب %2$d%% (combo*20%%) من قوة صدك الضررية كضرر إضافي. يعيد ضبط السلسلة عند الاستخدام
actors.buffs.combo$combomove.parry.name=اعتراض
actors.buffs.combo$combomove.parry.desc=يعترض الهجوم التالي خلال 1 دورة عند التفعيل, ويرد عليه فورا. يعيد ضبط السلسلة إذا لم يعترض شيئا.
actors.buffs.combo$combomove.parry.empower_desc=يعترض _جميع الهجمات_ خلال 1 دورة عند التفعيل, ويرد عليها فورا. يعيد ضبط السلسلة إذا لم يعترض شيئا.
actors.buffs.combo$combomove.crush.name=سحق
actors.buffs.combo$combomove.crush.desc=يسبب %d%% (combo*25%%) ضررا للهدف الأساسي, ونصف ذلك الضرر لجميع الأعداء الآخرين في منطقة تأثير 7x7. يعيد ضبط السلسلة عند الاستخدام.
actors.buffs.combo$combomove.crush.empower_desc=_يقفز حتى %1$d مربع_ ويسبب %2$d%% (combo*25%%) ضررا للهدف الأساسي, ونصف ذلك الضرر لجميع الأعداء الآخرين في منطقة تأثير 7x7. يعيد ضبط السلسلة عند الاستخدام.
actors.buffs.combo$combomove.fury.name=فروي
actors.buffs.combo$combomove.fury.desc=يضرب عدوا مرة واحدة عن كل نقطة سلسلة لديك, وكل ضربة تسبب 60% ضررا ويمكنها تشغيل التعويذات. يعيد ضبط السلسلة عند الاستخدام.
actors.buffs.combo$combomove.fury.empower_desc=_يقفز حتى %d مربعات_ ويضرب عدوًا مرة واحدة لكل كومبو لديك, كل ضربة تسبب 60%% من الضرر ويمكنها تشغيل التعويذات. يُصفَّر الكومبو عند الاستخدام.

actors.buffs.corruption.name=ملعون
actors.buffs.corruption.desc=يتغلغل الفساد في جوهر الكائن, فيشوهه عن طبيعته السابقة.   ستهاجم المخلوقات الفاسدة حلفاءها, وتتجاهل أعداءها السابقين. الفساد مُدمّر أيضاً, وسيؤدي تدريجياً إلى استسلام هدفه.   الفساد دائم, وآثاره لا تنتهي إلا بالموت.

actors.buffs.cripple.name=شلل
actors.buffs.cripple.heromsg=أنت معطّل الحركة!
actors.buffs.cripple.desc=أنت متأكد تماماً من أن الأرجل ليست مصممة للانحناء بهذه الطريقة\n\nيؤدي تعطل النصف إلى تقليل سرعة الحركة, مما يجعل تحريك البلاطة يستغرق عادةً دورتين بدلاً من دورة واحدة\n\nعدد لفات العاجز المتبقية: %s

actors.buffs.daze.name=مشوّش
actors.buffs.daze.heromsg=أنت مشوّش!
actors.buffs.daze.desc=طنين الأذنين وتشوش الرؤية يجعلان القتال صعباً \n\nأثناء حالة الذهول, تنخفض الدقة والمراوغة بنسبة 50% %% مما يجعل كلاً من الهبوط وتفادي الضربات أكثر صعوبة \n\nعدد نوبات الذهول المتبقية: %s .

actors.buffs.degrade.name=متدهور
actors.buffs.degrade.heromsg=يبدو أن معداتك ضعفت!
actors.buffs.degrade.desc=السحر الأسود القوي يستنزف القوة التي طبقتها لفائف الترقية على معداتك!   حتى بعد تدهور مستوى المعدات المطورة, ستُعامل كما لو كانت بمستوى أدنى مما هي عليه في الواقع. كل ترقية بعد +3 تصبح أضعف بشكل كبير من سابقتها. ستتغير أوصاف عناصرك لتعكس مستوى قوتها المنخفض.   لا يؤثر التدهور على متطلبات القوة, أو شحنات العصا, أو متانة الأسلحة المرمية, أو القطع الأثرية.   عدد دورات التدهور المتبقية: %s استخدام لفافة الترقية أو إزالة اللعنة سينهي التدهور فورًا

actors.buffs.doom.name=مقدَّر عليك الهلاك
actors.buffs.doom.desc=من الصعب الاستمرار عندما يبدو أن الكون يريد موتك\n\nستتلقى الشخصيات المحكوم عليها بالفناء ضرراً إضافياً بنسبة 67% من جميع المصادر \n\nالهلاك دائم, وآثاره لا تنتهي إلا بالموت

actors.buffs.dread.name=رهبة
actors.buffs.dread.desc=رعب عظيم لدرجة أنه سيدفع هدفه إلى الفرار من الزنزانة بالكامل!   ستفرّ المخلوقات المتأثرة بالرعب من خصمها بسرعة فائقة, وستختفي من الزنزانة تمامًا بمجرد أن تغيب عن الأنظار. الأعداء الذين يُهزمون بهذه الطريقة يمنحون نصف نقاط الخبرة ولا يسقطون أي عناصر. صدمة الألم ستُقلل من مدة الرعب.   ما تبقى من لحظات الرعب: %d .

actors.buffs.drowsy.name=النعس
actors.buffs.drowsy.desc=هناك قوة سحرية تجعل من الصعب البقاء مستيقظاً, وبعد بضع جولات, سيدخل الهدف في نوم سحري عميق.   يستطيع البطل مقاومة النعاس إما بتلقي الضرر أو بالتمتع بصحة كاملة.   يتقلب حتى ينام: %s .

actors.buffs.earthimbue.name=مشبع بالأرض
actors.buffs.earthimbue.desc=أنت مُتشبّع بقوة الأرض!\n\n\nستؤدي جميع الهجمات الجسدية إلى تحريك الأرض تحت العدو, مما يشل حركته لفترة قصيرة\n\nتُضفي دورات الأرض على المتبقي: %s

actors.buffs.enhancedrings.name=خواتم مُعزَّزة
actors.buffs.enhancedrings.desc=الأداة التي استخدمها المحتال مؤخرًا تعزّز خواتمه, بإضافة +1 إلى مستواها.\n\nالأدوار المتبقية: %s.

actors.buffs.fireimbue.name=مشبع بالنار
actors.buffs.fireimbue.desc=أنت مُتشبّع بقوة النار!   جميع الهجمات الجسدية لديها فرصة لإشعال النيران في الأعداء. بالإضافة إلى ذلك, أنت محصن تمامًا ضد تأثيرات النار.   تُضفي دورات النار على المتبقي: %s

actors.buffs.foresight.name=بصيرة
actors.buffs.foresight.desc=أنت قادر بطريقة ما على رؤية تخطيط التضاريس المحيطة بعقلك.   أثناء تأثير البصيرة, يتم الكشف لك عن جميع البلاطات في نطاق واسع, بما في ذلك أي فخاخ أو أبواب سرية.   عدد دورات التبصر المتبقية: %s .

actors.buffs.frost.name=متجمد
actors.buffs.frost.freezes=%sتجمد
actors.buffs.frost.desc=لا ينبغي الخلط بين هذا وبين التجميد الكامل, فهذا التجميد الأقل ضرراً يغلف الهدف ببساطة بالجليد.   يعمل التجميد بشكل مشابه للشلل, مما يجعل من المستحيل على الهدف القيام بأي حركة. على عكس الشلل, يزول التجميد فورًا إذا تعرض الهدف لأي ضرر, حيث يتحطم الجليد.   عدد دورات التجميد المتبقية: %s .

actors.buffs.frostimbue.name=مشبع بالصقيع
actors.buffs.frostimbue.desc=أنت مشبع بقوة جليدية!\n\nستتراكم البرودة تدريجيًا على الأعداء مع كل الهجمات الفيزيائية. علاوة على ذلك, أنت مناع تمامًا ضد البرد.\n\nالأدوار المتبقية من تفعية الصقيع: %s.

actors.buffs.fury.name=غاضب
actors.buffs.fury.heromsg=أنت تغلي غضبًا!
actors.buffs.fury.desc=إذا كنت غاضباً, فلن يحبك أعداؤك عندما تكون غاضباً.   يشتعل في داخلك غضب عارم, مما يزيد من الضرر الذي تُلحقه بالهجمات الجسدية بنسبة 50%. %% .   سيستمر هذا الغضب طالما أن إصابتك أقل من 50 %%  صحة.

actors.buffs.blobimmunity.name=حاجز التطهير
actors.buffs.blobimmunity.desc=هناك قوة غريبة تحيط بك بحاجز واقٍ رقيق, يحجب عنك جميع التأثيرات الضارة المحمولة جواً.   أنت محصن ضد جميع التأثيرات المرتبطة بمنطقة معينة طالما استمر هذا الحاجز \n\nعدد دورات الحصانة المتبقية: %s

actors.buffs.gravitychaostracker.name=فوضى الجاذبية
actors.buffs.gravitychaostracker.desc_intro=كل عدة أدوار, ستُقذف جميع الشخصيات في الطابق الحالي من الزنزانة في اتجاه عشوائي.
actors.buffs.gravitychaostracker.desc_positive=لكنك أنت وحلفاؤك تبدون مناعين أمام ذلك.
actors.buffs.gravitychaostracker.desc_duration=من غير الواضح كم سيستمر هذا الأثر, لكنه لا يمكن أن يدوم إلى الأبد.

actors.buffs.greaterhaste.name=سرعة فائقة
actors.buffs.greaterhaste.desc=دفعة سرعة هائلة, للحظة يبدو الأمر كما لو أن كل شيء آخر متوقف.   أثناء تأثير السرعة الفائقة, لا تستغرق الحركات أي وقت على الإطلاق, بينما تُنفَّذ الحركات الأخرى بالسرعة العادية. كل خطوة حركة تستهلك دورة واحدة من السرعة الفائقة.   منعطفات السرعة الأكبر المتبقية: %d .

actors.buffs.haste.name=جري سريع
actors.buffs.haste.desc=تتدفق الطاقة عبر عضلاتك, مما يسمح لك بالجري بسرعات مذهلة!   أثناء تأثير السرعة, ستجري بسرعة ثلاثة أضعاف, لكنك ستؤدي جميع الإجراءات الأخرى بالسرعة العادية.   عدد دورات العجلة المتبقية: %s

actors.buffs.healing.name=شفاء
actors.buffs.healing.desc=العلاج السحري هو الذي يتسبب في التئام الجروح والتئام الأنسجة \n\nفي كل دورة, ستتجدد الصحة تدريجياً حتى ينتهي مفعول الشفاء. قد يتلاشى مقدار الشفاء بمرور الوقت \n\nالعلاج التالي: %d  الشفاء المتبقي: %d

actors.buffs.herodisguise.name=تنكّر
actors.buffs.herodisguise.desc=لقد غيّرت السحر الوهمي مظهرك الجسدي! الأثر مجرد مظهر خارجي فحسب, لكنه يبدو غريبًا جدًا على أي حال.\n\nالأدوار المتبقية من التنكّر: %s.

actors.buffs.hex.name=مسحور
actors.buffs.hex.heromsg=لقد سُحرت!
actors.buffs.hex.desc=سحر أسود يستنزف التركيز, فيجعل الهدف مشوشًا قليلًا.\n\nالسحر الأسود يقلل الدقة والتفادي بنسبة 20%%, فيصبح الهدف أقل فعالية في القتال.\n\nالأدوار المتبقية من السحر الأسود: %s.

actors.buffs.holdfast.name=تماسك
actors.buffs.holdfast.desc=يحافظ المحارب على موضعه, مما يزيد درعه بمقدار %1$d-%2$d ويقلل معدل تلاشي بعض التعزيزات بنسبة %3$d%%. سيستمر هذا حتى يتحرك.

actors.buffs.hunger.hungry=الجوع
actors.buffs.hunger.starving=يتضور جوعا
actors.buffs.hunger.onhungry=أنت جائع.
actors.buffs.hunger.onstarving=أنت تتضوّر جوعًا!
actors.buffs.hunger.ondeath=لقد متّ جوعًا...
actors.buffs.hunger.cursedhorn=ينتزع القرن الملعون بعض طاقة الطعام أثناء أكلك.
actors.buffs.hunger.rankings_desc=مات جوعًا
actors.buffs.hunger.desc_intro_hungry=تسمع نداء معدتك للطعام, لكن الأمر ليس عاجلًا جدًا بعد.
actors.buffs.hunger.desc_intro_starving=أنت جائع لدرجة أنك تتألم.
actors.buffs.hunger.desc=يزداد الجوع تدريجيًا كلما قضيت وقتًا أطول في الزنزانة , حتى تبدأ في النهاية بالموت جوعًا. وخلال فترة الجوع, ستفقد صحتك تدريجيًا بدلًا من استعادتها.   التقنين مهم! إذا كنت تتمتع بصحة جيدة, فليس من السيئ أن تموت جوعاً إذا كان ذلك يعني توفر المزيد من الطعام لاحقاً. فالتقنين الفعال للطعام يُطيل مدة صلاحيته بشكل كبيرل مدة صلاحيته بشكل كبير!

actors.buffs.invisibility.name=غير مرئي
actors.buffs.invisibility.desc=أنت مندمج تماماً مع التضاريس المحيطة, مما يجعل رؤيتك مستحيلة.   أثناء اختفاءك, لا يستطيع الأعداء مهاجمتك أو ملاحقتك. الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) ستلغي الاختفاء فورًا.   عدد مرات الاختفاء المتبقية: %s .

actors.buffs.invulnerability.name=حصين
actors.buffs.invulnerability.desc=هذه الشخصية مشبعة بقوة حماية عظيمة, مما يمنحها فترة قصيرة من المناعة!\n\nالأدوار المتبقية: %s.

actors.buffs.levitation.name=يطير في الهواء
actors.buffs.levitation.desc=قوة سحرية ترفعك فوق الأرض, مما يجعلك تشعر بانعدام الوزن.   تتحرك الشخصيات المُحلقة بصمت وتتجاهل جميع التأثيرات الأرضية. لن تُفعّل الفخاخ, ولن يُطفئ الماء النار, ولن تُداس النباتات, ولن تُخطئ الجذور الهدف, وستحوم فوق الحفر. كن حذرًا, فقد تُفعّل كل هذه الأشياء بمجرد انتهاء التحليق!   عدد دورات الرفع المتبقية: %s .

actors.buffs.lifelink.name=وصل الحياة
actors.buffs.lifelink.ondeath=قتلك الضرر المرتبط بوصل الحياة...
actors.buffs.lifelink.desc=ترتبط قوة حياة هذه الشخصية بشخصية أخرى قريبة منها. وأي ضرر يلحق بها يتم تقاسمه بينهما.   كلما تعرضت هذه الشخصية للضرر, سيتم توجيه نصفه إلى هدف ربط الحياة بدلاً من ذلك.   عدد دورات الحياة المتبقية: %s .

actors.buffs.light.name=مضي
actors.buffs.light.desc=حتى في أحلك الأبراج المحصنة, يظل وجود ضوء ثابت بجانبك مصدرًا للراحة دائمًا.   يساعد الضوء في إبعاد الظلام, مما يسمح لك بالرؤية لمسافة معقولة بغض النظر عن البيئة المحيطة.   عدد دورات الإضاءة المتبقية: %s

actors.buffs.lockedfloor.name=الطابق مغلق
actors.buffs.lockedfloor.desc=الطابق الحالي مغلق, ولا يمكنك مغادرته!   أثناء إغلاق الطابق, لن تشعر بالجوع ولن تتلقى أي ضرر من الجوع. إضافةً إلى ذلك, إذا لم تسعَ لهزيمة زعيم هذا الطابق, ستتوقف تأثيرات التجديد التلقائي.   بالإضافة إلى ذلك, إذا تم إحياؤك بواسطة عنخ غير مبارك بينما الأرضية مغلقة, فسيتم إعادة ضبطها.   اقتل زعيم هذا الطابق لكسر القفل.

actors.buffs.lostinventory.name=مخزون مفقود
actors.buffs.lostinventory.desc=لقد فُقد مخزونك في مكان ما داخل الزنزانة! لن تتمكن من التقاط معظم العناصر أو استخدامها حتى تستعيده.

actors.buffs.magicalsight.name=رؤيه سحريه
actors.buffs.magicalsight.desc=بطريقة ما, تستطيع أن ترى بعقلك, بدلاً من عينيك.   أثناء تفعيل الرؤية السحرية, ستتمكن من الرؤية عبر جميع التضاريس في دائرة نصف قطرها 12 بلاطة.   عدد من المشاهد السحرية المتبقية: %s

actors.buffs.magicalsleep.name=خروف سحري
actors.buffs.magicalsleep.toohealthy=أنت بصحة جيدة جدًا, وتصدّ النعاس.
actors.buffs.magicalsleep.fallasleep=تغفو نومًا سحريًا عميقًا.
actors.buffs.magicalsleep.wakeup=تستيقظ منتعشًا وبصحة جيدة.
actors.buffs.magicalsleep.desc=لقد دخلت هذه الشخصية في سبات سحري عميق لن تستيقظ منه بشكل طبيعي.   النوم السحري يشبه النوم العادي, إلا أن الضرر فقط هو ما يتسبب في إيقاظ الهدف.   بالنسبة للبطل وحلفائه, يتمتع النوم السحري ببعض الخصائص العلاجية, مما يسمح لهم بالشفاء بسرعة أثناء الراحة.

actors.buffs.magicimmune.name=مناع ضد السحر
actors.buffs.magicimmune.desc=لقد فقدت جميع التأثيرات السحرية سيطرتها عليك, فأنت محصن تمامًا ضدها.   بينما تتمتع بمناعة سحرية, فإن جميع التأثيرات السحرية الضارة والمفيدة لن تنطبق عليك, بما في ذلك اللعنات والتعاويذ والعصي واللفائف والخواتم والتحف وما إلى ذلك. قدرات الدرع البطولي قوية بما يكفي للعمل بغض النظر عن هذا التأثير.   عدد دورات المناعة السحرية المتبقية: %s

actors.buffs.mindvision.name=رؤية ذهنية
actors.buffs.mindvision.desc=بطريقة ما, تستطيع أن ترى جميع المخلوقات الموجودة على هذا الطابق من خلال عقلك. إنه شعور غريب.   جميع الشخصيات في هذا الطابق مرئية لك طالما لديك قدرة الرؤية الذهنية. رؤية مخلوق ما من خلال الرؤية الذهنية تُعتبر بمثابة رؤيته أو وجوده بالقرب منك لأغراض العديد من التأثيرات السحرية.   ما تبقى من رؤى العقل: %s .

actors.buffs.momentum.momentum=يكتسب زخمًا
actors.buffs.momentum.running=عداء حر
actors.buffs.momentum.resting=استعاده
actors.buffs.momentum.action_name=جوله حره
actors.buffs.momentum.momentum_desc=أثناء تحركه, يكتسب العداء الحر زخماً يمكنه استخدامه لبدء الجري الحر.   تمنح كل شحنة من الزخم دورتين من الجري الحر, ويمكن للعداء الحر أن يجمع ما يصل إلى 10 شحنات. يتلاشى الزخم بسرعة عندما يتوقف العداء الحر عن الحركة.   شحنة الزخم الحالية: %d .
actors.buffs.momentum.running_desc=أثناء تحركه, يكتسب العداء الحر زخماً يمكنه استخدامه لبدء الجري الحر \n\nأثناء الجري الحر, يتحرك العداء الحر بسرعة مضاعفة ويكتسب قدرة إضافية على المراوغة بناءً على مستواه \n\nعدد الأدوار المتبقية: %d
actors.buffs.momentum.resting_desc=مع حركته, يكتسب العدّاء الحر زخمًا يمكنه إنفاقه لبدء الجري الحر.\n\nيحتاج العدّاء الحر إلى وقت لاستعادة طاقته قبل أن يكتسب زخمًا مجددًا.\n\nالأدوار المتبقية: %d.

actors.buffs.monkenergy.name=طاقه
actors.buffs.monkenergy.action=قدرات الراهب
actors.buffs.monkenergy.desc=مع هزيمة الأعداء, تكتسب الراهبة طاقةً تستطيع استخدامها في مجموعة متنوعة من القدرات. يمنح معظم الأعداء نقطة طاقة واحدة عند هزيمتهم, ولا تفقد الراهبة طاقتها بمرور الوقت\n\nالطاقة الحالية: %1$d / %2$d
actors.buffs.monkenergy.desc_cooldown=استخدم الراهب قدرة مؤخرًا, ويجب أن ينتظر قبل استخدام أخرى.\n\nمدة الانتظار الحالية: %d أدوار.
actors.buffs.monkenergy$monkability$flurry.name=سيل من الضربات
actors.buffs.monkenergy$monkability$flurry.desc=ضربتان فوريتان تسببان %1$d-%2$d من الضرر وتجاهلان الدرع. لا يمكن استخدام هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$flurry.empower_desc=ضربتان فوريتان تسببان %1$d-%2$d من الضرر, وتجاهلان الدرع, _وتستخدمان تعويذة سلاحك._ لا يمكن استخدام هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$focus.name=تركيز
actors.buffs.monkenergy$monkability$focus.desc=يخصّص الراهب دورة للتركيز, فيتمكن من صدّ الهجوم التالي الموجّه إليه.
actors.buffs.monkenergy$monkability$focus.empower_desc=يركّز الراهب _فورًا,_ فيتمكن من صدّ الهجوم التالي الموجّه إليه.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=مركز
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=يركّز الراهب على محياته, متوقعًا الهجوم التالي الموجّه إليه. وطالما أنه مركّز, فهو مضمون الصدّ للهجوم القادم.
actors.buffs.monkenergy$monkability$dash.name=داش
actors.buffs.monkenergy$monkability$dash.prompt=اختر موقعًا
actors.buffs.monkenergy$monkability$dash.desc=اندفاع فوري حتى 4 مربعات. يمكن لهذه القدرة تجاوز المخاطر, لكنها لا تمر عبر الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dash.empower_desc=اندفاع فوري حتى _8 مربعات_. يمكن لهذه القدرة تجاوز المخاطر, لكنها لا تمر عبر الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dragonkick.name=ركلة التنين
actors.buffs.monkenergy$monkability$dragonkick.desc=ركلة مدمرة تسبب %1$d-%2$d من الضرر وتجاهل الدرع. تدفع الركلة الهدف بعيدًا وتُشلّه لمدة مساوية لعدد المربعات التي يقطعها.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=ركلة مدمرة تسبب _%1$d-%2$d من الضرر_ وتجاهل الدرع. تدفع الركلة _جميع الأهداف المجاورة_ بعيدًا وتُشلّها لمدة مساوية لعدد المربعات التي تقطعها.
actors.buffs.monkenergy$monkability$meditate.name=تأمّل
actors.buffs.monkenergy$monkability$meditate.desc=يركّز الراهب طاقته في جسده لمدة 5 أدوار. يزيل هذا معظم الآثار السلبية ويمنحه 8 أدوار لإعادة شحن العصي والأدوات.
actors.buffs.monkenergy$monkability$meditate.empower_desc=تُركّز الراهبة طاقتها في جسدها لمدة 5 أدوار. يُزيل هذا معظم التأثيرات السلبية ويمنحها 8 أدوار لإعادة شحن عصاها وأدواتها. كما تكتسب مقاومة للضرر بنسبة 80% أثناء التأمل, وتتعافى ببطء بنسبة 20% من نقاط صحتها المفقودة.

actors.buffs.ooze.name=حمأة كاوية
actors.buffs.ooze.heromsg=تأكل الحمأة الكاوية لحمك. اغسلها!
actors.buffs.ooze.ondeath=تذوب تمامًا...
actors.buffs.ooze.rankings_desc=مذاب
actors.buffs.ooze.desc=هذا الحمض اللزج يلتصق باللحم, ويذيبه ببطء.   ستسبب المادة اللزجة ضرراً مستمراً بمرور الوقت, ولكن يمكن غسلها بالماء على الفور\n\nعدد لفات الوحل المتبقية: %s

actors.buffs.paralysis.name=شلل
actors.buffs.paralysis.heromsg=أنت مشلول!
actors.buffs.paralysis.out=صمد أمام الشلل
actors.buffs.paralysis.desc=في كثير من الأحيان, أسوأ شيء يمكن فعله هو عدم القيام بأي شيء على الإطلاق.   يُوقف الشلل جميع الحركات تمامًا, مما يُجبر الهدف على الانتظار حتى يزول مفعوله. وقد يدفع الألم الناتج عن تلقي الضرر الشخصيات إلى مقاومة الشلل, مما يُحررها من تأثيره.   عدد نوبات الشلل المتبقية: %s .

actors.buffs.physicalempower.name=معزّز جسديًا
actors.buffs.physicalempower.desc=تم تعزيز ضرباتك, مما يزيد مقدار الضرر الذي تسببه عند إصابة الأعداء بالهجمات الفيزيائية.\n\nضرر إضافي: %1$d.\nالضربات المتبقية: %2$d.

actors.buffs.pincushion.name=وسادة دبابيس
actors.buffs.pincushion.desc=الأسلحة المقذوفة التي استخدمتها ضد هذه الشخصية حاليًا مغروسة فيها, وستسقط على الأرض بعد هزيمتها.\n\nالعناصر الملاصقة حاليًا:

actors.buffs.poison.name=مسموم
actors.buffs.poison.heromsg=أنت مسموم!
actors.buffs.poison.ondeath=متّ بسبب السم...
actors.buffs.poison.rankings_desc=استسلم للسم
actors.buffs.poison.desc=ينتقل السم في الجسم تدريجيًا, فيعطل وظائفه الداخلية ببطء.\n\nيسبب السم ضررًا في كل دورة بمقدار يتناسب مع المدة المتبقية على زواله.\n\nالأدوار المتبقية من السم: %s.

actors.buffs.preparation.name=استعدادت
actors.buffs.preparation.action_name=ضربة مُعدّة
actors.buffs.preparation.desc=ينتظر القاتل بصبر, مُعدًا لضرب من الظلال.
actors.buffs.preparation.desc_dmg=سيسبب هجومه القادم _%1$d%% من الضرر الإضافي_, وسيُعدّم الأعداء العاديين الذين تقل صحتهم عن _%2$d%% من الصحة_, أو الزعماء الذين تقل صحتهم عن _%3$d%% من الصحة_.
actors.buffs.preparation.desc_dmg_likely=كما أن الهجوم سيكون أكثر عرضة لإلحاق ضرر أكبر.
actors.buffs.preparation.desc_blink=يتمكن من الوميض نحو عدو قبل ضربه, بمسافة قصوى تبلغ _%d._
actors.buffs.preparation.desc_invis_time=الأدوار التي قضيتها مخفيًا: _%d._
actors.buffs.preparation.desc_invis_next=الأدوار حتى الهجوم الأقوى: _%d._
actors.buffs.preparation.prompt=اختر هدفًا للهجوم!\nأقصى مسافة للوميض: %d
actors.buffs.preparation.no_target=لا يوجد ما يمكن هجومه هناك.
actors.buffs.preparation.out_of_reach=ذلك الهدف خارج نطاق الوصول.
actors.buffs.preparation.assassinated=اغتيل

actors.buffs.prismaticguard.name=حارس سحري
actors.buffs.prismaticguard.desc=أنت محمي بصورة موشورية غير نشطة حاليًا. عند ظهور الأعداء, ستتحرك الصورة الموشورية لحمايتك!   أثناء عدم النشاط, ستتعافى الصورة المنشورية تدريجياً من أي ضرر لحق بها.   نقاط الصحة الحالية: %d / %d .
actors.buffs.prismaticguard.desc_many=تستفيد هذه الصورة الطيفية أيضًا من قوة الجماعة. الأدوار المتبقية: %d.

actors.buffs.recharging.name=إعادة الشحن
actors.buffs.recharging.desc=الطاقة تتدفق فيك, مما يحسن معدل شحن عصيك وقوابك السحرية.   في كل دورة, سيزيد هذا التأثير من الشحنة الحالية بمقدار الربع, بالإضافة إلى إعادة الشحن العادية.   عدد دورات الشحن المتبقية: %s

actors.buffs.revealedarea.name=منطقة مكشوفة
actors.buffs.revealedarea.desc=كُشف مؤقتًا عن منطقة من الزنزانة أمام البطل, وسيراها أينما كان.\n\nالأدوار المتبقية: %s.

actors.buffs.revealedchar.name=مكشوف
actors.buffs.revealedchar.desc=هذه الشخصية مكشوفة أمام البطل, وسيُرى أينما كان.\n\nالأدوار المتبقية: %s.

actors.buffs.roots.name=متجزر
actors.buffs.roots.heromsg=لا يمكنك التحرك!
actors.buffs.roots.desc=تتشبث الجذور (السحرية أو الطبيعية) بالأقدام, وتجبرها على النزول إلى الأرض.   تُثبّت الجذور الهدف في مكانه, مما يجعل الحركة ومعظم قدرات الحركة مستحيلة. أما الإجراءات الأخرى فلا تتأثر, بما في ذلك تأثيرات الانتقال الآني.   عدد لفات الجذر المتبقية: %s .

actors.buffs.scrollempower.name=تعزيز اللفافة
actors.buffs.scrollempower.desc=الطاقة الناتجة عن اللفافة التي قرأها الساحر مؤخرًا تعزّز عصيه!\n\nزيادة المستوى: +%1$d.\nالاستخدامات المتبقية: %2$d.

actors.buffs.shadows.name=مندمج في الظل
actors.buffs.shadows.desc=تندمج في الظلال المحيطة بك, مما يمنحك القدرة على الاختفاء ويبطئ عملية التمثيل الغذائي لديك.   أثناء اختفائك, لا يستطيع الأعداء مهاجمتك أو ملاحقتك. معظم الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) تُبطل الاختفاء فورًا. بالإضافة إلى ذلك, أثناء اندماجك مع الظل, يتباطأ معدل شعورك بالجوع.   ستبقى متخفياً في الظلال حتى تغادرها أو حتى يتصل بك عدو.

actors.buffs.slow.name=تباطؤ
actors.buffs.slow.desc=يؤثر سحر الإبطاء على معدل الزمن لدى الهدف, فكل شيء بالنسبة له يتحرك بسرعة فائقة \n\nالشخصية البطيئة تقوم بجميع الإجراءات في ضعف الوقت الذي تستغرقه عادةً \n\nمنعطفات بطيئة متبقية: %s

actors.buffs.snipersmark.name=علامة القناص
actors.buffs.snipersmark.action_name_snapshot=لقطة
actors.buffs.snipersmark.action_name_volley=رشقة
actors.buffs.snipersmark.action_name_sniper=رصاصة القناص
actors.buffs.snipersmark.desc=تُركّز القناصة على الهدف الذي هاجمته مؤخرًا. وهي قادرة على تنفيذ هجوم خاص بقوسها, والذي يختلف باختلاف مستوى تطوير القوس.   سيطلق القوس غير المعزز طلقة سريعة, والتي تسبب ضررًا أقل ولكنها لا تستغرق أي وقت لإطلاقها.   القوس المُعزز لزيادة السرعة يُطلق وابلًا من ثلاثة أسهم. كل سهم يُلحق ضررًا أقل, لكنه لا يزال قادرًا على تفعيل التعويذة. يستغرق إطلاق هذا الوابل دورًا واحدًا.   القوس المعزز لزيادة الضرر سيطلق طلقة قناص. هذه الطلقة مضمونة الإصابة, وتلحق ضررًا إضافيًا بناءً على المسافة من الهدف, وتستغرق دورتين لإطلاقها.   عدد الأدوار المتبقية: %s .

actors.buffs.soulmark.name=موسوم بالروح
actors.buffs.soulmark.desc=لقد استمد الساخر قوة روح هذا المخلوق, مما يسمح له بالالتئام عند تلقي هذا المخلوق للضرر الجسدي.\n\nالأدوار المتبقية من علامة الروح: %s.

actors.buffs.stamina.name=التحمل
actors.buffs.stamina.desc=لديك قدرة تحمل لا تنضب, مما يسمح لك بالحركة بشكل أسرع! \n\nأثناء تأثير القدرة على التحمل, ستجري بسرعة +50 %% ستؤدي جميع الإجراءات الأخرى بسرعة عادية, ولكنها ستنفذ جميع الإجراءات الأخرى بسرعة عادية \n\nعدد دورات التحمل المتبقية: %s

actors.buffs.swarminteltracker.name=ذكاء السرب
actors.buffs.swarminteltracker.desc=تتسبب ذكاءات السرب في جذب الأعداء لأعداء آخرين إلى موقعك عندما يرونك أو حلفائك.   هذا الجذب له نطاق محدود, ولكن كلما طالت مدة رؤيتك زاد هذا النطاق, ليصل إلى حد أقصى قدره 12. حتى فقدان الرؤية للحظة يعيد ضبط النطاق.   أكبر نطاق جذب سياحي حالي: %d .

actors.buffs.vulnerable.name=قابل للإصابة
actors.buffs.vulnerable.heromsg=تشعر بالهشاشة!
actors.buffs.vulnerable.desc=يزيد سحر الهشاشة كل الضرر الجسدي الذي تتكبده الشخصية بنسبة 33%%, بعد خصم الدرع منه.\n\nالأدوار المتبقية من قابلية الإصابة: %s.

actors.buffs.terror.name=مرعوب
actors.buffs.terror.desc=الإرهاب هو سحر تلاعب يجبر هدفه على الدخول في حالة ذعر لا يمكن السيطرة عليها.   تُجبر الشخصيات المذعورة على الفرار من خصومها, محاولةً وضع أكبر عدد ممكن من الأبواب والجدران بينها وبين خصومها. إلا أن صدمة الألم ستُقلل من مدة الرعب.   ما تبقى من جولات الرعب: %s

actors.buffs.toxicimbue.name=مشبع بالسموم
actors.buffs.toxicimbue.desc=أنت مشبع بطاقة سامة!   أثناء تحركك, سيتصاعد منك غاز سام باستمرار, مُلحقًا الضرر بأعدائك. أنت محصن ضد الغاز السام والسموم طوال مدة تأثيره, وكذلك لبضع جولات لاحقة.   عدد دورات التشبع السام المتبقية: %s .

actors.buffs.corrosion.name=التآكل
actors.buffs.corrosion.heromsg=أنت تذوب!
actors.buffs.corrosion.ondeath=تذوب وتتبخر...
actors.buffs.corrosion.rankings_desc=مذاب
actors.buffs.corrosion.desc=حمض قوي يذيب اللحم والمعدن والعظام بمعدل ينذر بالخطر \n\nيزداد الضرر الناتج عن التآكل بمرور الوقت, حيث يستمر الهدف في الانصهار.   عدد دورات التآكل المتبقية: %1$s   \n\nأضرار التآكل الحالية: %2$d

actors.buffs.vertigo.name=دائخ
actors.buffs.vertigo.desc=قد يكون المشي في خط مستقيم صعباً عندما يدور العالم كله.   أثناء تأثير الدوار, ستتحرك الشخصيات التي تحاول التحرك في اتجاه عشوائي, بدلاً من الاتجاه الذي كانت تنوي الذهاب إليه.   نوبات الدوار المتبقية: %s .

actors.buffs.wandempower.name=عصي معززة
actors.buffs.wandempower.desc=تمت تدعيم عصيك المسببة للضرر, لزيادة مقدار الضرر الذي تلحقه لعدة ضربات.\n\nالضرر الإضافي: %1$d.\nالضربات المتبقية: %2$d.

actors.buffs.weakness.name=اضعاف
actors.buffs.weakness.heromsg=تشعر بالوهن!
actors.buffs.weakness.desc=تبدو كل الأشياء فجأة أثقل بكثير.\n\nيقلل سحر الوهن من القوة الجسدية للشخصية, مما يقلل الضرر الذي تسببه بنسبة 33%%.\n\nالأدوار المتبقية من الوهن: %s.

actors.buffs.wellfed.name=شبعان
actors.buffs.wellfed.desc=تشعر بالرضا والامتلاء.\n\nفي حالة الشبع, لن يزداد جوعك, وستلتئم كمية إضافية من الصحة بمرور الوقت.\n\nالأدوار المتبقية: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=لا يمكنك استهداف نفسك!
actors.hero.abilities.armorability.no_target=لا يوجد شيء لاستهدافه هناك!
actors.hero.abilities.armorability.prompt=اختر موقعا لاستهدافه
actors.hero.abilities.armorability.cost=تكلفة الشحنة: _%d_

actors.hero.abilities.warrior.heroicleap.name=القفزة البطولية
actors.hero.abilities.warrior.heroicleap.prompt=اختر اتجاه القفز
actors.hero.abilities.warrior.heroicleap.short_desc=ينفذ المحارب _القفزة البطولية_ نحو موقع مستهدف, محلقا فوق الأعداء والمزالق.
actors.hero.abilities.warrior.heroicleap.desc=يقفز المحارب نحو موقع مستهدف, متجاوزا أي أعداء أو مزالق في طريقه. لكنه لا يستطيع القفز فوق الجدران أو أي تضاريس صلبة أخرى.
actors.hero.abilities.warrior.shockwave.name=الموجة الصدمية
actors.hero.abilities.warrior.shockwave.short_desc=يطلق المحارب _موجة صدمية_ مخروطية الشكل بضرب الأرض. الأعداء الذين تصيبهم الموجة يتعرضون للضرر ويشلون.
actors.hero.abilities.warrior.shockwave.desc=يضرب المحارب الأرض بقوة, مما ينتج عنه موجة صدمية تنتقل لمسافة تصل إلى 5 مربعات في مخروط بزاوية 60 درجة.   يُصاب الأعداء الذين يقعون في نطاق هذه الموجة الصدمية بالشلل لمدة 5 أدوار. كما يتلقون ضررًا يتراوح بين 5 و10 نقاط, بالإضافة إلى ضرر إضافي يتراوح بين 1 و2 نقطة لكل نقطة قوة يمتلكها المحارب فوق 10 نقاط.
actors.hero.abilities.warrior.endure.name=الصمود
actors.hero.abilities.warrior.endure$enduretracker.name=التحمل
actors.hero.abilities.warrior.endure$enduretracker.desc=يضاعف المحارب الآن ضره بناء على الضرر الذي تحمله.\n\nالضرر الإضافي: %1$d\nالضربات المتبقية: %2$d
actors.hero.abilities.warrior.endure.short_desc=المحارب _يصمد_, متخطيا عدة أدوار لكنه يكتسب مقاومة عالية للضرر. ثم يزيد الضرر الذي يسببه بناء على ما تحمله.
actors.hero.abilities.warrior.endure.desc=يتحمل المحارب الضرر لمدة ثلاث جولات, ويتلقى نصف الضرر من جميع المصادر. ويُطبق هذا التخفيض قبل تأثيرات مقاومة الضرر مثل الدروع.   بعد الصمود, يكتسب المحارب ضررًا إضافيًا في ضربته التالية خلال عشر جولات. هذا الضرر الإضافي يساوي نصف إجمالي الضرر الذي تلقاه أثناء الصمود, قبل أي تأثيرات لتقليل الضرر!   إذا كان لدى المحارب أي سلسلة من الحركات, فإن استخدام هذه القدرة يزيد من وقته المتبقي بمقدار 3 أدوار

actors.hero.abilities.mage.elementalblast.name=الانفجار العنصري
actors.hero.abilities.mage.elementalblast.no_staff=لا يمكنك استخدام هذه القدرة بدون عصاك.
actors.hero.abilities.mage.elementalblast.short_desc=ينشر الساحر _الانفجار العنصري_ من عصاه, مغطيا منطقة واسعة حوله بأثر يتغير حسب العصا المثبتة في عصاه.
actors.hero.abilities.mage.elementalblast.desc=يُطلق الساحر موجة سحرية تغطي منطقة دائرية يصل مداها إلى أربع مربعات, وتُلحق ضررًا يتراوح بين 15 و25 نقطة. ويختلف تأثير هذه الموجة بحسب نوع العصا السحرية المُدمجة في عصا الساحر.
actors.hero.abilities.mage.elementalblast.generic_desc=سيكون أثر الانفجار العنصري مشابها لأثر العصا عند توجيهها ضد عدو أو حليف.
actors.hero.abilities.mage.wildmagic.name=السحر الفوضوي
actors.hero.abilities.mage.wildmagic.no_wands=لا تملك أي عصا لتستخدمها!
actors.hero.abilities.mage.wildmagic.short_desc=يطلق الساحر _السحر الفوضوي_ الكامن في عصيه, موجها إياها عشوائيا عدة مرات على هدف مختار خلال دورة واحدة.
actors.hero.abilities.mage.wildmagic.desc=يُطلق الساحر العنان لقوة عصيه السحرية, فيُطلقها عشوائيًا حتى أربع مرات في دورة واحدة. ولا يشمل هذا التأثير عصا الساحر.   كما يتم تعزيز مستوى كل عصا بمقدار 2, حتى +3. تستخدم هذه القدرة نصف شحنة العصا لكل ضربة, ولا يمكن إطلاق أي عصا أكثر من مرتين.
actors.hero.abilities.mage.warpbeacon.name=منارة الانتقال
actors.hero.abilities.mage.warpbeacon.depths=لا يمكنك الانتقال بين الطوابق!
actors.hero.abilities.mage.warpbeacon.locked_floor=لا يمكنك مغادرة طابق مغلق!
actors.hero.abilities.mage.warpbeacon.too_far=ذلك الموقع بعيد جدا!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=لا يمكنك وضع منارة هناك!
actors.hero.abilities.mage.warpbeacon.window_desc=منارتك موضوعة حاليا في الطابق %d.
actors.hero.abilities.mage.warpbeacon.window_tele=الانتقال إلى المنارة
actors.hero.abilities.mage.warpbeacon.window_clear=إزالة المنارة
actors.hero.abilities.mage.warpbeacon.window_cancel=الغاء
actors.hero.abilities.mage.warpbeacon.short_desc=يضع الساحر _منارة انتقال_ في موقعه الحالي, يمكنه الانتقال إليها فورا متى شاء.
actors.hero.abilities.mage.warpbeacon.desc=يضع الساحر منارة, يمكن الانتقال إليها متى شاء. يستغرق وضع المنارة دورة واحدة, لكن الانتقال إليها فوري.   لا يستطيع الساحر الانتقال الفوري بين الطوابق افتراضيًا, أو استخدام المنارة للوصول إلى أماكن يصعب الوصول إليها كالغرف المغلقة. لكن بإمكانه الانتقال الفوري إلى الأعداء, مما يدفعهم جانبًا.

actors.hero.abilities.rogue.smokebomb.name=قنبلة دخانية
actors.hero.abilities.rogue.smokebomb.fov=يمكنك القفز فقط إلى موقع خالي داخل مجال رؤيتك.
actors.hero.abilities.rogue.smokebomb.prompt=اختر موقعا للقفز إليه
actors.hero.abilities.rogue.smokebomb$ninjalog.name=الخدعة الخشبية
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=بطريقة ما, يقتنع الأعداء بسهولة أن هذه الخدعة الخشبية هي المحتال الحقيقي!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=يمكنك إيجاد هذه الشخصية عبر قدرة درع محددة للبطل.
actors.hero.abilities.rogue.smokebomb.short_desc=يرمي المحتال _قنبلة دخان_ بينما يختفي فجأة, ويعمي الأعداء القريبين من موقعه السابق.
actors.hero.abilities.rogue.smokebomb.desc=يلقي المحتال قنبلة دخان وينتقل بسرعة تصل إلى 6 مربعات. يستطيع الانتقال عبر المخاطر والأعداء, لكن ليس عبر التضاريس الصلبة كالجدران.   سيتم عمى الأعداء المجاورين لموقع المحتال القديم لمدة 5 أدوار.
actors.hero.abilities.rogue.deathmark.name=علامة الموت
actors.hero.abilities.rogue.deathmark.ally_target=يمكنك وضع العلامات على الأعداء فقط
actors.hero.abilities.rogue.deathmark.short_desc=يضع المحتال _علامة الموت_ على عدو مختار. يزداد الضرر الذي يتكبده الأعداء الموسومون, لكنهم لا يموتون حتى تنتهي العلامة.
actors.hero.abilities.rogue.deathmark.desc=يضع المحتال علامة على عدو مختار, مما يجعله يتلقى ضررًا إضافيًا بنسبة 25%. تُطبّق العلامة فورًا وتستمر لمدة 5 أدوار.   يتلقى الأعداء المميزون ضررًا إضافيًا, لكنهم لا يموتون حتى يزول تأثير العلامة. إذا كان لدى العدو صفر من نقاط الصحة عند انتهاء تأثير العلامة, فسيموت فورًا.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=موسوم للموت
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=تم وضع علامة على هذا العدو, مما يزيد الضرر الذي يتكبده بنسبة 25%%, لكنه يمنعه من الموت حتى تنتهي العلامة.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.rogue.shadowclone.name=نسخة الظل
actors.hero.abilities.rogue.shadowclone.short_desc=يستدعي المحتال _نسخة ظل_ يمكن توجيهها لمساعدته في القتال.
actors.hero.abilities.rogue.shadowclone.desc=يستدعي المحتال نسخة ظلية منه, يمكن توجيهها لمساعدته في القتال. ولا يتطلب توجيه هذه النسخة الظلية أي تكلفة.   يمتلك المستنسخ 80 نقطة صحة, ولا يرتدي درعًا, ويُلحق ضررًا يتراوح بين 10 و20 نقطة. يمكن تحسين جميع هذه الخصائص باستخدام المواهب, بحيث يستفيد المستنسخ من أسلحة ودروع البطل.
actors.hero.abilities.rogue.shadowclone$shadowally.name=محتال الظل
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=تتحرك نسختك إلى ذلك الموضع.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=تتحرك نسختك لتبعتك.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=تتحرك نسختك للهجوم!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=نسخة من المحتال, مصنوعة من ظلام دامس. تقف جامدة بلا حراك, بعيون فارغة وخيوط صغيرة من الظلام تتصاعد منها كالبخار.   النسخة المستنسخة ليست نسخة طبق الأصل من المحتال, لكنها لا تزال مقاتلاً جيداً, ويمكنها الاستفادة من معدات المحتال مع المواهب المناسبة.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=يمكنك إيجاد هذه الشخصية عبر قدرة درع محددة للبطل.

actors.hero.abilities.huntress.spectralblades.name=النصال الشبحية
actors.hero.abilities.huntress.spectralblades.short_desc=ترمي الصيادة _النصال الشبحية_ نحو هدف, يتوقف الضرر الذي تسببه على سلاحها الميداني المجهز حاليا.
actors.hero.abilities.huntress.spectralblades.desc=تُلقي الصيادة نصلًا شبحيًا على العدو, يعمل كضربة بعيدة المدى من سلاحها اليدوي. ستُفعّل جميع التأثيرات المعتادة للسلاح اليدوي, بما في ذلك التعويذات
actors.hero.abilities.huntress.naturespower.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower.short_desc=تستدعي الصيادة _قوة الطبيعة_, مما يزيد سرعتها في الحركة ومعدل إطلاق نيران قوسها لفترة قصيرة.
actors.hero.abilities.huntress.naturespower.desc=تُمنح الصيادة نفسها وقوسها قوة الطبيعة مؤقتًا! ويستمر هذا التأثير لمدة 8 أدوار.   خلال هذه الفترة, تتحرك الصيادة بسرعة مضاعفة, وتهاجم بقوسها أسرع بنسبة 33%. لا تُفعّل تأثيرات القوس الإضافية إذا كانت القناصة تستخدم هجماتها الخاصة.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=تزداد الصيادة قوة لفترة وجيزة, مما يزيد سرعتها في الحركة وسرعة هجماتها بقوسها.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.huntress.spirithawk.name=الصقر الروحي
actors.hero.abilities.huntress.spirithawk.no_space=لا توجد مساحة فارغة بالقرب منك.
actors.hero.abilities.huntress.spirithawk.short_desc=تستدعي الصيادة _الصقر الروحي_ ليكون رفيقها, يساعدها في استطلاع المواقع وإلهاء الأعداء.
actors.hero.abilities.huntress.spirithawk.desc=تستدعي الصيادة صقرًا روحيًا مرافقًا, ويمكن توجيهه باستخدام القدرة مرة أخرى أثناء استدعائه. يدوم الصقر لمدة 100 دورة, ولا يتطلب توجيهه أي تكلفة.   يتمتع الصقر بصحة وقوة هجومية محدودتين, ولكنه سريع ومراوغ ودقيق. ويشارك الصيادة مجال رؤيته بالكامل في جميع الأوقات. وهو محصن ضد جميع التأثيرات المرتبطة بمنطقة معينة, مثل النار والغازات السامة. ولن يهاجم إلا إذا طُلب منه ذلك تحديدًا
actors.hero.abilities.huntress.spirithawk$hawkally.name=الصقر الروحي
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=يتحرك صقرك إلى ذلك الموضع.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=يتحرك صقرك لتبعتك.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=يتحرك صقرك للهجوم!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=صقر سحري, استدعته الصيادة. يتوهج بلون أزرق أثيري ساطع, ورأسه يتحرك باستمرار أثناء مسحه للمنطقة.   على الرغم من أنها ليست مقاتلة بارعة, إلا أن سرعتها ورؤيتها تجعلها ممتازة للاستطلاع وتشتيت انتباه الأعداء.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=الأدوار المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=التفادات المضمونة المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=يمكنك إيجاد هذه الشخصية عبر قدرة درع محددة للبطل.

actors.hero.abilities.duelist.challenge.name=تحدي
actors.hero.abilities.duelist.challenge.prompt=اختر عدوا لتحديه
actors.hero.abilities.duelist.challenge.already_dueling=يمكنك خوض نزال واحد فقط في كل مرة.
actors.hero.abilities.duelist.challenge.ally_target=يمكنك تحدي الأعداء فقط.
actors.hero.abilities.duelist.challenge.unreachable_target=يجب أن تكون قادرا على الوصول إلى هدفك.
actors.hero.abilities.duelist.challenge.distant_target=ذلك العدو بعيد جدا لتحديه.
actors.hero.abilities.duelist.challenge.short_desc=المبارز _يتحدي_ عدوا قريبا في نزال, مما يجمد كل الأعداء الآخرين مؤقتا.
actors.hero.abilities.duelist.challenge.desc=تتحدى المبارزة عدوًا قريبًا في مبارزة. يُجبر هذا العدو على قتالها بينما يتجمد جميع الأعداء الآخرين مؤقتًا في الزمن.   يجب أن يكون الهدف في متناول اليد وعلى بُعد 5 مربعات من المبارز. تستمر المبارزة حتى مرور 10 أدوار, أو موت العدو, أو ابتعاد المبارز عن العدو بأكثر من 5 مربعات.   الأعداء المتجمدون لا يُقهرون. حلفاء المبارز لا يتجمدون بهذه القدرة, ولكن إذا تم استهداف زعيم, فلن يتجمد أتباعه أيضًا
actors.hero.abilities.duelist.challenge$duelparticipant.name=المشارك في النزال
actors.hero.abilities.duelist.challenge$duelparticipant.desc=تشارك هذه الشخصية في مبارزة. يُسمح لها, ولأي من حلفائها أو أتباعها, بالتصرف بشكل طبيعي بينما يتم تجميد الآخرين.   ستستمر المبارزة لفترة زمنية محددة, حتى يموت أحد المشاركين, أو حتى يبتعد المشاركون عن بعضهم البعض بأكثر من 5 مربعات.   عدد الأدوار المتبقية: %d .
actors.hero.abilities.duelist.elementalstrike.name=الضربة العنصرية
actors.hero.abilities.duelist.elementalstrike.short_desc=تقوم المبارزة بتنفيذ _ضربة عنصرية_, حيث ينتشر أثر في منطقة تأثير مخروطية بحسب تعويذة سلاحها.
actors.hero.abilities.duelist.elementalstrike.desc=يوجّه المبارز ضربةً إلى عدو أو موقع, مُنفّذًا هجومًا عاديًا مضمون الإصابة, ومُطلقًا تأثيرًا سحريًا ينتشر لمسافة تصل إلى 4 مربعات في مخروط بزاوية 65 درجة. ويختلف هذا التأثير السحري بناءً على التعويذة الموجودة على سلاح المبارز الأساسي.
actors.hero.abilities.duelist.elementalstrike.generic_desc=الضربة العنصرية بلا تعويذة تطلق دفعة سحرية صغيرة, مسببة ضرر 6-12 لجميع الأعداء في المدى.
actors.hero.abilities.duelist.feint.name=خدعة
actors.hero.abilities.duelist.feint.prompt=اختر الموقع للاندفاع إليه
actors.hero.abilities.duelist.feint.too_far=ذلك الموقع لا يجاورك.
actors.hero.abilities.duelist.feint.bad_location=لا يمكنك التحرك إلى ذلك الموقع.
actors.hero.abilities.duelist.feint.short_desc=تقوم المبارزة بتنفيذ _الخدعة_, حيث تتظاهر بالهجوم أثناء اندفاعها إلى مربع متجاور. وسيربض الأعداء صورتها الوهمية, فيتعرضون للهجوم المضاد.
actors.hero.abilities.duelist.feint.desc=تُوهم المبارزة بهجومٍ أثناء اندفاعها إلى المربع المجاور, تاركةً وراءها صورةً ظليةً مؤقتةً لنفسها. الأعداء الذين كانوا يهاجمون المبارزة سيهاجمون صورتها الظلية بدلاً منها.   الأعداء الذين يهاجمون الصورة اللاحقة يصابون بالارتباك, مما يلغي حركتهم التالية ويجعلهم عرضة لهجوم مفاجئ.

actors.hero.abilities.cleric.ascendedform.name=الشكل الصاعد
actors.hero.abilities.cleric.ascendedform.short_desc=يتبنى الكاهن _الشكل الصاعد_, فيكتسب تعويذات جديدة ومدى هجوم وحماية.
actors.hero.abilities.cleric.ascendedform.desc=يُطلق الكاهن طاقة مقدسة من نفسه, متخذًا هيئة إشعاعية ممتدة لمدة عشر جولات. في هذه الهيئة, يستطيع الكاهن إلقاء تعاويذ جديدة, ويكتسب مدى هجوم إضافي بمقدار 2, و30 نقطة حماية, وأي تعويذة إضافية يلقيها ستمنحه 10 نقاط حماية لكل شحنة من كتاب مقدس مستخدمة.   لا يتلاشى تأثير الحماية من الهيئة المُرتقية وتعاويذها بشكل طبيعي, بل يزول فور انتهاء الهيئة المُرتقية. ويمكن إعادة استخدام هذه القدرة لتجديد مدة الهيئة المُرتقية
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=الشكل الصاعد
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=تنبعث طاقة مشعة من جسد الكاهن. في هذه الهيئة, يكتسب الكاهن مدى هجوم إضافي بمقدار 2 (بفضل الطاقة المقدسة المنبعثة منه), و10 نقاط حماية كلما استخدم شحنة من كتاب مقدس. كما يصبح قادرًا على إلقاء التعاويذ التي تُفتح عبر مواهب الهيئة المُرتقية.   إن الدرع الممنوح من خلال الشكل المتسامي وتعاويذه لن يتلاشى بشكل طبيعي, ولكنه سيتلاشى على الفور عند انتهاء الشكل المتسامي.   الحماية الحالية: %1$d .  عدد الأدوار المتبقية: %2$d .
actors.hero.abilities.cleric.trinity.name=حليه سحريه
actors.hero.abilities.cleric.trinity.no_imbue=ليس لدى الثالوث أي أثر محدد لأي من أشكاله حالياً, استخدم إحدى تعويذاته!
actors.hero.abilities.cleric.trinity.no_duplicate=لا يستطيع الثالوث استنساخ أثر تملكه بالفعل!
actors.hero.abilities.cleric.trinity.ench_glyph_use=يطبق الثالوث هذا الأثر لمدة _%1$d دورة_ مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=يطبق الثالوث هذا الأثر _القوي_ لمدة _%1$d دورة_ مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.wand_use=يصعق الثالوث هذه العصا بـ_+%1$d_ مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.wand_multi_use=يصعق الثالوث هذه العصا _متعددة الشحنات_ بـ_+%1$d_ مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.thrown_use=يرمي الثالوث هذا السلاح بـ_+%1$d_ مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.ring_use=يطبق الثالوث أثر هذا الخاتم بـ_+%1$d_ لمدة 20 دورة, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=يطبق الثالوث أثر الخيمياء عن بعد لهذه الأثرية, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=يطبق الثالوث أثر استعادة الصحة السلبي لهذه الأثرية بـ_+%1$d_ لمدة 20 دورة, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.driedrose_use=يستخدم الثالوث أثر هذه الأثرية لاستدعاء شبح حليف مفسد بصحة شبح _+%1$d_, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.etherealchains_use=يطبق الثالوث أثر الإلقاء المتسلسل لهذه الأثرية بمدى _+%1$d_, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.hornofplenty_use=يطبق الثالوث أثر تناول الطعام لهذه الأثرية, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=يطبق الثالوث أثر سلب الأعداء لهذه الأثرية بـ_+%1$d_, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=يطبق الثالوث أثر التثبيت لهذه الأثرية مع بذرة عشوائية مؤذية, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.skeletonkey_use=يطبق الثالوث أثر الإدراج لهذه الأثرية, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=يطبق الثالوث أثر التنبؤ لهذه الأثرية بـ_+%1$d_, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=يطبق الثالوث أثر تجميد الزمن لهذه الأثرية بمدة _%1$d_ دورة, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=يطبق الثالوث أثر اللفافة العشوائية لهذه الأثرية مع فرصة _%1$d/10_ لعرض النسخة النادرة دون أي تكلفة إضافية, مقابل _%2$s شحنة._
actors.hero.abilities.cleric.trinity.cost=تكلفة الشحنة لهذه القدرة تختلف, لكنها في معظم الأحيان تكون _%d._
actors.hero.abilities.cleric.trinity.short_desc=يحصل الكاهن على _ثالوث_ من القدرات, تحاكي المعدات التي رآتها ويمكن تعيينها باستخدام تعويذات جديدة.
actors.hero.abilities.cleric.trinity.desc=يكتسب الكاهن ثلاث قدرات دروع, يمكن تخصيصها لتأثيرات عناصر مختلفة باستخدام ثلاث تعاويذ جديدة. تركز كل تعويذة من هذه التعاويذ على محاكاة تأثيرات أنواع مختلفة من المعدات التي حددها الكاهن خلال هذه الجولة: شكل الجسد (الأسلحة والدروع), وشكل العقل (العصي والأسلحة المقذوفة), وشكل الروح (الخواتم والتحف).   يمكن إضفاء تأثير واحد على كل شكل من أشكال القوه الثلاثيه في كل مرة, ويختار الكاهن التأثير الذي سيفعّله عند استخدام القوه الثلاثيه. ولن يكرر  تأثير أي شيء مجهز لديك بالفعل
actors.hero.abilities.cleric.trinity$wndusetrinity.text=اختر شكل الثالوث المراد استخدامه. يمكن أن تكون آثار الأشكال المختلفة فعّالة في الوقت نفسه.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_الشكل الجسدي: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_الشكل الذهني: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_الشكل الروحي: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=اختر الأثر لدمجه في الثالوث. ستظهر معلومات إضافية قبل التأكيد.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=تعيين إلى الشكل الجسدي
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=تعيين إلى الشكل الذهني
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=تعيين إلى الشكل الروحي
actors.hero.abilities.cleric.powerofmany.name=قوة الجماعة
actors.hero.abilities.cleric.powerofmany.prompt_default=اختر الحليف أو الموقع
actors.hero.abilities.cleric.powerofmany.prompt_ally=وجه حليفك الضوئي
actors.hero.abilities.cleric.powerofmany.ally_exists=لديك بالفعل حليف معزز.
actors.hero.abilities.cleric.powerofmany.no_vision=لا يمكنك استهداف موقع لا تراه.
actors.hero.abilities.cleric.powerofmany.only_allies=يمكنك تعزيز الحلفاء فقط.
actors.hero.abilities.cleric.powerofmany.short_desc=يستمد الكاهن _قوة الجماعة_, لتعزيز أحد الحلفاء القائمين أو لخلق حليف جديد.
actors.hero.abilities.cleric.powerofmany.desc=يوجّه الكاهن قوة "الكثرة", التي إما أن تُقوّي حليفًا موجودًا أو تُنشئ حليفًا جديدًا مُقوّى لمدة 100 دورة. استهداف مساحة فارغة يُنشئ حليفًا جديدًا.   أثناء تفعيل قدرة "قوة الكثرة", يُلحق أي حليف ضررًا إضافيًا بنسبة 25%, ويتلقى ضررًا أقل بنسبة 25%, ويشارك رؤيته مع الكاهن. كما يكتسب 25 نقطة حماية عند استخدام هذه القدرة.   يكتسب الكاهن أيضًا ثلاث تعاويذ جديدة لا يمكن إلقاؤها إلا بوجود حليف مُعزَّز. ولن تنتهي قوة الكثرة طالما أن إحدى هذه التعاويذ فعّالة
actors.hero.abilities.cleric.powerofmany$powerbuff.name=قوة الجماعة
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=تم تمكين هذا الحليف بقوة الكثيرين, مما منحه +25 %% الضرر المُلحق و-25 %% الضرر الذي سيتلقونه. كما سيشاركون نطاق رؤيتهم مع الكاهن, ويمكنهم الاستفادة من قوة العديد من التعاويذ.   ستستمر قوة الكثيرين حتى عندما يختبئ الحلفاء مثل الصور المنشورية, لكن مدتها ستظل تتناقص.   عدد الأدوار المتبقية: %s .
actors.hero.abilities.cleric.powerofmany$lightally.name=حليف ضوئي
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=يتحرك حليفك إلى ذلك الموقع.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=يتحرك حليفك ليتبعك.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=يتحرك حليفك للهجوم!
actors.hero.abilities.cleric.powerofmany$lightally.desc=نسخة من أحد رفاق الكاهن في مغامراته, مصنوعة من نور خالص. ورغم أنها تتخذ شكل بطل آخر, إلا أنها لا تمتلك أيًا من قدراته الفريدة. سيبقى هذا الحليف قائمًا ما دامت قوة الكثرة مُطبقة عليه.   يمكن توجيه هذا الحليف بدون أي تكلفة عن طريق إعادة استخدام قدرة درع "قوة الكثيرين".
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=يمكنك العثور على هذه الشخصية بقدرة درع بطل محددة.


actors.hero.abilities.ratmogrify.name=تحوير جرذني
actors.hero.abilities.ratmogrify.cant_transform=لا يمكنك تحويل ذلك إلى جرذ!
actors.hero.abilities.ratmogrify.too_strong=ذلك العدو قوي لدرجة أنه لا يمكن تحويله إلى جرذ!
actors.hero.abilities.ratmogrify.short_desc=يقوم البطل _بتحويل_ عدو إلى جرذ! يتحول إلى جرذ بلا قدرات لفترة مؤقتة.
actors.hero.abilities.ratmogrify.desc=يقوم البطل بتحويل عدو إلى جرذ لمدة 6 أدوار! لا يمكن تحويل الزعماء أو الحلفاء أو الجرذان.\n\nيحتفظ الأعداء المحولون إلى جرذان بخصائصهم الأصلية, لكنهم لا يملكون أي قدرات.
actors.hero.abilities.ratmogrify$transmograt.name=%s محول إلى جرذ
actors.hero.abilities.ratmogrify$transmograt.desc=تم تحويل هذا العدو إلى جرذ. تحسن كبير إن سألتموني! - ملك الجرذان
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=قتل بواسطة: عدو محول إلى جرذ

##Cleric Spells
actors.hero.spells.auraofprotection.name=هالة الحماية
actors.hero.spells.auraofprotection.short_desc=تعزز الدفاع للبالادين وحلفائه القريبين.
actors.hero.spells.auraofprotection.desc=يبدأ الفارس بإشعاع طاقة وقائية في هالة متلألئة حول نفسه لمدة 20 دورة. أي حليف ضمن نطاق مربعين من الفارس (بما في ذلك الفارس نفسه) يتلقى %1$d %% يُقلل الضرر, ويكتسب تأثير نقش درع الفارس عند + %2$d %%  قوة.   يُطبَّق هذا التخفيض للضرر قبل تأثيرات تخفيض الضرر الأخرى (مثل الدروع). سيُطبَّق تعزيز قوة النقش دائمًا, ولكن لا يمكن لهذه التعويذة أن تُطبَّق نقش الفارس أكثر من مرة إذا كانت شخصية أخرى تستفيد منه بالفعل (مثل الفارس نفسه, أو صورة موشورية)
actors.hero.spells.auraofprotection$aurabuff.name=هالة الحماية
actors.hero.spells.auraofprotection$aurabuff.desc=يشع الفارس طاقة وقائية حول نفسه \n\nأي حليف قريب (بما في ذلك الفارس نفسه) يتلقى ضررًا مخففًا ويكتسب تأثير نقش درع الفارس مع قوة معززة \n\nعدد الأدوار المتبقية: %s

actors.hero.spells.beamingray.name=شعاع متوهج
actors.hero.spells.beamingray.no_space=لا يوجد مكان ليظهر فيه حليفك هناك.
actors.hero.spells.beamingray.out_of_range=هذا الموقع خارج النطاق.
actors.hero.spells.beamingray.short_desc=ينقل حليفك عبر البوابة ويمنحه زيادة في الضرر.
actors.hero.spells.beamingray.desc=يُوجّه الكاهن القوة من حليفه إلى شعاع ضوئي ينقله إلى موقع محدد. إذا اصطدم الشعاع بعدو, فإنه ينقل الحليف إلى مكان قريب منه ويوجهه نحو العدو.   يبلغ أقصى مدى للشعاع ... %1$d البلاطات, وسيزيد الضرر الإضافي لقوة الكثيرين إلى + %2$d %% لمدة عشر جولات ضد أقرب عدو ضمن نطاق أربع مربعات. يمكن لشعاع الإشعاع أن ينقل الحلفاء غير المتحركين عادةً, لكن مداه ينخفض إلى النصف في هذه الحالات
actors.hero.spells.beamingray$beamingrayboost.name=شعاع متوهج
actors.hero.spells.beamingray$beamingrayboost.desc=تم نقل هذا الحليف مؤخرًا بواسطة شعاع شعاعي, مما منحه ضررًا إضافيًا ضد أقرب عدو بعد النقل. كما أن تأثير "قوة الكثيرين" لن ينتهي عند تفعيل هذا التأثير.   عدد الأدوار المتبقية: %s

actors.hero.spells.blessspell.name=مباركه
actors.hero.spells.blessspell.short_desc=يبارك & يحمي الكاهن, ويبارك & يشفي الآخرين.
actors.hero.spells.blessspell.desc=يضع الكاهن بركة مقدسة على نفسه أو على شخصية أخرى يمكنه رؤيتها.   عندما يُلقى التأثير على أنفسهم يكون أضعف, مما يمنحهم %1$d أدوار البركة و %2$d  حاجز.   تكون التعويذة أكثر قوة عند إلقائها على شخصيات أخرى, مما يمنحها %3$d أدوار البركة و %4$d الشفاء. يتحول الشفاء الزائد إلى حاجز

actors.hero.spells.bodyform.name=الشكل الجسدي
actors.hero.spells.bodyform.short_desc=يربط الثالوث بتعويذة أو رقعة.
actors.hero.spells.bodyform.desc=يختار الكاهن تعويذة أو رمزًا قام بتحديده في هذه الجولة ويمنح القوه المقدسه تأثيره.   عند استخدام القوه المقدسه, يكتسب الكاهن تأثير التعويذة أو الرمز المختار لـ %d يتحول. ستعمل هذه التعويذة أو النقشة المؤقتة بنفس تأثير التعويذة أو النقشة العادية.   تحل هذه التعويذة محل أي تأثير جسدي آخر تتمتع به ترينيتي حاليًا.
actors.hero.spells.bodyform$bodyformbuff.name=الشكل الجسدي
actors.hero.spells.bodyform$bodyformbuff.desc=يمنحك شكل جسد ترينيتي حاليًا قوة سحر أو نقش, كما لو كنت قد قمت بتجهيزه على سلاحك أو درعك الحالي.   لاحظ أن شكل الجسم لا يمكنه توفير نسخة أخرى من تأثير تستفيد منه بالفعل.   التأثير الحالي: %1$s .   عدد الأدوار المتبقية: %2$s .

actors.hero.spells.cleanse.name=تطهير
actors.hero.spells.cleanse.short_desc=يزيل الآثار السلبية ويمنح حماية.
actors.hero.spells.cleanse.desc=يزيل الكاهن جميع الآثار الضارة عن نفسه وحلفائه المرئيين. بعد انتهاء التعويذة تحصل جميع الشخصيات المتأثرة على مناعة ضد الآثار السلبية لمدة %1$d دورة, وحاجز بقوة %2$d.

actors.hero.spells.clericspell.prompt=اختر هدفًا
actors.hero.spells.clericspell.no_target=لا يوجد هدف هناك.
actors.hero.spells.clericspell.invalid_target=لا يمكنك استهداف ذلك الموقع.
actors.hero.spells.clericspell.invalid_enemy=لا يمكنك استهداف ذلك العدو.
actors.hero.spells.clericspell.charge_cost=تكلفة الشحنة: %d

actors.hero.spells.divinesense.name=الحس الإلهي
actors.hero.spells.divinesense.short_desc=تحصل على رؤية ذهنية مؤقتة في مدى واسع.
actors.hero.spells.divinesense.desc=يركز الكاهن حواسه على محيطه, فيكتسب رؤية ذهنية بمدى %d مربع لمدة 50 دورة. لا تحتاج هذه التعويذة إلى وقت لإلقائها.
actors.hero.spells.divinesense$divinesensetracker.name=الحس الإلهي
actors.hero.spells.divinesense$divinesensetracker.desc=تمتلك هذه الشخصية القدرة على رؤية المخلوقات القريبة الأخرى بعقلها لفترة مؤقتة!\n\nالأدوار المتبقية: %s.

actors.hero.spells.divineintervention.name=تدخّل إلهي
actors.hero.spells.divineintervention.short_desc=تعزيز هائل للدرع للكاهن وحلفائه.
actors.hero.spells.divineintervention.desc=يُلقي الكاهن بكمية هائلة من القوة من كتابه على نفسه وحلفائه, مما يعزز الجميع إلى %1$d حماية وتوسيع الشكل الصاعد بواسطة %2$d يتم تقييم القوة الدفاعية الهائلة لهذه التعويذة مقابل تكلفة شحنها العالية للغاية.   تمامًا مثل الحماية الأخرى التي يمنحها الشكل المتسامي, فإن هذه الحماية لا تتلاشى بشكل طبيعي, ولكنها ستنتهي فورًا عند انتهاء الشكل المتسامي.

actors.hero.spells.flash.name=فلاش
actors.hero.spells.flash.prompt=اختر موقعاً
actors.hero.spells.flash.short_desc=انتقال جسري إلى موقع قريب.
actors.hero.spells.flash.desc=يستحضر الكاهن هيئته المتصاعدة في موقع قريب وينتقل إليه آنيًا. يمكن لمهارة "وميض" أن تنقل الكاهن إلى أي موقع مكتشف ضمن نطاقها وغير مشغول. تزداد تكلفة هذه التعويذة مع كل استخدام لها بنفس الهيئة المتصاعدة.

actors.hero.spells.guidinglight.name=النور الهادي
actors.hero.spells.guidinglight.short_desc=يسبّب ضرراً سحرياً بعيد المدى ويضمن الإصابة.
actors.hero.spells.guidinglight.desc=يُطلق الكاهن شعاعًا من الطاقة السحرية يصيب الهدف, مُلحقًا به ضررًا يتراوح بين 2 و8 نقاط, ومُضيئًا إياه. ويُضمن إصابة العدو المُضاء في الهجوم الجسدي التالي غير المُثقل.
actors.hero.spells.guidinglight.desc_priest=تزداد قوة هذه التعويذة عند إلقائها من قِبَل الكاهن. لا تتطلب أول إلقاء للتعويذة كل 50 دورة أي شحنات من الكتب السحرية, وسيتم استهلاك تعويذة الإضاءة بواسطة الإشعاع والعصي السحرية والشخصيات الأخرى والقطع الأثرية التي تؤثر مباشرةً على الأعداء. عند استخدام تعويذة الإضاءة بهذه الطريقة, فإنها تُلحق ضررًا سحريًا إضافيًا يساوي مستوى الكاهن + 5
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=النور الهادي
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=سيتمكن الكاهن من إطلاق النور الهادي مجدداً مجاناً بعد مرور 50 دورة.\n\nالأدوار المتبقية: %s.
actors.hero.spells.guidinglight$illuminated.name=مُضاء
actors.hero.spells.guidinglight$illuminated.desc=تتوهج هذه الشخصية نتيجة تعرضها لضوء موجه. ورغم أن التوهج ليس قويًا بما يكفي لإضاءة المنطقة المحيطة, إلا أن التأثير السحري سيجعل توجيه الضربات إليها أسهل بكثير بالنسبة للكاهن
actors.hero.spells.guidinglight$illuminated.desc_priest=يستطيع الكاهن أيضًا استهلاك طاقة "الإضاءة" من خلال الإشعاع, أو ضربة عصا سحرية, أو ضربة من حليف, أو تأثيرات بعض القطع الأثرية. استخدام "الإضاءة" بهذه الطريقة يُلحق ضررًا سحريًا إضافيًا يساوي مستوى الكاهن + 5
actors.hero.spells.guidinglight$illuminated.desc_generic=يمكن للأبطال الآخرين استخدام الإضاءة للاستفادة من موهبة النور الحارق, لكن لن يكسبوا أي دقة.

actors.hero.spells.hallowedground.name=الأرض المقدسة
actors.hero.spells.hallowedground.prompt=اختر موقعاً
actors.hero.spells.hallowedground.short_desc=يعالج الحلفاء, ويبطّئ الأعداء, وينشر العشب في منطقة.
actors.hero.spells.hallowedground.desc=يركز الكاهن سحره الإلهي على الأرض القريبة, مما يخلق %1$d x %1$d منطقة أرض مقدسة لمدة 20 دورة.   عند إلقاء هذه التعويذة, فإنها تشفي جميع الحلفاء بمقدار 15 نقطة صحة (يحصل الحلفاء الأصحاء والكاهن على درع), وتثبت الأعداء لفترة وجيزة, وتنشر عشبًا قصيرًا.   تُعالج الأرض المقدسة الحلفاء بمقدار نقطة صحة واحدة لكل دور (يحصل الحلفاء الأصحاء والكاهن على درع), وتُضعف الأعداء, وتتسبب بشكل عشوائي في نمو العشب الطويل.   يتم تدمير الأرض المقدسة بالنار, وستنتج عشبًا محفورًا إذا تم تعطيل تأثيرات التجديد السلبي أو إذا لم يكتسب الكاهن خبرة لفترة من الوقت
actors.hero.spells.hallowedground$hallowedterrain.desc=أُقدّست الأرض هنا. الأرض المقدسة تبطّئ الأعداء, وتعالج الحلفاء, وتُسبّب انتشار العشب.

actors.hero.spells.holyintuition.name=الحدس المقدس
actors.hero.spells.holyintuition.prompt=اختر عنصراً
actors.hero.spells.holyintuition.cursed=تشعر بسحر خبيث كامن في هذا العنصر.
actors.hero.spells.holyintuition.uncursed=هذا العنصر خالٍ من السحر الخبيث.
actors.hero.spells.holyintuition.short_desc=يحدد ما كان العنصر ملعوناً أم لا.
actors.hero.spells.holyintuition.desc=يركّز الكاهن حواسّه على عنصر ويحدّد ما كان ملعوناً أو لا دون الحاجة إلى تجهيزه.

actors.hero.spells.holylance.name=الرمح المقدس
actors.hero.spells.holylance.short_desc=يسبّب ضرراً سحرياً ثقيلاً بعيد المدى.
actors.hero.spells.holylance.desc=يُركّز الكاهن كمية كبيرة من الطاقة في رمح ضوئي مُدمّر يُقذف. هذا الرمح يُلحق ضرراً بالغاً %1$d - %2$d يُلحق الضرر دائمًا بأقصى قدر من الضرر بالأهداف غير الميتة والشيطانية.   هذه التعويذة مكلفة للغاية, ولها فترة انتظار تبلغ 30 دورة.
actors.hero.spells.holylance$lancecooldown.name=فترة استرداد الرمح المقدس
actors.hero.spells.holylance$lancecooldown.desc=أطلق الكاهن الرمح المقدس مؤخراً, ويجب عليه الانتظار قبل إطلاقه مجدداً.\n\nالأدوار المتبقية: %s.

actors.hero.spells.holyward.name=الحرس المقدس
actors.hero.spells.holyward.glyph_name=%s من النور
actors.hero.spells.holyward.glyph_desc=يزيد هذا الرمز قليلاً من كمية الضرر الذي يستطيع الدرع صده.
actors.hero.spells.holyward.short_desc=يستبدل الرموز مؤقتاً لتعزيز صد الدرع.
actors.hero.spells.holyward.desc=يقوم الكاهن بتزويد درعه البالي برموز من النور المقدس, مما يزيد من قدرة الدرع على صد الضرر بمقدار 1. لا يستغرق إلقاء هذه التعويذة أي وقت.   يستمر هذا الرمز لمدة 50 دورة, وسيحل محل أي رمز مفيد آخر موجود على الدرع طوال هذه المدة. سيستفيد الكاهن من هذا التأثير حتى لو لم يكن يرتدي درعًا.
actors.hero.spells.holyward.desc_paladin=تكون هذه التعويذة أكثر قوة عند إلقائها من قبل الفارس. يتم زيادة حجب الضرر الإضافي إلى 3, ولم تعد التعويذة تتجاوز النقوش الموجودة, كما أن إلقاء تعويذات أخرى أثناء تفعيل الحماية المقدسة سيؤدي إلى تمديد مدتها بمقدار 10 أدوار لكل شحنة مستخدمة.
actors.hero.spells.holyward$holyarmbuff.name=الحرس المقدس
actors.hero.spells.holyward$holyarmbuff.desc=غرس الكاهن طاقة مقدسة في الدرع الذي يرتديه, مستبدلاً مؤقتاً أي رمز موجود ومسبباً للدرع صد 1 نقطة إضافية من الضرر.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=قام الفارس الخارق بشحن درعه البالي بطاقة قويه, مما تسبب في قدرة الدرع على صد 3 نقاط إضافية من الضرر.   إن إلقاء تعاويذ أخرى أثناء تفعيل الحماية المعززه سيؤدي إلى تمديد مدتها بمقدار 10 أدوار لكل شحنة يتم إنفاقها.   عدد الأدوار المتبقية: %s .

actors.hero.spells.holyweapon.name=السلاح المقدس
actors.hero.spells.holyweapon.ench_name=%s مقدس
actors.hero.spells.holyweapon.ench_desc=يتلقى الأعداء الذين يُضربون بسلاح مقدس ضرراً سحرياً إضافياً.
actors.hero.spells.holyweapon.short_desc=يستبدل التعويذات مؤقتاً لتعزيز الضرر.
actors.hero.spells.holyweapon.desc=يُضفي الكاهن على سلاحه البالي طاقةً مقدسة, مما يجعله يُلحق ضررًا سحريًا إضافيًا بمقدار 2 في كل مرة يُصيب بها عدوًا. لا يستغرق هذا التعويذ وقتًا لإلقائه.   يستمر هذا السحر لمدة 50 دورة, ويلغي أي سحر مفيد آخر يمتلكه السلاح طوال هذه المدة. كما يمكن للضربات غير المسلحة الاستفادة من هذا التأثير.
actors.hero.spells.holyweapon.desc_paladin=تكون هذه التعويذة أكثر قوة عند إلقائها من قبل الفارس المقدس. يتم زيادة الضرر السحري الإضافي إلى 6, ولم تعد التعويذة تتجاوز التعويذات الموجودة, كما أن إلقاء تعويذات أخرى أثناء تفعيل السلاح المقدس سيؤدي إلى تمديد مدته بمقدار 10 أدوار لكل شحنة مستخدمة.
actors.hero.spells.holyweapon$holywepbuff.name=السلاح المقدس
actors.hero.spells.holyweapon$holywepbuff.desc=قام الكاهن بشحن سلاحه البالي بطاقة خارقه, مما أدى إلى تجاوز أي تعويذة موجودة مؤقتًا وتسبب في أن يلحق السلاح ضررًا سحريًا إضافيًا بمقدار 2 في كل هجوم \n\nعدد الأدوار المتبقية: %s
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=قام الفارس المقدس بشحن سلاحه البالي بطاقة مقدسة, مما تسبب في أن هجماته تسبب ضررًا سحريًا إضافيًا قدره 6.   إن إلقاء تعاويذ أخرى أثناء تفعيل السلاح المقدس سيؤدي إلى تمديد مدته بمقدار 10 أدوار لكل شحنة مستخدمة.   عدد الأدوار المتبقية: %s .

actors.hero.spells.judgement.name=الحكم
actors.hero.spells.judgement.short_desc=يضرّ جميع الأعداء المرئيين.
actors.hero.spells.judgement.desc=يضرب الكاهن الأرض بقبضته, مما يتسبب في انفجار ضوئي يُلحق الضرر بجميع الأعداء الذين يراهم. %1$d - %2$d يُلحق ضررًا أساسيًا, ولكنه يُلحق أيضًا ضررًا إضافيًا قدره 33 %% الضرر لكل تعويذة ألقاها الكاهن منذ دخوله في الشكل الصاعد (أو منذ آخر مرة ألقى فيها تعويذة الحكم).   ستتولى المحكمة حاليًا معالجة القضايا. %3$d - %4$d  ضرر.

actors.hero.spells.layonhands.name=وضع اليدين
actors.hero.spells.layonhands.short_desc=يعالج فورياً شخصية مجاورة أو يمنح درعاً للبالادين.
actors.hero.spells.layonhands.desc=يقوم الفارس بتوجيه الطاقة المقدسة من خلال يديه, فيشفي أو يحمي أي شيء يلمسه.   يستطيع الفارس المقدّس إلقاء هذه التعويذة على أي شخصية مجاورة ليمنحها %1$d الشفاء, أو على أنفسهم لتحقيق مكاسب %1$d الحماية. يتم تحويل الشفاء الزائد الناتج عن هذه التعويذة إلى حماية.   يتم إلقاء هذه التعويذة على الفور ويمكن إلقاؤها بشكل متكرر, ولكن لا يمكنها منح أكثر من ثلاث تعويذات من الحماية في المرة الواحدة

actors.hero.spells.lifelinkspell.name=وصلة الحياة
actors.hero.spells.lifelinkspell.short_desc=يتشارك الضرر مع حليف, ويقلل الضرر الذي يتكبده.
actors.hero.spells.lifelinkspell.desc=595      يعزز الكاهن الرابطة بينه وبين حليفه المُعزز. وبفضل هذه الرابطة, سيتم تقاسم أي ضرر يلحق بالبطل وحليفه. %1$d ستزداد قوة تعزيز الدفاع لمهارة "قوة الكثيرين" إلى - %2$d %% الضرر المُتلقى. لاحظ أن الضرر يُوزع بعد تأثير الدرع, ولكن قبل تقليل الضرر بواسطة قوة الكثرة.   أثناء تفعيل هذا التأثير, ستنطبق تعاويذ الكاهن المفيدة من المستوى الثالث أو أقل على كل من الكاهن وحليفه إذا كانت ستنطبق على أحدهما فقط
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=حماية وصلة الحياة
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=قام الكاهن مؤخراً بإلقاء تعويذة "رابطة الحياة" على هذا الحليف.   بالإضافة إلى الفوائد المعتادة لـ Life Link, فإن هذه الشخصية تتلقى أيضًا ضررًا أقل, ويتم تطبيق أي تعويذات إيجابية للكاهن على كل من الكاهن وهذا الحليف بدلاً من واحد فقط, ولن تنتهي صلاحية Power of Many أثناء تفعيل هذا التأثير.   عدد الأدوار المتبقية: %s .

actors.hero.spells.mindform.name=شكل العقل
actors.hero.spells.mindform.short_desc=يوصّل الثالوث بعصا أو سلاح رمي.
actors.hero.spells.mindform.desc=يختار الكاهن عصا سحرية أو أسلحة رمية قام بتحديدها في هذه الجولة ويمنح الثالوث تأثيرها.   عند استخدام ترينيتي, يستطيع الكاهن شن هجوم واحد كما لو كان يستخدم العنصر المختار عند + %d سيؤدي هذا إلى إطلاق جميع التأثيرات التي يؤدي إليها استخدام هذا النوع من العناصر عادةً.   تحل هذه التعويذة محل أي تأثير عقلي آخر مشبع به ترينيتي حاليًا.

actors.hero.spells.mnemonicprayer.name=صلاة الذاكرة
actors.hero.spells.mnemonicprayer.short_desc=يمدّد التعزيزات/الإضعافات على حليف/عدو, ويُعيد تطبيق الإضاءة.
actors.hero.spells.mnemonicprayer.desc=يتلو الكاهن صلاةً تُطيل مدة جميع التأثيرات الإيجابية أو السلبية على هدف محدد بواسطة %1$d لا يستغرق إلقاء هذه التعويذة وقتًا. ستدوم التأثيرات الإيجابية لفترة أطول على الحلفاء (بما في ذلك الكاهن نفسه), وستدوم التأثيرات الضارة لفترة أطول على الأعداء.   لا يمكن لدعاء التذكر أن يمدد إلا حالة محددة من التعزيز أو التثبيط مرة واحدة, ولا يمكنه تمديد التعزيزات الممنوحة من قدرات الدروع.

actors.hero.spells.radiance.name=الإشعاع
actors.hero.spells.radiance.short_desc=يضيء الأعداء المرئيين ويُصيبهم بدوار لبرهة.
actors.hero.spells.radiance.desc=ينفجر الكاهن بنور مقدس, مُذهلاً جميع الأعداء المرئيين لمدة ثلاث جولات. إذا كان العدو مُضاءً بالفعل, فإنّ الإشعاع سيُفعّل ضرر الإضاءة الإضافي, ثم يُطبّق تأثير الإضاءة السلبي. كما سيُضيء الكاهن لمدة مئة جولة إذا كان الطابق الحالي مُظلمًا.

actors.hero.spells.recallinscription.name=استدعاء النقوش
actors.hero.spells.recallinscription.short_desc=يكرّر حجراً سحرياً أو لفافة استُخدمت مؤخراً.
actors.hero.spells.recallinscription.desc=يستخدم الكاهن السحر المقدس لإعادة صياغة تأثير رونية سحرية موجودة على حجر رونية أو لفافة استخدموها في المرة السابقة %s منعطفات.   لا يمكن استخدام تعويذة "استدعاء النقش" لنسخ لفائف الترقية. تختلف تكلفة شحن هذه التعويذة بناءً على العنصر المستخدم مؤخرًا: 2 للحجر الروني, و3 لللفافة, و4 لللفافة النادرة. تتضاعف تكلفة الشحن عند نسخ لفافة التحويل, أو عناصر الخيمياء التي يجب صنعها باستخدام التحويل أو الترقي
actors.hero.spells.recallinscription$useditemtracker.name=الحجر السحري المستخدم مؤخراً
actors.hero.spells.recallinscription$useditemtracker.desc=استخدم الكاهن مؤخرًا أداةً تتوافق مع تعويذة الاستدعاء المنقوشة عليها. يستطيع الكاهن إلقاء التعويذة لتكرار تأثير الأداة\n\nالعنصر المستخدم: %1$s   \n\nعدد الأدوار المتبقية: %2$s

actors.hero.spells.shieldoflight.name=درع النور
actors.hero.spells.shieldoflight.short_desc=يمنح درعاً مؤقتاً ضد هدف.
actors.hero.spells.shieldoflight.desc=يُنشئ الكاهن حاجزًا رقيقًا من الضوء بينه وبين العدو, مما يزيد من قوة درعه في صدّ هجمات ذلك العدو. %1$d - %2$d لمدة 5 أدوار.   لا تستغرق هذه التعويذة وقتاً لإلقائها, ولكن لا يمكن استخدامها ضد عدة أهداف في وقت واحد.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=درع النور
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=درع رقيق من النور يقف بين هذه الشخصية وعدو. ليس قوياً بما يكفي لصد الهجمات تماماً, لكنه سيلطّفها.\n\nالأدوار المتبقية: %s

actors.hero.spells.spiritform.name=شكل الروح
actors.hero.spells.spiritform.short_desc=يوصّل الثالوث بخاتم أو أثر.
actors.hero.spells.spiritform.desc=يختار الكاهن خاتمًا أو قطعة أثرية قام بتحديدها في هذه الجولة (باستثناء الكتاب المقدس) ويمنح القوه المقدسه تأثيرها.   إذا تم اختيار خاتم, فإن القوه المقدسه يمنح تأثير ذلك الخاتم عند + %1$d لمدة 20 دورة.   إذا تم اختيار قطعة أثرية, فإن ترينيتي تُكرر تأثير تلك القطعة الأثرية عند + %2$d لكل قطعة أثرية سلوكيات محددة مختلفة وتكاليف شحن دروع مختلفة عند استخدامها مع القوه المقدسه.   تحل هذه التعويذة محل أي تأثير روحي آخر تتمتع به ترينيتي حاليًا
actors.hero.spells.spiritform$spiritformbuff.name=شكل الروح
actors.hero.spells.spiritform$spiritformbuff.desc=يمنحك شكل روح ترينيتي حاليًا قوة عنصر ما, كما لو كنت قد قمت بتجهيزه.   لاحظ أن الشكل الروحي لا يمكنه توفير نسخة أخرى من التأثير الذي تستفيد منه بالفعل.   التأثير الحالي: %1$s .   عدد الأدوار المتبقية: %2$s .

actors.hero.spells.smite.name=الضربة السماوية
actors.hero.spells.smite.short_desc=يضمن إصابة هدف بضرر إضافي وقوة تعويذة.
actors.hero.spells.smite.desc=يُضفي الفارس المقدس على ضربة الاشتباك قوة تدميرية مقدسة.   إضافةً إلى إلحاق الضرر العادي بالهجمات القريبة, يضمن سحر "الضربة القاضية" إصابة الهجمات غير المحملة, ويمنح +300 %% قوة السحر, والصفقات %1$d - %2$d ضرر سحري إضافي.   يتناسب الضرر السحري الإضافي لمهارة "الضربة القاضية" مع مستوى الفارس, وسوف تسبب دائمًا أقصى ضرر سحري إضافي ضد الأعداء الموتى الأحياء أو الشياطين.

actors.hero.spells.stasis.name=السكون
actors.hero.spells.stasis.short_desc=يُخرج حليفاً من الزنزانة ويحفظه.
actors.hero.spells.stasis.desc=يركز الكاهن اتصاله بحليفه نحوه, مما يؤدي إلى احتجاز الحليف مؤقتًا في نوع من سكون الطاقة داخل الكاهن. سيتم الحفاظ على الحليف لمدة تصل إلى %d وتتحول, مع عدم تأثر جميع التأثيرات الإيجابية عليها بفترة بقائها في حالة سكون.   سيظهر الحليف بجوار الكاهن عند انتهاء حالة التجميد تلقائيًا, أو يمكنه إعادة إلقاء التعويذة فورًا دون أي تكلفة لإنهاء التأثير مبكرًا. يمكن لحالة التجميد أن تُحرّك الحلفاء غير القادرين على الحركة, لكنها لا تنقلهم بين الطوابق
actors.hero.spells.stasis$stasisbuff.name=حليف في سكون
actors.hero.spells.stasis$stasisbuff.left_behind=تُرك حليك الثابت وراءك.
actors.hero.spells.stasis$stasisbuff.desc=يملك الكاهن حاليًا حليفًا في حالة سكون. تُحفظ جميع التأثيرات الإيجابية على هذا الحليف, بما في ذلك قوة الكثرة, وسيظهر الحليف مجددًا بجانب الكاهن عند انتهاء التأثير. يمكن أيضًا إنهاء التأثير مبكرًا بإعادة تفعيل حالة السكون.   حليف في حالة الجمود: %1$s .  عدد الأدوار المتبقية: %2$s .

actors.hero.spells.sunray.name=شعاع الشمس
actors.hero.spells.sunray.short_desc=يسبّب ضرراً سحرياً بعيد المدى ويعمّي هدفاً مرة واحدة.
actors.hero.spells.sunray.desc=يُطلق الكاهن شعاعًا من الضوء الساطع على الهدف, مُلحقًا به ضررًا بالغًا. %1$d - %2$d تسبب في إلحاق الضرر بهم وإصابتهم بالعمى. %3$d تُلحق أشعة الشمس دائمًا أقصى ضرر بالأهداف من الموتى الأحياء والشياطين.   بعد أن يصيب هذا السحر العدو, ستتكيف رؤيته, مما يمنعه من التعرض للعمى مرة أخرى. مع ذلك, إذا أصيب مرة أخرى وهو أعمى بهذا السحر, فإن الضوء سيكون ساطعًا للغاية ويشل حركته.

actors.hero.spells.walloflight.name=جدار النور
actors.hero.spells.walloflight.short_desc=يُنشئ جداراً يصدّ الأعداء.
actors.hero.spells.walloflight.desc=يقوم الفارس بإنشاء جدار مصنوع من ألواح من الضوء الصلب أمامه مباشرة, بسمك بلاطة واحدة. %1$d يمتد على مساحة البلاطات, ويستمر لمدة 20 دورة.   يعمل هذا الجدار تمامًا كالجدار العادي, إلا أنه شفاف. الأعداء الذين يُحاصرون داخله عند إنشائه سيُصابون بصدمة مؤقتة ويُدفعون للخلف إن أمكن. أي شيء عالق داخل الجدار سيتمكن من الخروج منه.   يمكن إلقاء تعويذة الجدار في أي من الاتجاهات الأصلية الأربعة أو الاتجاهات القطرية الأربعة. إذا كان الجدار مُفعّلاً بالفعل, فيمكن إعادة استخدام التعويذة مجانًا لإزالته فورًا
actors.hero.spells.walloflight.early_end=تُلغي جدار النور.
actors.hero.spells.walloflight$lightwall.desc=ألواح متلألئة من النور تسدّ المرور هنا.

