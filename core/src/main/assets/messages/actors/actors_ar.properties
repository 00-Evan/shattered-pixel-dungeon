#warrior
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Warrior for _4 HP_ when he is at or below 33% health.\n\n_+2:_ Eating food heals the Warrior for _6 HP_ when he is at or below 33% health.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The Warrior identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Warrior identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When any shielding buff applied to the Warrior is broken by damage, his next physical attack will deal _3 bonus damage_.\n\n_+2:_ When any shielding buff applied to the Warrior is broken by damage, his next physical attack will deal _5 bonus damage_.
actors.hero.talent.iron_will.title=iron will
actors.hero.talent.iron_will.desc=_+1:_ The shield provided by the Warrior's seal is _increased by 1_.\n\n_+2:_ The shield provided by the Warrior's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will passively grant a 1 or 2 max shield version of the Warrior's broken seal effect.

actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Warrior 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Warrior 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=liquid willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ يكتسب المحارب _6.5% من الحد الأقصى لنقاط صحته في الحماية_ عند شرب أو إلقاء جرعة أو مشروب أو إكسير.   _+2:_ يكتسب المحارب _10% من الحد الأقصى لنقاط صحته في الحماية_ عند شرب أو إلقاء جرعة أو مشروب أو إكسير.   تتضاعف كمية الدرع عند استخدام جرعات القوة أو الخبرة أو عناصر الخيمياء التي يجب صنعها باستخدام تلك الجرعات.   بالنسبة لعناصر الخيمياء ذات كميات الإنتاج الأعلى (مثل مشروب الماء)، فإن هذه الموهبة لديها فرصة للتفعيل بناءً على عدد العناصر المنتجة
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc= +1: يمكن لختم المحارب المكسور نقل النقوش العادية بنفس الطريقة التي ينقل بها الترقية.   _+2:_ يمكن لختم المحارب المكسور نقل _الرموز العادية والقوية واللعنة_ بنفس الطريقة التي ينقل بها الترقية.   لا يمكن للختم نقل الرموز إلا إذا تم وضعها على الدرع عند تثبيت الختم.
actors.hero.talent.runic_transference.meta_desc=إذا اكتسب بطل آخر هذه الموهبة، فستساعد بدلاً من ذلك النقوش الموجودة على درعك على مقاومة الإزالة بواسطة لفائف الترقية. ستبدأ النقوش بالاختفاء عند الترقية من المستوى 6 (بدلاً من 4) عند +1، أو من المستوى 7 (بدلاً من 4) عند +2. يبقى المستوى الذي تُفقد فيه النقوش حتمًا دون تغيير عند +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ عندما يوجه المحارب ضربة قاضية للعدو بسلاح مادي، فإنه لديه فرصة بنسبة 67٪ أن يأخذ 0 أدوار.   _+2:_ عندما يوجه المحارب ضربة قاضية للعدو بسلاح مادي، فإنه لديه فرصة بنسبة 100٪ أن يأخذ 0 أدوار.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=+1: يستطيع المحارب إعماء العدو لمدة دورتين برمي أي شيء ليس سلاحًا يُرمى عليه. يستغرق هذا التأثير 50 دورة لإعادة استخدامه.   +2: يستطيع المحارب إعماء العدو لمدة 3 أدوار برمي أي شيء ليس سلاحًا يُرمى عليه. يستغرق هذا التأثير 50 دورًا لإعادة استخدامه.

actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ عندما ينتظر المحارب مع تجهيز ختمه، فإنه يكتسب _1-2 درعًا_ ويبطئ تلاشي تأثيرات التوليف والدرع بنسبة _50%_ حتى يتحرك.   _+2:_ عندما ينتظر المحارب وهو مجهز بختمه، فإنه يكتسب _2-4 دروع_ ويبطئ من تلاشي تأثيرات التعزيزات المركبة والدروع بنسبة _75%_ حتى يتحرك.   _+3:_ عندما ينتظر المحارب مع تجهيز ختمه، فإنه يكتسب _3-6 دروع_ ويبطئ تلاشي تأثيرات التعزيزات المركبة والدروع بنسبة _100%_ حتى يتحرك
actors.hero.talent.hold_fast.meta_desc=_If this talent is gained by a different hero_ it does not require the warrior's seal, but cannot grant more armor than the tier of your equipped armor plus its level.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The Warrior's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Warrior's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Warrior's strength is _increased by 18%_, rounded down.

actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=+1: يمكن أن يصل غضب المحارب البربري إلى حد أقصى قدره 116%.   +2: يمكن أن يصل غضب المحارب البربري إلى حد أقصى قدره 133%.   +3: يمكن أن يصل غضب المحارب البربري إلى حد أقصى قدره 150%.   كل نقطة غضب فوق 100٪ تزيد من درع الهيجان بنسبة 1٪ وتقلل من وقت التبريد بنسبة 1٪، لكنها لا تزيد من مكافأة الضرر بما يتجاوز +50٪.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=يتم تفعيل Berserk _+1:_تلقائيًا إذا كان Berserker على وشك الموت وكان الغضب عند 100٪ أو أعلى، ولكن لديه فترة انتظار تبلغ _3 مستويات بطل_ عندما يحدث هذا.   _+2:_ يتم تفعيل Berserk تلقائيًا إذا كان Berserker على وشك الموت وكان الغضب عند 100٪ أو أعلى، ولكن لديه فترة انتظار تبلغ _2 مستوى بطل_ عندما يحدث هذا.   _+3:_ يتم تفعيل Berserk تلقائيًا إذا كان Berserker على وشك الموت وكان الغضب عند أو أعلى من 100٪، ولكن لديه فترة انتظار تبلغ مستوى بطل واحد عند حدوث ذلك.   لاحظ أن المحارب البربري سيموت حتى لو كانت نقاط صحته صفرًا عند انتهاء حالة البربري
actors.hero.talent.enraged_catalyst.title=enraged catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ يتم تفعيل التعويذات واللعنات على سلاح المحارب بشكل متكرر كلما زاد غضبه، بحد أقصى _15% أكثر_ عند 100% من الغضب.   _+2:_ يتم تفعيل التعويذات واللعنات على سلاح المحارب بشكل متكرر كلما زاد غضبه، بحد أقصى _30% أكثر_ عند 100% من الغضب.   _+3:_ يتم تفعيل التعويذات واللعنات على سلاح المحارب بشكل متكرر كلما زاد غضبه، بحد أقصى _45% أكثر_ عند 100% من الغضب

actors.hero.talent.cleave.title=شق
actors.hero.talent.cleave.desc=_+1:_ يتم زيادة الوقت الإضافي الذي يحصل عليه المصارع عند القتل إلى _30 دورة_، بدلاً من 15.   _+2:_ يتم زيادة الوقت الإضافي الذي يحصل عليه المصارع عند القتل إلى _45 دورة_، بدلاً من 15.   _+3:_ يتم زيادة الوقت الإضافي الذي يحصل عليه المصارع عند القتل إلى _60 دورة_، بدلاً من 15.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=     _+1:_ عندما يقتل المصارع عدوًا بحركة كومبو، يتم تقليل وقت إعادة استخدام درع الختم المكسور بمقدار 50 دورة.   _+2:_ عندما يقتل المصارع عدوًا بحركة كومبو، يتم تقليل وقت إعادة استخدام درع الختم المكسور بمقدار 100 دورة.   _+3:_ عندما يقتل المصارع عدوًا بحركة كومبو، يتم تقليل وقت إعادة استخدام درع الختم المكسور بمقدار 150 دورة.   يمكن تقليل وقت إعادة استخدام الدرع إلى -150 دورة بواسطة هذه الموهبة، مما يعني أنه سيكون متاحًا مرة أخرى على الفور بمجرد تفعيله
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ عندما يكون مجموع ضربات المصارع 7 أو أعلى، يزداد مدى دفع كلوبير إلى 3، ويسبب الدوار، ويمكنه دفع الأعداء إلى الحفر.   +2: بالإضافة إلى مزايا +1، عندما يكون مجموع ضربات المصارع 9 أو أعلى، فإن الصد يعمل على الهجمات المتعددة.   _+3:_ بالإضافة إلى مزايا +1 و+2، يمكن للمصارع أن يقفز حتى مربعات كومبو/3 عند استخدام Slam أو Crush أو Fury.

actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=+1: عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء المجاورين ضررًا يساوي 1-4 بالإضافة إلى 25٪ من قوة صد الضرر لديه.   +2: عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء المجاورين ضررًا يساوي 2-8 بالإضافة إلى 50% من قوة صد الضرر لديه.   _+3:_ عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء المجاورين ضررًا يساوي _3-12 بالإضافة إلى 75%_ من قوة صد الضرر لديه.   +4: عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء المجاورين ضررًا يساوي 4-16 بالإضافة إلى 100% من قوة صد الضرر لديه
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=+1: عندما يهبط المحارب بعد القفز، يتم دفع جميع الأعداء المجاورين للخلف بمقدار مربعين، ويكون لديهم فرصة بنسبة 25٪ ليصبحوا عرضة للهجوم لمدة 5 أدوار.   _+2:_ عندما يهبط المحارب بعد القفز، يتم دفع جميع الأعداء المجاورين _3 مربعات_ للخلف ويكون لديهم فرصة _50%_ ليصبحوا عرضة للهجوم لمدة 5 أدوار.   _+3:_ عندما يهبط المحارب بعد القفز، يتم دفع جميع الأعداء المجاورين _4 مربعات_ للخلف ويكون لديهم فرصة _75%_ ليصبحوا عرضة للهجوم لمدة 5 أدوار.   +4: عندما يهبط المحارب بعد القفز، يتم دفع جميع الأعداء المجاورين للخلف بمقدار 5 مربعات ويكون لديهم فرصة بنسبة 100٪ ليصبحوا عرضة للهجوم لمدة 5 أدوار
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc= +1: إذا قام المحارب بقفزة ثانية في غضون 3 أدوار، فإن تكلفة شحن تلك القفزة تكون مخفضة بنسبة 16٪.   _+2:_ إذا قام المحارب بقفزة ثانية في غضون 3 أدوار، فإن تكلفة شحن تلك القفزة تكون مخفضة بنسبة 30%.   _+3:_ إذا قام المحارب بقفزة ثانية في غضون 3 أدوار، فإن تكلفة شحن تلك القفزة تكون مخفضة بنسبة 40%.   +4: إذا قام المحارب بقفزة ثانية في غضون 3 أدوار، فإن تكلفة شحن تلك القفزة تكون مخفضة بنسبة 50٪.

actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ تم زيادة مدى موجة الصدمة إلى _6 مربعات_ من 5، وتم زيادة عرضها إلى _75 درجة_ من 60.   _+2:_ تم زيادة مدى موجة الصدمة إلى _7 مربعات_ من 5، وتم زيادة عرضها إلى _90 درجة_ من 60.   _+3:_ تم زيادة مدى موجة الصدمة إلى _8 مربعات_ من 5، وتم زيادة عرضها إلى _105 درجة_ من 60.   _+4:_ تم زيادة مدى موجة الصدمة إلى _9 مربعات_ من 5، وتم زيادة عرضها إلى _120 درجة_ من 60
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ لدى موجة الصدمة فرصة بنسبة 30% لاستخدام تأثيرات الضربة مثل التعويذات والكومبو.   _+2:_ لدى موجة الصدمة فرصة بنسبة 60% لاستخدام تأثيرات الضربة مثل التعويذات والكومبو.   _+3:_ لدى موجة الصدمة فرصة بنسبة 90% لاستخدام تأثيرات الضربة مثل التعويذات والكومبو.   _+4:_ لدى موجة الصدمة فرصة بنسبة 100% لاستخدام تأثيرات الضربة مثل التعويذات والكومبو، وهي تمنح التعويذات قوة بنسبة 20%.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ موجة الصدمة تسبب _20% ضررًا إضافيًا_ ولديها فرصة _25%_ للصعق بدلاً من الشلل.   _+2:_ موجة الصدمة تسبب ضررًا أكبر بنسبة 40% ولديها فرصة بنسبة 50% للصعق بدلاً من الشلل.   _+3:_ موجة الصدمة تسبب ضررًا أكبر بنسبة 60% ولديها فرصة بنسبة 75% للصعق بدلاً من الشلل.   _+4:_ موجة الصدمة تسبب _80% ضررًا إضافيًا_ ولديها فرصة _100%_ للصعق بدلاً من الشلل

actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc= _+1:_ يقوم المحارب بإلحاق ضرر إضافي بنسبة 115% موزعة على ضربتين، بدلاً من إلحاق ضرر إضافي بنسبة 100% في ضربة واحدة.   _+2:_ يقوم المحارب بإلحاق ضرر إضافي بنسبة 130% موزعة على 3 ضربات، بدلاً من إلحاق ضرر إضافي بنسبة 100% في ضربة واحدة.   _+3:_ يقوم المحارب بإلحاق ضرر إضافي بنسبة 145% موزعة على 4 ضربات، بدلاً من إلحاق ضرر إضافي بنسبة 100% في ضربة واحدة.   _+4:_ يقوم المحارب بإلحاق ضرر إضافي بنسبة 160% موزعة على 5 ضربات، بدلاً من إلحاق ضرر إضافي بنسبة 100% في ضربة واحدة
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ تم زيادة نسبة تقليل الضرر لدى المحارب أثناء التحمل إلى 60%، بدلاً من 50%.   _+2:_ تم زيادة نسبة تقليل الضرر لدى المحارب أثناء التحمل إلى 68%، من 50%.   _+3:_ تم زيادة نسبة تقليل الضرر لدى المحارب أثناء التحمل إلى 74%، من 50%.   _+4:_ تم زيادة نسبة تقليل الضرر لدى المحارب أثناء التحمل إلى 80%، بدلاً من 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=+1: يلحق المحارب ضررًا إضافيًا بنسبة 5% لكل عدو ضمن نطاق مربعين عند انتهاء التحمل.   _+2:_ يلحق المحارب ضررًا إضافيًا بنسبة 10% لكل عدو ضمن نطاق مربعين عند انتهاء التحمل.   _+3:_ يلحق المحارب ضررًا إضافيًا بنسبة 15% لكل عدو ضمن نطاق مربعين عند انتهاء التحمل.   +4: يلحق المحارب ضررًا إضافيًا بنسبة 20% لكل عدو ضمن نطاق مربعين عند انتهاء التحمل

#mage
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a wand.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a wand.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies wands _3x faster_.\n\n_+2:_ The Mage identifies wands _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a wand or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a wand or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level wand.

actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=+1: عندما يقرأ الساحر لفافة أو يستخدم عنصر تعويذة، فإن ضربتي عصاه التاليتين تحصلان على +2 مستوى.   +2: عندما يقرأ الساحر لفافة أو يستخدم عنصر تعويذة، فإن ضربات عصاه الثلاث التالية تحصل على +2 مستوى.   يتضاعف عدد ضربات العصا المحسّنة عند استخدام لفافة من عناصر الترقية أو التحويل أو الخيمياء التي يجب صنعها باستخدام تلك اللفائف.   بالنسبة لعناصر الخيمياء ذات كميات الإنتاج الأعلى (مثل معظم التعاويذ)، فإن هذه الموهبة لديها فرصة للتفعيل بناءً على عدد العناصر المنتجة
actors.hero.talent.wand_preservation.title=wand preservation
actors.hero.talent.wand_preservation.desc=+1: عندما يقوم الساحر بتطعيم عصا جديدة في عصاه، تُعاد العصا القديمة بقيمة +0، ولكن لا يمكن القيام بذلك إلا مرة واحدة.   +2: عندما يقوم الساحر بتطعيم عصا جديدة في عصاه، تُعاد العصا القديمة عند +0، ويمكن تكرار ذلك مع فترة انتظار مستوى بطل واحد.
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a wand into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ يمكن للساحر أن يستهدف نفسه بعصا سحرية لتحويل جميع شحناته إلى دروع بمعدل _4% من الحد الأقصى لنقاط الصحة لكل شحنة_.   _+2:_ يمكن للساحر أن يستهدف نفسه بعصا سحرية لتحويل جميع شحناته إلى دروع بمعدل _6% من الحد الأقصى لنقاط الصحة لكل شحنة_

actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc= _+1:_ تكتسب عصي الساحر وعصاه مستوى _+1_ في ضربتها الأخيرة عندما تكون على وشك النفاد من الشحنة.   _+2:_ تكتسب عصي الساحر وعصاه _+2 مستوى_ في ضربتها الأخيرة عندما تكون على وشك النفاد من الشحنة.   _+3:_ تكتسب عصي الساحر وعصاه _+3 مستويات_ في ضربتها الأخيرة عندما تكون على وشك النفاد من الشحنة
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ يمكن للساحر اختيار حليف لتبادل الأماكن معه على الفور، بمدى _2 بلاطة_.   _+2:_ يمكن للساحر اختيار حليف ليتبادل الأماكن معه على الفور، بمدى _4 مربعات_.   _+3:_ يمكن للساحر اختيار حليف ليتبادل الأماكن معه على الفور، بمدى _6 مربعات_.   لا يستطيع الساحر تبديل الأماكن مع الحلفاء غير القادرين على الحركة.

actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ الضربة الأولى التي يوجهها الساحر المحارب بعصاه بعد استخدام الصاعقة تسبب _+16% ضررًا_ ويحصل التأثير الإضافي للعصا على _+50% قوة_.   _+2:_ الضربة الأولى التي يوجهها الساحر المحارب بعصاه بعد استخدام الصاعقة تسبب _+33% ضررًا_ ويحصل التأثير الإضافي للعصا على _+100% قوة_.   _+3:_ الضربة الأولى التي يوجهها الساحر المحارب بعصاه بعد استخدام الصاعقة تسبب _+50% ضررًا_ ويحصل التأثير الإضافي للعصا على _+150% قوة
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of artifact recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of artifact recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of artifact recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ عندما يتم شحن عصا الساحر المحارب بالكامل، فإن ضربتها التالية ستمنحه _0.67 درعًا_ لكل مستوى من مستويات العصا.   _+2:_ عندما يتم شحن عصا الساحر المحارب بالكامل، فإن ضربتها التالية ستمنحه _1.33 درعًا_ لكل مستوى من مستويات العصا.   _+3:_ عندما يتم شحن عصا الساحر المحارب بالكامل، فإن ضربتها التالية ستمنحه _2 درعًا_ لكل مستوى من مستويات العصا

actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ يؤدي الضرر الجسدي الذي يلحقه اللاعبون الآخرون إلى تفعيل علامة روح الساحر بنسبة فعالية 13%.   _+2:_ يؤدي الضرر الجسدي الذي يلحقه اللاعبون الآخرون إلى تفعيل علامة روح الساحر بنسبة فعالية 27%.   _+3:_ يؤدي الضرر الجسدي الذي يلحقه اللاعبون الآخرون إلى تفعيل علامة روح الساحر بنسبة فعالية 40%.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=+1: تمنح علامة الروح 0.33 دورة من الشبع مقابل كل ضرر جسدي يتم إلحاقه. لدى الأعداء الذين يحملون علامة الروح فرصة بنسبة 10% لتفعيل تأثيرات عند تناولهم الطعام عند موتهم.   +2: تمنح علامة الروح 0.67 دورة من الشبع مقابل كل ضرر جسدي يتم إلحاقه. لدى الأعداء الذين يحملون علامة الروح فرصة بنسبة 20% لتفعيل تأثيرات عند تناولهم الطعام عند موتهم.   +3: تمنح علامة الروح دورة واحدة من الشبع مقابل كل ضرر جسدي يتم إلحاقه. لدى الأعداء الذين يحملون علامة الروح فرصة بنسبة 30% لتفعيل تأثيرات عند تناولهم الطعام عند موتهم
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ عندما يموت عدو موسوم بروح، يكون لدى الساحر فرصة بنسبة 13٪ لإحيائه كشبح فاسد.   _+2:_ عندما يموت عدو موسوم بروح، يكون لدى الساحر فرصة بنسبة 27% لإحيائه كشبح فاسد.   _+3:_ عندما يموت عدو موسوم بروح، يكون لدى الساحر فرصة بنسبة 40٪ لإحيائه كشبح فاسد.

actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ تم زيادة نصف قطر الانفجار العنصري إلى _5 مربعات_، من 4.   _+2:_ تم زيادة نصف قطر الانفجار العنصري إلى _6 مربعات_، من 4.   _+3:_ تم زيادة نصف قطر الانفجار العنصري إلى _7 مربعات_، من 4.   _+4:_ تم زيادة نصف قطر الانفجار العنصري إلى _8 مربعات_، من 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ يكتسب الساحر _2.5 درعًا_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 5 شخصيات.   _+2:_ يكتسب الساحر _5 دروع_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 6 شخصيات.   _+3:_ يكتسب الساحر _7.5 درعًا_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 7 شخصيات.   _+4:_ يكتسب الساحر _10 دروع_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 8 شخصيات

actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc= _+1:_ عند استخدام السحر الجامح، سيتم تعزيز العصي إما بمقدار _2 أو 3، حتى +4_.   _+2:_ عند استخدام السحر الجامح، سيتم تعزيز العصي بمقدار _3، حتى +5_.   _+3:_ عند استخدام السحر الجامح، سيتم تعزيز العصي إما بمقدار _3 أو 4، حتى +6_.   _+4:_ عند استخدام السحر الجامح، سيتم تعزيز العصي بمقدار _4، حتى +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ السحر الجامح الآن يعمل _5 مرات_ بدلاً من 4، وكل عصا لديها فرصة _25%_ لتكون قابلة للاستخدام 3 مرات.   _+2:_ يتم الآن إطلاق السحر البري _6 مرات_ بدلاً من 4، ولكل عصا فرصة _50%_ لتكون قابلة للاستخدام 3 مرات.   _+3:_ السحر الجامح الآن يعمل _7 مرات_ بدلاً من 4، وكل عصا لديها فرصة _75%_ لتكون قابلة للاستخدام 3 مرات.   _+4:_ السحر الجامح الآن يعمل _8 مرات_ بدلاً من 4، وكل عصا لديها فرصة _100%_ لتكون قابلة للاستخدام 3 مرات
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc= _+1:_ كل صاعقة من السحر الجامح تستخدم الآن _0.33 شحنة_ بدلاً من 0.5، والسحر الجامح لديه فرصة _25%_ لعدم قضاء دور.   _+2:_ كل صاعقة من السحر الجامح تستخدم الآن _0.225 شحنة_ بدلاً من 0.5، والسحر الجامح لديه فرصة _50%_ لعدم قضاء دور.   _+3:_ كل ضربة من السحر الجامح تستخدم الآن _0.15 شحنة_ بدلاً من 0.5، والسحر الجامح لديه فرصة _75%_ لعدم قضاء دور.   _+4:_ كل صاعقة من السحر الجامح تستخدم الآن _0.1 شحنة_ بدلاً من 0.5، والسحر الجامح لديه فرصة _100%_ لعدم قضاء دور.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc= +1: إذا انتقل الساحر إلى شخصية أخرى، فإنه يلحق بها ضررًا يتراوح بين 10 و15، ولكنه يتلقى أيضًا ضررًا قدره 5.   _+2:_ إذا انتقل الساحر إلى شخصية أخرى فإنه يلحق بها ضررًا يتراوح بين 20 و30 نقطة، ولكنه يتلقى أيضًا ضررًا قدره 10 نقاط.   _+3:_ إذا انتقل الساحر إلى شخصية أخرى فإنه يلحق بها ضررًا يتراوح بين 30 و45، ولكنه يتلقى أيضًا ضررًا قدره 15.   +4: إذا انتقل الساحر إلى شخصية أخرى، فإنه يلحق بها ضررًا يتراوح بين 40 و60، ولكنه يتلقى أيضًا ضررًا قدره 20.   لا يمكن قتل البطل بهذه الموهبة، ويمكن تقليل الضرر الذاتي عن طريق تأثيرات مقاومة السحر.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=+1: يمكن للساحر وضع منارة في أي مكان ضمن نطاق 4 مربعات.   _+2:_ يستطيع الساحر وضع منارة في أي مكان ضمن _8 مربعات_.   +3: يمكن للساحر وضع منارة في أي مكان ضمن نطاق 12 مربعًا.   +4: يمكن للساحر وضع منارة في أي مكان ضمن نطاق 16 مربعًا.   لا يستطيع الساحر وضع المنارات في المواقع التي لا يمكن الوصول إليها
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=+1: يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحن تبلغ 150%.   _+2:_ يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحن تبلغ _117%_.   _+3:_ يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحن تبلغ 83%.   +4: يمكن للساحر الآن الانتقال بين الطوابق، بتكلفة شحن تبلغ 50%.   لا يستطيع الساحر استخدام الانتقال بعيد المدى لمغادرة طابق مغلق

#rogue
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=+1: يمكن للمحتال أن يجد حصتين من المؤن موضوعتين في الصناديق أثناء استكشافه للطوابق القليلة التالية من الزنزانة.   _+2:_ يمكن للمحتال أن يجد _3 حصص إمداد_ موضوعة في الصناديق أثناء استكشافه للطوابق القليلة التالية من الزنزانة.   يتم تناول حصص الإمداد بسرعة، وتستعيد قدراً معتدلاً من الشبع، وتعالج 5 نقاط صحة، وتستعيد شحنة واحدة لرداء الظلال.
actors.hero.talent.thiefs_intuition.title=thief's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The Rogue identifies rings _2x faster_, and identifies the type of a ring _when he equips it_.\n\n_+2:_ The Rogue identifies rings _when he equips them_, and identifies the type of a ring _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The Rogue deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The Rogue deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The Rogue gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The Rogue gains one shielding _every turn_ he is invisible, _to a max of 5_.

actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ تناول الطعام يأخذ من المحتال دورًا واحدًا (يتم تناول حصص الإمداد على الفور) ويمنحه _3 أدوار من إعادة شحن القطع الأثرية_.   _+2:_ تناول الطعام يأخذ من المحتال دورًا واحدًا (يتم تناول حصص الإمداد على الفور) ويمنحه _5 أدوار من إعادة شحن القطع الأثرية_.   لا يمكن استخدام هذه الموهبة للسماح لقرن الوفرة بإعادة شحن نفسه.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=+1: يكتسب المحتال 3 أدوار من الاختفاء بعد قراءة لفافة أو استخدام عنصر سحري.   +2: يكتسب المحتال 5 أدوار من الاختفاء بعد قراءة لفافة أو استخدام عنصر سحري.   تتضاعف مدة الاختفاء عند استخدام لفافة الترقية، أو لفافة التحويل، أو عناصر الخيمياء التي يجب صنعها باستخدام تلك اللفائف.   بالنسبة لعناصر الخيمياء ذات كميات الإنتاج الأعلى (مثل معظم التعاويذ)، فإن هذه الموهبة لديها فرصة للتفعيل بناءً على عدد العناصر المنتجة
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The Rogue’s search radius is increased from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The Rogue will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The Rogue will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=rogue's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ عندما يكون المحتال في مستوى يحتوي على غرفة سرية، لديه فرصة بنسبة 75% لملاحظة أن المستوى يحتوي على سر.   _+2:_ عندما يكون المحتال في مستوى يحتوي على غرفة سرية، فإنه يمتلك فرصة بنسبة 100٪ لملاحظة أن المستوى يحتوي على سر.

actors.hero.talent.light_cloak.title=light cloak
actors.hero.talent.light_cloak.desc=+1: يمكن للمحتال استخدام عباءة الظلال الخاصة به عندما لا يكون مجهزًا، ولكنها تشحن بسرعة 25% عند عدم تجهيزها.   _+2:_ يمكن للمحتال استخدام عباءة الظلال الخاصة به عندما لا يكون مجهزًا، ولكنها تشحن بسرعة _50%_ عند عدم تجهيزها.   _+3:_ يمكن للمحتال استخدام عباءة الظلال الخاصة به عندما لا يكون مجهزًا، ولكنها تشحن بسرعة _75%_ عند عدم تجهيزها.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all artifacts by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced rings
actors.hero.talent.enhanced_rings.desc=_+1:_ عندما يستخدم المحتال قطعة أثرية، تحصل خواتمه على ترقية +1 لمدة _3 أدوار_.   _+2:_ عندما يستخدم المحتال قطعة أثرية، تحصل خواتمه على ترقية +1 لمدة _6 أدوار_.   _+3:_ عندما يستخدم المحتال قطعة أثرية، تحصل خواتمه على ترقية +1 لمدة _9 أدوار_.

actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc= _+1:_ يمكن للقاتل اغتيال الأعداء الذين تقل صحتهم عن _4/13/27/67%_ لكل مستوى من مستويات التحضير، بزيادة عن 3/10/20/50%.   _+2:_ يمكن للقاتل اغتيال الأعداء الذين تقل صحتهم عن _5/17/33/83%_ لكل مستوى من مستويات التحضير، بزيادة عن 3/10/20/50%.   _+3:_ يمكن للقاتل اغتيال الأعداء الذين تقل صحتهم عن _6/20/40/100%_ لكل مستوى من مستويات التحضير، بزيادة عن 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ تم زيادة مدى وميض القاتل لكل مستوى من مستويات التحضير إلى _1/3/4/6 مربعات_، من 1/2/3/4.   _+2:_ تم زيادة مدى وميض القاتل لكل مستوى من مستويات التحضير إلى _2/4/6/8 مربعات_، من 1/2/3/4.   _+3:_ تم زيادة مدى وميض القاتل لكل مستوى من مستويات التحضير إلى _2/5/7/10 مربعات_، من 1/2/3/4.   يمكن لهذه الوميض أن يمر عبر المخاطر والأعداء، ولكن ليس عبر التضاريس الصلبة مثل الجدران.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ عندما يقتل القاتل عدوًا بضربة مُعدة مسبقًا، تزداد فرصة سقوط العناصر بنسبة _2/4/8/16%_، لكل مستوى من مستويات الإعداد.   _+2:_ عندما يقتل القاتل عدوًا بضربة مُعدة مسبقًا، تزداد فرصة سقوط العناصر بنسبة _4/8/16/32%_، لكل مستوى من مستويات الإعداد.   _+3:_ عندما يقتل القاتل عدوًا بضربة مُعدة مسبقًا، تزداد فرصة سقوط العناصر بنسبة _6/12/24/48%_، لكل مستوى من مستويات الإعداد

actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ أثناء الجري الحر، يحصل العداء الحر على _+1 مراوغة إضافية لكل نقطة قوة زائدة على درعه.   _+2:_ أثناء الجري الحر، يحصل العداء الحر على _+2 مراوغة إضافية لكل نقطة قوة زائدة على درعه.   _+3:_ أثناء الجري الحر، يحصل العداء الحر على _+3 مراوغة إضافية لكل نقطة قوة زائدة على درعه.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ While freerunning, the Freerunner gains _+50% accuracy and +15% damage_ with thrown weapons.\n\n_+2:_ While freerunning, the Freerunner gains _+100% accuracy and +30% damage_ with thrown weapons.\n\n_+3:_ While freerunning, the Freerunner gains _+150% accuracy and +45% damage_ with thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=+1: يكتسب العداء الحر 2 من الزخم في كل دور أثناء كونه غير مرئي.   +2: بالإضافة إلى مزايا +1، لم يعد الجري الحر يعد تنازليًا أثناء كون العداء الحر غير مرئي.   _+3:_ بالإضافة إلى مزايا +1 و+2، يتحرك العداء الحر بسرعة مضاعفة أثناء كونه غير مرئي، بغض النظر عما إذا كان يمارس الجري الحر أم لا

actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=+1: بعد الرمش، يكتسب المحتال دورة واحدة من السرعة والاختفاء.   +2: بعد الرمش، يكتسب المحتال دورتين من السرعة والاختفاء.   +3: بعد الرمش، يكتسب المحتال 3 أدوار من السرعة والاختفاء.   +4: بعد الرمش، يكتسب المحتال 4 أدوار من السرعة والاختفاء.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc= _+1:_ بعد أن يرمش، يترك المحتال خلفه فخًا خشبيًا يحتوي على _20 صحة و1-3 دروع_.   _+2:_ بعد أن يرمش، يترك المحتال خلفه فخًا خشبيًا يحتوي على _40 صحة و2-6 دروع_.   _+3:_ بعد أن يرمش، يترك المحتال خلفه فخًا خشبيًا يحتوي على _60 صحة و3-9 دروع_.   _+4:_ بعد أن يرمش، يترك المحتال خلفه فخًا خشبيًا يحتوي على _80 صحة و4-12 درعًا_.   لا يمكن تفعيل سوى فخ واحد في كل مرة.
actors.hero.talent.shadow_step.title=shadow step
actors.hero.talent.shadow_step.desc=إذا استخدم المحتال قنبلة دخان مستوي +1وهو غير مرئي، فإنها تحدث على الفور وتكون تكلفة الشحن مخفضة بنسبة 16٪، ولكنها أيضًا لا تعمي الأعداء أو تشغل مواهب أخرى. _+2:_ إذا استخدم المحتال قنبلة دخان وهو غير مرئي، فإنها تحدث على الفور وتكون تكلفة شحنها مخفضة بنسبة 30٪، ولكنها أيضًا لا تعمي الأعداء أو تشغل مواهب أخرى. _+3:_ إذا استخدم المحتال قنبلة دخان وهو غير مرئي، فإنها تحدث على الفور وتكون تكلفة الشحن _مخفضة بنسبة 41٪_، ولكنها أيضًا لا تعمي الأعداء أو تشغل مواهب أخرى. _+4:_ إذا استخدم المحتال قنبلة دخان وهو غير مرئي، فإنها تحدث على الفور وتكون تكلفة شحنها مخفضة بنسبة 50٪، ولكنها أيضًا لا تعمي الأعداء أو تشغل مواهب أخرى

actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=+1: عندما يصل العدو الذي يحمل علامة الموت إلى 0 نقطة صحة، يصبح عاجزًا.   +2: عندما يصل العدو الذي يحمل علامة الموت إلى 0 نقطة صحة، يصبح مخيفًا ومعاقًا.   +3: عندما يصل العدو الذي يحمل علامة الموت إلى 0 نقطة صحة، يصبح مخيفًا ومعاقًا، ويصبح الأعداء الموجودون في نطاق 3 مربعات معاقين.   +4: عندما يصل العدو الذي يحمل علامة الموت إلى 0 نقطة صحة، يصبح مخيفًا ومعاقًا، ويصبح الأعداء الموجودون في نطاق 3 مربعات مخيفين ومعاقين
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ الأعداء الذين يقتلون بعلامة الموت يمنحون المحتال درعًا يعادل _13%_ من نقاط صحتهم عندما تم وضع العلامة عليهم.   _+2:_ الأعداء الذين يقتلون بعلامة الموت يمنحون المحتال درعًا يعادل _25%_ من نقاط صحتهم عندما تم وضع العلامة عليهم.   _+3:_ الأعداء الذين يقتلون بواسطة علامة الموت يمنحون المحتال درعًا يعادل _38%_ من نقاط صحتهم عندما تم وضع علامة عليهم.   _+4:_ الأعداء الذين يقتلون بعلامة الموت يمنحون المحتال درعًا يعادل _50%_ من نقاط صحتهم عندما تم وضع العلامة عليهم
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=+1: وضع علامة على هدف ثانٍ في نفس وقت وضع علامة على الهدف الأول له تكلفة شحن مخفضة بنسبة 30%.   _+2:_ وضع علامة على هدف ثانٍ في نفس الوقت مع الهدف الأول له تكلفة شحن مخفضة بنسبة 50%.   _+3:_ وضع علامة على هدف ثانٍ في نفس الوقت مع الهدف الأول له تكلفة شحن مخفضة بنسبة 65%.   +4: وضع علامة على هدف ثانٍ في نفس الوقت مع الهدف الأول له تكلفة شحن مخفضة بنسبة 75%

actors.hero.talent.shadow_blade.title=shadow blade
actors.hero.talent.shadow_blade.desc=_+1:_ يكتسب المستنسخ الظلي _8%_ من ضرر البطل في كل دور، ولديه فرصة _25%_ لاستخدام التعويذة على سلاح البطل.   _+2:_ يكتسب المستنسخ الظلي _16%_ من ضرر البطل في كل دور، ولديه فرصة _50%_ لاستخدام التعويذة على سلاح البطل.   _+3:_ يكتسب المستنسخ الظلي _24%_ من ضرر البطل في كل دور، ولديه فرصة _75%_ لاستخدام التعويذة على سلاح البطل.   _+4:_ يكتسب المستنسخ الظلي _32%_ من ضرر البطل في كل دور، ولديه فرصة _100%_ لاستخدام التعويذة على سلاح البطل
actors.hero.talent.cloned_armor.title=cloned armor
actors.hero.talent.cloned_armor.desc=_+1:_ يكتسب المستنسخ الظلي _12%_ من قيمة درع البطل، ولديه فرصة _25%_ لاستخدام النقش على درع البطل.   _+2:_ يكتسب المستنسخ الظلي _24%_ من قيمة درع البطل، ولديه فرصة _50%_ لاستخدام النقش الموجود على درع البطل.   _+3:_ يكتسب المستنسخ الظلي _36%_ من قيمة درع البطل، ولديه فرصة _75%_ لاستخدام النقش على درع البطل.   _+4:_ يكتسب المستنسخ الظلي _48%_ من قيمة درع البطل، ولديه فرصة _100%_ لاستخدام النقش على درع البطل
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ يكتسب استنساخ الظل _10%_ من الحد الأقصى لنقاط صحة البطل، ويمكنه تبديل الأماكن مع البطل على الفور حتى مسافة _مربع واحد_.   _+2:_ يكتسب استنساخ الظل _20%_ من الحد الأقصى لنقاط صحة البطل، ويمكنه تبديل الأماكن مع البطل على الفور حتى مسافة _2 مربع_.   _+3:_ يكتسب استنساخ الظل _30%_ من الحد الأقصى لنقاط صحة البطل، ويمكنه تبديل الأماكن مع البطل على الفور حتى مسافة _3 مربعات_.   _+4:_ يكتسب استنساخ الظل _40%_ من الحد الأقصى لنقاط صحة البطل، ويمكنه تبديل الأماكن مع البطل على الفور حتى مسافة _4 مربعات

#huntress
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc= +1: يمكن للصيادة أن تجد 4 حبات توت مخبأة في العشب الطويل أثناء استكشافها للطوابق القليلة التالية من الزنزانة.   +2: يمكن للصيادة أن تجد 6 حبات توت مخبأة في العشب الطويل أثناء استكشافها للطوابق القليلة التالية من الزنزانة.   تُؤكل التوت بسرعة، وتُعيد قدراً ضئيلاً من الشعور بالشبع، وقد تحتوي على بذرة قابلة للاستخدام
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies thrown weapons _3x faster_.\n\n_+2:_ The Huntress identifies thrown weapons _when she hits with them_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ عندما تصيب الصيادة عدوًا بقوسها أو بسلاح مقذوف، فإن هجومها التالي بالاشتباك ضد ذلك العدو يسبب _2 ضررًا إضافيًا_.   _+2:_ عندما تصيب الصيادة عدوًا بقوسها أو بسلاح مقذوف، فإن هجومها التالي بالاشتباك ضد ذلك العدو يسبب _3 ضررًا إضافيًا_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ تكتسب الصيادة درعًا من 0-2 من جلد اللحاء، والذي يتلاشى كل _3 أدوار_ عندما يتم تفعيل تأثير النبات في مجال رؤيتها.   _+2:_ تكتسب الصيادة درعًا من 0-2 من جلد اللحاء، والذي يتلاشى كل _5 أدوار_ عندما يتم تفعيل تأثير النبات في مجال رؤيتها

actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=عندما تشرب الصيادة أو ترمي جرعة أو مشروبًا أو إكسيرً مستوي 1، تنبت _حتى 4 بلاطات عشبية_ في المنطقة المحيطة، ويتم تثبيت الأعداء المجاورين لمدة _دور واحد_.   _+2:_ عندما تشرب الصيادة أو ترمي جرعة أو مشروبًا أو إكسيرًا، تنبت _حتى 6 بلاطات عشبية_ في المنطقة المحيطة، ويتم تثبيت الأعداء المجاورين لمدة _دورتين_.   تتضاعف كمية العشب ومدة بقاء الجذور عند استخدام جرعات القوة أو الخبرة أو عناصر الخيمياء التي يجب صنعها باستخدام تلك الجرعات.   بالنسبة لعناصر الخيمياء ذات كميات الإنتاج الأعلى (مثل مشروب الماء)، فإن هذه الموهبة لديها فرصة للتفعيل بناءً على عدد العناصر المنتجة
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=+1: عندما تطأ الصيادة على عشب قصير أو جمر، يتحول إلى عشب طويل تقوم الصيادة بحفره فورًا. يستغرق هذا الأمر 10 أدوار لإعادة استخدامه.   +2: عندما تطأ الصيادة على عشب قصير أو جمر، يتحول إلى عشب طويل تقوم الصيادة بحفره فورًا. يستغرق هذا الأمر 5 أدوار لإعادة استخدامه.   ستنتج هذه الموهبة عشبًا محفورًا إذا تم تعطيل تأثيرات التجديد السلبي أو إذا لم يكتسب البطل خبرة لفترة طويلة
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on characters within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on characters within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.

actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc= _+1:_ عندما تستخدم الصيادة قوسها أو سلاحًا يُرمى في نطاق الاشتباك المباشر، تكون دقتها _-25%،_ بدلاً من -50%.   _+2:_ عندما تستخدم الصيادة قوسها أو سلاحًا يُرمى في نطاق الاشتباك المباشر، يكون لها دقة عادية، بدلاً من -50%.   _+3:_ عندما تستخدم الصيادة قوسها أو سلاحًا يُرمى في نطاق الاشتباك المباشر، يكون لديها دقة _+25%،_ بدلاً من -50%.   لاحظ أن الأسلحة التي تُرمى أو القوس الروحي تتمتع دائمًا بدقة +50% عند استخدامها عن بعد
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc= +1: عندما تطلق الصيادة سهماً على الأرض، فإنها تمنح رؤية في منطقة 3x3 حولها لمدة 5 أدوار. يستغرق هذا الأمر 20 دوراً لإعادة شحنه.   +2: عندما تطلق الصيادة سهماً على الأرض، فإنها تمنح رؤية في منطقة 3x3 حولها لمدة 10 أدوار. يستغرق هذا الأمر 20 دوراً لإعادة شحنه.   +3: عندما تطلق الصيادة سهماً على الأرض، فإنها تمنح رؤية في منطقة 3x3 حولها لمدة 15 دورة. يستغرق هذا الأمر 20 دورة لإعادة شحنه
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.

actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ الأسلحة التي يتم رميها لديها فرصة بنسبة 33% لاستخدام السحر على قوس القناص.   _+2:_ الأسلحة التي يتم رميها لديها فرصة بنسبة 67% لاستخدام السحر على قوس القناص.   _+3:_ الأسلحة التي يتم رميها لديها فرصة بنسبة 100% لاستخدام السحر على قوس القناص.   يمكن تفعيل سحر القوس بالإضافة إلى أي سحر موجود بالفعل على السلاح المرمي.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=عندما يهاجم القناص بسلاح رمي مطور مستوي، يزيد كل مستوى مدة علامة القناص بمقدار دورة واحدة وضرر هجومها الخاص بنسبة 16٪، بحد أقصى دورتين و+33٪ ضرر عند +2_.   _+2:_ عندما يهاجم القناص بسلاح رمي مطور، يزيد كل مستوى مدة علامة القناص بمقدار دورة واحدة وضرر هجومها الخاص بنسبة 16٪، بحد أقصى 4 دورات و+67٪ ضرر عند +4_.   _+3:_ عندما يهاجم القناص بسلاح رمي مطور، يزيد كل مستوى مدة علامة القناص بمقدار دورة واحدة وضرر هجومه الخاص بنسبة 16٪، بحد أقصى 6 دورات و+100٪ ضرر عند 6+

actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping on unfurrowed high grass or plants, the Warden gains _0-33% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping on unfurrowed high grass or plants, the Warden gains _0-67% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping on unfurrowed high grass or plants, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc= +1: يمكن لقطرات الندى أن تحمي الحارس عندما تكون صحتها كاملة، حتى 20% من الحد الأقصى لنقاط صحتها.   _+2:_ يمكن لقطرات الندى أن تحمي الحارس عندما تكون صحتها كاملة، حتى _40% من الحد الأقصى لنقاط صحتها_.   _+3:_ يمكن لقطرات الندى أن تحمي الحارس عندما تكون صحتها كاملة، حتى _60% من الحد الأقصى لنقاط صحتها_.

actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=+1: يمكن للشفرات الطيفية أن تصيب هدفًا إضافيًا واحدًا بنسبة 50% من الضرر. يجب أن يكون الهدف مرئيًا وضمن نطاق تأثير مخروطي بزاوية 30 درجة.   +2: يمكن للشفرات الطيفية أن تصيب هدفين إضافيين بنسبة 50% من الضرر. يجب أن يكون الهدفان مرئيين وضمن نطاق تأثير مخروطي بزاوية 60 درجة.   +3: يمكن للشفرات الطيفية أن تصيب ما يصل إلى 3 أهداف إضافية بنسبة 50% من الضرر. يجب أن تكون الأهداف مرئية وضمن نطاق تأثير مخروطي بزاوية 90 درجة.   +4: يمكن للشفرات الطيفية أن تصيب ما يصل إلى 4 أهداف إضافية بنسبة 50% من الضرر. يجب أن تكون الأهداف مرئية وضمن نطاق تأثير مخروطي بزاوية 120 درجة
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ تتمتع الشفرات الطيفية بدقة _+25%_، ويمكنها اختراق ما يصل إلى _2 بلاطة صلبة_.   _+2:_ تتمتع الشفرات الطيفية بدقة _+50%_، ويمكنها اختراق ما يصل إلى _4 بلاطات صلبة_.   _+3:_ تتمتع الشفرات الطيفية بدقة _+75%_، ويمكنها اختراق ما يصل إلى _6 بلاطات صلبة_.   _+4:_ تتمتع الشفرات الطيفية بدقة _+100%_، ويمكنها اختراق ما يصل إلى _8 بلاطات صلبة_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ لدى الشفرات الطيفية فرصة بنسبة 30% لاستخدام السحر على القوس الروحي أيضًا.   _+2:_ لدى الشفرات الطيفية فرصة بنسبة 60% لاستخدام السحر على القوس الروحي أيضًا.   _+3:_ لدى الشفرات الطيفية فرصة بنسبة 90% لاستخدام السحر على القوس الروحي أيضًا.   _+4:_ تتمتع الشفرات الطيفية بفرصة بنسبة 100% لاستخدام السحر على القوس الروحي أيضًا، وتمنح كل سحر قوة بنسبة 10%

actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ تم زيادة تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة إلى _38% و125%_، من 33% و100%.   _+2:_ يتم زيادة تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة إلى _42% و150%_، من 33% و100%.   _+3:_ يتم زيادة تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة إلى _46% و175%_، من 33% و100%.   _+4:_ يتم زيادة تعزيزات الهجوم وسرعة الحركة من قوة الطبيعة إلى _50% و200%_، من 33% و100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ أثناء نشاط قوة الطبيعة، فإن إطلاق النار من القوس الروحي لديه فرصة بنسبة 8٪ لإطلاق تأثير نباتي ضار عشوائي.   _+2:_ بينما تكون قوة الطبيعة نشطة، فإن الطلقات من القوس الروحي لديها فرصة بنسبة 17٪ لإطلاق تأثير نباتي ضار عشوائي.   _+3:_ بينما تكون قوة الطبيعة نشطة، فإن الطلقات من القوس الروحي لديها فرصة بنسبة 25٪ لإطلاق تأثير نباتي ضار عشوائي.   _+4:_ بينما تكون قوة الطبيعة نشطة، فإن الطلقات من القوس الروحي لديها فرصة بنسبة 33٪ لإطلاق تأثير نباتي ضار عشوائي.   النباتات التي يمكن تحفيزها هي: عشبة العمى، زهرة النار، غطاء الجليد، طحلب الحزن، وكرمة العاصفة
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=يؤدي قتل عدو باستخدام القوس الروحي مستوي 1 إلى إطالة مدة قوة الطبيعة بمقدار دورة واحدة. ويمكن تمديد المدة بحد أقصى دورتين.   +2: يؤدي قتل عدو باستخدام القوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار دورتين. ويمكن تمديد المدة بحد أقصى أربع دورات.   +3: يؤدي قتل عدو باستخدام القوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار 3 أدوار. ويمكن تمديد المدة بحد أقصى 6 أدوار.   +4: يؤدي قتل عدو باستخدام القوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار 4 أدوار. ويمكن تمديد المدة بحد أقصى 8 أدوار

actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ تم زيادة مدى رؤية الصقر الروحي إلى _7 مربعات_ من 6.   _+2:_ تم زيادة مدى رؤية الصقر الروحي إلى _8 مربعات_ من 6.   _+3:_ تم زيادة مدى رؤية الصقر الروحي إلى _9 مربعات_ من 6، وحصل على _2 مربعات_ من الرؤية العقلية.   _+4:_ تم زيادة مدى رؤية الصقر الروحي إلى _10 مربعات_ من 6، وحصل على _3 مربعات_ من الرؤية العقلية.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ هجمات الصقر الروحي تعمي الأعداء لمدة _دورتين_.   _+2:_ هجمات الصقر الروحي تعمي الأعداء لمدة _5 أدوار_.   _+3:_ هجمات الصقر الروحي تعمي الأعداء لمدة _5 أدوار_ وتشلهم لمدة _2 أدوار_.   _+4:_ هجمات الصقر الروحي تعمي الأعداء لمدة _5 أدوار_ وتشلهم لمدة _5 أدوار_
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc= _+1:_ تزداد سرعة حركة الصقر الروحي إلى _2.5 مربع_ من 2، ومن المؤكد أنه سيتجنب أول _هجومين_ يتم توجيههما ضده.   _+2:_ تزداد سرعة حركة الصقر الروحي إلى _3 مربعات_ من 2، ومن المؤكد أنه سيتجنب أول _4 هجمات_ يتم توجيهها ضده.   _+3:_ تزداد سرعة حركة الصقر الروحي إلى _3.5 مربعات_ من 2، ومن المؤكد أنه سيتجنب أول _6 هجمات_ يتم توجيهها ضده.   _+4:_تزداد سرعة حركة الصقر الروحي إلى _4 مربعات_ من 2، ومن المؤكد أنه سيتجنب أول _8 هجمات_ يتم توجيهها ضده

#duelist
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.

actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_عند شرب أو إلقاء جرعة أو مشروب أو إكسير، يكون لدى المبارز _3x مراوغة_، ويكون لديه _3x دقة_ في هجومه القريب التالي في غضون 5 أدوار.   _+2:_ عند شرب أو إلقاء جرعة أو مشروب أو إكسير، يكون لدى المبارز _مراوغة لا نهائية_، ولديه _دقة لا نهائية_ في هجومه القريب التالي في غضون 5 أدوار.   تستمر هذه المكافأة لدورة إضافية وهجوم عند استخدام جرعات القوة أو الخبرة أو عناصر الخيمياء التي يجب صنعها باستخدام تلك الجرعات.   بالنسبة لعناصر الخيمياء ذات كميات الإنتاج الأعلى (مثل مشروب الماء)، فإن هذه الموهبة لديها فرصة للتفعيل بناءً على عدد العناصر المنتجة
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of wand or artifact recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of wand or artifact recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=+1: عندما توجه المبارزة ضربة قاضية للعدو باستخدام قدرة سلاح، فإنها تكتسب حركة فورية بقيمة 3 أدوار.   _+2:_ عندما توجه المبارزة ضربة قاضية للعدو باستخدام قدرة سلاح، فإنها تكتسب _5 أدوار_ من الحركة الفورية
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=+1: يمكن للمبارزة تغيير سلاحها المجهز على الفور مرة واحدة كل 20 دورة.   +2: يمكن للمبارزة تبديل سلاحها المجهز على الفور مرتين كل 20 دورة.   إذا كان لدى المبارز هذه الموهبة ولم تكن في فترة انتظار، فإن استخدام سلاح غير مجهز بسرعة سيؤدي إلى تجهيزها.

actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=+1: عندما تستخدم المبارزة قدرة سلاح، فإنها تكتسب دقة مضاعفة في هجومها القريب التالي في غضون 5 أدوار.   _+2:_ عندما تستخدم المبارزة قدرة سلاح، فإنها تكتسب _5x دقة_ في هجومها القريب التالي في غضون 5 أدوار.   _+3:_ عندما تستخدم المبارزة قدرة سلاح، فإنها تكتسب دقة لا نهائية في هجومها القريب التالي في غضون 5 أدوار.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc= _+1:_ عندما تصيب المبارزة عدوًا بسلاح مقذوف، فإنها ستلحق به ضررًا إضافيًا بنسبة 10% في القتال المباشر لمدة 5 أدوار.   _+2:_ عندما تصيب المبارزة عدوًا بسلاح مقذوف، فإنها ستلحق به ضررًا إضافيًا بنسبة 20% في القتال المباشر لمدة 5 أدوار.   _+3:_ عندما تصيب المبارزة عدوًا بسلاح مقذوف، فإنها ستلحق به ضررًا إضافيًا بنسبة 30% في القتال المباشر لمدة 5 أدوار.

actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc= _+1:_ تستعيد البطلة على الفور _0.17 شحنة سلاح_ عندما تستخدم قدرتين مختلفتين للسلاح، بدون حد زمني.   _+2:_ تستعيد البطلة على الفور _0.33 شحنة سلاح_ عندما تستخدم قدرتين مختلفتين للسلاح، بدون حد زمني.   _+3:_ تستعيد البطلة على الفور _0.5 شحنة سلاح_ عندما تستخدم قدرتين مختلفتين للسلاح، بدون حد زمني.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc= _+1:_ إذا كان أحد سلاحي البطل المجهزين بمستوى أقل وكان _أقل بمستويين أو أكثر_ من السلاح الآخر، فسيتم رفعه إلى مستوى السلاح الآخر.   _+2:_ إذا كان أحد سلاحي البطل المجهزين بمستوى أقل وكان _مستوى واحد أو أكثر_ أقل من السلاح الآخر، فسيتم رفعه إلى مستوى السلاح الآخر.   _+3:_ إذا كان أحد سلاحي البطل المجهزين بمستوى أقل وكان _من نفس المستوى أو أقل_ من السلاح الآخر، فسيتم رفعه إلى مستوى السلاح الآخر.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc= _+1:_ إذا هاجم البطل بسلاح قتالي قريب المدى مباشرة بعد استخدام قدرة سلاح مختلف، فإن هذا الهجوم سيقضي على أي عدو غير الزعيم متبقٍ عند _أقل من 13% من نقاط الصحة_.   _+2:_ إذا هاجم البطل بسلاح قتالي قريب المدى مباشرة بعد استخدام قدرة سلاح مختلف، فإن هذا الهجوم سيقضي على أي عدو غير زعيم متبق عند _أقل من 27% من نقاط الصحة_.   _+3:_ إذا هاجم البطل بسلاح قتالي مباشرة بعد استخدام قدرة سلاح مختلف، فإن هذا الهجوم سيقضي على أي عدو غير زعيم متبقٍ عند _أقل من 40% من نقاط الصحة_.   يمكن أن يكون هذا الهجوم هجومًا عاديًا بسلاح اشتباك، أو جزءًا من قدرة سلاح.

actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc= _+1:_ يكتسب الراهب _50% طاقة إضافية_ لكل قطعة من المعدات _المستوى 3 أو أقل_ التي يستخدمها.   +2: تكتسب الراهبة طاقة إضافية بنسبة 75% لكل قطعة من المعدات من المستوى الثاني أو أقل التي تستخدمها. وتبقى فائدة المستوى الثالث دون تغيير.   +3: تكتسب الراهبة طاقة إضافية بنسبة 100% لكل قطعة من المعدات من المستوى الأول أو أقل التي تستخدمها. تبقى مزايا المستويين الثاني والثالث كما هي. كما تحصل على درع قماشي وقفازات مرصعة مجانًا.   لاحظ أن هذه الموهبة لا تمنح أي فائدة من كونها غير مسلحة أو من الهجوم باستخدام خاتم القوة
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=+1: إذا كانت طاقة الراهب 100%، فإن قدراتها ستتعزز.   +2: إذا كان لدى الراهب 80% أو أكثر من الطاقة، فإن قدراتها ستتعزز.   +3: إذا كان لدى الراهب طاقة بنسبة 60% أو أكثر، فإن قدراتها ستتعزز.   عند تمكينهم:  - يقوم هجوم Flurry بتطبيق سحر سلاحك  - التركيز فوري  - زيادة مدى الاندفاع بمقدار 4 نقاط  - ركلة التنين تُلحق ضررًا إضافيًا بنسبة 50% وتُطبق تأثير الدفع والصعق على جميع الأعداء المجاورين  - التأمل يعالج ببطء 20% من نقاط الصحة المفقودة ويمنح مقاومة للضرر بنسبة 80%
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ إذا استخدمت الراهبة قدرة سلاح وقدرة طاقة _4+ خلال 5 أدوار من بعضها البعض، فإنها تستعيد طاقة واحدة مستهلكة.   _+2:_ إذا استخدمت الراهبة قدرة سلاح وقدرة طاقة _3+ خلال 5 أدوار من بعضها البعض، فإنها تستعيد طاقة واحدة مستهلكة.   _+3:_ إذا استخدمت الراهبة قدرة سلاح وقدرة طاقة _2+ خلال 5 أدوار من بعضها البعض، فإنها تستعيد طاقة واحدة مستهلكة

actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=+1: تومض المبارزة حتى مربعين باتجاه هدفها عند بدء المبارزة.   +2: تومض المبارزة حتى ثلاث مربعات باتجاه هدفها عند بدء المبارزة.   +3: تومض المبارزة حتى أربع مربعات باتجاه هدفها عند بدء المبارزة.   +4: تومض المبارزة لمسافة تصل إلى خمس مربعات باتجاه هدفها عند بدء المبارزة.   يمكن لهذا الوميض أن يخترق العوائق والأعداء، لكنه لا يخترق التضاريس الصلبة كالجدران. ويُؤخذ هذا الوميض في الاعتبار عند تحديد ما إذا كان العدو ضمن نطاق المواجهة
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=+1: إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تتعافى بمقدار 5 نقاط صحة بالإضافة إلى 30% من الضرر الذي تلقته أثناء المبارزة.   _+2:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تتعافى بمقدار _10 نقاط صحة بالإضافة إلى 50% من الضرر_ الذي تلقته أثناء المبارزة.   _+3:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تتعافى بمقدار _15 نقطة صحة بالإضافة إلى 65% من الضرر_ الذي تلقته أثناء المبارزة.   _+4:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تشفى بمقدار _20 نقطة صحة بالإضافة إلى 75% من الضرر_ الذي تلقته أثناء المبارزة
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=+1: إذا قام المبارز بالتحدي مرة أخرى في غضون 3 أدوار من انتهاء المبارزة، فإن تكلفة الشحن لهذا التحدي تكون مخفضة بنسبة 16٪.   _+2:_ إذا قام المبارز بالتحدي مرة أخرى في غضون 3 أدوار من انتهاء المبارزة، فإن تكلفة الشحن لهذا التحدي تكون مخفضة بنسبة 30٪.   _+3:_ إذا قام المبارز بالتحدي مرة أخرى في غضون 3 أدوار من انتهاء المبارزة، فإن تكلفة الشحن لهذا التحدي تكون مخفضة بنسبة 40٪.   _+4:_ إذا قام المبارز بالتحدي مرة أخرى في غضون 3 أدوار من انتهاء المبارزة، فإن تكلفة الشحن لهذا التحدي تكون مخفضة بنسبة 50%

actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc= _+1:_ تم زيادة مدى الضربة العنصرية إلى _5 مربعات_ من 4، وتم زيادة عرضها إلى _75 درجة_ من 65.   _+2:_ تم زيادة مدى الضربة العنصرية إلى _6 مربعات_ من 4، وتم زيادة عرضها إلى _85 درجة_ من 65.   _+3:_ تم زيادة مدى الضربة العنصرية إلى _7 مربعات_ من 4، وتم زيادة عرضها إلى _95 درجة_ من 65.   _+4:_ تم زيادة مدى الضربة العنصرية إلى _8 مربعات_ من 4، وتم زيادة عرضها إلى _105 درجة_ من 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc= _+1:_ الهجوم المباشر من الضربة العنصرية يكتسب _+30% قوة سحرية_ لكل عدو في نطاق تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.   _+2:_ الهجوم المباشر من الضربة العنصرية يكتسب _+60% قوة سحرية_ لكل عدو في نطاق تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.   _+3:_ الهجوم المباشر من الضربة العنصرية يكتسب _+90% قوة سحرية_ لكل عدو في نطاق تأثير الضربة العنصرية، بما في ذلك هدف الهجوم.   _+4:_ الهجوم المباشر من الضربة العنصرية يكتسب _+120% قوة سحرية_ لكل عدو في نطاق تأثير الضربة العنصرية، بما في ذلك هدف الهجوم

actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=+1: إذا هاجم عدو صورة المبارزة، فإنها تكتسب دورتين من السرعة.   _+2:_ إذا هاجم عدو صورة المبارزة، فإنها تكتسب _4 أدوار_ من السرعة.   _+3:_ إذا هاجم عدو صورة المبارزة، فإنها تكتسب _6 أدوار_ من السرعة.   +4: إذا هاجم عدو صورة المبارزة، فإنها تكتسب 8 أدوار من السرعة.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ الأعداء الذين يهاجمون صورة المبارز يصبحون ضعفاء وعرضة للخطر لمدة _دورتين_.   _+2:_ الأعداء الذين يهاجمون صورة المبارز يصبحون ضعفاء وعرضة للهجوم لمدة _4 أدوار_.   _+3:_ الأعداء الذين يهاجمون صورة المبارز الخلفية يصبحون ضعفاء وعرضة للخطر لمدة _6 أدوار_.   _+4:_ الأعداء الذين يهاجمون صورة المبارز يصبحون ضعفاء وعرضة للهجوم لمدة _8 أدوار_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc= _+1:_ إذا استخدمت المبارزة قدرة سلاح في غضون 3 أدوار من تعرض صورتها اللاحقة للهجوم، فسوف تستعيد على الفور _0.38 شحنة_.   _+2:_ إذا استخدمت المبارزة قدرة سلاح في غضون 3 أدوار من تعرض صورتها اللاحقة للهجوم، فسوف تستعيد على الفور _0.77 شحنة_.   _+3:_ إذا استخدمت المبارزة قدرة سلاح في غضون 3 أدوار من تعرض صورتها اللاحقة للهجوم، فسوف تستعيد على الفور _1.13 شحنة_.   _+4:_ إذا استخدمت المبارزة قدرة سلاح في غضون 3 أدوار من تعرض صورتها اللاحقة للهجوم، فسوف تستعيد على الفور _1.5 شحنة

#cleric
actors.hero.talent.satiated_spells.title=Satiated Spells
actors.hero.talent.satiated_spells.desc=_+1:_ Eating food causes the Cleric to gain _3 shielding_ the next time they cast a spell.\n\n_+2:_ Eating food causes the Cleric to gain _5 shielding_ the next time they cast a spell.
actors.hero.talent.satiated_spells.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding immediately, which will start to decay normally after 10 turns.
actors.hero.talent.holy_intuition.title=holy intuition
actors.hero.talent.holy_intuition.desc=_+1:_ The Cleric can cast _Holy Intuition,_ a spell that reveals whether an item is cursed at the cost of _3 charges._\n\n_+2:_ The Cleric can cast _Holy Intuition,_ a spell that reveals whether an item is cursed at the cost of _2 charges._
actors.hero.talent.holy_intuition.meta_desc=_If this talent is gained by a different hero_ it will instead let the hero identify the curse status on a cursed item just before equipping it, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.searing_light.title=searing light
actors.hero.talent.searing_light.desc=_+1:_ The Cleric's physical attacks on enemies illuminated by _Guiding Light_ deal _+3 damage._\n\n_+2:_ The Cleric's physical attacks on enemies illuminated by _Guiding Light_ deal _+5 damage._
actors.hero.talent.searing_light.meta_desc=_If this talent is gained by a different hero_ it will instead grant its bonus damage after a wand or artifact is used on an enemy, with a 20 turn cooldown.
actors.hero.talent.shield_of_light.title=shield of light
actors.hero.talent.shield_of_light.desc=_+1:_ يستطيع الكاهن إلقاء تعويذة _درع النور، وهي تعويذة يتم إلقاؤها على الفور وتمنحه _2-4 دروعًا_ ضد هدف لمدة 5 أدوار بتكلفة شحنة واحدة.   _+2:_ يستطيع الكاهن إلقاء تعويذة _درع النور، وهي تعويذة يتم إلقاؤها على الفور وتمنحه _3-6 دروعًا_ ضد هدف لمدة 5 أدوار بتكلفة شحنة واحدة.
actors.hero.talent.shield_of_light.meta_desc=_If this talent is gained by a different hero_ it will instead reduce physical damage taken from your targeted enemy by 1, 33% of the time at +1 or 50% of the time at +2.

actors.hero.talent.enlightening_meal.title=Enlightening Meal
actors.hero.talent.enlightening_meal.desc=_+1:_ Eating food takes the Cleric 1 turn and grants them _0.67 charges_ on their holy tome.\n\n_+2:_ Eating food takes the Cleric 1 turn and grants them _1 charge_ on their holy tome.
actors.hero.talent.enlightening_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant 2 turns of wand and artifact recharging at +1, or 3 turns at +2. This cannot be used to let the horn of plenty recharge itself.
actors.hero.talent.recall_inscription.title=Recall Inscription
actors.hero.talent.recall_inscription.refunded=Your item was refunded!
actors.hero.talent.recall_inscription.desc=يستطيع الكاهن إلقاء تعويذة "استدعاء النقش" مستوي 1، وهي تعويذة تسمح له بتكرار تأثير آخر حجر رون أو لفافة استخدمها خلال 10 أدوار.   +2: يستطيع الكاهن إلقاء تعويذة "استدعاء النقش"، وهي تعويذة تسمح له بتكرار تأثير آخر حجر رون أو لفافة استخدمها خلال 300 دورة.   لا يمكن استخدام تعويذة "استدعاء النقش" مع لفائف الترقية. تختلف تكلفة شحن هذه التعويذة بناءً على العنصر المستخدم مؤخرًا: 2 للحجر الروني، و3 لللفافة، و4 لللفافة النادرة. تتضاعف تكلفة الشحن عند استخدامها مع لفافة التحويل، أو عناصر الخيمياء التي يجب صنعها باستخدام التحويل أو الترقية
actors.hero.talent.recall_inscription.meta_desc=_If this talent is gained by a different hero_ it will instead refund any scroll or runestone 10% of the time at +1 or 15% of the time at +2. Scrolls of Upgrade are exempt from this effect.
actors.hero.talent.sunray.title=Sunray
actors.hero.talent.sunray.desc=_+1:_ يستطيع الكاهن إلقاء تعويذة _شعاع الشمس،_ التي تسبب _4-8 ضررًا_ وتعمي الهدف لمدة _4 أدوار،_ بتكلفة شحنة واحدة.   _+2:_ يستطيع الكاهن إلقاء تعويذة _شعاع الشمس،_ التي تسبب _6-12 ضررًا_ وتعمي الهدف لمدة _6 أدوار،_ بتكلفة شحنة واحدة.   لا يُمكن لشعاع الشمس أن يُعمي كل هدف إلا مرة واحدة، ولكن إذا كان الهدف مُصابًا بالعمى بالفعل بسبب شعاع الشمس، فإنه يُشل حركته بدلًا من ذلك. يُلحق شعاع الشمس دائمًا أقصى ضرر بالأعداء الشيطانيين والأموات الأحياء
actors.hero.talent.sunray.meta_desc=_If this talent is gained by a different hero_ it will instead cause wands and artifacts to blind enemies for 4 turns, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.divine_sense.title=Divine Sense
actors.hero.talent.divine_sense.desc=_+1:_ يستطيع الكاهن إلقاء تعويذة _الحاسة الإلهية،_ التي تمنحه _8 مربعات_ من رؤية العقل لمدة 50 دورة ولا تستغرق وقتًا لإلقائها، بتكلفة شحنتين.   _+2:_ يستطيع الكاهن إلقاء تعويذة _الحاسة الإلهية،_ التي تمنحه _12 مربعًا_ من رؤية العقل لمدة 50 دورة ولا تستغرق وقتًا لإلقائها، بتكلفة شحنتين.
actors.hero.talent.divine_sense.meta_desc=_If this talent is gained by a different hero_ it will instead grant them mind vision for a brief moment after using a wand or artifact with a range of 3 tiles at +1 or 5 tiles at +2.
actors.hero.talent.bless.title=Bless
actors.hero.talent.bless.desc=_+1:_ يستطيع الكاهن إلقاء تعويذة _البركة،_ التي تمنح _6 أدوار من البركة و10 دروع_ عند إلقائها على نفسه أو _10 أدوار من البركة و10 شفاء_ عند إلقائها على شخصية أخرى، بتكلفة شحنة واحدة.   _+2:_ يستطيع الكاهن إلقاء تعويذة _البركة،_ التي تمنح _10 أدوار من البركة و15 درعًا_ عند إلقائها على نفسه أو _15 أدوار من البركة و15 شفاءً_ عند إلقائها على شخصية أخرى، بتكلفة شحنة واحدة.   يتم تحويل الشفاء الزائد الناتج عن هذه التعويذة إلى درع واقٍ
actors.hero.talent.bless.meta_desc=_If this talent is gained by a different hero_ it will instead boost accuracy and evasion for the hero and all allies by 3% at +1 or 5% at +2.

actors.hero.talent.cleanse.title=Cleanse
actors.hero.talent.cleanse.desc=_+1:_ يستطيع الكاهن إلقاء تعويذة _التطهير_ التي _تزيل التأثيرات السلبية_ من الكاهن وأي حلفاء قريبين، وتمنحهم _10 دروع_ بتكلفة 2 شحنة.   _+2:_ يستطيع الكاهن إلقاء تعويذة _التطهير_، والتي _تمنح 3 أدوار من المناعة ضد الحالات السلبية_ للكاهن وأي حلفاء قريبين، وتمنحهم _20 درعًا_ بتكلفة شحنتين.   _+3:_ يستطيع الكاهن إلقاء تعويذة _التطهير_، والتي _تمنح 5 أدوار من المناعة ضد الحالات السلبية_ للكاهن وأي حلفاء قريبين، وتمنحهم _30 درعًا_ بتكلفة شحنتين
actors.hero.talent.cleanse.meta_desc=_If this talent is gained by a different hero_ it will instead cleanse negative status effects on the hero after using a wand or artifact, 10/20/30% of the time at +1/+2/+3.
actors.hero.talent.light_reading.title=Light Reading
actors.hero.talent.light_reading.desc=+1: يمكن للكاهن استخدام كتابه المقدس عندما لا يكون مجهزًا، ولكنه يعيد الشحن بسرعة 25% عند عدم تجهيزه.   _+2:_ يمكن للكاهن استخدام كتابه المقدس عندما لا يكون مجهزًا، ولكنه يعيد الشحن بسرعة _50%_ عند عدم تجهيزه.   _+3:_ يمكن للكاهن استخدام كتابه المقدس عندما لا يكون مجهزًا، ولكنه يعيد الشحن بسرعة _75%_ عند عدم تجهيزه
actors.hero.talent.light_reading.meta_desc=_If this talent is gained by a different hero_ it will instead increase the recharging speed of all wands by 7/13/20% at +1/+2/+3.

actors.hero.talent.holy_lance.title=Holy Lance
actors.hero.talent.holy_lance.desc=_+1:_ The Priest can cast _Holy Lance,_ a devastating spell that deals _30-55 damage_ at the cost of 3 charges.\n\n_+2:_ The Priest can cast _Holy Lance,_ a devastating spell that deals _45-83 damage_ at the cost of 3 charges.\n\n_+3:_ The Priest can cast _Holy Lance,_ a devastating spell that deals _60-110 damage_ at the cost of 3 charges.\n\nHoly Lance always deals maximum damage to demonic and undead foes. Holy Lance has a 30 turn cooldown before it can be cast again.
actors.hero.talent.hallowed_ground.title=Hallowed Ground
actors.hero.talent.hallowed_ground.desc=يستطيع الكاهن إلقاء تعويذة _الأرض المقدسة، مستوي+1_ التي تقدس الأرض في منطقة _3x3_ لمدة 20 دورة، بتكلفة شحنتين.   _+2:_ يستطيع الكاهن إلقاء تعويذة _الأرض المقدسة،_ التي تقدس الأرض في منطقة _5x5_ لمدة 20 دورة، بتكلفة شحنتين.   _+3:_ يستطيع الكاهن إلقاء تعويذة _الأرض المقدسة،_ التي تقدس الأرض في منطقة _7x7_ لمدة 20 دورة، بتكلفة شحنتين.   عند استخدام تعويذة "الأرض المقدسة"، تشفي الحلفاء بمقدار 15 نقطة صحة، وتُثبّت الأعداء مؤقتًا في مكانهم، وتنشر عشبًا قصيرًا. بعد ذلك، تشفي الحلفاء ببطء، وتُضعف الأعداء، وتُسبب نمو عشب طويل عشوائيًا. تمنح "الأرض المقدسة" الكاهن درعًا واقيًا بدلًا من الشفاء، وتُدمّر بالنار
actors.hero.talent.mnemonic_prayer.title=Mnemonic Prayer
actors.hero.talent.mnemonic_prayer.desc=  _+1:_ يستطيع الكاهن إلقاء تعويذة _الصلاة التذكيرية،_ وهي تعويذة تعمل على تمديد تأثيرات التعزيز/الضعف على الحليف/العدو لمدة _3 أدوار_ بتكلفة شحن واحدة.   _+2:_ يستطيع الكاهن إلقاء تعويذة _الصلاة التذكيرية،_ وهي تعويذة تعمل على تمديد تأثيرات التعزيز/الضعف على الحليف/العدو لمدة _4 أدوار_ بتكلفة شحن واحدة.   _+3:_ يستطيع الكاهن إلقاء تعويذة _الصلاة التذكيرية،_ وهي تعويذة تعمل على تمديد تأثيرات التعزيز/الضعف على الحليف/العدو لمدة _5 أدوار_ بتكلفة شحن واحدة.   لا يستغرق إلقاء الدعاء التذكيري أي وقت. يمكن للدعاء التذكيري تمديد تأثير تعزيز/إضعاف معين مرة واحدة فقط، ولا يمكنه تمديد تأثيرات التعزيزات الناتجة عن قدرات الدروع

actors.hero.talent.lay_on_hands.title=lay on hands
actors.hero.talent.lay_on_hands.desc=يستطيع الفارس إلقاء تعويذة "وضع الأيدي"،  مستوي 1وهي تعويذة تشفي على الفور شخصية قريبة بمقدار 15 نقطة صحة، أو تمنح الفارس 15 درعًا، وذلك بتكلفة شحنة واحدة.   _+2:_ يستطيع الفارس إلقاء تعويذة "وضع الأيدي"، وهي تعويذة تشفي على الفور شخصية قريبة بمقدار 20 نقطة صحة، أو تمنح الفارس 20 درعًا، وذلك بتكلفة شحنة واحدة.   _+3:_ يستطيع الفارس إلقاء تعويذة "وضع الأيدي"، وهي تعويذة تشفي على الفور شخصية قريبة بمقدار 25 نقطة صحة، أو تمنح الفارس 25 درعًا، وذلك بتكلفة شحنة واحدة.   يُحوّل الشفاء الزائد الناتج عن هذه التعويذة إلى درع. يمكن إلقاء تعويذة "وضع الأيدي" بشكل متكرر، ولكن لا يمكن تطبيق أكثر من ثلاث تعويذات درع في المرة الواحدة. \n\n\n\n\n\n\n\n\n
actors.hero.talent.aura_of_protection.title=aura of protection
actors.hero.talent.aura_of_protection.desc= يستطيع الفارس إلقاء تعويذة _هالة الحماية_  مستوي +1التي تمنح الفارس وجميع الحلفاء في نطاق مربعين _مقاومة ضرر بنسبة 20%_ وتأثير نقش درع الفارس بقوة _+50%_ لمدة 20 دورة، بتكلفة شحنتين. _+2:_ يستطيع الفارس إلقاء تعويذة _هالة الحماية_ التي تمنح الفارس وجميع الحلفاء في نطاق مربعين _مقاومة ضرر بنسبة 30%_ وتأثير نقش درع الفارس بقوة _+75%_ لمدة 20 دورة، بتكلفة شحنتين. _+3:_ يستطيع الفارس إلقاء تعويذة _هالة الحماية_، وهي تعويذة تمنح الفارس وجميع الحلفاء في نطاق مربعين _مقاومة ضرر بنسبة 40%_ وتأثير نقش درع الفارس بقوة _+100%_ لمدة 20 دورة، بتكلفة شحنتين
actors.hero.talent.wall_of_light.title=wall of light
actors.hero.talent.wall_of_light.desc=يستطيع الفارس إلقاء تعويذة _جدار النور، مستوي +1 وهي تعويذة تنشئ جدارًا صلبًا بعرض _3 مربعات_ أمام الفارس يدفع الأعداء بعيدًا ويستمر لمدة 20 دورة، بتكلفة 3 شحنات. _+2:_ يستطيع الفارس إلقاء تعويذة _جدار النور، وهي تعويذة تنشئ جدارًا صلبًا بعرض _5 مربعات_ أمام الفارس يدفع الأعداء بعيدًا ويستمر لمدة 20 دورة، بتكلفة 3 شحنات. _+3:_ يستطيع الفارس إلقاء تعويذة _جدار النور، وهي تعويذة تنشئ جدارًا صلبًا بعرض _7 مربعات_ أمام الفارس يدفع الأعداء بعيدًا ويستمر لمدة 20 دورة، بتكلفة 3 شحنات. يمكن وضع الجدار بشكل رئيسي أو قطري، ولا يمكن أن يوجد سوى جدار واحد في كل مرة

actors.hero.talent.divine_intervention.title=divine intervention
actors.hero.talent.divine_intervention.desc= أثناء وجود الكاهن في هيئته المتسامية، يمكنه إلقاء تعويذة "التدخل الإلهي"،+1 التي تعزز الكاهن وجميع حلفائه بما يصل إلى 150 نقطة حماية، وتمدد هيئته المتسامية بمقدار 3 أدوار.   +2: أثناء وجود الكاهن في هيئته المتسامية، يمكنه إلقاء تعويذة "التدخل الإلهي"، التي تعزز الكاهن وجميع حلفائه بما يصل إلى 200 نقطة حماية، وتمدد هيئته المتسامية بمقدار 4 أدوار.   +3: أثناء وجود الكاهن في هيئته المتسامية، يمكنه إلقاء تعويذة "التدخل الإلهي"، التي تعزز الكاهن وجميع حلفائه بما يصل إلى 250 نقطة حماية، وتمدد هيئته المتسامية بمقدار 5 أدوار.   +4: أثناء وجود الكاهن في هيئته المتسامية، يمكنه إلقاء تعويذة "التدخل الإلهي"، التي تعزز الكاهن وجميع حلفائه بما يصل إلى 300 نقطة حماية، وتمدد هيئته المتسامية بمقدار 6 أدوار.   يكلف التدخل الإلهي 5 شحنات من الكتب، ولا يمكن استخدامه إلا مرة واحدة بنفس الشكل المتطور.
actors.hero.talent.judgement.title=judgement
actors.hero.talent.judgement.desc=+1: أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء حكم، والذي يلحق ضررًا يتراوح بين 10 و20 لجميع الأعداء المرئيين.   _+2:_ أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء _الحكم،_ والذي يلحق _15-30 ضررًا_ بجميع الأعداء المرئيين.   _+3:_ أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء _الحكم،_ والذي يلحق _20-40 ضررًا_ بجميع الأعداء المرئيين.   +4: أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء حكم، والذي يلحق ضررًا يتراوح بين 25 و50 لجميع الأعداء المرئيين.   يكلف الحكم 3 شحنات من الكتاب. يُلحق الحكم ضررًا إضافيًا بنسبة 33% لكل تعويذة ألقاها الكاهن منذ دخوله في هيئته المتصاعدة أو منذ آخر استخدام للحكم
actors.hero.talent.flash.title=فلاش
actors.hero.talent.flash.desc=+1: أثناء وجوده في الشكل الاعلي، يمكن للكاهن إلقاء تعويذة الوميض للانتقال الفوري لمسافة تصل إلى 3 مربعات.   _+2:_ أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء تعويذة _وميض_ للانتقال الفوري لمسافة تصل إلى _4 مربعات_ بعيدًا.   _+3:_ أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء تعويذة _وميض_ للانتقال الفوري لمسافة تصل إلى _5 مربعات_ بعيدًا.   _+4:_ أثناء وجوده في الشكل الصاعد، يمكن للكاهن إلقاء تعويذة _وميض_ للانتقال الفوري لمسافة تصل إلى _6 مربعات_ بعيدًا.   يكلف استخدام الفلاش شحنتين مبدئيًا، وشحنة إضافية واحدة لكل استخدام في نفس الشكل المتطور

actors.hero.talent.body_form.title=body form
actors.hero.talent.body_form.desc=يستطيع الكاهن إلقاء تعويذة "شكل الجسد"، التي تمنح القوه المقدسه قوة سحر أو نقش قام الكاهن بتحديده في هذه الجولة، وذلك بتكلفة شحنتين.   +1: عند استخدام القوه المقدسه، يحصل الكاهن على التأثير المختار لمدة 20 دورة.   +2: عند استخدام القوه المقدسه، يحصل الكاهن على التأثير المختار لمدة 27 دورة.   +3: عند استخدام، القوه المقدسه يحصل الكاهن على التأثير المختار لمدة 33 دورة.   +4: عند استخدام القوه المقدسه، يحصل الكاهن على التأثير المختار لمدة 40 دورة.   لا يمكن إضفاء  اكثر من تأثير جسدي واحد على ترينيتي في كل مرة. وتزداد تكلفة شحن درع ترينيتي إذا كان الرمز المختار نادرًا وقويًا
actors.hero.talent.mind_form.title=mind form
actors.hero.talent.mind_form.desc=يستطيع الكاهن إلقاء تعويذة "شكل العقل"، التي تمنح الثالوث قوة عصا سحرية أو سلاح رمي استخدمه الكاهن في هذه الجولة، وذلك بتكلفة 3 شحنات.مستوي +1: عند استخدام الثالوث، يستخدم الكاهن تأثير الصعق أو الرمي للعنصر المختار، كما لو كان مستوي+3.عند استخدام الثالوث، مستوي+2 يستخدم الكاهن تأثير الصعق أو الرمي للعنصر المختار، كما لو كان +4.  عند استخدام الثالوث، مستوي +4 يستخدم الكاهن تأثير الصعق أو الرمي للعنصر المختار، كما لو كان مستوي  +5. عند استخدام الثالوث مستوي +6، يستخدم الكاهن تأثير الصعق أو الرمي للعنصر المختار، كما لو كان +6.  لا يمكن غرس سوي تأثير عقلي واحد فقط في ترينيتي في كل مرة
actors.hero.talent.spirit_form.title=spirit form
actors.hero.talent.spirit_form.desc=يستطيع الكاهن إلقاء تعويذة "شكل الروح"، التي تمنح القوة المقدسه لخاتم أو قطعة أثرية حددها الكاهن في هذه الجولة (باستثناء الكتاب المقدس)، بتكلفة 4 شحنات. عند استخدام القوه المقدسه، سيكتسب الكاهن تأثير خاتم بمعدل +1 لمدة 20 دورة، أو سيُفعّل تأثير قطعة أثرية بمعدل +4. عند استخدام القوه المقدسه، سيكتسب الكاهن تأثير الخاتم عند +2 لمدة 20 دورة، أو سيُفعّل تأثير قطعة أثرية عند +6. عند استخدام القوه المقدسه، سيكتسب الكاهن تأثير الخاتم عند +3 لمدة 20 دورة، أو سيُفعّل تأثير قطعة أثرية عند +8. عند استخدام القوه المقدسه، سيكتسب الكاهن تأثير الخاتم عند +4 لمدة 20 دورة، أو سيُفعّل تأثير قطعة أثرية عند +10. لا يمكن غرس تأثير روحي واحد فقط في ترينيتي في كل مرة. وتختلف تأثيرات القطع الأثرية وتكاليف شحن الدروع عند تفعيلها بواسطة ترينيتي

actors.hero.talent.beaming_ray.title=beaming ray
actors.hero.talent.beaming_ray.desc=يستطيع الكاهن إطلاق تعويذة "شعاع " من حليف مُعزز مقابل شحنة واحدة. يخترق هذا الشعاع الجدران وينقل الحليف إلى موقع مُحدد. إذا كان هناك عدو في ذلك الموقع، يظهر الحليف بجانبه ويستهدفه. يمكن لشعاع "شعاع الضوء" نقل الحلفاء غير القادرين على الحركة عادةً، لكن مداه يكون نصف مداه عند القيام بذلك. _+1:_ يبلغ أقصى مدى لشعاع _4 مربعات،_ ويزيد من مكافأة قوه الجماعه إلى _+35% ضرر_ ضد أقرب عدو لمدة 10 أدوار. _+2:_ يبلغ أقصى مدى لشعاع الضوء _8 مربعات،_ ويزيد من مكافأة قوه العدد إلى _+40% ضرر_ ضد أقرب عدو لمدة 10 أدوار. _+3:_ يبلغ أقصى مدى لشعاع الضوء_12  بلاطة،_ ويزيد من مكافأة قوه العدد إلى _+45% ضرر_ ضد أقرب عدو لمدة 10 أدوار. _+4:_ يبلغ أقصى مدى لشعاع الضوء _16 بلاطة،_ ويزيد من مكافأة قوه الجماعه إلى _+50% ضرر_ ضد أقرب عدو لمدة 10 أدوار
actors.hero.talent.life_link.title=life link
actors.hero.talent.life_link.desc=يستطيع الكاهن إلقاء تعويذة "رابط الحياة" بينه وبين حليف مُعزَّز بتكلفة شحنتين. تتسبب هذه التعويذة في توزيع الضرر بين الكاهن وحليفه، كما تُفعِّل تعاويذ الكاهن المفيدة من المستوى الثالث أو أدنى على كليهما إذا كان أحدهما متأثرًا بها.   +1: يستمر تأثير ربط الحياة لمدة 10 أدوار ويزيد من مكافأة قوة الكثيرين إلى -35% من الضرر المتلقى.   _+2:_ يستمر تأثير ربط الحياة لمدة _13 دورة_ ويزيد من مكافأة قوة الكثيرين إلى _-40% من الضرر المتلقى._   _+3:_ يستمر تأثير ربط الحياة لمدة _17 دورة_ ويزيد من مكافأة قوة الكثيرين إلى _-45% من الضرر المتلقى._   +4: يستمر تأثير ربط الحياة لمدة 20 دورة ويزيد من مكافأة قوة الكثيرين إلى -50% من الضرر المتلقى
actors.hero.talent.stasis.title=Stasis
actors.hero.talent.stasis.desc=يستطيع الكاهن إلقاء تعويذة "الجمود" على حليف مُعزَّز بتكلفة شحنتين. يُزيل الجمود الحليف مؤقتًا من الزنزانة ويحافظ على الوقت المتبقي لجميع التعزيزات، بما في ذلك "قوة العدد". سيعود الحليف للظهور بجانبك عند انتهاء التأثير. يمكن إعادة إلقاء تعويذة الجمود فورًا وبدون تكلفة لإنهاء التأثير مبكرًا. يعمل الجمود على الحلفاء غير المتحركين، لكنه لا يُمكنه نقلهم بين طوابق الزنزانة في مستوي. +1: يستمر التجميد لمدة أقصاها 60 دورة في مستوي. +2: يستمر التجميد لمدة أقصاها 90 دورة. في مستوي+3: يستمر التجميد لمدة أقصاها 120 دورة. عند مستوي +4: يستمر التجميد لمدة أقصاها 150 دورة. يستطيع الكاهن أيضًا استخدام شعاع الإشعاع عندما يكون أحد الحلفاء في حالة سكون لإعادة استدعائه، أو استخدام رابط الحياة لتطبيق تأثيره استباقيًا. مع ذلك، لا يستفيد الحلفاء من رابط الحياة أثناء وجودهم في حالة سكون


#universal
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=+1: تتميز قدرة درع البطل بتكلفة شحن مخفضة بنسبة 12%.   +2: تتميز قدرة درع البطل بتكلفة شحن مخفضة بنسبة 23%.   +3: تتميز قدرة درع البطل بتكلفة شحن مخفضة بنسبة 32%.   +4: تتميز قدرة درع البطل بتكلفة شحن مخفضة بنسبة 40%.

actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=+1: استخدام خاصية تحويل العدو إلى راتموغريفي على عدو تم تحويله إلى راتموغريفي يجعله صديقًا ويجعل التحول دائمًا.   _+2:_ استخدام تحويل الفأر على عدو تم تحويله إلى فأر يجعله صديقًا، ويجعل التحول دائمًا، ويمنحه _دورتين_ من الأدرينالين.   _+3:_ استخدام ratmogrify على عدو ratmogrify يجعله صديقًا، ويجعل التحول دائمًا، ويمنحه _4 أدوار_ من الأدرينالين.   _+4:_ استخدام ratmogrify على عدو ratmogrify يجعله صديقًا، ويجعل التحول دائمًا، ويمنحه _6 أدوار_ من الأدرينالين
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ استخدام خاصية تحويل الفئران على نفسك _يؤدي إلى ظهور فأر جرابي حليف واحد بجانبك.   _+2:_ استخدام خاصية تحويل الفئران على نفسك يؤدي إلى ظهور فأرين جرابيين حليفين بجانبك.   _+3:_ استخدام ratmogrify على نفسك _يؤدي إلى ظهور 3_ فئران جرابية حليفة بجانبك.   _+4:_ استخدام خاصية تحويل الفئران على نفسك يؤدي إلى ظهور 4 فئران جرابية حليفة بجانبك.



###npcs
actors.mobs.npcs.blacksmith.name=troll blacksmith
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! You look like a tough one.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! You look like a smart one.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! You look like a sneaky one.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! You look like a quick one.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! You look like a brave one.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! You look like an important one.
actors.mobs.npcs.blacksmith.intro_quest_start=تريد أن تكون مفيدًا، أليس كذلك؟ حسنًا، لديّ ما يمكنك فعله. لقد بنيت هذه الورشة فوق منجم قديم، إنها أسفل هذا السلم مباشرةً. خذ هذا الفأس واستخرج لي بعض خام الذهب الداكن. 40 قطعة ستكون كافية. الصخور هناك ناعمة ولطيفة، لذا ستتمكن من الحفر عبر الجدران ببعض الجهد.   ماذا تقصد، كيف سأدفع؟ أنت جشع...   حسناً، حسناً، يمكنني أن أقوم ببعض أعمال الحدادة لك. اعتبر نفسك محظوظاً، فأنا الحداد الوحيد في المنطقة
actors.mobs.npcs.blacksmith.intro_quest_crystal=لكن احذر، فالمنجم خطير على إنسان صغير مثلك. لقد هُجر لفترة، وبدأت مجموعة من البلورات بالنمو فيه. إنها لامعة، لكنها هشة للغاية ولا قيمة لها، ولديها بعض الأشياء السحرية التي تحميها. إنها قوية جدًا، لذا كن حذرًا عند التنقيب، وإلا ستلفت انتباهها.   هناك بلورة عملاقة في مكان ما أيضًا. إنها أقوى بكثير، لذا استعد للمواجهة إذا حاولت تحطيمها. أراهن أن تحطيمها سيبطئ نمو البلورات الأخرى، لذا سأدفع مبلغًا إضافيًا إذا استطعت فعل ذلك
actors.mobs.npcs.blacksmith.intro_quest_gnoll=لكن احذر، فالمنجم خطير على إنسان صغير مثلك. بعض الغنولز يريدون الذهب أيضاً، وهم الآن يدمرون المكان. إنهم مخلوقات حمقاء، لذا تسبب تعدينهم في انهيارات وهدمات عديدة. سيتعين عليك التنقيب من خلاله، لذا ابحث عن الصخور التي تم تحريكها مؤخراً.   أعتقد أن أحد الغنولز هو سبب معظم المشاكل، ربما يكون ساحرًا أرضيًا أو شيئًا من هذا القبيل. سأدفع مبلغًا إضافيًا إذا استطعت العثور عليه وقتله، لكنني متأكد من أنه سيقاوم
actors.mobs.npcs.blacksmith.intro_quest_fungi=لكن احذر، فالمنجم خطير على إنسان صغير مثلك. هناك وحش فطري ينمو في الأسفل. لديه حراس فطريون شديدو الخطورة إذا رأوك، لكنهم لا يستطيعون النهوض ومطاردتك على الأقل. ابقَ بعيدًا عن الأنظار إذا أردت البقاء على قيد الحياة.   سأدفع مبلغًا إضافيًا إذا تمكنت من القضاء على أكبر فطر، لكن الأمر سيتطلب جهدًا كبيرًا. إنه متصل بمجموعة من عقد الفطريات المخفية في الجدران. سيتعين عليك تدمير معظمها قبل أن تتمكن من إلحاق ضرر حقيقي به
actors.mobs.npcs.blacksmith.reminder=You done wastin' my time? The mine entrance is over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much gold as you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much gold as you can, and try to kill the gnoll geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much gold as you can, and try to kill the giant mushroom too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kiddin' me? Where is my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=You ready to go down? Make sure you've got some free space for the gold.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=You done already? You've hardly got any gold at all! You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=You done already? Doesn't look like you've got a lot of gold. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=You done? You've got some gold at least, but there's definitely more in the mine. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=You done? Looks like you've got a good amount of gold, but I could use a bit more. You should be able to get _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=You done? You've got lots of gold, but make sure you haven't left any of your gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal's still down there too. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom's still down there too. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=ممنوع
actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with disproportionally small tools.

actors.mobs.npcs.ghost.name=الشبح الحزين
actors.mobs.npcs.ghost.rat_1=مرحبًا %s ... كنتُ مثلك ذات يوم - قويًا وواثقًا من نفسي... لكنني قُتلتُ على يد وحشٍ خبيث... لا أستطيع مغادرة هذا المكان... ليس قبل أن أنتقم... سأقتل ذلك الجرذ النتِن الذي أزهق روحي...   إنها تتربص في هذا الطابق... تنشر القذارة في كل مكان... احذروا سحابة رائحتها الكريهة ولسعتها اللاذعة، فالحمض يذوب في الماء...
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=مرحبًا %s ... كنتُ مثلك ذات يوم - قويًا وواثقًا من نفسي... لكنني قُتلتُ على يد عدوٍّ ماكر... لا أستطيع مغادرة هذا المكان... ليس قبل أن أنتقم... وأقتل ذلك المخادع الغنول الذي أزهق روحي...   إنه ليس كباقي الغنولز... فهو يختبئ ويستخدم الأسلحة المقذوفة... احذروا سهامه السامة والحارقة، ولا تهاجموه من مسافة بعيدة...
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=مرحبًا %s ... كنتُ مثلك ذات يوم - قويًا وواثقًا من نفسي... لكنني قُتلتُ على يد مخلوقٍ قديم... لا أستطيع مغادرة هذا المكان... ليس قبل أن أنتقم... وأقتل السلطعون العظيم الذي أزهق روحي...   إنه قديم بشكل غير طبيعي... بمخلب ضخم واحد وصدفة سميكة... احذر مخلبه، يجب أن تفاجئ السلطعون وإلا سيصدك به
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come find me...
actors.mobs.npcs.ghost.desc=The ghost is barely visible. It looks like a shapeless spot of faint light with a sorrowful face.

actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.old_intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.old_golems_1=في حالتي، يجب القضاء على الغولم. كما تعلمون، سأبدأ مشروعًا تجاريًا صغيرًا هنا، لكن هذه الغولم الغبية تضرّ بالعمل! من الصعب جدًا التفاوض مع كتل الجرانيت المتجولة، اللعنة عليها! لذا، من فضلكم، اقتلوا... لنقل أربعة منها، وستحصلون على مكافأة.
actors.mobs.npcs.imp.old_monks_1=في حالتي، يجب قتل الرهبان. كما ترى، سأبدأ مشروعًا تجاريًا صغيرًا هنا، لكن هؤلاء المجانين لا يشترون شيئًا وسيخيفون الزبائن الآخرين. لذا، أرجوكم اقتلوا... لنقل خمسة منهم، وستحصلون على مكافأة.
actors.mobs.npcs.imp.old_golems_2=How is your golem safari going? Just don't forget to grab those tokens.
actors.mobs.npcs.imp.old_monks_2=Oh, you're still alive! I knew that your kung-fu would be stronger ;) Just don't forget to grab those tokens.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.quest_intro_1=أهلاً، هل أنت مغامر؟ أنا أعشق المغامرين! يمكنك الاعتماد عليهم دائماً عندما تحتاج إلى مساعدة. مع مكافأة مناسبة، بالطبع 😉.   يوجد أمامي قبو قزمي ضخم يحوي مجموعة من القطع الأثرية النادرة. أنا من هواة جمع التحف، وهناك تمثال صغير في ذلك القبو أرغب بشدة في اقتنائه.   لكن القبو مليء بالحراس والفخاخ، لذا أحتاج إلى القليل من المساعدة
actors.mobs.npcs.imp.quest_intro_2=الخزنة مغلقة بسحر. يمكنني نقلك إليها بتعويذة كنتُ أُحضّرها، لكن لا يمكنني نقل معداتك معك. مع ذلك، ستجد الكثير من الغنائم داخل الخزنة تُساعدك! يُفضّل أن تبدأ بتجنّب الأعداء والبحث عن العناصر الأقل حماية.   يمكنني أن أطلب منك إحضار غرضين من الخزنة. أحدهما سيكون تمثالي، والآخر يمكن أن يكون أي شيء تريده من الخزنة!   لقد جمعتُ مجموعة من الأشياء الثمينة التي قد تهمك أيضاً! إذا ساعدتني هنا، فسأقيم متجراً في مكان أبعد قليلاً، ويمكننا حينها أن نتبادل الأشياء
actors.mobs.npcs.imp.quest_in_progress=Just step into the center of the vault entrance when you're ready to go and I'll teleport you inside.
actors.mobs.npcs.imp.enter_text=هل أنت مستعد؟ سأحتفظ بأغراضك بأمان هنا، وستستردها كلها عند عودتك.   خذ معك هذا الدرع القماشي وبلورة الانتقال الآني. استخدم البلورة عندما تحصل على تمثالي. ...أظن أنه يمكنك استخدامها مبكرًا أيضًا إذا كنت في ورطة، لكن لا تتوقع الحصول على المكافأة كاملة!   لم يتم العبث بالخزنة لفترة طويلة، لذا من المفترض أن يكون الأعداء بداخلها أبطأ من المعتاد. سيكون من الأسهل تجنب اكتشافك، خاصةً إذا بقيت خلف الاتجاه الذي يسير فيه الأعداء. إذا رآك أي عدو، فلن يطاردك إذا رآك للحظة فقط. من المحتمل أيضًا أن تتمكن من استشعار خطوات الأقدام القريبة إذا انتبهت
actors.mobs.npcs.imp.quest_completed_bad=Well, thanks for trying.\n\nThe spell I used to access the vault will take a very long time to prepare again, so you'd better be on your way.
actors.mobs.npcs.imp.quest_completed_good=شكرا لمساعدتك!\n\nسيستغرق الأمر بعض الوقت لتجهيز تعويذة الانتقال الآني، وسأحتاج أيضًا إلى التخطيط للأمور بناءً على المعلومات التي قدمتها لي.\n\nسأجهز أغراضي وأراك لاحقًا في الزنزانة. للأسف، ما زلت بحاجة إلى الذهب، لذا لن تكون بضاعتي مجانية ;)
actors.mobs.npcs.imp.quest_completed_great=عمل رائع هناك، شكراً جزيلاً!   لديّ كل ما أحتاجه هنا، لذا سأجهز أغراضي وأراك لاحقًا في الزنزانة. أخشى أنني ما زلت بحاجة إلى الذهب، لذا لن تكون بضاعتي مجانية 😉.   ما الذي كان يميز هذا التمثال؟ لا شيء مما قد تظن، فهو في الواقع شيء عادي جدًا. إنه قادم من أرض بعيدة لم تعد موجودة؛ وربما يكون آخر ما تبقى من نوعه. لولا هؤلاء الأقزام الجشعين، لكان قد دُمر على الأرجح مع كل شيء آخر
actors.mobs.npcs.imp.enter_yes=Descend into the vault
actors.mobs.npcs.imp.enter_no=Stay here
actors.mobs.npcs.imp.desc=هذا الكائن الأحمر الصغير يشبه العفريت. العفاريت شياطين أدنى مرتبة، تتميز بذكائها لا بقوتها.   لم تسمع عن الشياطين إلا في الحكايات الشعبية القديمة، والتي تصفهم عادةً بأنهم مسافرون من عالم آخر. لم ترَ قط أي دليل على وجود الشياطين فعلياً، لكن هذا العفريت حقيقي بوضوح ويبدو سعيداً جداً برؤيتك.

actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns your item.
actors.mobs.npcs.impshopkeeper.desc=The imp has set up a little shop on the border of the inner halls. It's nice to see a friendly face, but his prices certainly don't seem friendly.

actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=هذا الوهم يشبهك إلى حد كبير، حتى أنه يبدو وكأنه يحمل سلاحك ودروعك الحالية.   ستلاحق النسخ المتطابقة الأعداء وتهاجمهم باستخدام أسلحتها المقلدة، والتي تعمل بنفس طريقة سلاحك، ولكنها تُلحق ضررًا أقل. تبدأ هذه النسخ شبه غير مرئية، ولكن يجب أن تتخذ شكلًا يسهل رؤيته للهجوم.   على الرغم من أن قوتهم الهجومية قد تكون هائلة، إلا أن الصور المتطابقة لا تتمتع بالمتانة، وستتلاشى في اللحظة التي تتعرض فيها للضرر
actors.mobs.npcs.mirrorimage.discover_hint=You can find this character with a specific scroll.

actors.mobs.npcs.npc.discover_hint=You can find this character in a specific region of the dungeon.

actors.mobs.npcs.prismaticimage.name=نسخه سحريه
actors.mobs.npcs.prismaticimage.desc=هذا الوهم المتلألئ يشبهك إلى حد كبير، حتى أنه يبدو وكأنه يحمل سلاحك ودروعك الحالية.   ستحاول الصور المنشورية جذب انتباه الأعداء وإبعادهم عنك، مستخدمةً دفاعها وصحتها المعززة لحمايتك. ورغم أنها لا تمتلك نفس القوة الهجومية للصور المتطابقة، إلا أنها تتمتع بمتانة معززة، بما في ذلك الاستفادة من درعك.   عندما تنخفض نقاط صحة الصور المنشورية إلى الصفر، فإنها تتلاشى تدريجيًا على مدى عدة أدوار، ويمكن علاجها خلال هذه الفترة. وعندما لا يكون هناك أعداء، تتلاشى الصور المنشورية وتعود إلى سيدها
actors.mobs.npcs.prismaticimage.discover_hint=You can find this character with a specific scroll.

actors.mobs.npcs.ratking.name=ملك الفئران
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I have no time for this nonsense. My kingdom won't rule itself!
actors.mobs.npcs.ratking.confused=Wha... Where am I? My kingdom needs me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! You're in no state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=أوه، هل هذا التاج لي؟! يبدو أكثر لمعاناً من تاجي، لذا أقبله بكل سرور!   في الحقيقة، أعتقد أنني أستطيع أن أقدم لك مكافأةً على هذا التاج. قوة هائلة تليق ببطل مثلك! هل ترغب في ذلك؟
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This rat is a little bigger than a regular marsupial rat. It's wearing dwarf king's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny green party hat instead of its usual crown. Happy birthday Rat King!
actors.mobs.npcs.ratking.desc_winter=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny festive hat instead of its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=This rat is a little bigger than a regular marsupial rat. It's wearing a tiny crown on its head.
actors.mobs.npcs.ratking.discover_hint=You can find this character at the end of a specific region of the dungeon.

actors.mobs.npcs.sheep.name=خروف
actors.mobs.npcs.sheep.baa!=با
actors.mobs.npcs.sheep.baa?=با؟
actors.mobs.npcs.sheep.baa.=باا
actors.mobs.npcs.sheep.baa...=بلابلاا
actors.mobs.npcs.sheep.def_verb=ممنوع
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.sheep.discover_hint=You can find this character with a specific item or trap.

actors.mobs.npcs.shopkeeper.name=التاجر
actors.mobs.npcs.shopkeeper.thief=لص لص !
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=تحدث
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting seal you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=ههه، أعتقد أنني رأيتُ ملصقًا مطلوبًا باسمك في مكانٍ ما بالمدينة. هل أنتَ هارب؟ أوه، أنتَ بريء، أليس كذلك؟ بالطبع، بالطبع... لا تقلق، لديّ ما هو أهم من الإبلاغ عنك، ولكن ربما عليكَ شراء شيءٍ ما للتأكد؟
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Have you come from the thieves guild to clear the area? No, just shopping? Well kill a few monsters while you're here anyway. Don't expect a discount either, I pay good protection money to you people and you're barely keeping me safe down here.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=أليس هذا هو البطل المتجول؟ إن كنت تحاول إنقاذ بلدة أخرى، فحظاً موفقاً، فالمخاطر هنا أشد بكثير من مجرد عصابات قطاع طرق صغيرة. أنا متأكد أنك ستبلي بلاءً حسناً أكثر من أي شخص آخر، فقط حاول ألا تموت أمام متجري مباشرةً.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=أهلاً وسهلاً يا صاحب السمو، أم يا قداسة الدالاي لاما؟ ههه، على أي حال، هذا ليس مكانك، سيحزن الكثيرون لو انتهى بك الأمر ميتاً. لا شك أن لديك بعض المال، فلماذا لا تشتري شيئاً يمنع ذلك؟
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to that Troll blacksmith for me if you see him. Remind the lug that he still owes me money for that hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you safe down here.\n\n...And don't loiter if you please. It took forever to get the locals down here to leave me alone, I don't want you attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=مرحباً، لدي أسعار خاصة لصائدي الشياطين!   انتبه جيدًا في الأسفل! الشياطين هناك أشد فتكًا مما رأيته في القبو، ولا يوجد بلورة هروب لإنقاذك. لن تستطيع العودة وإنفاق المزيد من المال إن مت! ;)   هل الشياطين مثلي؟ ههه، لا على الإطلاق. أنا مجرد كائن صغير، لستُ مقاتلاً بارعاً، وقد تمكنتُ من الحفاظ على سلامة عقلي. الشياطين في الأسفل أقوى بكثير، وقد استُعبدوا جميعاً من قِبل... حسناً... فقط احذر هناك
actors.mobs.npcs.shopkeeper.talk_ascent=I don't know what you're planning to do with that amulet but I want no part of it. Buy something and move on, we both need to leave this place!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.

actors.mobs.npcs.wandmaker.name=old wandmaker
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello there! What a pleasant surprise to meet a warrior from the north in such a depressing place! You must have travelled quite far to get here. If you're looking for adventure, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, you startled me! I haven't met a bandit from this place that still has his sanity, so you must be from the surface! If you're up to helping a stranger out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard there was some ruckus regarding you and the wizards institute? Oh never mind, I never liked those stick-in-the-muds anyway. If you're willing, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=أهلاً يا آنسة! رؤية وجه ودود هنا مفاجأة سارة، أليس كذلك؟ في الحقيقة، أقسم أنني رأيت وجهك من قبل، لكنني لا أتذكر أين... لا بأس، إذا كنتِ هنا من أجل المغامرة، فقد يكون لديّ مهمة لكِ.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a hero in such a depressing place! If you're up to helping an old man out, I may have a task for you.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hello Your Highness! What a pleasant surprise to meet you in such a depressing place! I hate to impose, but I may have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came here to find a rare ingredient for a wand, but I've gotten myself lost, and my magical shield is weakening. I'll need to leave soon, but can't bear to go without getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=أبحث عن غبار الجثث. إنه نوع خاص من مسحوق العظام الملعون، يظهر عادةً في أماكن كهذه. لا بد من وجود غرفة محصنة هنا، وأنا متأكد من أنني سأجد بعض الغبار هناك. لكن كن حذرًا، فاللعنة التي يحملها الغبار قوية جدًا، تواصل معي بأسرع ما يمكن وسأطهره لك.
actors.mobs.npcs.wandmaker.intro_ember=أبحث عن بعض الجمرات المتوهجة من عنصر ناري حديث الولادة. عادةً ما تظهر العناصر النارية عندما لا يكون طقس الاستدعاء مُتحكمًا به، لذا ابحث عن بعض الشموع وموقع للطقوس، وأنا متأكد من أنك ستتمكن من استدعاء واحد. عليك تجنب حصر نفسك في مكان مغلق أثناء قتاله، أو يمكنك الاحتفاظ ببعض أدوات التجميد في متناول يدك. العناصر النارية حديثة الولادة قوية وفوضوية، لكنها لا تتحمل البرد.
actors.mobs.npcs.wandmaker.intro_berry=كان لدى مدير السجن العجوز نبتة عنب فاسد، وأنا أبحث عن إحدى بذورها. ربما تكون النبتة قد نمت بشكل عشوائي الآن، لذا قد يكون من الصعب الحصول على بذرة منها. من المفترض أن تكون حديقتها في مكان ما هنا. حاول الابتعاد عن سيقانها الحادة إذا أردت البقاء سالمًا. قد يكون استخدام النار مغريًا، لكن من فضلك لا تفعل، لأنك ستقتل النبتة وتدمر بذورها
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you can get that for me, I'll be happy to pay you with one of my finely crafted wands! I brought two with me, so you can take whichever one you prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck with corpse dust, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck with those embers, %s? You'll need to find four candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck with a Rotberry seed, %s? Look for a room filled with vegetation.
actors.mobs.npcs.wandmaker.def_verb=ممنوع
actors.mobs.npcs.wandmaker.desc=This old yet hale gentleman wears a slightly confused expression. He is protected by a magic shield.



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=greater elemental
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Overwhelmed by the Greater Elemental
actors.mobs.quest.vault.vaultbosselemental.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultbosselemental.desc=Representing the pinnacle of dwarven summoning magic, this massive elemental's unstable power seems to be regulated by the equally impressive circle that summoned it. This gives it the ability to _swap forms!_ Each form has unique attacks, resistances, and weaknesses.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=      يتخذ العنصر حاليًا شكلًا ناريًا شديد الحرارة. في هذا الشكل، يمكنه إطلاق كرات نارية واستدعاء موجات من اللهب تجتاح الساحة. سيحاول توجيه الكرات النارية في اتجاه حركتك، وتكون موجات اللهب دائمًا متباعدة. إذا أصابتك أيٌّ منها، فسوف تشتعل.   في هذه الحالة، يكون مقاومًا للسحر، الذي لا يزيد الأمر إلا سوءًا. ومع ذلك، من المحتمل أن يكون من السهل إصابة نواته المنصهرة الهشة بالأسلحة بعيدة المدى.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=The flames grow as the elemental absorbs most of your magic attack!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Your thrown weapon strikes the elemental's core, dealing extra damage!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=يتخذ العنصر حاليًا هيئة جليدية. في هذه الهيئة، يستطيع إطلاق مخروط واسع من البرد واستدعاء دوامة من الهواء المتجمد المتحرك. يمكن تفادي كلا الهجومين بتوقيت مناسب، لكن المخروط يكون فتاكًا بشكل خاص من مسافة بعيدة. إذا أصابك أي منهما، ستتجمد تمامًا.   في هذه الحالة، يكون مقاومًا أيضًا للأسلحة المقذوفة، التي تلتصق بقشرته الجليدية. مع ذلك، لا تبدو القشرة متينة للغاية، لذا فإن ضربة بسلاح يدوي ستكون مدمرة بشكل خاص
actors.mobs.quest.vault.vaultbosselemental.frost_resist=The thrown weapon sticks to the elemenental's frost shell!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Your melee strike shatters some of the frost shell, dealing extra damage!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=يتخذ العنصر حاليًا شكلًا كهربائيًا صادمًا. في هذا الشكل، يمكنه إطلاق صاعقة برق نحوك، أو استدعاء خطوط من الشرر من جوانب الساحة. يسهل تفادي هذه الهجمات، لكنه ينفذها بوتيرة أعلى. إذا أصابك أيٌّ منها، فستصاب بصدمة مؤقتة.   في هذه الهيئة، يكون مقاومًا أيضًا للهجمات المباشرة، مما يُسبب صدمة مؤلمة. ومع ذلك، فإن الطاقة المحيطة به ستُزعزع استقرارها بفعل السحر، مما يُلحق ضررًا إضافيًا
actors.mobs.quest.vault.vaultbosselemental.shock_resist=As you try to strike you receive a painful jolt!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=The magic disrupts the elemental's electric field, dealing extra damage!

actors.mobs.quest.vault.vaultdm100.name=modified DM-100
actors.mobs.quest.vault.vaultdm100.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultdm100.desc= تبدو هذه الروبوتات من طراز DM-100 مطابقة تقريبًا لتلك الموجودة في السجن، لكن مع توهج أزرق مخضر ساطع ينبعث من عيونها. ربما تم تعديلها لتستخدم مصدر طاقة قزمي حديث.   إنها تعمل تمامًا مثل أجهزة DM-100 العادية. ولا تزال قدرتها على إطلاق البرق عن بعد موجودة على الرغم من تغيير مصدر الطاقة، كما أن حالتها النظيفة تجعلها أكثر متانة

actors.mobs.quest.vault.vaultdm200.name=modified DM-200
actors.mobs.quest.vault.vaultdm200.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultdm200.desc=تبدو هذه الروبوتات من طراز DM-200 تمامًا مثل نظيراتها الموجودة في الكهوف، لكن بعيون زرقاء متوهجة. من المحتمل أنها خضعت لتعديلات لاحقة لتزويدها بمصدر طاقة قزمي أكثر حداثة.   تمامًا كما هو الحال في نظيراتها الموجودة في الكهوف، فإن هذه الأجهزة من طراز DM-200 كبيرة جدًا بحيث لا يمكن وضعها في الأماكن المغلقة، ولا تزال قادرة على إطلاق الغاز

actors.mobs.quest.vault.vaultrat.desc=طرأت بعض التغييرات السلوكية على هذا الفأر لاختبار الذكاء الاصطناعي الجديد لأعداء القبو:  يمكن سماع حركته من خلال الجدران  سيتجول على طول مسار دورية محددة مسبقًا  أثناء تجواله، انخفض نطاق الكشف بشكل حاد خلف الاتجاه الذي يتحرك فيه.  أثناء وضع السكون، ينخفض نطاق الكشف الخاص به أيضًا  عندما يكتشف وجودك، سيقوم بـ"التحقيق" قبل أن ينتقل إلى الصيد. يتحرك الأعداء المحققون نحوك لكنهم لا يهاجمون، ويسهل التخلص منهم خلف الأبواب والزوايا

actors.mobs.quest.vault.vaultskeleton.name=dwarven skeleton
actors.mobs.quest.vault.vaultskeleton.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultskeleton.desc=لولا كثافة شعر الوجه المذهلة، لكانت هذه الهياكل العظمية تبدو عادية من السجن. يبدو أن بعض الأقزام لم يكونوا بمنأى عن السحر الأسود حتى قبل أن يتولى ملكهم الجديد الحكم.   يتصرفون تمامًا مثل الهياكل العظمية العادية، بما في ذلك تحللهم إلى شظايا عظمية عند الموت. ومن المفارقات أن لحاهم تبدو وكأنها توفر لهم حماية إضافية.

actors.mobs.quest.vault.vaultshaman.name=captured shaman
actors.mobs.quest.vault.vaultshaman.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultshaman.desc=These gnoll shamans are clearly from the caves, but have a strange metal mask that looks dwarven. The fit on the mask is extremely tight, and the shamans move in an awkward stilted manner. Is the mask made to control them?
actors.mobs.quest.vault.vaultshaman.spell_desc=لاشك أن هؤلاء الغنولز ما زالوا قادرين على إلحاق الضرر بك بالسحر، ولكن بدون معرفة لون القناع، لا يمكن التنبؤ بنوع السحر الذي سيستخدمونه. ويبدو أن القناع المعدني يوفر لهم حماية أكبر من القناع الخشبي، كما أن هجماتهم أقوى بكثير من هجمات شامان الغنول العادي



###mobs
actors.mobs.acidic.name=acidic scorpio
actors.mobs.acidic.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances. This one appears to be dripping with corrosive ooze.

actors.mobs.albino.name=albino rat
actors.mobs.albino.desc=This is a rare breed of marsupial rat, with pure white fur and jagged teeth.
actors.mobs.albino.discover_hint=You can rarely find this enemy in a specific region of the dungeon.

actors.mobs.armoredstatue.name=armored statue
actors.mobs.armoredstatue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.\n\nIt seems to be in great condition because of the armor it's wearing, it might be very hard to kill.
actors.mobs.armoredstatue.desc_arm_wep=While the statue itself is made of stone, the _%1$s_ and _%2$s_ it's wielding look real.

actors.mobs.bandit.name=crazy bandit
actors.mobs.bandit.desc=لصٌّ محترف، يتميز برداءه الأرجواني الفاخر. ورغم مهارته العالية، فقد أصبح بلا عقل كاللصوص العاديين.   إضافةً إلى السرقة، قد يقوم قطاع الطرق المجانين بإصابتك بالعمى المؤقت، أو العجز، أو السم! لكن من المرجح أن يحملوا غنائم إضافية أكثر من اللص العادي.

actors.mobs.bat.name=خفاش مصاص الدماء
actors.mobs.bat.desc=These brisk and tenacious inhabitants of the caves are much more dangerous than they seem. They replenish their health with each successful attack, which allows them to defeat much larger opponents.

actors.mobs.bee.name=نحله
actors.mobs.bee.desc_honey=Despite their small size, golden bees tend to protect their home fiercely. This one has been placated, and seems to want to follow you.
actors.mobs.bee.desc=Despite their small size, golden bees tend to protect their home fiercely. This one is very mad, better keep your distance.
actors.mobs.bee.discover_hint=You can find this character with a specific item.

actors.mobs.brute.name=gnoll brute
actors.mobs.brute.enraged=غاضب
actors.mobs.brute.def_verb=ممنوع
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. When mortally wounded, they go berserk, gaining temporary shielding and a large boost to damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=هذا الغنول الوحشي يحتضر، لكنه يريد أن يأخذك معه!   سيموت الوحش عندما يتلاشى درعه، إما بمرور الوقت أو إذا تعرض للتلف. في هذه الأثناء، سيُلحق ضررًا هائلاً، لذا كن حذرًا!   الدرع المتبقي: %d .

actors.mobs.causticslime.name=caustic slime
actors.mobs.causticslime.desc=This slime seems to have been tainted by the dark magic emanating from below. It has lost its usual green color, and drips with caustic ooze.
actors.mobs.causticslime.discover_hint=You can rarely find this enemy in a specific region of the dungeon.

actors.mobs.crab.name=sewer crab
actors.mobs.crab.desc=These huge crabs are at the top of the food chain in the sewers. They are extremely fast and their thick carapace can withstand heavy blows.

actors.mobs.crystalguardian.name=crystal guardian
actors.mobs.crystalguardian.def_verb=ممنوع
actors.mobs.crystalguardian.desc=تبدو هولاء الحراس البلوريين الضخمة أشبه بالتماثيل لولا عيونها المتوهجة. فالبلور الصلب الذي صُنعت منه يجعلها بطيئة الحركة لكنها شديدة الصلابة، لذا من الأفضل تركها تنام في عشها البلوري لأطول فترة ممكنة.   بسبب حجمها، تتحرك حراس الكريستال ببطء شديد في الأماكن المغلقة. كما أنها شديدة التحمل لدرجة أنه من المستحيل قتلها مباشرة. يمكن هزيمتها وتعطيلها مؤقتًا، لكنها ستعود إلى وضعها الطبيعي بعد فترة وجيزة
actors.mobs.crystalguardian.discover_hint=You can find this enemy during a specific quest.

actors.mobs.crystalmimic.name=crystal mimic
actors.mobs.crystalmimic.ate=The mimic ate your %s!
actors.mobs.crystalmimic.escaped=The crystal mimic has escaped!
actors.mobs.crystalmimic.desc=الميميكس مخلوقات سحرية قادرة على اتخاذ أي شكل تريده. في الأبراج المحصنة، غالباً ما تختار شكل صندوق الكنز، لجذب المغامرين غير المتوقعين.   تُعدّ المخلوقات الكريستالية المُقلّدة أكثر دهاءً من نظيراتها العادية، وتُفضّل تجنّب المواجهة أثناء سرقة الغنائم. وستحاول الفرار فور اكتشافها، ولديها القدرة على تغيير مواقع الأعداء عند الهجوم.

actors.mobs.crystalspire.name=crystal spire
actors.mobs.crystalspire.warning=The crystal vibrates as you strike it. Keeping this up is bound to draw attention to you...
actors.mobs.crystalspire.alert=The vibration grows and rumbles through the whole cave!
actors.mobs.crystalspire.rankings_desc=Perforated by the Crystal Spire
actors.mobs.crystalspire.desc=من المحتمل أن يكون هذا البرج العملاق المصنوع من الكريستال فائق الصلابة مصدر جميع المخلوقات البلورية الغريبة في هذا الكهف. أسلحتك العادية غير فعالة ضده، لذا ستحتاج إلى استخدام فأسك إذا كنت ترغب في تدميره.   تأكد من استعدادك قبل البدء في تكسيرها. من المرجح أن يستغرق استخراج بلورة بهذا الحجم وقتًا طويلاً، وربما لن تتمكن من القيام بذلك دون إزعاج. قد يمتلك البرج نفسه وسائل للدفاع عن نفسه أيضًا. ربما يمكن استخدام هجمات البرج ضد أتباعه
actors.mobs.crystalspire.discover_hint=You can find this enemy during a specific quest.

actors.mobs.crystalwisp.name=crystal wisp
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=قطعة صغيرة غاضبة تطفو في الهواء من الكريستال المتصلب، تُصدر توهجًا ساطعًا. ورغم أنها ليست قوية بشكل خاص، إلا أن خيوط الكريستال ستطلق عليك شعاعًا ضوئيًا مؤذيًا إذا سنحت لها فرصة مناسبة.   تتميز الخيوط بصغر حجمها بما يكفي للتحرك بسهولة عبر النتوءات البلورية المختلفة، لكنها غير قادرة على إطلاق النار من خلالها.
actors.mobs.crystalwisp.discover_hint=You can find this enemy during a specific quest.

actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=The demonic energy here seems to lessen as the spawner dies.
actors.mobs.demonspawner.desc=هذا المزيج المشوّه من لحم الأقزام هو المسؤول عن خلق شياطين ممزقة من الأقزام الذين ماتوا في هذه المنطقة. من الواضح أن الشياطين لا ترى أي غضاضة في استخدام كل مورد متاح ضد أعدائها.   على الرغم من مظهرها المرعب، لا تملك مخلوقات توليد الشياطين أي وسيلة للحركة أو الدفاع عن نفسها بشكل مباشر. إلا أن كتلتها الهائلة تجعل قتلها سريعًا أمرًا صعبًا، كما أنها تُنتج شياطينًا مفترسة بسرعة أكبر عندما تتعرض للخطر.   يبدو أن مولدات الشياطين مرتبطة بمصدر مركزي للقوة الشيطانية. قد يؤدي قتلها إلى إضعافه

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt killed you...
actors.mobs.dm100.desc=إنّ جهاز DM-100 هو نموذج مبكر من "آلات الدفاع" القزمية، صُمم لحماية عمال المناجم الأقزام في الكهوف أسفل هذا السجن. إلا أن صدماته الكهربائية كانت ضعيفة للغاية، لذا أُهديت إلى المدينة البشرية في الأعلى. بقيت هذه الأجهزة مهملة لسنوات، إلى أن وصلت في النهاية إلى السجن، حيث اعتبرها مدير السجن في البداية قاسية للغاية. ولكن مع ازدياد تمرد السجناء، أصبحت ضرورة لا غنى عنها

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of toxic exhaust!
actors.mobs.dm200.desc= DM-200 هو الجيل الثاني من "آلات الدفاع" القزمية، وقد صُمم لحماية عمال المناجم الأقزام في الكهوف والمدينة الواقعة أسفلها. وهي أكبر حجماً وأكثر ضخامة من سابقاتها، وتهاجم بقبضات هيدروليكية مدمرة.   يُعدّ حجمها الكبير نقطة ضعفها الرئيسية، إذ لا تستطيع المرور عبر الأنفاق والمداخل الضيقة للزنزانة. وقد تمكّن الأقزام من تعويض افتقار DM-200 إلى الحركة بالسماح لها بتفريغ غازات عادمها السامة على الأعداء البعيدين، أو الأعداء الذين لا تستطيع الوصول إليهم

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a corrosive grenade!
actors.mobs.dm201.desc=قام الأقزام لفترة وجيزة بتجربة إبراز افتقار DM-200 للحركة بشكل أكبر، وصنعوا بعض نماذج DM الثابتة تمامًا. DM-201 هو نموذج مُعدّل من DM-200 يعمل كبرج حراسة بلا قدرة على الحركة. في المقابل، يتمتع DM-201 بمتانة وقوة هجومية أكبر بكثير.   بما أن مركبات DM-201 لا تحتوي على محرك لتصريف العادم، فقد جهزها الأقزام بقنابل غازية أكالة! مع ذلك، فإن مركبات DM-201 حذرة في استخدام هذه القنابل، ولن تقذفها إلا عند تعرضها لهجوم من مسافة بعيدة

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls power from the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable while it is being energized by a pylon!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON DESTROYED! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN POWER GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=ممنوع
actors.mobs.dm300.defeated=CRITICAL DAMAGE! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=إنّ DM-300 هي أكبر وأقوى "آلة دفاعية" بناها الأقزام على الإطلاق. ونظرًا لصعوبة تصنيع مثل هذه الآلة الجبارة، لم يصنع الأقزام سوى عدد قليل منها لحراسة مداخل مدينتهم الجوفية.   وهو مزود بفتحات تهوية لإخراج غازات العادم السامة، وبمثقاب عالي الطاقة يمكنه استخدامه لتدمير الأرض وإلحاق الضرر بها. كما يمكن لـ DM-300 الاتصال بشبكة الطاقة، مما يزيد من قوته
actors.mobs.dm300.desc_supercharged=جهاز DM-300 مشحون حاليًا بالكامل بالطاقة الكهربائية. في هذه الحالة، لا يمكن إتلاف جهاز DM-300 ويتحرك بسرعة مضاعفة! بالإضافة إلى ذلك، يدور مثقابه الآن بسرعة كافية لحفر أنفاق عبر الصخور الصلبة، على الرغم من أنه يتحرك ببطء شديد أثناء القيام بذلك.   إن مهاجمة DM-300 مباشرة أمر لا طائل منه أثناء شحنه الفائق، ولكن لا بد أن هناك شيئًا ما في المنطقة يزوده بهذه الطاقة، وتدمير ذلك الشيء قد يضعفه.

actors.mobs.dwarfking.name=King of Dwarves
actors.mobs.dwarfking.notice=How dare you! You have no idea what you're interfering with!
actors.mobs.dwarfking.lifelink_1=I have need of your essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=Deal with them, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for your king!
actors.mobs.dwarfking.wave_3=Useless! KILL THEM NOW!
actors.mobs.dwarfking.enraged=You cannot kill me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=No! You can't do this... you have no idea what lies below...
actors.mobs.dwarfking.defeated=You've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking.desc=منذ سنوات عديدة، كشف أحد كبار السحرة في بلاط الأقزام أسرارًا منحته قوة هائلة على الحياة والموت. وسرعان ما استغل هذه القوة، فأخضع أقرانه وملكه، ثم جميع مواطني الأقزام، وأفسدهم. والآن هو ملك، حاكم على جحافل من الموتى الأحياء.   إن ملك الأقزام عدو شرس، وسيحاول محاصرة أعدائه وإغراقهم بجيشه من أتباعه الموتى الأحياء
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell Before the King of Dwarves
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell Before the King of Dwarves

actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=There was a mimic there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=الميميكس مخلوقات سحرية قادرة على اتخاذ أي شكل تريده. في الأبراج المحصنة، غالباً ما تختار شكل صندوق الكنز، لجذب المغامرين غير المتوقعين.   تُعدّ مخلوقات الأبنوس المُقلّدة مخلوقاتٍ مُتخفية تتمتع بقدرةٍ على الاختفاء تقريبًا. تتربص هذه المخلوقات في الأماكن التي يُحتمل أن يتفاعل معها المغامرون، ولكنها تحتوي أيضًا على غنائم خاصة بها. لا تُشكّل هذه المخلوقات أي خطرٍ يُذكر مقارنةً بالمخلوقات المُقلّدة العادية بمجرد اكتشافها، إلا أن لدغتها المفاجئة مُدمرة
actors.mobs.ebonymimic.discover_hint=You can find this enemy with a specific trinket.

actors.mobs.elemental$fireelemental.name=fire elemental
actors.mobs.elemental$fireelemental.desc=العناصر كائنات فوضوية تُخلق غالبًا عندما لا يتم التحكم في السحر الخفي القوي بشكل صحيح. تتمتع العناصر بذكاء محدود، وعادةً ما ترتبط بنوع معين من السحر.   تُعدّ العناصر النارية نوعًا شائعًا من العناصر التي تُلحق الضرر بسحر ناري. فهي تُشعل النار في هدفها بهجمات قريبة المدى، ويمكنها أحيانًا إطلاق سهام نارية أيضًا.
actors.mobs.elemental$newbornfireelemental.name=newborn fire elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic creatures that are often created when powerful occult magic isn't properly controlled. Elementals have minimal intelligence, and are usually associated with a particular type of magic.\n\nThis fire elemental is freshly summoned, but still quite dangerous!
actors.mobs.elemental$newbornfireelemental.rankings_desc=Charred by a Newborn Fire Elemental
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic nature of its summoning, this elemental can only spread fire in inaccurate blasts after charging for a turn.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because this elemental was summoned by a spell, it has a little more control over its flame. It's incapable of making ranged attacks, but will ignite enemies it attacks in melee.
actors.mobs.elemental$newbornfireelemental.discover_hint=You can find this enemy during a specific quest.
actors.mobs.elemental$frostelemental.name=frost elemental
actors.mobs.elemental$frostelemental.desc=العناصر كائنات فوضوية تُخلق غالبًا عندما لا يتم التحكم في السحر الخفي القوي بشكل صحيح. تتمتع العناصر بذكاء محدود، وعادةً ما ترتبط بنوع معين من السحر.   تُعدّ عناصر الصقيع نوعًا شائعًا من العناصر التي تُضعف الأعداء بسحرها المُجمّد. تُجمّد هذه العناصر هدفها بهجمات قريبة المدى، وأحيانًا بهجمات بعيدة المدى. ويكون سحرها أكثر فعالية في الماء.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=العناصر كائنات فوضوية تُخلق غالبًا عندما لا يتم التحكم في السحر الخفي القوي بشكل صحيح. تتمتع العناصر بذكاء محدود، وعادةً ما ترتبط بنوع معين من السحر.   تُعدّ العناصر الصاعقة نوعًا أقل شيوعًا من العناصر، تُعطّل أعداءها بالكهرباء وومضات الضوء. في القتال المباشر، تُطلق هذه العناصر شرارات كهربائية نحو الأعداء القريبين، وتُلحق ضررًا إضافيًا بهدفها الرئيسي إذا كان في الماء. كما تُركّز أحيانًا شعاعًا ضوئيًا بعيد المدى على هدفها، مُسببةً له عمىً مؤقتًا
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=العناصر كائنات فوضوية تُخلق غالبًا عندما لا يتم التحكم في السحر الخفي القوي بشكل صحيح. تتمتع العناصر بذكاء محدود، وعادةً ما ترتبط بنوع معين من السحر.   عناصر الفوضى هي عناصر نادرة وخطيرة لم تستقر بعد على عنصر معين. ستطلق العنان لسحر جامح لا يمكن التنبؤ به عند هجومها.

actors.mobs.eye.name=العين الشريره
actors.mobs.eye.deathgaze_kill=The deathgaze killed you...
actors.mobs.eye.desc=العيون الشريرة عبارة عن كرات عائمة من الطاقة الشيطانية المكبوتة. ورغم قدرتها على القتال المباشر، إلا أن قوتها الحقيقية تنبع من سحرها.   بعد تراكم الطاقة لفترة قصيرة، ستطلق العين الشريرة شعاعًا مدمرًا من الطاقة يسمى "نظرة الموت". أي شيء يقع ضمن نطاق رؤية العين الشريرة سيتعرض لأضرار هائلة، وسيلجأ المغامرون الحكماء إلى الاحتماء.

actors.mobs.fetidrat.name=fetid rat
actors.mobs.fetidrat.rankings_desc=Dissolved by the Fetid Rat
actors.mobs.fetidrat.desc=من الواضح أن هناك خطباً ما في هذا الجرذ. ففراؤه الأسود الدهني وجلده المتعفن يختلفان تماماً عن الجرذان السليمة التي رأيتها سابقاً. وعيناه الخضراوان الشاحبتان تجعلانه يبدو مخيفاً بشكل خاص.   يحمل الجرذ معه سحابة من الرائحة الكريهة، وهي قوية للغاية عند الاقتراب منه.   يتساقط سائل داكن لزج من فم الفأر، ويخترق الأرضية ولكنه يبدو أنه يذوب في الماء.
actors.mobs.fetidrat.discover_hint=You can find this enemy during a specific quest.

actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=This gigantic mushroom must be the source of all the fungal activity in this cave.

actors.mobs.fungalsentry.name=fungal sentry
actors.mobs.fungalsentry.desc=يعمل هذا الفطر الطويل بشكل خاص كنقطة دفاع للشبكة الفطرية الأكبر التي تعيش في هذا الكهف.   هو كائن ثابت لا يتحرك، لكنه يطلق رشقات دقيقة من السم على أي شيء يقع في مجال رؤيته. ورغم أن تأثير هذه الرشقات ضعيف نسبياً، إلا أنها قادرة على تراكم كميات قاتلة من السم بسرعة كبيرة. ورغم إمكانية قتله، فمن الأفضل تجنبه.

actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=يبدو أن هذا العنكبوت الغزال في الكهوف يخضع لسيطرة فطر طفيلي. وقد غيّر الفطر أيضاً من قدراته، فاستبدل شبكته وأكياس سمه بنمو فطري.   سيقوم الفطر الزاحف بقذف نباتات عليك بدلاً من خيوط العنكبوت، مما ينشر الفطريات وقد يتسبب في تجذير جسمك. ورغم أنه لا يستطيع التسمم، إلا أن الفطر الزاحف سيكتسب مقاومة كبيرة للأضرار إذا كان مجاوراً لأي فطر.

actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=مع بدء انهيار مجتمع الأقزام تدريجيًا، واستيلاء ملكهم الحالي على السلطة المطلقة، لم يُعامل الضعفاء أو من قاوموه معاملة حسنة. ومع ازدياد براعة الملك في استخدام السحر الأسود، أخضع هؤلاء الأقزام لإرادته، فأصبحوا الآن جنود جيشه.   لا تتمتع الغيلان بقوة كبيرة بمفردها، لكنها تسافر دائمًا في مجموعات، ويصعب قتلها بأعداد كبيرة. عندما يُهزم غول، فإنه سيعود إلى الحياة بعد بضع جولات طالما كان هناك غول آخر قريب

actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. They dwell in sewers and dungeons, venturing up to raid the surface from time to time. Gnoll scouts are regular members of their pack, they are not as strong as brutes and not as intelligent as shamans.

actors.mobs.gnollexile.name=gnoll exile
actors.mobs.gnollexile.desc=يحمل هذا الغنول ذو الفراء الرمادي علامة كبيرة على كتفه، تدل على أنه منفي. عادةً ما يُنفى الغنول من مجتمعهم لتجاهلهم الأوامر أو خرقهم القوانين. يجب أن يكون المنفيون أقوياء وأذكياء للبقاء على قيد الحياة، ويبدو أن هذا الغنول يعرف كيف يستخدم الرمح الذي يحمله.
actors.mobs.gnollexile.desc_passive=يتحرك الغنول المنفي للهجوم. لا يبدو عدوانيًا مثل الغنول الآخرين هنا، وربما لا يعتقد أن قتالك يستحق العناء. يمكنك ببساطة تركه يمر، لكن لديه حقيبة ظهر قد تكون مليئة بأشياء مفيدة...
actors.mobs.gnollexile.desc_aggro=_The gnoll exile looks around angrily._ It seems something has made it decide to fight after all. Watch out for that spear!
actors.mobs.gnollexile.seen_passive=The spear-wielding gnoll looks at you warily, but doesn't move to attack.
actors.mobs.gnollexile.seen_aggro=The spear-wielding gnoll moves to attack!

actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure you're ready before you continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave seems to shift as it leaps away while laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks killed you...
actors.mobs.gnollgeomancer.rankings_desc=Buried by the Gnoll Geomancer
actors.mobs.gnollgeomancer.desc=لا بد أن هذا الغنول الكبير ذو القامة الفارعة هو مصدر مختلف أنواع السحر المؤثر على الأرض في هذه المنطقة، ومنظم جميع أنشطة الغنول. على عكس الغنول الذين يخربون الأرض في المنطقة، فإن ساحر الأرض هذا بارعٌ جدًا في سحره، ولا يمكن أن يتضرر من الصخور المقذوفة أو المتساقطة. مع ذلك، فهو لا يملك أي وسيلة للقتال المباشر.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock armor. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=هذا الشامان الغنول، ذو القامة الفارعة، محاط بطبقة من الصخور، ويبدو أشبه بتمثال. بالتدقيق، يمكنك رؤية الصخور تتحرك بسحر متناغم مع أنفاس الغنول الكبير. لا يمكن إيذاؤه وهو محاط بالصخور هكذا، ويبدو أنه ينعم بنوم عميق على التراب.   ربما تستطيع اختراق طبقات الصخور بفأسك، لكن تأكد من استعدادك للمواجهة. لا بد أن يكون ساحر الأرض مصدرًا لأنواع السحر المختلفة التي تحرك الأرض هنا، ومنظمًا لجميع أنشطة الغيلان. قد يكون من الأفضل هزيمة الغيلان المتناثرة هنا قبل مواجهته
actors.mobs.gnollgeomancer.discover_hint=You can find this enemy during a specific quest.

actors.mobs.gnollguard.name=gnoll guard
actors.mobs.gnollguard.def_verb=ممنوع
actors.mobs.gnollguard.spear_warn=The gnoll lands a vicious blow with the tip of its spear!
actors.mobs.gnollguard.desc=غنول ضخم البنية وقوي المظهر يحمل رمحًا ودرعًا، لكنه بلا خوذة. من المرجح أن هؤلاء الحراس هم وحوش متدربة، تم إقحامهم للمساعدة في حماية المنجم من الحيوانات البرية المتطفلة.   حارس الغنول قوي بما يكفي لحمل الرمح بيد واحدة، لكنه لا يجيد استخدامه. سيحتاج إلى مساحة مفتوحة نسبياً للهجوم من مسافة بعيدة، وسيلحق بك ضرراً أقل بكثير إذا اقتربت منه.
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollguard.discover_hint=You can find this enemy during a specific quest.

actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnollsapper.desc=غنول صغير وضعيف لكنه ذكي، ذو فراء شاحب وحقيبة مليئة بأدوات متنوعة. يُرجح وجوده هنا للمساعدة في التنقيب عن الذهب الداكن واستخراجه، وله حارس قريب لحمايته. هو قادر على القتال، لكن هجماته ضعيفة للغاية، لا تتجاوز قوة كشاف غنول.   بدلاً من القتال المباشر، يُفضّل المهندسون استخدام أدواتهم المتنوعة لجعل البيئة الصخرية تُهاجمهم. مع ذلك، فهم لا يُتقنون سحر تحريك الأرض، ولذا يُرجّح أن يستخدموا أدواتهم بتهوّر. _يجب أن تكون هناك طرق عديدة لاستخدام هجماتهم ضدهم أو ضد حراسهم
actors.mobs.gnollsapper.discover_hint=You can find this enemy during a specific quest.

actors.mobs.gnolltrickster.name=gnoll trickster
actors.mobs.gnolltrickster.rankings_desc=Outwitted by the Gnoll Trickster
actors.mobs.gnolltrickster.desc=مخلوق غريب الشكل، حتى بمعايير الغنول. ينحني للأمام بابتسامة شريرة، يكاد يحتضن الحقيبة المعلقة على كتفه. عيناه واسعتان بمزيج غريب من الخوف والإثارة.   يوجد في حقيبته مجموعة كبيرة من السهام رديئة الصنع، ويبدو أن جميعها مطلية بمواد ضارة مختلفة.
actors.mobs.gnolltrickster.discover_hint=You can find this enemy during a specific quest.

actors.mobs.goldenmimic.name=golden mimic
actors.mobs.goldenmimic.desc=الميميكس مخلوقات سحرية قادرة على اتخاذ أي شكل تريده. في الأبراج المحصنة، غالباً ما تختار شكل صندوق الكنز، لجذب المغامرين غير المتوقعين.   تُعدّ المخلوقات الذهبية المُقلّدة أكثر شراسة، وتسعى لجذب أقوى المغامرين. فهي تمتلك غنائم أفضل، ولكنها أيضاً أقوى بكثير من المخلوقات المُقلّدة العادية.

actors.mobs.golem.name=غولم
actors.mobs.golem.def_verb=ممنوع
actors.mobs.golem.desc=تُعدّ الغولم محاولةً لتصحيح عيوب الآلات القزمية السابقة من خلال استخدام الأقزام للسحر. وهي أكثر إحكامًا وكفاءةً مقارنةً بـ DM-300، مع احتفاظها بقوتها الفتاكة.   رغم أن حجم الغولم لا يزال كبيرًا جدًا بحيث لا يمكنه المرور عبر الممرات، فقد منحه الأقزام قدرات سحرية جديدة لتعويض ذلك. يستطيع الغولم الانتقال الفوري بين الغرف، ونقل الأعداء إليه عندما يكون بعيدًا عن متناوله

actors.mobs.goo.name=غوو
actors.mobs.goo.notice=غلورب غلرب
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo is pumping itself up!
actors.mobs.goo.enraged=غاضب
actors.mobs.goo.gluuurp=غلوورب
actors.mobs.goo.rankings_desc=Absorbed by the Goo
actors.mobs.goo.desc=لا يُعرف الكثير عن "المادة اللزجة". من المحتمل جدًا أنها ليست كائنًا حيًا، بل مزيج من مواد كريهة من المجاري اكتسبت بطريقة ما ذكاءً بدائيًا. على أي حال، من المؤكد أن السحر الأسود هو ما سمح بوجود "المادة اللزجة".   بفضل طبيعته الهلامية، يمتص كميات هائلة من الطاقة المظلمة، فتشعر بقشعريرة لمجرد الاقتراب منه. إذا تمكن هذا الهلام من الهجوم بهذه الطاقة، فلن تعيش طويلاً

actors.mobs.greatcrab.name=great crab
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=ممنوع
actors.mobs.greatcrab.rankings_desc=Snipped by the Great Crab
actors.mobs.greatcrab.desc=     هذا السلطعون ضخم للغاية، حتى بالمقارنة مع أنواع السلطعون الأخرى التي تعيش في المجاري. صدفته الزرقاء مغطاة بالشقوق والبرنقيل، مما يدل على قدمه. يتحرك ببطء شديد، بالكاد يحافظ على توازنه بمخلبه الضخم.   على الرغم من أن للسرطان مخلباً واحداً فقط، إلا أن حجمه يعوض ذلك بسهولة. يرفع السرطان مخلبه أمام أي تهديد، متحصناً خلف جدار منيع من الدرع. مع ذلك، لا يستطيع السرطان صدّ الهجمات التي لا يراها قادمة، أو هجمات عدة أعداء في آن واحد.
actors.mobs.greatcrab.discover_hint=You can find this enemy during a specific quest.

actors.mobs.guard.name=prison guard
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=ممنوع
actors.mobs.guard.desc=كان هؤلاء الحراس في يوم من الأيام حراس السجن، لكنهم أصبحوا منذ زمن بعيد لا يختلفون عن السجناء. يتخبطون كالأموات الأحياء، يتجولون بلا وعي في الممرات بحثاً عن أي شيء غريب، مثلك تماماً!   يحملون سلاسل حول خصرهم، ربما تستخدم لجذب الأعداء إلى مسافة قريبة.

actors.mobs.hermitcrab.name=hermit crab
actors.mobs.hermitcrab.def_verb=ممنوع
actors.mobs.hermitcrab.desc=لسببٍ ما، قرر هذا السلطعون المجاري ارتداء الجزء العلوي المكسور من برميل على رأسه! أدى الوزن الزائد إلى إبطائه إلى سرعته العادية، ولكنه منحه أيضًا دفاعًا أقوى بكثير. لكنك تظن أنك تسمع شيئًا يرتد داخل البرميل...

actors.mobs.mimic.name=مقلد
actors.mobs.mimic.reveal=That chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=الميميكس مخلوقات سحرية قادرة على اتخاذ أي شكل تريده. في الأبراج المحصنة، غالباً ما تختار شكل صندوق الكنز، لجذب المغامرين غير المتوقعين.   تمتلك المخلوقات المقلدة عضة مؤلمة، لكنها غالباً ما تحمل كنوزاً أكثر من الصناديق العادية.
actors.mobs.mimic.discover_hint=You can find this enemy anywhere in the dungeon.

actors.mobs.necromancer.name=necromancer
actors.mobs.necromancer.desc=These apprentice dark mages have flocked to the prison, as it is the perfect place to practise their evil craft.\n\nNecromancers will summon and empower skeletons to fight for them. Killing the necromancer will also kill the skeleton it summons.
actors.mobs.necromancer$necroskeleton.name=necromancer's skeleton
actors.mobs.necromancer$necroskeleton.desc=This skeleton has been summoned by a necromancer. It behaves just like a regular skeleton, and will die when the necromancer which summoned it is slain.

actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.mob.discover_hint=You can find this enemy in a specific region of the dungeon.

actors.mobs.monk.name=dwarf monk
actors.mobs.monk.def_verb=ممنوع
actors.mobs.monk.parried=مدفون
actors.mobs.monk.desc=هؤلاء الرهبان متعصبون، كرسوا أنفسهم لحماية ملكهم بالقوة البدنية. بلغ إخلاصهم حداً جعلهم يسلمون عقولهم بالكامل لملكهم، ويجوبون الآن مدينة الأقزام كالأموات الأحياء بلا عقول.   يعتمد الرهبان كلياً على فنون القتال اليدوي، ويستطيعون استخدام قبضاتهم غير المسلحة للهجوم والدفاع على حد سواء. وعندما يبلغون ذروة تركيزهم، يتصدون للهجوم الجسدي التالي الموجه ضدهم، حتى لو كان من المؤكد إصابتهم. ويكتسب الرهبان تركيزهم بسرعة أكبر أثناء الحركة، وببطء أكبر في القتال المباشر
actors.mobs.monk$focus.name=مركز
actors.mobs.monk$focus.desc=ذا الراهب دقيق للغاية في تحديد هدفه، ويبدو أنه يتوقع تحركاتهم قبل أن يقوموا بها.   أثناء التركيز، من المؤكد أن الهجوم الجسدي التالي الموجه ضد هذه الشخصية سيخطئ الهدف، مهما كانت الظروف. سيؤدي صد هذا الهجوم إلى استنزاف تركيز الراهب، وسيحتاج إلى إعادة شحنه لصد هجوم آخر. يكتسب الرهبان التركيز بسرعة أكبر أثناء الحركة.

actors.mobs.phantompiranha.name=phantom piranha
actors.mobs.phantompiranha.teleport_away=The phantom piranha teleports away...
actors.mobs.phantompiranha.desc=أسماك البيرانا الشبحية هي سلالة نادرة من أسماك البيرانا تتمتع بقدرات سحرية وأجسام شفافة غريبة. وهي قادرة على الانتقال الآني أثناء تعرضها للهجوم، إما للهروب أو للاقتراب بسرعة من عدوها!   على الرغم من صعوبة قتالها، إلا أن لحمها يُعتبر ثميناً لخصائصه السحرية.

actors.mobs.piranha.name=giant piranha
actors.mobs.piranha.desc=These carnivorous fish are bred specifically to protect flooded areas. Their bite is deadly, so it's best to avoid confronting them directly.
actors.mobs.piranha.discover_hint=You can find this enemy anywhere in the dungeon.

actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A power pylon, meant to help regulate the electricity which powers the machinery in this area.\n\nThe pylon is currently inactive and immune to damage.
actors.mobs.pylon.desc_active=برج كهرباء مصمم للمساعدة في تنظيم الكهرباء التي تُشغل الآلات في هذه المنطقة. البرج مُفعم حاليًا بالطاقة الكهربائية، لا بد أن هذا هو ما يُشحن DM-300!   في هذه الحالة، تكون أبراج نقل الطاقة عرضة للتلف، لكنها ستنقل التيار الكهربائي إلى الخلايا المجاورة في اتجاه عقارب الساعة. وبفضل تركيبها المعدني الثقيل، تتمتع هذه الأبراج بمقاومة عالية للأضرار الكبيرة

actors.mobs.rat.name=marsupial rat
actors.mobs.rat.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.

actors.mobs.ripperdemon.name=ripper demon
actors.mobs.ripperdemon.leap=The ripper demon prepares to leap!
actors.mobs.ripperdemon.desc=هذه المخلوقات المرعبة هي نتاج استخدام قوى شيطانية لجثث الأقزام الكثيرة في هذه المنطقة. الريبرز مخلوقات هزيلة تشبه الأقزام، لكن بأجساد محطمة ومخالب طويلة حادة مصنوعة من العظام.   لا تتمتع شياطين التمزيق بصلابة كبيرة، لكنها رشيقة وخطيرة. فهي قادرة على القفز لمسافات طويلة للوصول بسرعة إلى أهدافها قبل أن تنهشها بمخالبها.

actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=ثمرة نبات التوت البري فريدة من نوعها. فبدلاً من أن تتعفن وتستهلك العناصر الغذائية، تنمو الثمرة وتتصلب وتحيط بالبذرة، موفرةً بذلك الحماية للأعضاء الداخلية التي تنمو داخلها. ويُطلق على هذه الكرة العملاقة اسم قلب نبات التوت البري البالغ.
actors.mobs.rotheart.discover_hint=You can find this enemy during a specific quest.

actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.rankings_desc=Whipped by a rot lasher
actors.mobs.rotlasher.desc= يُعدّ "الخنفساء المتعفنة" جزءًا من بنية جذور نبات التوت المتعفن الناضج، ووسيلته الدفاعية الأساسية. هذه الخنفساء عمياء ومغروسة في الأرض، لكنها تهاجم بشراسة أي تهديد قريب بعد لحظة من رصده. وعندما لا يكون هناك أعداء قريبون، تقف بلا حراك، محاولةً التمويه بين النباتات المحيطة
actors.mobs.rotlasher.discover_hint=You can find this enemy during a specific quest.

actors.mobs.scorpio.name=برج العقرب
actors.mobs.scorpio.desc=These huge arachnid-like demonic creatures avoid close combat, preferring to fire crippling serrated spikes from long distances.

actors.mobs.senior.name=senior monk
actors.mobs.senior.desc=هؤلاء الرهبان متعصبون، كرسوا أنفسهم لحماية ملكهم بالقوة البدنية. بلغ إخلاصهم حداً جعلهم يسلمون عقولهم بالكامل لملكهم، ويجوبون الآن مدينة الأقزام كالأموات الأحياء بلا عقول.   أتقن هذا الراهب فنون القتال اليدوي، ويستطيع التركيز أثناء الحركة بسرعة تفوق سرعة الرهبان العاديين. عندما يركز الرهبان، يتصدون للهجوم الجسدي التالي الموجه ضدهم، حتى لو كان من المؤكد إصابتهم. يكتسب الرهبان التركيز بسرعة أكبر أثناء الحركة، وببطء أكبر في القتال المباشر

actors.mobs.shaman.name=gnoll shaman
actors.mobs.shaman.bolt_kill=The magic bolt killed you...
actors.mobs.shaman.desc=Gnoll shamans are intelligent gnolls who use battle spells to compensate for their lack of might. They have a very respected position in gnoll society, despite their weaker strength.
actors.mobs.shaman$redshaman.spell_desc=This shaman is wearing a red mask, and will use magic that temporarily _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=This shaman is wearing a blue mask, and will use magic that temporarily _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This shaman is wearing a purple mask, and will use magic that temporarily _reduces your accuracy and evasion._

actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior gnoll brutes often wear powerful armor to show their status. The armor makes these brutes much more resilient to physical damage, and their greater discipline means they can rage for much longer before succumbing to their wounds.

actors.mobs.skeleton.name=هيكل عظمي
actors.mobs.skeleton.explo_kill=You were killed by the explosion of bones...
actors.mobs.skeleton.def_verb=ممنوع
actors.mobs.skeleton.desc=تتكون الهياكل العظمية من عظام المغامرين التعساء وسكان السجن، وقد أُحييت بفعل انبعاثات سحر شرير من الأعماق. بعد تعرضها لأضرار بالغة، تتفتت الهياكل العظمية في انفجار هائل. شظايا هذا الانفجار ضارة بكل ما هو قريب، لكن الدروع فعالة للغاية في التخفيف من آثارها

actors.mobs.slime.name=سلايم
actors.mobs.slime.def_verb=ممنوع
actors.mobs.slime.desc=المخلوقات الهلامية غريبة، ذات طابع سحري بعض الشيء، ولها جسم خارجي مطاطي ولب سائل. وتوفر لها مجاري المدينة إمدادات وفيرة من الماء والمغذيات.   بسبب غشائها الخارجي المرن، من الصعب إلحاق أكثر من 6 ضرر بالوحل من أي هجوم واحد.

actors.mobs.snake.name=sewer snake
actors.mobs.snake.hint=Try using the examine button on a snake to learn how to counter them.
actors.mobs.snake.desc=هذه الثعابين الضخمة قادرة على التسلل بسرعة حول الضربات، مما يجعل إصابتها صعبة للغاية. ومع ذلك، فإن الهجمات السحرية أو الهجمات المفاجئة قادرة على مباغتتها.   يمكنك شن هجوم مفاجئ بالهجوم وأنت خارج مجال رؤية الثعبان. إحدى الطرق هي ترك الثعبان يطاردك عبر مدخل ثم الانقضاض عليه مباشرة بعد دخوله الباب.

actors.mobs.spectralnecromancer.name=spectral necromancer
actors.mobs.spectralnecromancer.desc=بينما تُعدّ الهياكل العظمية مصدر رزق أساسي لسحرة الموتى، يفضّل البعض البحث عن أتباع آخرين أقلّ مادية. وقد اختار سحرة الموتى الأشباح الأشباح كأتباعهم المفضّلين!   الأشباح الفردية ليست بقوة الهياكل العظمية، لكن هؤلاء السحرة لا يخشون استدعاء مجموعة منها!

actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=تحاول هذه العناكب الكهفية الخضراء ذات الفراء تجنب المواجهة المباشرة. وبدلاً من ذلك، تفضل الانتظار على مسافة بعيدة بينما يتخبط فريستها في خيوطها العنكبوتية، ويموت ببطء من لدغتها السامة. وهي قادرة على إطلاق خيوطها لمسافات طويلة، وستحاول سد أي طريق تسلكه فريستها.

actors.mobs.statue.name=animated statue
actors.mobs.statue.def_verb=ممنوع
actors.mobs.statue.desc=You would think that it's just another one of this dungeon's inanimate statues, but its red glowing eyes give it away.
actors.mobs.statue.desc_weapon=While the statue itself is made of stone, the _%s_ it's wielding looks real.
actors.mobs.statue.discover_hint=You can find this enemy anywhere in the dungeon.

actors.mobs.succubus.name=شيطان الاغواء
actors.mobs.succubus.desc=سوكوبي شكل إنسان قوطي شاحب، ربما لجذب سحرة الأقزام؟   قد تُسحر السوكوبي عدوها مؤقتًا عند الهجوم، مما يجعله عاجزًا عن مهاجمتها مباشرةً. وعندما تهاجم السوكوبي عدوًا مسحورًا، فإنها تسرق جزءًا من جوهر حياته.

actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The deadly swarm of flies buzzes angrily. Every non-magical attack will split it into two smaller but equally dangerous swarms.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.notice_have=I have you now, %s!
actors.mobs.tengu.defeated=Free at last...
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc= قاتل مشهور وغامض، سُمّي بهذا الاسم نسبةً إلى القناع الذي كان يغطي وجهه.   تم تثبيت تينغو بمشابك كبيرة على معصميه وركبتيه، على الرغم من أنه يبدو أنه تخلص من سلاسله منذ زمن طويل.   سيحاول استخدام الفخاخ والسحر الخادع والهجمات الدقيقة للقضاء على الشيء الوحيد الذي يمنعه من الهروب: أنت.

actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke Bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=  ألقى تينغو قنبلة دخان غريبة الشكل هنا، تتصاعد منها سحابة كثيفة من الدخان الساخن. تُصدر صوت دقات عالٍ، كما لو أنها تعد تنازليًا لانفجار!   لقد ثبتت القنبلة نفسها في الأرض، لذا لا يمكنك التقاطها.

actors.mobs.tengu$fireability$fireblob.desc=Tengu has thrown a fine powder that seems to be catching into steam here, it's about to ignite!

actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=القى تينغو بآلة غريبة هنا، يبدو أنها مصنوعة من أجزاء من DM-100. تُصدر الآلة شرارات كهربائية باستمرار حولها، ولكن يبدو أنها تسير وفق نمط يمكن التنبؤ به.   مع كل هذه الكهرباء التي تدور حوله، لا يمكنك التقاطه بأي حال من الأحوال

actors.mobs.thief.name=crazy thief
actors.mobs.thief.stole=The thief stole %s from you!
actors.mobs.thief.carries=\n\nThe thief is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The thief gets away with your %s!
actors.mobs.thief.desc=رغم أن هؤلاء السجناء يتجولون بحرية خارج زنازينهم، إلا أن هذا المكان لا يزال سجنهم. بمرور الوقت، استولى هذا المكان على عقولهم كما استولى على حريتهم. منذ زمن بعيد، نسي هؤلاء اللصوص المختلون هويتهم وسبب سرقتهم.   هؤلاء الأعداء يميلون إلى السرقة والفرار أكثر من القتال. احرص على مراقبتهم جيداً، وإلا فقد لا ترى مسروقاتك مرة أخرى.

actors.mobs.tormentedspirit.name=tormented spirit
actors.mobs.tormentedspirit.desc=الأرواح المعذبة هي أرواح طيبة في الأصل، لكنها مصابة بلعنة. وطالما أنها ملعونة، فإنها تهاجم كالأشباح، بل وتكون أقوى منها!   قد يكون من الممكن تطهير اللعنة باستخدام الأداة المناسبة وأنت بجوار الروح. إذا رُفعت اللعنة، فستكون الروح ممتنة بالتأكيد...
actors.mobs.tormentedspirit.thank_you=Thank you...

actors.mobs.npcs.vaultlaser.name=disintegration sentry
actors.mobs.npcs.vaultlaser.ondeath=You were killed by the disintegration ray...
actors.mobs.npcs.vaultlaser.desc=تُطلق هذه الحراس أشعة سحرية مُدمِّرة على فترات منتظمة أو شبه عشوائية. تبدو هذه الأشعة خطيرة للغاية، لكنها على الأقل تتجه دائمًا إلى نفس المكان. لا يبدو أن هناك أي طريقة لمقاومة هذه الأشعة، لذا سيتعين عليك تجنبها بطريقة أو بأخرى.

actors.mobs.npcs.vaultsentry.name=scanning sentry
actors.mobs.npcs.vaultsentry.ondeath=The lightning bolt killed you...
actors.mobs.npcs.vaultsentry.desc=تقوم هذه الحراس بمسح المنطقة وفق نمط محدد مسبقًا. تبدو خطيرة للغاية، ومن المؤكد أنك ستتعرض للصعق إذا تم رصدك. يمكن تجنب هذا النمط في كثير من الأحيان، ولكن يجب على الحراس أيضًا رؤيتك بصريًا لرصدك، لذا فإن أي شيء يحجب الرؤية يكون فعالًا ضدهم.

actors.mobs.npcs.vaulttokendoor.name=strange door
actors.mobs.npcs.vaulttokendoor.def_verb=ممنوع
actors.mobs.npcs.vaulttokendoor.desc=This seemingly unlocked door won't budge, and has an unusual mechanism along its surface. There are ten indentations that look like some sort of flat diamond-shaped object would fit into them.
actors.mobs.npcs.vaulttokendoor.no_tokens=_Perhaps something you can find in the vault might fit here?_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Your dwarven tokens fit the indentations perfectly_, but you don't have enough of them.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_You have enough dwarven tokens to fill every indentation_, do you want to place them into the door?
actors.mobs.npcs.vaulttokendoor.open=Open the Door
actors.mobs.npcs.vaulttokendoor.not_yet=Not Yet
actors.mobs.npcs.vaulttokendoor.unlocked=The tokens seem to merge into the door and you hear the distinct click of a lock opening.

actors.mobs.npcs.vaultmirror.name=Strange Mirror
actors.mobs.npcs.vaultmirror.def_verb=ممنوع
actors.mobs.npcs.vaultmirror.desc=This large mirror is inscribed with various glowing dwarven runes, it hums gently but doesn't seem to actually reflect anything.
actors.mobs.npcs.vaultmirror.approach=Before you stands a large mirror with thin glowing runes etched into its opulent golden frame. The mirror's surface is pitch black, until you get close. As you lean toward the mirror the runes flash brightly and a shockingly familiar scene appears behind the glass.
actors.mobs.npcs.vaultmirror.scene_warrior=ترى ختمك الشمعي الأحمر، مقطوعًا إلى نصفين ومدفونًا جزئيًا في الثلج. المشهد أشبه بذكرى، لكن التفاصيل مختلفة. لم تستطع أبدًا التخلص من الختم، فالاحتفاظ به كان بمثابة عقاب لك. لقد أمضيت وقتًا طويلًا في النظر إليه، والكسر الآن بزاوية مختلفة قليلًا
actors.mobs.npcs.vaultmirror.scene_mage=ترى عصاك السحرية موضوعة على طاولة في مكتب. المشهد أشبه بذكرى، لكن التفاصيل مختلفة. كان هذا مكتبك الرسمي في معهد السحرة الجنوبي؛ مكان بارز للغاية بحيث لا يُمكن الاحتفاظ بالعصا فيه. يبدو المكتب أكثر استخدامًا مما ينبغي، فأنت لم تُعر اهتمامًا قط للعمل فيه بجدية
actors.mobs.npcs.vaultmirror.scene_rogue=ترى عباءة الظلال، مستقرةً برفق على حامل في مستودع الأسلحة الملكي. المشهد أشبه بذكرى، لكن التفاصيل مختلفة. المستودع ساكن وهادئ، والحارس المناوب يمسح المكان بهدوء بنظرة حنونة. تشعر بوخزة ذنب مألوفة وأنت تراه واقفًا بسلام ودون أذى.
actors.mobs.npcs.vaultmirror.scene_huntress=ترى قوسك الروحي موضوعًا على حجر دائري مسطح كبير محاط بغابة كثيفة. المشهد أشبه بذكرى، لكن التفاصيل مختلفة. الفسحة الصغيرة حول الحجر هادئة وخالية، على عكس الاحتفال الذي أُهديت فيه قوسك. في الواقع، لا يمكنك استشعار أي شيء من الطبيعة المحيطة على الإطلاق.
actors.mobs.npcs.vaultmirror.scene_duelist=ترى أمامك رجلاً طويل القامة يرتدي درع الحرس الملكي: والدك الراحل. المشهد أشبه بذكرى، لكن التفاصيل مختلفة. النظرة الحنونة في عينيه هي نفسها التي تتذكرها، لكن وجهه مُنهكٌ بفعل سنوات لم يُكتب له أن يعيشها. يمدّ إليك سيفه العظيم المسحور لتأخذه
actors.mobs.npcs.vaultmirror.scene_cleric=You see an opened reliquary coffer in a brightly lit chapel, containing the _holy tome_. The scene is almost like a memory, but the details are different. You never took the reliquary out of storage, only the tome itself. The divine energies radiating from the tome feel unusual too, as though it is channeling energy from a different source.
actors.mobs.npcs.vaultmirror.scene_final=You notice that the glass surface of the mirror is completely gone, there's nothing stopping you from reaching in and taking the item.
actors.mobs.npcs.vaultmirror.take=Take the Item
actors.mobs.npcs.vaultmirror.scene_take=عندما تمد يدك وتأخذ الشيء، يبقى المشهد كما هو، كما لو أن الشيء موجود في مكانين في وقت واحد.   تتلاشى الصورة في المرآة، ويبدو أن الشيء الذي في يدك ينبض بلطف بنفس إيقاع الأحرف الرونية حول المرآة.   أنت لست متأكدًا تمامًا مما حدث للتو، ولكن يبدو أن وجود العنصر مرتبط بالمرآة، وربما لن تتمكن من إخراجه من الخزنة
actors.mobs.npcs.vaultmirror.scene_nothing=You approach the mirror again but nothing happens. Its surface is smooth and solid, you can just barely see the reflection of your fingertips as you touch the glass.

actors.mobs.warlock.name=dwarf warlock
actors.mobs.warlock.bolt_kill=The shadow bolt killed you...
actors.mobs.warlock.desc=مع تحوّل اهتمامات الأقزام من الهندسة إلى الفنون السحرية، برز السحرة في المدينة. بدأوا بالسحر العنصري، لكن سرعان ما انتقلوا إلى علم الشياطين واستحضار الأرواح. استولى أقوى هؤلاء السحرة على عرش مدينة الأقزام، وسُمح لأتباعه بمواصلة ممارسة سحرهم المظلم، شريطة أن يتنازلوا عن إرادتهم الحرة له.   يمتلك هؤلاء السحرة سحراً تخريبياً قوياً، وهم قادرون على إعاقة سحر الترقية المطبق على معداتك مؤقتاً. وكلما زادت ترقية العنصر، زادت قوة تأثير هذا السحر علي

actors.mobs.wraith.name=شبح
actors.mobs.wraith.desc=A wraith is a vengeful spirit of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very hard to hit with a regular weapon.
actors.mobs.wraith.discover_hint=You can find this enemy anywhere in the dungeon.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The darkness pulls in closer...
actors.mobs.yogdzewa.hope=YOUR. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa.desc=يوغز إله قديم؛ وحش عظيم يمتد إلى عوالم البشر ويلتهمها ليغذي نموه اللامتناهي. لا بد أن الأقزام قد لفتوا انتباه هذا الرعب الكوني أثناء تلاعبهم بالسحر الأسود، وهم يحاولون احتواءه منذ ذلك الحين.   ينحدر يوغزمن بُعدٍ من الفوضى السحرية الخام، ولا يستطيع أن يُظهر شكله الحقيقي في هذا العالم. بدلاً من ذلك، خلق صوراً رمزية واستدعى أتباعاً شيطانيين لتنفيذ أوامره هنا.   تُشكّل هذه العين العملاقة مركز قوة يوغ-دزيوا في هذا العالم. ورغم أن العين نفسها ثابتة، إلا أنها قادرة على إطلاق أشعة قوية من السحر الشيطاني واستدعاء مجموعة متنوعة من الأتباع لمساعدتها
actors.mobs.yogdzewa.desc_spawners=You can feel waves of demonic energy radiating to the eye from the floors above. Something you left alive up there must be funneling power back into Yog-Dzewa. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=These tiny spawn of Yog-Dzewa are simple minions that are easy to produce. While individually weak, they are summoned quickly and can become overwhelming in large numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by Yog-Dzewa

actors.mobs.yogfist.invuln_warn=The fist is invulnerable while near to the eye!
actors.mobs.yogfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yogfist.desc=This fist is an aspect of Yog-Dzewa's power. Fists are linked to the power of Yog-Dzewa, and will be protected from all damage when they are close to the eye.
actors.mobs.yogfist$burningfist.name=burning fist
actors.mobs.yogfist$burningfist.desc=هذه القبضة مصنوعة من سحر ناري فوضوي. ومع تحركها، تُشعل باستمرار الأرض المحيطة بها. كما أنها قادرة على إطلاق دفعات من القوة النارية، التي تنشر اللهب حيثما تصيب.   تتضاءل قدرة القبضة على نشر اللهب عند اقترابها من الماء، لكن حرارتها كبيرة لدرجة أن أي ماء حولها سيتبخر بعد فترة وجيزة!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=هذه القبضة مصنوعة من سحر الأرض الفوضوي. ومع حركتها، ستتسبب باستمرار في إنبات النباتات حولها. كما يمكنها إطلاق انفجارات أرضية مركزة تُحاصر هدفها في كروم وجذور سريعة النمو!   تستمد القبضة قوتها من هذه النباتات، وستقاوم الضرر بناءً على كمية النباتات الطويلة أو المتشعبة القريبة منها!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=هذه القبضة مُشكّلة من فساد حيّ. إنها كتلة هائلة من اللحم المتعفن قادرة على نشر سائل كاوٍ في القتال المباشر وغاز سام عن بُعد. والأسوأ من ذلك، أن كتلة القبضة الهائلة تجعلها تنزف بدلًا من أن تتلقى الضرر مباشرةً.   يمكن استخدام الماء لغسل الإفرازات، لكن القبضة قادرة أيضاً على امتصاص الماء لشفاء نفسها! إضافةً إلى ذلك، فإن إلحاق الضرر بالقبضة أثناء نزيفها سيؤدي إلى تجدد النزيف، لكن لن يتراكم
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=هذه القبضة مصنوعة من معدن حيّ. إنها كتلة هائلة من المعدن المتحرك، تمتلك هجمات قريبة المدى قوية، ويمكنها شل أهدافها عن بُعد. وبسبب كتلتها الهائلة، فإن أي ضرر يلحق بها سيتراكم مع مرور الوقت، بدلاً من أن يكون فورياً.   مع ذلك، فإن القبضة غير مرنة، ولا يمكنها التحرك في الممرات الضيقة. إضافةً إلى ذلك، ورغم أنها قد تتلقى الضرر ببطء، إلا أن الضرر المتراكم سيستمر في الازدياد إذا تعرضت القبضة للضرب عدة مرات
actors.mobs.yogfist$brightfist.name=bright fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports away in a flash of light that seriously blinds you!
actors.mobs.yogfist$brightfist.desc=هذه القبضة مصنوعة من طاقة ضوئية خالصة. وهي قادرة على إطلاق أشعة قوية حارقة في كل دورة! ستُعميك هذه الأشعة مؤقتًا بالإضافة إلى إلحاق ضرر بالغ بك. كما تستطيع القبضة أن تُغرق الساحة بضوء ساطع لفترة وجيزة لتتمكن من الفرار!   لكن القبضة لا تمتلك أي قدرات خاصة يمكنها استخدامها في نطاق الاشتباك المباشر.
actors.mobs.yogfist$darkfist.name=dark fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports away in a blast of darkness that extinguishes your light source!
actors.mobs.yogfist$darkfist.desc=هذه القبضة مصنوعة من طاقة الظلام الخالصة. وهي قادرة على إطلاق وابلات قوية من السحر الأسود في كل دور! ستُضعف هذه الوابلات مصدر الضوء لديك، بالإضافة إلى إلحاق ضرر جسيم. كما أن القبضة قادرة على إغراق الساحة في الظلام لفترة وجيزة للهروب!   لكن القبضة لا تمتلك أي قدرات خاصة يمكنها استخدامها في نطاق الاشتباك المباشر.


actors.char.kill=%s killed you...
actors.char.defeat=you defeated %s.
actors.char.def_verb=تفادي
actors.char.invulnerable=invulnerable
actors.char.immune=لايقهر
