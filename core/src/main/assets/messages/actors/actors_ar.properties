actors.hero.talent$aggressivebarriercooldown.desc=لقد استخدمت هذه الموهبة للتو, ويجب الانتظار قبل استخدامها مرة أخرى.\n\nالأدوار المتبقية: %s.
actors.hero.talent$liquidagilacctracker.name=رشاقة سائلة
actors.hero.talent$liquidagilacctracker.desc=سيحظى هجوم المبارزة القريب العادي بدقة إضافية.\n\nالأدوار المتبقية: %s.
