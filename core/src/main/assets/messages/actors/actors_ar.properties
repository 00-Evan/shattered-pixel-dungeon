##classes
actors.hero.heroclass.warrior=محارب
actors.hero.heroclass.warrior_desc_short=يصمد المحارب أمام الضرر الإضافي بفضل الحماية التي يمنحه _ختمه المكسور._ يمكن نقل الختم بين الأدرعة و_ينقل ترقياً واحداً فقط._
actors.hero.heroclass.warrior_desc=يبدأ المحارب بختم مكسور فريد يمنحه دفعة من الحماية عندما تنخفض صحته إلى أقل من النصف. يمكن نقل الختم بين الدروع, ويمكنه نقل ترقية واحدة معه.   يبدأ المحارب أيضًا بسيف قصير مهترئ, وثلاثة أحجار للرمي, ودرع من القماش, وقربة ماء, وحقيبة مخملية.   يقوم المحارب تلقائيًا بتحديد ما يلي:  لفائف تعريف الهوية  جرعات الشفاء  لفائف الغضب
actors.hero.heroclass.warrior_unlock=يُفتح المحارب تلقائياً.

actors.hero.heroclass.mage=ساحر
actors.hero.heroclass.mage_desc_short=الساحر خبير في السحر الغامض ويحمل _عصا سحرية_ أقوى من العصا العادية. يمكن _شحن العصا بأي عصا_ يعثر عليها الساحر.
actors.hero.heroclass.mage_desc=يبدأ الساحر بعصا فريدة, تُشحن أسرع بكثير من العصا السحرية, ولها شحنة إضافية. ويمكن تزويد هذه العصا بأي عصا سحرية يجدها الساحر في الزنزانة.   يبدأ الساحر أيضًا بعصا سحرية مدمجة في عصاه, ودرع من القماش, وقربة ماء, وحقيبة مخملية.   يقوم الساحر بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات اللهب السائل  لفائف الترقية
actors.hero.heroclass.mage_unlock=لفتح الساحر _استخدم لفافة ترقية لجعل عنصر أقوى._

actors.hero.heroclass.rogue=لص
actors.hero.heroclass.rogue_desc_short=يستطيع المحتال تفادي الأعداء والضرب من الخفاء باستخدام _عباءة الظلال._ كما _يكشف الأسرار والفخاخ_ من مسافة أكبر.
actors.hero.heroclass.rogue_desc=يبدأ المحتال بعباءة فريدة من نوعها تُسمى عباءة الظلال, والتي يمكنه استخدامها ليصبح غير مرئي حسب رغبته.   يستطيع المحتال اكتشاف الأسرار والفخاخ من مسافة أبعد.   يبدأ المحتال أيضًا بخنجر, وثلاثة سكاكين رمي, ودرع من القماش, وقربة ماء, وحقيبة مخملية.   يقوم برنامج Rogue بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات الاختفاء  لفائف الخرائط السحرية
actors.hero.heroclass.rogue_unlock=لفتح المحتال _نفّذ 10 هجمات مفاجئة في لعبة واحدة._

actors.hero.heroclass.huntress=صياده
actors.hero.heroclass.huntress_desc_short=الصيادة سيدة أسلحة الرمي وتملك _قوساً سحرياً_ بأسهم لا نهائية. كما تسير عبر العشب الطويل _دون دوسه._
actors.hero.heroclass.huntress_desc=تبدأ الصيادة بقوس روحي فريد من نوعه, والذي يمكنه إطلاق عدد لا نهائي من الأسهم المستحضرة.   تستطيع الصيادة التنقل عبر العشب الطويل دون أن تدوسه.   تبدأ الصيادة أيضًا بقفازات مرصعة, ودروع قماشية, وقربة ماء, وحقيبة مخملية.   تقوم الصيادة بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات رؤية العقل  لفائف التهويدة
actors.hero.heroclass.huntress_unlock=لفتح الصيادة _اضرب الأعداء بأسلحة الرمي 10 مرات في لعبة واحدة._

actors.hero.heroclass.duelist=المبارزة
actors.hero.heroclass.duelist_desc_short=المبارزة سيدة سلاح تستخدم سلاحها لتفعيل _قدرة سلاح خاصة._ هذه القدرة الخاصة _تختلف لكل سلاح._
actors.hero.heroclass.duelist_desc=يبدأ المبارز بسيف رابير فريد من نوعه يتمتع بقدرة خاصة يتم إعادة شحنها بمرور الوقت.   كل سلاح في اللعبة له قدرة خاصة مختلفة يمكن للمبارز استخدامها.   يبدأ المبارز أيضًا بـ _مسمارين للرمي_, ودرع من القماش, وقربة ماء, وحقيبة مخملية.   يقوم المبارز بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات القوة  لفائف صورة معكوسة
actors.hero.heroclass.duelist_unlock=لفتح المبارزة _جهّز سلاحاً من الدرجة 2 أو أعلى دون خصم قوة._

actors.hero.heroclass.cleric=الكاهن
actors.hero.heroclass.cleric_desc_short=الكاهن ساحر إلهي يستخدم _كتابه المقدس_ الفريد لتوجيه السحر الإلهي. يمكنه _تعلم وترقية التعاويذ_ عبر المواهب.
actors.hero.heroclass.cleric_desc=يبدأ الكاهن بكتاب مقدس فريد من نوعه, والذي يمكنه استخدامه لإلقاء تعاويذ متنوعة.   تتركز معظم مواهب الكاهن حول تعلم التعاويذ أو تطويرها.   يبدأ الكاهن أيضًا بعصا, ودرع من القماش, وقربة ماء, وحقيبة مخملية.   يقوم رجل الدين بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات النقاء  لفائف إزالة اللعنة
actors.hero.heroclass.cleric_unlock=لفتح الكاهن _نظّف تماماً لعنة أي قطعة من المعدات الملعونة._

actors.hero.herosubclass.berserker=بربري
actors.hero.herosubclass.berserker_short_desc=يُراكم _المشتبك_ الغضب عندما يتلقى ضرراً. يزيد الغضب من ضرره ويمكن تفعيله عند 100% لمنح حماية إضافية.
actors.hero.herosubclass.berserker_desc=يكتسب المحارب الشرس غضباً كلما تلقى ضرراً جسدياً, بما في ذلك الضرر الذي يحجبه درعه! يتلاشى الغضب تدريجياً مع مرور الوقت, ولكنه يتلاشى ببطء أكبر إذا كانت نقاط صحته منخفضة.   يمكن أن يتسبب الغضب في زيادة ضرر المحارب بنسبة تصل إلى 50%. عند بلوغه أقصى درجات الغضب, يمكنه أن ينفجر غضبًا, مكتسبًا دفعة من الدروع, ويحافظ على غضبه طالما بقي لديه درع. تتناسب قوة الدرع طرديًا مع مستوى درع المحارب, ويمكن تعزيزها بشكل كبير إذا كانت صحته منخفضة. يحتاج المحارب إلى وقت للتعافي بعد نوبة غضبه
actors.hero.herosubclass.gladiator=مصارع
actors.hero.herosubclass.gladiator_short_desc=يُراكم _المبارز_ الكومبو عند نجاح هجماته. يمكنه إنفاق الكومبو لاستخدام قدرات فريدة.
actors.hero.herosubclass.gladiator_desc=يكتسب المصارع نقطة واحدة من سلسلة الضربات المتتالية في كل مرة ينجح فيها بهجوم باستخدام سلاح يدوي أو سلاح رمي. إذا لم ينجح المصارع في الهجوم خلال 5 أدوار (15 دورًا بعد القضاء على خصم), تُعاد سلسلة ضرباته المتتالية إلى الصفر.   أثناء قيامه ببناء سلسلة الضربات, يمكن للمصارع استخدام مجموعة متنوعة من القدرات التي تضمن إصابة الهدف:  الضربة المزدوجة: تدفع العدو للخلف, وتحافظ على سلسلة الضربات.  الضربة الرباعية: تُلحق ضررًا بناءً على قوة الدرع  6- كومبو: صدّ, يحافظ على الكومبو  8 ضربات متتالية: إلحاق الضرر بالهدف والأعداء القريبين  10 ضربات متتالية: هاجم مرة واحدة لكل ضربة متتالية
actors.hero.herosubclass.battlemage=ساحر الحرب
actors.hero.herosubclass.battlemage_short_desc=يُنشئ _ساحر القتال_ تأثيرات إضافية عند القتال من قريب بعصاه. تعتمد هذه التأثيرات على العصا التي شُحنت بها عصاه.
actors.hero.herosubclass.battlemage_desc=يكتسب الساحر المحارب تأثيرًا إضافيًا كلما هاجم بعصاه في القتال المباشر, كما لو كانت عصاه تحمل تعويذة إضافية. وتعتمد هذه التأثيرات على نوع العصا السحرية التي تحملها عصاه, فلكل عصا تأثيرها الخاص. إضافةً إلى تأثيرات العصا السحرية, تكتسب عصا الساحر المحارب أيضًا نصف شحنة عند استخدامها في الهجوم.
actors.hero.herosubclass.warlock=ساحراسود
actors.hero.herosubclass.warlock_short_desc=_المحارب الساحر_ لديه فرصة لوضع علامة روحية على الأعداء بعصاه. وينتدل كلما ألحق بأحد الأعداء المعلمين ضرر جسدي.
actors.hero.herosubclass.warlock_desc=يملك الساحر فرصة لإلحاق علامة روحية بالشخصيات عند استخدام العصي السحرية عليها. وتزداد فرصة إلحاق العلامة الروحية ومدتها مع مستوى العصا.   عندما يتم وسم العدو بعلامة الروح, سيقوم الساحر بشفاء نقطتي صحة مقابل كل 5 نقاط ضرر يلحقها به, ولكن فقط بالهجمات من الأسلحة القريبة أو المقذوفة, وليس من العصي السحرية!
actors.hero.herosubclass.assassin=مغتال
actors.hero.herosubclass.assassin_short_desc=_القاتل_ يستطيع تجهيز ضربة قاتلة وهو مختفي. وكلما طال انتظاره, أصبح الهجوم أقوى.
actors.hero.herosubclass.assassin_desc=يستعد القاتل لضربته التالية عندما يصبح غير مرئي. كلما طالت فترة استعداده, زادت قوة هجومه التالي. يستمر الاستعداد لمدة تصل إلى 9 أدوار.   بعد الاستعداد, يلحق القاتل ضررًا إضافيًا في هجومه التالي, ويمكنه الانتقال الفوري إلى هدفه, بل ويمكنه حتى قتل الأعداء الضعفاء على الفور.
actors.hero.herosubclass.freerunner=العداء السريع
actors.hero.herosubclass.freerunner_short_desc=_العداء الحر_ يتراكم لديه زخم أثناء جريه, ويمكن استخدامه لبدء الجري الحر. يمنحه هذا سرعة وتفاديا إضافيا لفترة قصيرة.
actors.hero.herosubclass.freerunner_desc=أثناء تحرك العداء الحر, يكتسب زخمًا متراكمًا. يمكنه اكتساب ما يصل إلى 10 نقاط زخم بعد الجري لعشر دورات, لكنه يفقدها بسرعة إذا توقف عن الحركة. يستطيع العداء الحر استخدام زخمه لبدء الجري الحر, لمدة دورتين لكل نقطة زخم.   عند ممارسة رياضة الجري الحر, يتحرك اللاعب بسرعة مضاعفة, ويكتسب قدرة إضافية على المراوغة تتناسب مع مستواه. بعد انتهاء الجري الحر, هناك فترة انتظار قبل أن يتمكن من استعادة الزخم مرة أخرى
actors.hero.herosubclass.sniper=قناص
actors.hero.herosubclass.sniper_short_desc=_القناص_ يستطيع اختراق الدرع بهجماتها بعيدة المدى. وبعد الضرب بسلاح رمي, يمكنها متابعة ذلك بهجوم خاص من قوسها.
actors.hero.herosubclass.sniper_desc=القناصة بارعة في القتال عن بُعد, وتخترق هجماتها دروع الأعداء. عندما تهاجم عدوًا بسلاح يُرمى, تضع عليه علامة قناص, مما يسمح لها بمتابعة الهجوم بهجوم خاص من قوسها. يختلف هذا الهجوم الخاص باختلاف مستوى تطوير قوسها.   يُطلق القوس غير المُعزز سهماً سريعاً يُلحق ضرراً أقل, ولكنه يُطلق فوراً. أما القوس السريع, فيُطلق وابلاً من ثلاثة أسهم تُلحق ضرراً أقل, مع إمكانية تفعيل التعويذات, ويستغرق دوراً واحداً لإطلاقها. بينما يُطلق القوس المُعزز للضرر سهماً دقيقاً مضمون الإصابة, يُلحق ضرراً إضافياً بناءً على المسافة, ويستغرق دورين لإطلاقه
actors.hero.herosubclass.warden=حارس
actors.hero.herosubclass.warden_short_desc=_الحارس_ يستطيع الرؤية عبر الأعشاب الطويلة ويحصل على مؤثرات إضافية عندما تزرع البذور وتسحق النباتات.
actors.hero.herosubclass.warden_desc=تتمتع الحارسة بعلاقة وثيقة مع الطبيعة, مما يمنحها مجموعة متنوعة من التأثيرات الإضافية المتعلقة بالعشب والنباتات. فهي قادرة على الرؤية عبر العشب الطويل والمتجعد كما لو كان فراغًا.   تُنبت الحارسة العشب حول أي بذرة ترميها أو تزرعها, وتكتسب تأثيرات خاصة عند دوسها للنباتات. تحل هذه التأثيرات الخاصة محل تأثيرات النباتات العادية, مما يعني أنه لا يوجد نبات ضار لها عند دوسه
actors.hero.herosubclass.champion=المتميز
actors.hero.herosubclass.champion_short_desc=_المتميز_ يستطيع استخدام سلاحين ويحصل على شحنات سلاح أكثر. وتستخدم هجماتها العادية سلاحها الأساسي, لكنها تستطيع تبديل السلاح واستخدام قدرة أي منهما.
actors.hero.herosubclass.champion_desc=البطلة بارعة في استخدام أسلحة الاشتباك المباشر, ويمكنها تجهيز سلاح ثانوي بالإضافة إلى سلاحها الأساسي. تستخدم في هجماتها العادية سلاحها الأساسي, ولكن يمكنها تبديل سلاحها الأساسي فورًا واستخدام قدرات أيٍّ من السلاحين.   كما أنها تحصل على شحنتين إضافيتين لقدرة السلاح القصوى وسرعة إعادة شحن قدرة السلاح بنسبة 50%.
actors.hero.herosubclass.monk=راهب
actors.hero.herosubclass.monk_short_desc=_الراهب_ يتراكم لديه طاقة أثناء القتال. ويمكن صرف هذه الطاقة على مجموعة متنوعة من القدرات الفريدة.
actors.hero.herosubclass.monk_desc=الراهبة بارعة في فنون القتال الجسدي. ومع هزيمتها للأعداء, تكتسب طاقةً يمكن استخدامها في مجموعة متنوعة من القدرات الدفاعية والخدمية. هذه الطاقة لا تتلاشى بمرور الوقت, ولكن لها حد أقصى يعتمد على مستوى الراهبة.   1 الطاقة: اضرب بسرعة بالقبضات  2 الطاقة: التركيز لتفادي الهجوم التالي  3 طاقة: اندفاع فوري بالقرب من المكان  4 طاقة: ركل العدو بعيدًا  5- الطاقة: التأمل لتطهير الحالات واستعادة شحنة العصا والأداة
actors.hero.herosubclass.priest=الناسك
actors.hero.herosubclass.priest_short_desc=_الناسك_ يحصل على تعويذات جديدة بعيدة المدى ونسخة معززة من نور الهداية.
actors.hero.herosubclass.priest_desc=يكتسب الكاهن مجموعة متنوعة من التعاويذ الجديدة والمطورة التي تركز على القتال عن بعد والتناغم مع العناصر السحرية.   يستطيع الكاهن إلقاء تعويذة "الضوء الهادي" مجانًا مرة واحدة كل 50 دورة, ويضيء الأعداء المستهدفين مباشرة بأي من تعاويذه, ويمكنه استهلاك تأثير الإضاءة السلبي مع الحلفاء والعصي وبعض القطع الأثرية للحصول على ضرر إضافي يساوي مستواهم + 5.   يحصل الكاهن أيضًا على تعويذة "الإشعاع", التي تبدد الظلام وتؤثر على جميع الأعداء المرئيين, مما يؤدي إلى تشغيل وتطبيق الإضاءة وصعقهم لفترة وجيزة على حساب شحنتين
actors.hero.herosubclass.paladin=السامر
actors.hero.herosubclass.paladin_short_desc=_السامر_ يحصل على تعويذات جديدة قصيرة المدى ونسخ معززة من السلاح المقدس والحماية.
actors.hero.herosubclass.paladin_desc=يكتسب الفارس مجموعة متنوعة من التعاويذ الجديدة والمطورة التي تركز على القتال المباشر والتناغم مع الأسلحة والدروع.   تمنح تعويذات "السلاح المقدس" و"الحماية المقدسة" الخاصة بالفارس مكافآت أكبر, ولم تعد تتجاوز التعويذات والرموز الموجودة, ويمكن تمديدها عن طريق إلقاء تعويذات أخرى.   كما يحصل الفارس على تعويذة "الضربة القاضية", والتي تتيح له تنفيذ ضربة قريبة مضمونة مع ضرر إضافي وقوة سحرية.

##talents
actors.hero.talent$provokedangertracker.name=غضب مستثار
actors.hero.talent$provokedangertracker.desc=فقد المحارب حمايته للتو, وسيسبب هجومه الجسدي القادم ضرر إضافي.\n\nالأدوار المتبقية: %s.
actors.hero.talent$lingeringmagictracker.name=سحر مستمر
actors.hero.talent$lingeringmagictracker.desc=استخدم الساحر عصا سحرية للتو, وسيسبب هجومه الجسدي القادم ضرر إضافي.\n\nالأدوار المتبقية: %s.
actors.hero.talent$followupstriketracker.name=ضربة متابعة
actors.hero.talent$followupstriketracker.desc=هاجمت الصيادة أحد الأعداء بسلاح رمي للتو, وسيزداد ضرر هجومها القريب القادم ضد الهدف نفسه.\n\nالأدوار المتبقية: %s.
actors.hero.talent$patientstriketracker.name=ضربة متأنية
actors.hero.talent$patientstriketracker.desc=أمضت المبارزة دورة في الانتظار للتو, وسيسبب هجومها القريب القادم ضرر إضافي.
actors.hero.talent$improvisedprojectilecooldown.name=فترة تبريد المقذوفات المستعجلة
actors.hero.talent$improvisedprojectilecooldown.desc=لقد استخدمت هذه الموهبة للتو, ويجب الانتظار قبل استخدامها مرة أخرى.\n\nالأدوار المتبقية: %s.
