###blobs
actors.blobs.blizzard.name=blizzard
actors.blobs.blizzard.desc=A blizzard is swirling here.

actors.blobs.confusiongas.name=confusion gas
actors.blobs.confusiongas.desc=A cloud of confusion gas is swirling here.

actors.blobs.electricity.name=كهرباء
actors.blobs.electricity.desc=A field of electricity is sparking brightly here.
actors.blobs.electricity.rankings_desc=صعق كهربي
actors.blobs.electricity.ondeath=You were shocked to death...

actors.blobs.fire.name=نار
actors.blobs.fire.desc=A fire is raging here.

actors.blobs.foliage.name=foliage
actors.blobs.foliage.desc=Shafts of light pierce the gloom of the underground garden.

actors.blobs.freezing.name=freezing air
actors.blobs.freezing.desc=The air is unnaturally frigid here.

actors.blobs.goowarn.name=dark energy
actors.blobs.goowarn.desc=Specks of dark energy are swarming here!

actors.blobs.inferno.name=inferno
actors.blobs.inferno.desc=An inferno is raging here.

actors.blobs.paralyticgas.name=paralytic gas
actors.blobs.paralyticgas.desc=A cloud of paralytic gas is swirling here.

actors.blobs.regrowth.name=regrowth

actors.blobs.sacrificialfire.name=sacrificial fire
actors.blobs.sacrificialfire.desc=There is an altar here with a sacrificial fire burning atop it. Any creature that's killed here will be consumed as an offering to the spirits of the dungeon.\n\nPerhaps a reward will be given if enough sacrifices are made?
actors.blobs.sacrificialfire.worthy=The fire consumes your offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The fire consumes your offering, but doesn't change.
actors.blobs.sacrificialfire.reward=The fire flares and then dissipates, leaving a reward behind!

actors.blobs.smokescreen.name=smokescreen
actors.blobs.smokescreen.desc=A cloud of thick black smoke is swirling here.

actors.blobs.stenchgas.name=stench gas
actors.blobs.stenchgas.desc=A cloud of fetid stench is swirling here.

actors.blobs.stormcloud.name=storm clouds
actors.blobs.stormcloud.desc=A cloud of billowing water vapor is swirling here.

actors.blobs.toxicgas.name=toxic gas
actors.blobs.toxicgas.desc=A greenish cloud of toxic gas is swirling here.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=You died from the toxic gas...

actors.blobs.corrosivegas.name=corrosive gas
actors.blobs.corrosivegas.desc=A cloud of deadly caustic gas is swirling here.

actors.blobs.waterofawareness.name=water of awareness
actors.blobs.waterofawareness.procced=As you take a sip, you feel knowledge pour into your mind.
actors.blobs.waterofawareness.desc=Power of knowledge radiates from the water of this well. Drinking from the well will fully identify all equipped items, identify curses on all items in your inventory, and reveal all items on the current floor.

actors.blobs.waterofhealth.name=water of health
actors.blobs.waterofhealth.procced=As you take a sip, you feel your wounds heal completely.
actors.blobs.waterofhealth.desc=Power of health radiates from the water of this well. Drinking from this well will heal your wounds, satisfy hunger, and cleanse curses on any worn items.

actors.blobs.web.name=spider web
actors.blobs.web.desc=A thick web is covering everything here. Anything that touches or is thrown through the web will break it, but will also be stuck in place.



###buffs
actors.buffs.adrenaline.name=ادرينالين
actors.buffs.adrenaline.desc=A surge of physical power, adrenaline enhanced both attack and movement speed.\n\nAdrenaline allows its target to run at 2x speed, and attack at 1.5x speed.\n\nTurns remaining: %s.

actors.buffs.adrenalinesurge.name=تعزيز القوه
actors.buffs.adrenalinesurge.desc=A surge of great might, but sadly not permanent.\n\nStrength boost: +%d.\nTurns until boost weakens: %s.

actors.buffs.amok.name=همج
actors.buffs.amok.desc=Amok causes a state of great rage and confusion in its target.\n\nWhen a creature is amoked, they will attack whatever is near them, whether they be friend or foe.\n\nTurns of amok remaining: %s.

actors.buffs.arcanearmor.name=arcane armor
actors.buffs.arcanearmor.desc=A thin shield is surrounding you, blocking some of the damage from magical attacks.\n\nYour magical armor is currently boosted by: 0-%d.\n\nTurns until arcane armor weakens: %s.

actors.buffs.artifactrecharge.name=artifact recharging
actors.buffs.artifactrecharge.desc=Energy is coursing through you, increasing the rate your equipped artifacts charge.\n\nEach artifact is affected a little differently, but they will all gain charge much faster than normal.\n\nTurns remaining: %s.

actors.buffs.ascensionchallenge.name=amulet's curse
actors.buffs.ascensionchallenge.desc=بطريقة ما، يحافظ يوغز على نفوذه في هذا العالم من خلال التميمة، ويحاول إيقاف صعودك!   قوة يوغز تجعل الزنزانة أكثر خطورة، إذ تزيد من عدد الأعداء وتجعلهم أقوى! ستستمر هذه القوة في التزايد إن لم تُضبط، ويمكن إضعافها بهزيمة الأعداء الذين تم تعزيزهم بقوة يوغز
actors.buffs.ascensionchallenge.desc_clear=The dark energy radiating from the amulet has been weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The amulet is currently _calling out to distant enemies,_ alerting them to your position.
actors.buffs.ascensionchallenge.desc_haste=The amulet is currently _hastening distant enemies,_ letting them reach you faster!
actors.buffs.ascensionchallenge.desc_slow=The amulet is currently _slowing you down,_ and negating speed boosting effects!
actors.buffs.ascensionchallenge.desc_damage=The energy from the amulet has gotten so strong that it's _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The amulet begins calling out to distant enemies.
actors.buffs.ascensionchallenge.haste=The amulet begins hastening distant enemies!
actors.buffs.ascensionchallenge.slow=The amulet starts to feel like a lead weight in your inventory!
actors.buffs.ascensionchallenge.damage=The amulet begins radiating dark energy. It burns!
actors.buffs.ascensionchallenge.weaken_info=The amulet's curse can be weakened by defeating more enemies.
actors.buffs.ascensionchallenge.weaken_info_no_kills=If you defeat enemies the amulet's curse will weaken!
actors.buffs.ascensionchallenge.weaken=You can feel the amulet's curse weaken slightly.
actors.buffs.ascensionchallenge.break=You take a moment to catch your breath and feel your wounds begin to close!
actors.buffs.ascensionchallenge.almost=You feel Yog's grip on the amulet begin to weaken, you're almost there!
actors.buffs.ascensionchallenge.on_kill=The dark energy consumes you...

actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=جلدك متصلب، وملمسه خشن وصلب كالقشرة.   يزيد الجلد المقوى من فعالية درعك، مما يسمح لك بالدفاع بشكل أفضل ضد الهجمات الجسدية.   تم زيادة درعك حاليًا بمقدار: 0- %d .  يتحول حتى يضعف غلاف اللحاء: %s .   إذا تلقيت جلد اللحاء من مصادر متعددة، فسيتم تطبيق الأقوى منها فقط.

actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all damage.\n\nThe barrier will take damage for whatever it is protecting so long as there is shielding left. The shielding will also slowly decay over time.\n\nShielding remaining: %d.

actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=مرهق
actors.buffs.berserk.recovering=استعاده
actors.buffs.berserk.angered_desc=تُعزز شدة إصابات المحارب البربري قوة ضرباته. ومع تلقيه للأذى الجسدي، يزداد غضبه، مما يمنحه ضررًا إضافيًا. ويُحتسب الضرر الذي يحجبه الدرع ضمن تراكم الغضب.   سيتلاشى الغضب بمرور الوقت. كلما انخفضت صحة المحارب، طالت مدة استمراره.   عند 100 %% عند الغضب، يستطيع المحارب الهائج أن ينتابه شعور بالهياج، مما يمنحه درعًا يعتمد على مستوى درعه ومستوى صحته المفقودة. أثناء الهياج، يتلاشى درعه تدريجيًا، وعندما ينفد، سيتعين عليه الراحة قبل أن يستعيد شعوره بالهياج مجددًا.   الغضب الحالي: _ %1$.0f %% _  _+ %2$.0f %% _ ضرر   درع بيرسيرك عند مستوى الدرع ونقاط الصحة الحالية: _ %3$d _
actors.buffs.berserk.berserk_desc=يتلاشى الخوف والشك، ولا يبقى سوى الغضب. في هذه الحالة، يصبح المحارب البربري قويًا للغاية، حيث يُلحق ضررًا قدره +50 %% الضرر واكتساب دروع إضافية، ولكن أيضًا فقدان الدروع في كل دور.   عندما تنخفض جميع دروعه إلى الصفر، سينتهي الهياج.   بعد الغضب، سيحتاج المحارب إلى التعافي قبل أن يتمكن من بناء الغضب مرة أخرى.   الدرع المتبقي: %d
actors.buffs.berserk.recovering_desc=Inner strength has its limits. The Berserker must rest before using his rage again.\n\nWhile recovering the Berserker does not build any rage from taking damage.
actors.buffs.berserk.recovering_desc_turns=Turns until recovered: _%d_
actors.buffs.berserk.recovering_desc_levels=Levels until recovered: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.action_name=هائج
actors.buffs.berserk.no_seal=You need your broken seal to berserk!

actors.buffs.bleeding.name=نزيف
actors.buffs.bleeding.ondeath=You bled to death...
actors.buffs.bleeding.heromsg=You are bleeding!
actors.buffs.bleeding.rankings_desc=Bled to Death
actors.buffs.bleeding.desc=That wound is leaking a worrisome amount of blood.\n\nBleeding causes damage every turn. Each turn the damage decreases by a random amount, until the bleeding eventually stops.\n\nCurrent bleed damage: %d.

actors.buffs.bless.name=مباركه
actors.buffs.bless.desc=A great burst of focus, some say it is inspired by the gods.\n\nBlessing increases accuracy and evasion by 25%%, making the blessed much more effective in combat.\n\nTurns of bless remaining: %s.

actors.buffs.blindness.name=اعمي
actors.buffs.blindness.heromsg=You are blinded!
actors.buffs.blindness.desc=يُحوّل العمى العالم المحيط إلى ضباب داكن.   عندما يُصاب الشخص بالعمى، يتقلص مدى رؤيته إلى مربع واحد، مما يجعل الهجمات بعيدة المدى عديمة الجدوى، ويُسهّل عليه فقدان أثر الأعداء البعيدين. إضافةً إلى ذلك، لا يستطيع البطل الأعمى قراءة المخطوطات أو الكتب.   عدد دورات العمى المتبقية: %s .

actors.buffs.buff.heromsg=

actors.buffs.burning.name=يحترق
actors.buffs.burning.heromsg=You catch fire!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=You burned to death...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=قلما يوجد شيء أكثر إيلاماً من أن تغمرك النيران.   ستُلحق النار ضرراً في كل دورة حتى تُطفأ بالماء أو تنطفئ. يمكن إطفاء النار بالوقوف في الماء، أو برذاذ جرعة مُحطِّمة.   بالإضافة إلى ذلك، قد يتسبب الحريق في اشتعال التضاريس أو الأشياء القابلة للاشتعال التي يلامسها.   عدد دورات الاحتراق المتبقية: %s .

actors.buffs.championenemy.warn=You sense a deadly presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions deal 25% more melee damage, ignite enemies they attack, are immune to fire, and spread fire around them as they die. They can't spread fire onto water however.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions deal 25% more melee damage and have +3 attack range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less damage and are completely immune to magical effects.
actors.buffs.championenemy$giant.name=giant champion
actors.buffs.championenemy$giant.desc=Giant champions take 75% less damage and have +1 attack range, but cannot move through enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions have 4x accuracy and evasion.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions gain a steadily increasing bonus to accuracy, evasion, physical damage, and a reduction to damage taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%

actors.buffs.charm.name=سحر الفتن
actors.buffs.charm.heromsg=You are charmed!
actors.buffs.charm.cant_attack=You are charmed by that enemy and can't attack them.
actors.buffs.charm.desc=التعويذة هي سحر تلاعب يمكنه أن يجعل الأعداء يعشقون بعضهم البعض مؤقتًا.   الشخصيات المتأثرة بالسحر لا تستطيع مهاجمة العدو المسحور مباشرةً، لكن مهاجمة أهداف أخرى تبقى ممكنة. يُقلل ألم الصدمة من مدة السحر.   بعض اللحظات الساحرة المتبقية: %s

actors.buffs.chill.name=مثلج
actors.buffs.chill.freezes=%sتجمد
actors.buffs.chill.desc=لم يتجمد تماماً، لكنه لا يزال بارداً جداً.   تُنفّذ الأهداف المُجمدة جميع الإجراءات ببطء أكبر، وذلك بحسب عدد الأدوار المتبقية في التأثير. وفي أسوأ الأحوال، يُعادل هذا إبطاء الحركة.   عدد لفات التبريد المتبقية: %1$s .  يتم تقليل السرعة عن طريق: %2$s %%

actors.buffs.combo.name=كومبو
actors.buffs.combo.action_name=combo attack
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.bad_target=You must target an enemy in attack range.
actors.buffs.combo.prompt=Select a target to attack.
actors.buffs.combo.desc=يكتسب المصارع زخمًا مع كل ضربة ناجحة. تزيد كل هجمة عداد الضربات المتتالية بمقدار واحد، لكن التأخر في الضربات يُعيد عداد الضربات المتتالية إلى الصفر. وطالما أن المصارع لديه سلسلة ضربات متتالية، فإن أي درع لديه من ختمه المكسور لن يبدأ بالتلاشي.   يُتيح بناء سلسلة الضربات المتتالية تنفيذ هجمات متتالية خاصة لا يمكن تفويتها! يتم فتح هجمة مختلفة عند الوصول إلى 2، 4، 6، 8، و10 ضربات متتالية. بعض الحركات تُعيد ضبط سلسلة الضربات المتتالية، وبعضها لا، ولكن لا يمكن استخدام كل حركة إلا مرة واحدة في كل جلسة ضربات متتالية.   التشكيلة الحالية: %1$d .   يستمر في التناوب حتى يخسر سلسلة الضربات المتتالية: %2$s .
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an enemy back 2 tiles, but deals no damage and cannot knock into pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an enemy back _3 tiles, inflicts vertigo, and can knock into pits,_ but deals no damage. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=Deals %d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*20%%) of your damage blocking power as bonus damage. Resets combo when used.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next attack within 1 turn when activated, and instantly retaliates to it. Resets combo if nothing is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ within 1 turn when activated, and instantly retaliates to them. Resets combo if nothing is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=Deals %d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and deals %2$d%% (combo*25%%) damage to the primary target, and half that damage to all other enemies in a 7x7 AOE. Resets combo when used.
actors.buffs.combo$combomove.fury.name=فروي
actors.buffs.combo$combomove.fury.desc=Hits an enemy once for each combo you have, each hit deals 60% damage and can trigger enchantments. Resets combo when used.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an enemy once for each combo you have, each hit deals 60%% damage and can trigger enchantments. Resets combo when used.

actors.buffs.corruption.name=ملعون
actors.buffs.corruption.desc=يتغلغل الفساد في جوهر الكائن، فيشوهه عن طبيعته السابقة.   ستهاجم المخلوقات الفاسدة حلفاءها، وتتجاهل أعداءها السابقين. الفساد مُدمّر أيضاً، وسيؤدي تدريجياً إلى استسلام هدفه.   الفساد دائم، وآثاره لا تنتهي إلا بالموت.

actors.buffs.cripple.name=شلل
actors.buffs.cripple.heromsg=You are crippled!
actors.buffs.cripple.desc=You're pretty sure legs aren't meant to bend that way.\n\nCrippled halves movement speed, making moving a tile usually take two turns instead of one.\n\nTurns of cripple remaining: %s.

actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=You are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nWhile dazed, accuracy and evasion are reduced by 50%%, making both landing and evading blows much harder.\n\nTurns of daze remaining: %s.

actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=Your equipment feels weaker!
actors.buffs.degrade.desc=السحر الأسود القوي يستنزف القوة التي طبقتها لفائف الترقية على معداتك!   حتى بعد تدهور مستوى المعدات المطورة، ستُعامل كما لو كانت بمستوى أدنى مما هي عليه في الواقع. كل ترقية بعد +3 تصبح أضعف بشكل كبير من سابقتها. ستتغير أوصاف عناصرك لتعكس مستوى قوتها المنخفض.   لا يؤثر التدهور على متطلبات القوة، أو شحنات العصا، أو متانة الأسلحة المرمية، أو القطع الأثرية.   عدد دورات التدهور المتبقية: %s استخدام لفافة الترقية أو إزالة اللعنة سينهي التدهور فورًا

actors.buffs.doom.name=doomed
actors.buffs.doom.desc=It's hard to keep going when it seems like the universe wants you dead.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end in death.

actors.buffs.dread.name=dread
actors.buffs.dread.desc=رعب عظيم لدرجة أنه سيدفع هدفه إلى الفرار من الزنزانة بالكامل!   ستفرّ المخلوقات المتأثرة بالرعب من خصمها بسرعة فائقة، وستختفي من الزنزانة تمامًا بمجرد أن تغيب عن الأنظار. الأعداء الذين يُهزمون بهذه الطريقة يمنحون نصف نقاط الخبرة ولا يسقطون أي عناصر. صدمة الألم ستُقلل من مدة الرعب.   ما تبقى من لحظات الرعب: %d .

actors.buffs.drowsy.name=النعس
actors.buffs.drowsy.desc=A magical force is making it difficult to stay awake, after a few turns, the target will fall into a deep magical sleep.\n\nThe hero can resist drowsiness by taking damage or by being at full health.\n\nTurns until sleep: %s.

actors.buffs.earthimbue.name=imbued with earth
actors.buffs.earthimbue.desc=You are imbued with the power of earth!\n\nAll physical attacks will shift the earth under the enemy, crippling them for a short time.\n\nTurns of earth imbue remaining: %s.

actors.buffs.enhancedrings.name=enhanced rings
actors.buffs.enhancedrings.desc=The Rogue's recently used artifact is empowering his rings, granting them +1 level.\n\nTurns remaining: %s.

actors.buffs.fireimbue.name=imbued with fire
actors.buffs.fireimbue.desc=You are imbued with the power of fire!\n\nAll physical attacks will have a chance to light enemies ablaze. Additionally, you are completely immune to the effects of fire.\n\nTurns of fire imbue remaining: %s.

actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=You are somehow able to see the layout of surrounding terrain with your mind.\n\nWhile under the effect of foresight all tiles in a wide radius are revealed to you, including any secret traps or doors.\n\nTurns of foresight remaining: %s.

actors.buffs.frost.name=متجمد
actors.buffs.frost.freezes=%sتجمد
actors.buffs.frost.desc=لا ينبغي الخلط بين هذا وبين التجميد الكامل، فهذا التجميد الأقل ضرراً يغلف الهدف ببساطة بالجليد.   يعمل التجميد بشكل مشابه للشلل، مما يجعل من المستحيل على الهدف القيام بأي حركة. على عكس الشلل، يزول التجميد فورًا إذا تعرض الهدف لأي ضرر، حيث يتحطم الجليد.   عدد دورات التجميد المتبقية: %s .

actors.buffs.frostimbue.name=imbued with frost
actors.buffs.frostimbue.desc=You are imbued with icy power!\n\nAll physical attacks will steadily stack chill on enemies. Additionally, you are completely immune to the cold.\n\nTurns of frost imbue remaining: %s.

actors.buffs.fury.name=غاضب
actors.buffs.fury.heromsg=You become furious!
actors.buffs.fury.desc=You are angry, enemies won't like you when you're angry.\n\nA great rage burns within you, increasing the damage you deal with physical attacks by 50%%.\n\nThis rage will last as long as you are injured below 50%% health.

actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some strange force is encasing you in a thin protective barrier, blocking out all harmful airborne effects.\n\nYou are immune to all area-bound effects while this barrier lasts.\n\nTurns of immunity remaining: %s.

actors.buffs.gravitychaostracker.name=gravity chaos
actors.buffs.gravitychaostracker.desc_intro=Every few turns all characters on the current dungeon floor will be thrown in a random direction.
actors.buffs.gravitychaostracker.desc_positive=You and your allies seem to be immune though.
actors.buffs.gravitychaostracker.desc_duration=It's not clear how long the effect will last for, but it can't last forever.

actors.buffs.greaterhaste.name=greater haste
actors.buffs.greaterhaste.desc=دفعة سرعة هائلة، للحظة يبدو الأمر كما لو أن كل شيء آخر متوقف.   أثناء تأثير السرعة الفائقة، لا تستغرق الحركات أي وقت على الإطلاق، بينما تُنفَّذ الحركات الأخرى بالسرعة العادية. كل خطوة حركة تستهلك دورة واحدة من السرعة الفائقة.   منعطفات السرعة الأكبر المتبقية: %d .

actors.buffs.haste.name=جري سريع
actors.buffs.haste.desc=Energy courses through your muscles, allowing you to run at incredible speeds!\n\nWhile under the effects of haste you will run at 3x speed, but will perform all other actions at normal speed.\n\nTurns of haste remaining: %s.

actors.buffs.healing.name=شفاء
actors.buffs.healing.desc=A magical remedy is causing wounds to close and flesh to knit.\n\nEvery turn health will steadily regenerate until the healing effect expires. The amount of healing may fade over time.\n\nNext heal: %d.\n\nHealing remaining: %d.

actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory magic has altered your physical appearance! The effect is purely cosmetic, but feels very strange regardless.\n\nTurns of disguise remaining: %s.

actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=You have been hexed!
actors.buffs.hex.desc=Dark magic which saps focus, making the target slightly disoriented.\n\nHexing reduces accuracy and evasion by 20%%, making the target less effective in combat.\n\nTurns of hex remaining: %s.

actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The Warrior is holding his position, increasing his armor by %1$d-%2$d and slowing the decay rate of some buffs by %3$d%%. This will last until he moves.

actors.buffs.hunger.hungry=الجوع
actors.buffs.hunger.starving=يتضور جوعا
actors.buffs.hunger.onhungry=You are hungry.
actors.buffs.hunger.onstarving=You are starving!
actors.buffs.hunger.ondeath=You starved to death...
actors.buffs.hunger.cursedhorn=The cursed horn steals some of the food energy as you eat.
actors.buffs.hunger.rankings_desc=Starved to Death
actors.buffs.hunger.desc_intro_hungry=You can feel your stomach calling out for food, but it's not too urgent yet.
actors.buffs.hunger.desc_intro_starving=You're so hungry it hurts.
actors.buffs.hunger.desc=يزداد الجوع تدريجيًا كلما قضيت وقتًا أطول في الزنزانة ، حتى تبدأ في النهاية بالموت جوعًا. وخلال فترة الجوع، ستفقد صحتك تدريجيًا بدلًا من استعادتها.   التقنين مهم! إذا كنت تتمتع بصحة جيدة، فليس من السيئ أن تموت جوعاً إذا كان ذلك يعني توفر المزيد من الطعام لاحقاً. فالتقنين الفعال للطعام يُطيل مدة صلاحيته بشكل كبيرل مدة صلاحيته بشكل كبير!

actors.buffs.invisibility.name=غير مرئي
actors.buffs.invisibility.desc=أنت مندمج تماماً مع التضاريس المحيطة، مما يجعل رؤيتك مستحيلة.   أثناء اختفاءك، لا يستطيع الأعداء مهاجمتك أو ملاحقتك. الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) ستلغي الاختفاء فورًا.   عدد مرات الاختفاء المتبقية: %s .

actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=This character is suffused with great protective power, granting them a brief period of invulnerability!\n\nTurns remaining: %s.

actors.buffs.levitation.name=يطير في الهواء
actors.buffs.levitation.desc=قوة سحرية ترفعك فوق الأرض، مما يجعلك تشعر بانعدام الوزن.   تتحرك الشخصيات المُحلقة بصمت وتتجاهل جميع التأثيرات الأرضية. لن تُفعّل الفخاخ، ولن يُطفئ الماء النار، ولن تُداس النباتات، ولن تُخطئ الجذور الهدف، وستحوم فوق الحفر. كن حذرًا، فقد تُفعّل كل هذه الأشياء بمجرد انتهاء التحليق!   عدد دورات الرفع المتبقية: %s .

actors.buffs.lifelink.name=life link
actors.buffs.lifelink.ondeath=The life linked damage killed you...
actors.buffs.lifelink.desc=This character's life force is linked to another character nearby. Any damage taken is shared between them.\n\nWhenever this character takes damage, half of it will be dealt to the life link target instead.\n\nTurns of life link remaining: %s.

actors.buffs.light.name=مضي
actors.buffs.light.desc=Even in the Darkest Dungeon, a steady light at your side is always comforting.\n\nLight helps keep darkness at bay, allowing you to see a reasonable distance despite the environment.\n\nTurns of illumination remaining: %s.

actors.buffs.lockedfloor.name=floor is locked
actors.buffs.lockedfloor.desc= الطابق الحالي مغلق، ولا يمكنك مغادرته!   أثناء إغلاق الطابق، لن تشعر بالجوع ولن تتلقى أي ضرر من الجوع. إضافةً إلى ذلك، إذا لم تسعَ لهزيمة زعيم هذا الطابق، ستتوقف تأثيرات التجديد التلقائي.   بالإضافة إلى ذلك، إذا تم إحياؤك بواسطة عنخ غير مبارك بينما الأرضية مغلقة، فسيتم إعادة ضبطها.   اقتل زعيم هذا الطابق لكسر القفل.

actors.buffs.lostinventory.name=lost inventory
actors.buffs.lostinventory.desc=Your inventory has been lost somewhere in the dungeon! You won't be able to pick up or use most items until you retrieve it.

actors.buffs.magicalsight.name=رؤيه سحريه
actors.buffs.magicalsight.desc=Somehow you are able to see with your mind, rather than your eyes.\n\nWhile magical sight is active you will be able to see through all terrain in a 12 tile radius.\n\nTurns of magical sight remaining: %s.

actors.buffs.magicalsleep.name=خروف سحري
actors.buffs.magicalsleep.toohealthy=You are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=You fall into a deep magical sleep.
actors.buffs.magicalsleep.wakeup=You wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=لقد دخلت هذه الشخصية في سبات سحري عميق لن تستيقظ منه بشكل طبيعي.   النوم السحري يشبه النوم العادي، إلا أن الضرر فقط هو ما يتسبب في إيقاظ الهدف.   بالنسبة للبطل وحلفائه، يتمتع النوم السحري ببعض الخصائص العلاجية، مما يسمح لهم بالشفاء بسرعة أثناء الراحة.

actors.buffs.magicimmune.name=immune to magic
actors.buffs.magicimmune.desc=لقد فقدت جميع التأثيرات السحرية سيطرتها عليك، فأنت محصن تمامًا ضدها.   بينما تتمتع بمناعة سحرية، فإن جميع التأثيرات السحرية الضارة والمفيدة لن تنطبق عليك، بما في ذلك اللعنات والتعاويذ والعصي واللفائف والخواتم والتحف وما إلى ذلك. قدرات الدرع البطولي قوية بما يكفي للعمل بغض النظر عن هذا التأثير.   عدد دورات المناعة السحرية المتبقية: %s

actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=بطريقة ما، تستطيع أن ترى جميع المخلوقات الموجودة على هذا الطابق من خلال عقلك. إنه شعور غريب.   جميع الشخصيات في هذا الطابق مرئية لك طالما لديك قدرة الرؤية الذهنية. رؤية مخلوق ما من خلال الرؤية الذهنية تُعتبر بمثابة رؤيته أو وجوده بالقرب منك لأغراض العديد من التأثيرات السحرية.   ما تبقى من رؤى العقل: %s .

actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=عداء حر
actors.buffs.momentum.resting=استعاده
actors.buffs.momentum.action_name=جوله حره
actors.buffs.momentum.momentum_desc=أثناء تحركه، يكتسب العداء الحر زخماً يمكنه استخدامه لبدء الجري الحر.   تمنح كل شحنة من الزخم دورتين من الجري الحر، ويمكن للعداء الحر أن يجمع ما يصل إلى 10 شحنات. يتلاشى الزخم بسرعة عندما يتوقف العداء الحر عن الحركة.   شحنة الزخم الحالية: %d .
actors.buffs.momentum.running_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nWhile freerunning, the Freerunner moves at double speed and gains bonus evasion based on his level.\n\nTurns remaining: %d.
actors.buffs.momentum.resting_desc=As he moves, the Freerunner builds momentum, which he can spend to start freerunning.\n\nThe Freerunner needs time to regain his stamina before building momentum again.\n\nTurns remaining: %d.

actors.buffs.monkenergy.name=طاقه
actors.buffs.monkenergy.action=Monk Abilities
actors.buffs.monkenergy.desc=As she defeats enemies, the Monk gains energy that she can use on a variety of abilities. Most enemies grant 1 energy when defeated, and the Monk does not lose energy over time.\n\nCurrent energy: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The Monk has recently used an ability, and must wait before using another.\n\nCurrent cooldown: %d turns.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=Two instant strikes that deal %1$d-%2$d damage and ignore armor. This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Two instant strikes that deal %1$d-%2$d damage, ignore armor, _and use your weapon's enchantment._ This ability cannot be used repeatedly.
actors.buffs.monkenergy$monkability$focus.name=تركيز
actors.buffs.monkenergy$monkability$focus.desc=The Monk takes a turn to focus, letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The Monk _instantly focuses,_ letting her parry the next attack made against her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=مركز
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The Monk is focused on her surroundings, anticipating the next attack made against her. While focused, she is guaranteed to parry the next incoming attack.
actors.buffs.monkenergy$monkability$dash.name=داش
actors.buffs.monkenergy$monkability$dash.prompt=Choose a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ away. This ability can go over hazards, but not through enemies or solid terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick that deals %1$d-%2$d damage and ignores armor. The kick knocks the target away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick that deals _%1$d-%2$d damage_ and ignores armor. The kick knocks _all adjacent targets_ away and paralyzes them for each tile they travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The Monk focuses energy into her body for 5 turns. This clears most negative effects and grants her 8 turns of wand and artifact recharging. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._

actors.buffs.ooze.name=caustic ooze
actors.buffs.ooze.heromsg=Caustic ooze eats your flesh. Wash it away!
actors.buffs.ooze.ondeath=You melt away...
actors.buffs.ooze.rankings_desc=مذاب
actors.buffs.ooze.desc=This sticky acid clings to flesh, slowly melting it away.\n\nOoze will deal consistent damage over time, but can be immediately washed off in water.\n\nTurns of ooze remaining: %s.

actors.buffs.paralysis.name=شلل
actors.buffs.paralysis.heromsg=You are paralysed!
actors.buffs.paralysis.out=resisted paralysis
actors.buffs.paralysis.desc=في كثير من الأحيان، أسوأ شيء يمكن فعله هو عدم القيام بأي شيء على الإطلاق.   يُوقف الشلل جميع الحركات تمامًا، مما يُجبر الهدف على الانتظار حتى يزول مفعوله. وقد يدفع الألم الناتج عن تلقي الضرر الشخصيات إلى مقاومة الشلل، مما يُحررها من تأثيره.   عدد نوبات الشلل المتبقية: %s .

actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=Your blows have been empowered, increasing the amount of damage you can deal when you hit enemies with physical attacks.\n\nBonus damage: %1$d.\nHits remaining: %2$d.

actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The thrown weapons you have used against this character are currently stuck to them and will fall to the floor after they are defeated.\n\nThe following items are currently attached:

actors.buffs.poison.name=مسموم
actors.buffs.poison.heromsg=You are poisoned!
actors.buffs.poison.ondeath=You died from poison...
actors.buffs.poison.rankings_desc=Succumbed to Poison
actors.buffs.poison.desc=Poison works its way through the body, slowly impairing its internal functioning.\n\nPoison deals damage each turn proportional to how long until it expires.\n\nTurns of poison remaining: %s.

actors.buffs.preparation.name=استعدادت
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is waiting patiently, preparing to strike from the shadows.
actors.buffs.preparation.desc_dmg=His next attack will deal _%1$d%% bonus damage_, and will execute regular enemies below _%2$d%% health_, or bosses below _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The attack will also be more likely to deal a larger amount of damage.
actors.buffs.preparation.desc_blink=He is able to blink towards an enemy before striking them, with a max distance of _%d._
actors.buffs.preparation.desc_invis_time=Turns spent invisible: _%d._
actors.buffs.preparation.desc_invis_next=Turns for stronger attack: _%d._
actors.buffs.preparation.prompt=Select a target to attack!\nMax blink distance: %d
actors.buffs.preparation.no_target=There's nothing to attack there.
actors.buffs.preparation.out_of_reach=That target is out of reach.
actors.buffs.preparation.assassinated=assassinated

actors.buffs.prismaticguard.name=حارس سحري
actors.buffs.prismaticguard.desc=You are being guarded by a prismatic image which is currently inactive. When enemies are present the prismatic image will spring to action and protect you!\n\nWhile inactive, the prismatic image will steadily recover from any damage it has taken.\n\nCurrent HP: %d/%d.
actors.buffs.prismaticguard.desc_many=This prismatic image is also benefitting from Power of Many. Turns Remaining: %d.

actors.buffs.recharging.name=إعادة الشحن
actors.buffs.recharging.desc=Energy is coursing through you, improving the rate that your wands and staffs charge.\n\nEach turn this buff will increase current charge by one quarter, in addition to regular recharge.\n\nTurns of recharging remaining: %s.

actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of the dungeon has been temporarily revealed to the hero, They will see it no matter where they are.\n\nTurns remaining: %s.

actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=This character is revealed to the hero, They will be visible no matter where they are.\n\nTurns remaining: %s.

actors.buffs.roots.name=متجزر
actors.buffs.roots.heromsg=You can't move!
actors.buffs.roots.desc=Roots (magical or natural) grab at the feet, forcing them down to the ground.\n\nRoots lock a target in place, making movement and most movement abilities impossible. Other actions are not affected, including teleportation effects.\n\nTurns of root remaining: %s.

actors.buffs.scrollempower.name=scroll empower
actors.buffs.scrollempower.desc=The energy from the Mage's recently read scroll is empowering his wands!\n\nLevel Boost: +%1$d.\nZaps remaining: %2$d.

actors.buffs.shadows.name=مندمج في الظل
actors.buffs.shadows.desc=تندمج في الظلال المحيطة بك، مما يمنحك القدرة على الاختفاء ويبطئ عملية التمثيل الغذائي لديك.   أثناء اختفائك، لا يستطيع الأعداء مهاجمتك أو ملاحقتك. معظم الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) تُبطل الاختفاء فورًا. بالإضافة إلى ذلك، أثناء اندماجك مع الظل، يتباطأ معدل شعورك بالجوع.   ستبقى متخفياً في الظلال حتى تغادرها أو حتى يتصل بك عدو.

actors.buffs.slow.name=تباطؤ
actors.buffs.slow.desc=Slowing magic affects the target's rate of time, to them everything is moving super-fast.\n\nA slowed character performs all actions in twice the amount of time they would normally take.\n\nTurns of slow remaining: %s.

actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=تُركّز القناصة على الهدف الذي هاجمته مؤخرًا. وهي قادرة على تنفيذ هجوم خاص بقوسها، والذي يختلف باختلاف مستوى تطوير القوس.   سيطلق القوس غير المعزز طلقة سريعة، والتي تسبب ضررًا أقل ولكنها لا تستغرق أي وقت لإطلاقها.   القوس المُعزز لزيادة السرعة يُطلق وابلًا من ثلاثة أسهم. كل سهم يُلحق ضررًا أقل، لكنه لا يزال قادرًا على تفعيل التعويذة. يستغرق إطلاق هذا الوابل دورًا واحدًا.   القوس المعزز لزيادة الضرر سيطلق طلقة قناص. هذه الطلقة مضمونة الإصابة، وتلحق ضررًا إضافيًا بناءً على المسافة من الهدف، وتستغرق دورتين لإطلاقها.   عدد الأدوار المتبقية: %s .

actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The warlock has tapped into the soul of this creature, allowing him to heal as it takes physical damage.\n\nTurns of soul mark remaining: %s.

actors.buffs.stamina.name=التحمل
actors.buffs.stamina.desc=You have unending stamina, allowing for faster movement!\n\nWhile under the effects of stamina you will run at +50%% speed, but will perform all other actions at normal speed.\n\nTurns of stamina remaining: %s.

actors.buffs.swarminteltracker.name=swarm intelligence
actors.buffs.swarminteltracker.desc=تتسبب ذكاءات السرب في جذب الأعداء لأعداء آخرين إلى موقعك عندما يرونك أو حلفائك.   هذا الجذب له نطاق محدود، ولكن كلما طالت مدة رؤيتك زاد هذا النطاق، ليصل إلى حد أقصى قدره 12. حتى فقدان الرؤية للحظة يعيد ضبط النطاق.   أكبر نطاق جذب سياحي حالي: %d .

actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=You feel fragile!
actors.buffs.vulnerable.desc=Vulnerability magic increases all physical damage that a character takes by 33%%, after that damage has been reduced by armor.\n\nTurns of vulnerable remaining: %s.

actors.buffs.terror.name=مرعوب
actors.buffs.terror.desc=الإرهاب هو سحر تلاعب يجبر هدفه على الدخول في حالة ذعر لا يمكن السيطرة عليها.   تُجبر الشخصيات المذعورة على الفرار من خصومها، محاولةً وضع أكبر عدد ممكن من الأبواب والجدران بينها وبين خصومها. إلا أن صدمة الألم ستُقلل من مدة الرعب.   ما تبقى من جولات الرعب: %s

actors.buffs.toxicimbue.name=imbued with toxicity
actors.buffs.toxicimbue.desc=أنت مشبع بطاقة سامة!   أثناء تحركك، سيتصاعد منك غاز سام باستمرار، مُلحقًا الضرر بأعدائك. أنت محصن ضد الغاز السام والسموم طوال مدة تأثيره، وكذلك لبضع جولات لاحقة.   عدد دورات التشبع السام المتبقية: %s .

actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=You are melting!
actors.buffs.corrosion.ondeath=You melt away...
actors.buffs.corrosion.rankings_desc=مذاب
actors.buffs.corrosion.desc=Powerful acid melts away flesh, metal, and bone at an alarming rate.\n\nCorrosion damage increases over time, as the target continues to melt away.\n\nTurns of corrosion remaining: %1$s.\nCurrent corrosion damage: %2$d.

actors.buffs.vertigo.name=دائخ
actors.buffs.vertigo.desc=قد يكون المشي في خط مستقيم صعباً عندما يدور العالم كله.   أثناء تأثير الدوار، ستتحرك الشخصيات التي تحاول التحرك في اتجاه عشوائي، بدلاً من الاتجاه الذي كانت تنوي الذهاب إليه.   نوبات الدوار المتبقية: %s .

actors.buffs.wandempower.name=wands empowered
actors.buffs.wandempower.desc=Your damage-dealing wands have been empowered, increasing the amount of damage they deal for a few hits.\n\nBonus damage: %1$d.\nHits remaining: %2$d.

actors.buffs.weakness.name=اضعاف
actors.buffs.weakness.heromsg=You feel weakened!
actors.buffs.weakness.desc=Everything suddenly seems much heavier.\n\nWeakening magic reduces a character's physical strength, causing them to deal 33%% reduced damage.\n\nTurns of weakness remaining: %s.

actors.buffs.wellfed.name=well fed
actors.buffs.wellfed.desc=You feel quite satisfied and full.\n\nWhile well fed, your hunger will not increase, and you will heal an additional amount of health over time.\n\nTurns remaining: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=You can't target yourself!
actors.hero.abilities.armorability.no_target=There's nothing to target there!
actors.hero.abilities.armorability.prompt=Choose a location to target
actors.hero.abilities.armorability.cost=Charge cost: _%d_

actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=Choose direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The Warrior performs a _Heroic Leap_ towards a targeted location, sailing above enemies and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The Warrior leaps toward a targeted location, going over any enemies or hazards in the way. He cannot leap over walls or other solid terrain however.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The Warrior releases a _Shockwave_ in a conical AOE by slamming the ground. Enemies caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=يضرب المحارب الأرض بقوة، مما ينتج عنه موجة صدمية تنتقل لمسافة تصل إلى 5 مربعات في مخروط بزاوية 60 درجة.   يُصاب الأعداء الذين يقعون في نطاق هذه الموجة الصدمية بالشلل لمدة 5 أدوار. كما يتلقون ضررًا يتراوح بين 5 و10 نقاط، بالإضافة إلى ضرر إضافي يتراوح بين 1 و2 نقطة لكل نقطة قوة يمتلكها المحارب فوق 10 نقاط.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The Warrior is now dealing bonus damage based on the damage he endured.\n\nBonus Damage: %1$d\nHits Left: %2$d
actors.hero.abilities.warrior.endure.short_desc=The Warrior _Endures_, skipping several turns but gaining high damage resistance. He then deals bonus damage based on what he endured.
actors.hero.abilities.warrior.endure.desc=يتحمل المحارب الضرر لمدة ثلاث جولات، ويتلقى نصف الضرر من جميع المصادر. ويُطبق هذا التخفيض قبل تأثيرات مقاومة الضرر مثل الدروع.   بعد الصمود، يكتسب المحارب ضررًا إضافيًا في ضربته التالية خلال عشر جولات. هذا الضرر الإضافي يساوي نصف إجمالي الضرر الذي تلقاه أثناء الصمود، قبل أي تأثيرات لتقليل الضرر!   إذا كان لدى المحارب أي سلسلة من الحركات، فإن استخدام هذه القدرة يزيد من وقته المتبقي بمقدار 3 أدوار

actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=You can't use this ability without your staff.
actors.hero.abilities.mage.elementalblast.short_desc=The Mage emits an _Elemental Blast_ from his staff, covering a large area around him in an effect that varies based on the wand in his staff.
actors.hero.abilities.mage.elementalblast.desc=The Mage emits a blast of magic, which covers a circular region up to 4 tiles away and deals up to 15-25 damage. The specific effect of elemental blast will vary by the wand imbued in the Mage's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The effect of elemental blast will be similar to the effect of the wand when zapped at an enemy or ally.
actors.hero.abilities.mage.wildmagic.name=wild magic
actors.hero.abilities.mage.wildmagic.no_wands=You have no wands to zap with!
actors.hero.abilities.mage.wildmagic.short_desc=The Mage unleashes the _Wild Magic_ contained in his wands, randomly firing them multiple times at a chosen target over a single turn.
actors.hero.abilities.mage.wildmagic.desc=يُطلق الساحر العنان لقوة عصيه السحرية، فيُطلقها عشوائيًا حتى أربع مرات في دورة واحدة. ولا يشمل هذا التأثير عصا الساحر.   كما يتم تعزيز مستوى كل عصا بمقدار 2، حتى +3. تستخدم هذه القدرة نصف شحنة العصا لكل ضربة، ولا يمكن إطلاق أي عصا أكثر من مرتين.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=You can't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=You cannot leave a locked floor!
actors.hero.abilities.mage.warpbeacon.too_far=That location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=You can't place a beacon there!
actors.hero.abilities.mage.warpbeacon.window_desc=Your beacon is currently placed on floor %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleport to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=الغاء
actors.hero.abilities.mage.warpbeacon.short_desc=The Mage places a _Warping Beacon_ at his current location, which he can instantly teleport back to.
actors.hero.abilities.mage.warpbeacon.desc=يضع الساحر منارة، يمكن الانتقال إليها متى شاء. يستغرق وضع المنارة دورة واحدة، لكن الانتقال إليها فوري.   لا يستطيع الساحر الانتقال الفوري بين الطوابق افتراضيًا، أو استخدام المنارة للوصول إلى أماكن يصعب الوصول إليها كالغرف المغلقة. لكن بإمكانه الانتقال الفوري إلى الأعداء، مما يدفعهم جانبًا.

actors.hero.abilities.rogue.smokebomb.name=smoke bomb
actors.hero.abilities.rogue.smokebomb.fov=You can only jump to an empty location in your field of view.
actors.hero.abilities.rogue.smokebomb.prompt=Choose a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=wooden decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, enemies are easily convinced that this wooden decoy is the real Rogue!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=You can find this character with a specific hero armor ability.
actors.hero.abilities.rogue.smokebomb.short_desc=The Rogue throws down a _Smoke Bomb_ while blinking away. He blinds enemies near his old location.
actors.hero.abilities.rogue.smokebomb.desc=The Rogue throws down a smoke bomb and blinks up to 6 tiles away. He can blink through hazards and enemies, but not through solid terrain like walls.\n\nEnemies that are adjacent to the Rogue's old position will be blinded for 5 turns.
actors.hero.abilities.rogue.deathmark.name=death mark
actors.hero.abilities.rogue.deathmark.ally_target=You can only mark enemies
actors.hero.abilities.rogue.deathmark.short_desc=The Rogue places a _Death Mark_ on a chosen enemy. Marked enemies take bonus damage, but cannot die until the mark ends.
actors.hero.abilities.rogue.deathmark.desc= يضع المحتال علامة على عدو مختار، مما يجعله يتلقى ضررًا إضافيًا بنسبة 25%. تُطبّق العلامة فورًا وتستمر لمدة 5 أدوار.   يتلقى الأعداء المميزون ضررًا إضافيًا، لكنهم لا يموتون حتى يزول تأثير العلامة. إذا كان لدى العدو صفر من نقاط الصحة عند انتهاء تأثير العلامة، فسيموت فورًا.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for death
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=This enemy has been marked, causing them to take 25%% bonus damage, but also rendering them unable to die until the mark ends.\n\nTurns remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=shadow clone
actors.hero.abilities.rogue.shadowclone.short_desc=The Rogue summons a _Shadow Clone_, which can be directed to aid him in combat.
actors.hero.abilities.rogue.shadowclone.desc=يستدعي المحتال نسخة ظلية منه، يمكن توجيهها لمساعدته في القتال. ولا يتطلب توجيه هذه النسخة الظلية أي تكلفة.   يمتلك المستنسخ 80 نقطة صحة، ولا يرتدي درعًا، ويُلحق ضررًا يتراوح بين 10 و20 نقطة. يمكن تحسين جميع هذه الخصائص باستخدام المواهب، بحيث يستفيد المستنسخ من أسلحة ودروع البطل.
actors.hero.abilities.rogue.shadowclone$shadowally.name=shadow rogue
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Your clone moves to that position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Your clone moves to follow you.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Your clone moves to attack!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=نسخة من المحتال، مصنوعة من ظلام دامس. تقف جامدة بلا حراك، بعيون فارغة وخيوط صغيرة من الظلام تتصاعد منها كالبخار.   النسخة المستنسخة ليست نسخة طبق الأصل من المحتال، لكنها لا تزال مقاتلاً جيداً، ويمكنها الاستفادة من معدات المحتال مع المواهب المناسبة.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=You can find this character with a specific hero armor ability.

actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The Huntress throws _Spectral Blades_ at a target, inflicting damage depending on her currently equipped melee weapon.
actors.hero.abilities.huntress.spectralblades.desc=The Huntress throws out a spectral blade at an enemy, which acts like a ranged strike from her melee weapon. All of the normal effects of a melee weapon will activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=nature's power
actors.hero.abilities.huntress.naturespower.short_desc=The Huntress calls upon _Nature's Power_, increasing her movement speed and her bow's rate of fire for a short time.
actors.hero.abilities.huntress.naturespower.desc=تُمنح الصيادة نفسها وقوسها قوة الطبيعة مؤقتًا! ويستمر هذا التأثير لمدة 8 أدوار.   خلال هذه الفترة، تتحرك الصيادة بسرعة مضاعفة، وتهاجم بقوسها أسرع بنسبة 33%. لا تُفعّل تأثيرات القوس الإضافية إذا كانت القناصة تستخدم هجماتها الخاصة.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=nature's power
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The Huntress is briefly empowered, increasing her movement speed and attack speed with her bow.\n\nTurns remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=spirit hawk
actors.hero.abilities.huntress.spirithawk.no_space=There is no free space near you.
actors.hero.abilities.huntress.spirithawk.short_desc=The Huntress summons a _Spirit Hawk_ familiar, which can help her scout locations and distract enemies.
actors.hero.abilities.huntress.spirithawk.desc=تستدعي الصيادة صقرًا روحيًا مرافقًا، ويمكن توجيهه باستخدام القدرة مرة أخرى أثناء استدعائه. يدوم الصقر لمدة 100 دورة، ولا يتطلب توجيهه أي تكلفة.   يتمتع الصقر بصحة وقوة هجومية محدودتين، ولكنه سريع ومراوغ ودقيق. ويشارك الصيادة مجال رؤيته بالكامل في جميع الأوقات. وهو محصن ضد جميع التأثيرات المرتبطة بمنطقة معينة، مثل النار والغازات السامة. ولن يهاجم إلا إذا طُلب منه ذلك تحديدًا
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirit hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Your hawk moves to that position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Your hawk moves to follow you.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Your hawk moves to attack!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A magical hawk, summoned by the Huntress. It glows a bright ethereal blue, its head constantly shifts around as it surveys the area.\n\nWhile it isn't much of a fighter its speed and vision make it excellent for scouting and distracting enemies.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turns remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=You can find this character with a specific hero armor ability.

actors.hero.abilities.duelist.challenge.name=تحدي
actors.hero.abilities.duelist.challenge.prompt=Choose an enemy to challenge
actors.hero.abilities.duelist.challenge.already_dueling=You can only be in one duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=You can only challenge enemies.
actors.hero.abilities.duelist.challenge.unreachable_target=You must be able to reach your target.
actors.hero.abilities.duelist.challenge.distant_target=That enemy is too far away to challenge.
actors.hero.abilities.duelist.challenge.short_desc=The Duelist _Challenges_ a nearby enemy to a duel, temporarily freezing all other enemies.
actors.hero.abilities.duelist.challenge.desc=تتحدى المبارزة عدوًا قريبًا في مبارزة. يُجبر هذا العدو على قتالها بينما يتجمد جميع الأعداء الآخرين مؤقتًا في الزمن.   يجب أن يكون الهدف في متناول اليد وعلى بُعد 5 مربعات من المبارز. تستمر المبارزة حتى مرور 10 أدوار، أو موت العدو، أو ابتعاد المبارز عن العدو بأكثر من 5 مربعات.   الأعداء المتجمدون لا يُقهرون. حلفاء المبارز لا يتجمدون بهذه القدرة، ولكن إذا تم استهداف زعيم، فلن يتجمد أتباعه أيضًا
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=تشارك هذه الشخصية في مبارزة. يُسمح لها، ولأي من حلفائها أو أتباعها، بالتصرف بشكل طبيعي بينما يتم تجميد الآخرين.   ستستمر المبارزة لفترة زمنية محددة، حتى يموت أحد المشاركين، أو حتى يبتعد المشاركون عن بعضهم البعض بأكثر من 5 مربعات.   عدد الأدوار المتبقية: %d .
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The Duelist performs an _Elemental Strike_, spreading an effect in a conical AOE based on her weapon enchantment.
actors.hero.abilities.duelist.elementalstrike.desc=يوجّه المبارز ضربةً إلى عدو أو موقع، مُنفّذًا هجومًا عاديًا مضمون الإصابة، ومُطلقًا تأثيرًا سحريًا ينتشر لمسافة تصل إلى 4 مربعات في مخروط بزاوية 65 درجة. ويختلف هذا التأثير السحري بناءً على التعويذة الموجودة على سلاح المبارز الأساسي.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike with no enchantment will release a small burst of magic, dealing 6-12 damage to all enemies in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=Choose a location to dash to
actors.hero.abilities.duelist.feint.too_far=That location is not adjacent to you.
actors.hero.abilities.duelist.feint.bad_location=You can't move to that location.
actors.hero.abilities.duelist.feint.short_desc=The Duelist _Feints_, faking an attack while dashing to an adjacent tile. Enemies will attack her afterimage, leaving them open to a counterattack.
actors.hero.abilities.duelist.feint.desc=تُوهم المبارزة بهجومٍ أثناء اندفاعها إلى المربع المجاور، تاركةً وراءها صورةً ظليةً مؤقتةً لنفسها. الأعداء الذين كانوا يهاجمون المبارزة سيهاجمون صورتها الظلية بدلاً منها.   الأعداء الذين يهاجمون الصورة اللاحقة يصابون بالارتباك، مما يلغي حركتهم التالية ويجعلهم عرضة لهجوم مفاجئ.

actors.hero.abilities.cleric.ascendedform.name=ascended form
actors.hero.abilities.cleric.ascendedform.short_desc=The Cleric assumes an _Ascended Form_, gaining new spells, attack range, and shielding.
actors.hero.abilities.cleric.ascendedform.desc=يُطلق الكاهن طاقة مقدسة من نفسه، متخذًا هيئة إشعاعية ممتدة لمدة عشر جولات. في هذه الهيئة، يستطيع الكاهن إلقاء تعاويذ جديدة، ويكتسب مدى هجوم إضافي بمقدار 2، و30 نقطة حماية، وأي تعويذة إضافية يلقيها ستمنحه 10 نقاط حماية لكل شحنة من كتاب مقدس مستخدمة.   لا يتلاشى تأثير الحماية من الهيئة المُرتقية وتعاويذها بشكل طبيعي، بل يزول فور انتهاء الهيئة المُرتقية. ويمكن إعادة استخدام هذه القدرة لتجديد مدة الهيئة المُرتقية
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=ascended form
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=تنبعث طاقة مشعة من جسد الكاهن. في هذه الهيئة، يكتسب الكاهن مدى هجوم إضافي بمقدار 2 (بفضل الطاقة المقدسة المنبعثة منه)، و10 نقاط حماية كلما استخدم شحنة من كتاب مقدس. كما يصبح قادرًا على إلقاء التعاويذ التي تُفتح عبر مواهب الهيئة المُرتقية.   إن الدرع الممنوح من خلال الشكل المتسامي وتعاويذه لن يتلاشى بشكل طبيعي، ولكنه سيتلاشى على الفور عند انتهاء الشكل المتسامي.   الحماية الحالية: %1$d .  عدد الأدوار المتبقية: %2$d .
actors.hero.abilities.cleric.trinity.name=حليه سحريه
actors.hero.abilities.cleric.trinity.no_imbue=Trinity has no effect set for any of its forms currently, use one of its spells!
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity cannot duplicate an effect that you already have equipped!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity will apply this effect for _%1$d turns_ at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity will apply this _powerful_ effect for _%1$d turns_ at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.wand_use=Trinity will zap this wand at _+%1$d_ at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity will zap this _multi-charge_ wand at _+%1$d_ at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity will throw this weapon at _+%1$d_ at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.ring_use=Trinity will apply this ring's effect at _+%1$d_ for 20 turns, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity will apply this artifact's remote alchemy effect, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity will apply this artifact's passive health regen effect at _+%1$d_ for 20 turns, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity will use this artifact's effect to summon a corrupted friendly wraith with the HP of a _+%1$d_ ghost, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity will apply this artifact's chain-casting effect with reach at _+%1$d_, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity will apply this artifact's snacking effect, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity will apply this artifact's enemy robbing effect at _+%1$d_, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity will apply this artifact's root effect with a random harmful seed, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity will apply this artifact's insert effect, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity will apply this artifact's scry effect at _+%1$d_, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity will apply this artifact's time freeze effect with a _%1$d_ turn duration, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity will apply this artifact's random scroll effect with a _%1$d/10_ chance to offer the exotic version at no additional cost, at the cost of _%2$s charge._
actors.hero.abilities.cleric.trinity.cost=The charge cost of this ability varies, but is most often _%d._
actors.hero.abilities.cleric.trinity.short_desc=The Cleric gains a _Trinity_ of abilities, which emulate equipment they have seen and can be assigned by using new spells.
actors.hero.abilities.cleric.trinity.desc=     يكتسب الكاهن ثلاث قدرات دروع، يمكن تخصيصها لتأثيرات عناصر مختلفة باستخدام ثلاث تعاويذ جديدة. تركز كل تعويذة من هذه التعاويذ على محاكاة تأثيرات أنواع مختلفة من المعدات التي حددها الكاهن خلال هذه الجولة: شكل الجسد (الأسلحة والدروع)، وشكل العقل (العصي والأسلحة المقذوفة)، وشكل الروح (الخواتم والتحف).   يمكن إضفاء تأثير واحد على كل شكل من أشكال القوه الثلاثيه في كل مرة، ويختار الكاهن التأثير الذي سيفعّله عند استخدام القوه الثلاثيه. ولن يكرر  تأثير أي شيء مجهز لديك بالفعل
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Select which form of Trinity to use. The effects of different forms can be active simultaneously.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Body Form: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Mind Form: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Spirit Form: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Select an effect to be imbued into Trinity. Additional info will be shown before confirmation.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Assign to body form
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Assign to mind form
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Assign to spirit form
actors.hero.abilities.cleric.powerofmany.name=power of many
actors.hero.abilities.cleric.powerofmany.prompt_default=Choose an ally or location
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direct your light ally
actors.hero.abilities.cleric.powerofmany.ally_exists=You already have an empowered ally.
actors.hero.abilities.cleric.powerofmany.no_vision=You can't target a location you can't see.
actors.hero.abilities.cleric.powerofmany.only_allies=You can only empower allies.
actors.hero.abilities.cleric.powerofmany.short_desc=The Cleric channels the _Power of Many_, empowering an existing ally or creating a new one.
actors.hero.abilities.cleric.powerofmany.desc=يوجّه الكاهن قوة "الكثرة"، التي إما أن تُقوّي حليفًا موجودًا أو تُنشئ حليفًا جديدًا مُقوّى لمدة 100 دورة. استهداف مساحة فارغة يُنشئ حليفًا جديدًا.   أثناء تفعيل قدرة "قوة الكثرة"، يُلحق أي حليف ضررًا إضافيًا بنسبة 25%، ويتلقى ضررًا أقل بنسبة 25%، ويشارك رؤيته مع الكاهن. كما يكتسب 25 نقطة حماية عند استخدام هذه القدرة.   يكتسب الكاهن أيضًا ثلاث تعاويذ جديدة لا يمكن إلقاؤها إلا بوجود حليف مُعزَّز. ولن تنتهي قوة الكثرة طالما أن إحدى هذه التعاويذ فعّالة
actors.hero.abilities.cleric.powerofmany$powerbuff.name=power of many
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=تم تمكين هذا الحليف بقوة الكثيرين، مما منحه +25 %% الضرر المُلحق و-25 %% الضرر الذي سيتلقونه. كما سيشاركون نطاق رؤيتهم مع الكاهن، ويمكنهم الاستفادة من قوة العديد من التعاويذ.   ستستمر قوة الكثيرين حتى عندما يختبئ الحلفاء مثل الصور المنشورية، لكن مدتها ستظل تتناقص.   عدد الأدوار المتبقية: %s .
actors.hero.abilities.cleric.powerofmany$lightally.name=light ally
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Your ally moves to that position.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Your ally moves to follow you.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Your ally moves to attack!
actors.hero.abilities.cleric.powerofmany$lightally.desc=نسخة من أحد رفاق الكاهن في مغامراته، مصنوعة من نور خالص. ورغم أنها تتخذ شكل بطل آخر، إلا أنها لا تمتلك أيًا من قدراته الفريدة. سيبقى هذا الحليف قائمًا ما دامت قوة الكثرة مُطبقة عليه.   يمكن توجيه هذا الحليف بدون أي تكلفة عن طريق إعادة استخدام قدرة درع "قوة الكثيرين".
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=You can find this character with a specific hero armor ability.


actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=You can't ratmogrify that!
actors.hero.abilities.ratmogrify.too_strong=That enemy is too strong to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=The hero _Ratmogrifies_ an enemy! This temporarily turns them into a rat with no abilities.
actors.hero.abilities.ratmogrify.desc=The hero transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be ratmogrified.\n\nRatmogrified enemies retain their original stats, but do not have any abilities.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=This enemy has been transformed into a rat. A big improvement, if you ask me! - Rat King
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified enemy

##Cleric Spells
actors.hero.spells.auraofprotection.name=aura of protection
actors.hero.spells.auraofprotection.short_desc=Boosts defence for Paladin and nearby allies.
actors.hero.spells.auraofprotection.desc=يبدأ الفارس بإشعاع طاقة وقائية في هالة متلألئة حول نفسه لمدة 20 دورة. أي حليف ضمن نطاق مربعين من الفارس (بما في ذلك الفارس نفسه) يتلقى %1$d %% يُقلل الضرر، ويكتسب تأثير نقش درع الفارس عند + %2$d %%  قوة.   يُطبَّق هذا التخفيض للضرر قبل تأثيرات تخفيض الضرر الأخرى (مثل الدروع). سيُطبَّق تعزيز قوة النقش دائمًا، ولكن لا يمكن لهذه التعويذة أن تُطبَّق نقش الفارس أكثر من مرة إذا كانت شخصية أخرى تستفيد منه بالفعل (مثل الفارس نفسه، أو صورة موشورية)
actors.hero.spells.auraofprotection$aurabuff.name=aura of protection
actors.hero.spells.auraofprotection$aurabuff.desc=The Paladin is radiating protective energy around themselves.\n\nAny nearby ally (including the Paladin themselves) takes reduced damage and gains the effect of the Paladin's armor glyph with boosted power.\n\nTurns Remaining: %s.

actors.hero.spells.beamingray.name=beaming ray
actors.hero.spells.beamingray.no_space=There's no space for your ally to appear there.
actors.hero.spells.beamingray.out_of_range=That location is out of range.
actors.hero.spells.beamingray.short_desc=Teleports your ally and grants bonus damage.
actors.hero.spells.beamingray.desc=يُوجّه الكاهن القوة من حليفه إلى شعاع ضوئي ينقله إلى موقع محدد. إذا اصطدم الشعاع بعدو، فإنه ينقل الحليف إلى مكان قريب منه ويوجهه نحو العدو.   يبلغ أقصى مدى للشعاع ... %1$d البلاطات، وسيزيد الضرر الإضافي لقوة الكثيرين إلى + %2$d %% لمدة عشر جولات ضد أقرب عدو ضمن نطاق أربع مربعات. يمكن لشعاع الإشعاع أن ينقل الحلفاء غير المتحركين عادةً، لكن مداه ينخفض إلى النصف في هذه الحالات
actors.hero.spells.beamingray$beamingrayboost.name=beaming ray
actors.hero.spells.beamingray$beamingrayboost.desc=This ally was recently teleported by Beaming Ray, giving them bonus damage against the nearest enemy after the teleport. Power of Many also won't expire when this buff is active.\n\nTurns Remaining: %s.

actors.hero.spells.blessspell.name=مباركه
actors.hero.spells.blessspell.short_desc=Blesses & shields Cleric, blesses & heals others.
actors.hero.spells.blessspell.desc=يضع الكاهن بركة مقدسة على نفسه أو على شخصية أخرى يمكنه رؤيتها.   عندما يُلقى التأثير على أنفسهم يكون أضعف، مما يمنحهم %1$d أدوار البركة و %2$d  حاجز.   تكون التعويذة أكثر قوة عند إلقائها على شخصيات أخرى، مما يمنحها %3$d أدوار البركة و %4$d الشفاء. يتحول الشفاء الزائد إلى حاجز

actors.hero.spells.bodyform.name=body form
actors.hero.spells.bodyform.short_desc=Assigns Trinity to an enchant or glyph.
actors.hero.spells.bodyform.desc=يختار الكاهن تعويذة أو رمزًا قام بتحديده في هذه الجولة ويمنح القوه المقدسه تأثيره.   عند استخدام القوه المقدسه، يكتسب الكاهن تأثير التعويذة أو الرمز المختار لـ %d يتحول. ستعمل هذه التعويذة أو النقشة المؤقتة بنفس تأثير التعويذة أو النقشة العادية.   تحل هذه التعويذة محل أي تأثير جسدي آخر تتمتع به ترينيتي حاليًا.
actors.hero.spells.bodyform$bodyformbuff.name=body form
actors.hero.spells.bodyform$bodyformbuff.desc=يمنحك شكل جسد ترينيتي حاليًا قوة سحر أو نقش، كما لو كنت قد قمت بتجهيزه على سلاحك أو درعك الحالي.   لاحظ أن شكل الجسم لا يمكنه توفير نسخة أخرى من تأثير تستفيد منه بالفعل.   التأثير الحالي: %1$s .   عدد الأدوار المتبقية: %2$s .

actors.hero.spells.cleanse.name=cleanse
actors.hero.spells.cleanse.short_desc=Clears debuffs and grants shielding.
actors.hero.spells.cleanse.desc=The Cleric clears all harmful status effects on themselves and visible allies. After the spell ends all characters affected also gain %1$d turns of debuff immunity, and %2$d barrier.

actors.hero.spells.clericspell.prompt=Choose a target
actors.hero.spells.clericspell.no_target=There is no target there.
actors.hero.spells.clericspell.invalid_target=You can't target that location.
actors.hero.spells.clericspell.invalid_enemy=You can't target that enemy.
actors.hero.spells.clericspell.charge_cost=Charge cost: %d

actors.hero.spells.divinesense.name=divine sense
actors.hero.spells.divinesense.short_desc=Gain temporary mind vision in a wide range.
actors.hero.spells.divinesense.desc=The Cleric focuses their senses on their surroundings, gaining mind vision with a %d tile range for 50 turns. This spell takes no time to cast.
actors.hero.spells.divinesense$divinesensetracker.name=divine sense
actors.hero.spells.divinesense$divinesensetracker.desc=This character is temporarily able to see other nearby creatures with their mind!\n\nTurns remaining: %s.

actors.hero.spells.divineintervention.name=divine intervention
actors.hero.spells.divineintervention.short_desc=Massive shield boost to Cleric and allies.
actors.hero.spells.divineintervention.desc=يُلقي الكاهن بكمية هائلة من القوة من كتابه على نفسه وحلفائه، مما يعزز الجميع إلى %1$d حماية وتوسيع الشكل الصاعد بواسطة %2$d يتم تقييم القوة الدفاعية الهائلة لهذه التعويذة مقابل تكلفة شحنها العالية للغاية.   تمامًا مثل الحماية الأخرى التي يمنحها الشكل المتسامي، فإن هذه الحماية لا تتلاشى بشكل طبيعي، ولكنها ستنتهي فورًا عند انتهاء الشكل المتسامي.

actors.hero.spells.flash.name=فلاش
actors.hero.spells.flash.prompt=Choose a location
actors.hero.spells.flash.short_desc=Teleport to a nearby location.
actors.hero.spells.flash.desc=The Cleric channels their ascended form at a nearby location and teleports there. Flash can teleport the Cleric to any discovered location that is in range and unoccupied. This spell costs more tome charges every time it is used in the same ascended form.

actors.hero.spells.guidinglight.name=guiding light
actors.hero.spells.guidinglight.short_desc=Deals ranged magic damage and guarantees a hit.
actors.hero.spells.guidinglight.desc=The Cleric fires a bolt of magical energy which strikes a target, dealing 2-8 damage and illuminating them. The next non-encumbered physical attack made against an illuminated enemy is guaranteed to hit them.
actors.hero.spells.guidinglight.desc_priest=تزداد قوة هذه التعويذة عند إلقائها من قِبَل الكاهن. لا تتطلب أول إلقاء للتعويذة كل 50 دورة أي شحنات من الكتب السحرية، وسيتم استهلاك تعويذة الإضاءة بواسطة الإشعاع والعصي السحرية والشخصيات الأخرى والقطع الأثرية التي تؤثر مباشرةً على الأعداء. عند استخدام تعويذة الإضاءة بهذه الطريقة، فإنها تُلحق ضررًا سحريًا إضافيًا يساوي مستوى الكاهن + 5
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Guiding Light
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=The Priest will be able to cast Guiding Light for free again after 50 turns elapse.\n\nTurns remaining: %s.
actors.hero.spells.guidinglight$illuminated.name=Illuminated
actors.hero.spells.guidinglight$illuminated.desc=This character is glowing as a result of being struck by guiding light. While the glow isn't strong enough to brighten the surrounding area, the magical effect will make landing blows on them much easier for the Cleric.
actors.hero.spells.guidinglight$illuminated.desc_priest=The Priest can additionally consume illuminated with radiance, a wand zap, strike from an ally, or effects from some artifacts. Using illuminated in this way will deal bonus magic damage equal to the Priest's level + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Other heroes can still use illuminated to benefit from the searing light talent, but will not gain any accuracy.

actors.hero.spells.hallowedground.name=hallowed ground
actors.hero.spells.hallowedground.prompt=Choose a location
actors.hero.spells.hallowedground.short_desc=Heals allies, slows enemies, and spreads grass in an AOE.
actors.hero.spells.hallowedground.desc=يركز الكاهن سحره الإلهي على الأرض القريبة، مما يخلق %1$d x %1$d منطقة أرض مقدسة لمدة 20 دورة.   عند إلقاء هذه التعويذة، فإنها تشفي جميع الحلفاء بمقدار 15 نقطة صحة (يحصل الحلفاء الأصحاء والكاهن على درع)، وتثبت الأعداء لفترة وجيزة، وتنشر عشبًا قصيرًا.   تُعالج الأرض المقدسة الحلفاء بمقدار نقطة صحة واحدة لكل دور (يحصل الحلفاء الأصحاء والكاهن على درع)، وتُضعف الأعداء، وتتسبب بشكل عشوائي في نمو العشب الطويل.   يتم تدمير الأرض المقدسة بالنار، وستنتج عشبًا محفورًا إذا تم تعطيل تأثيرات التجديد السلبي أو إذا لم يكتسب الكاهن خبرة لفترة من الوقت
actors.hero.spells.hallowedground$hallowedterrain.desc=The ground has been hallowed here. Hallowed ground slows enemies, heals allies, and causes grass to spread.

actors.hero.spells.holyintuition.name=holy intuition
actors.hero.spells.holyintuition.prompt=choose an item
actors.hero.spells.holyintuition.cursed=You sense malevolent magic lurking within this item.
actors.hero.spells.holyintuition.uncursed=This item is free of malevolent magic.
actors.hero.spells.holyintuition.short_desc=identifies whether an item is cursed or not.
actors.hero.spells.holyintuition.desc=The Cleric focuses their senses on an item and determines whether it is cursed or not without having to equip it.

actors.hero.spells.holylance.name=holy lance
actors.hero.spells.holylance.short_desc=Deals heavy ranged magic damage.
actors.hero.spells.holylance.desc=The Priest concentrates a large amount of energy into a devastating thrown lance made of light. This lance deals %1$d-%2$d damage and always deals maximum damage to undead and demonic targets.\n\nThis spell is very expensive, and has a cooldown of 30 turns.
actors.hero.spells.holylance$lancecooldown.name=holy lance cooldown
actors.hero.spells.holylance$lancecooldown.desc=The Priest has recently cast Holy Lance, and must wait before casting it again.\n\nTurns remaining: %s.

actors.hero.spells.holyward.name=holy ward
actors.hero.spells.holyward.glyph_name=%s of light
actors.hero.spells.holyward.glyph_desc=This glyph slightly increases the amount of damage armor can block.
actors.hero.spells.holyward.short_desc=Temporarily overrides glyphs to boost armor blocking.
actors.hero.spells.holyward.desc=يقوم الكاهن بتزويد درعه البالي برموز من النور المقدس، مما يزيد من قدرة الدرع على صد الضرر بمقدار 1. لا يستغرق إلقاء هذه التعويذة أي وقت.   يستمر هذا الرمز لمدة ٥٠ دورة، وسيحل محل أي رمز مفيد آخر موجود على الدرع طوال هذه المدة. سيستفيد الكاهن من هذا التأثير حتى لو لم يكن يرتدي درعًا.
actors.hero.spells.holyward.desc_paladin=_This spell is more powerful when cast by the Paladin._ The additional damage blocking is increased to 3, the spell no longer overrides existing glyphs, and casting other spells while holy ward is active will extend its duration by 10 turns per charge used.
actors.hero.spells.holyward$holyarmbuff.name=holy ward
actors.hero.spells.holyward$holyarmbuff.desc=The Cleric has imbued their worn armor with holy energy, temporarily overriding any existing glyph and causing the armor to block an extra 1 point of damage.\n\nTurns Remaining: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=The Paladin has imbued their worn armor with holy energy, causing the armor to block an extra 3 points of damage.\n\nCasting other spells while holy ward is active will extend its duration by 10 turns per charge spent.\n\nTurns Remaining: %s.

actors.hero.spells.holyweapon.name=holy weapon
actors.hero.spells.holyweapon.ench_name=holy %s
actors.hero.spells.holyweapon.ench_desc=Enemies struck by a holy weapon will take extra magical damage.
actors.hero.spells.holyweapon.short_desc=Temporarily overrides enchantments to boost damage.
actors.hero.spells.holyweapon.desc=يُضفي الكاهن على سلاحه البالي طاقةً مقدسة، مما يجعله يُلحق ضررًا سحريًا إضافيًا بمقدار 2 في كل مرة يُصيب بها عدوًا. لا يستغرق هذا التعويذ وقتًا لإلقائه.   يستمر هذا السحر لمدة 50 دورة، ويلغي أي سحر مفيد آخر يمتلكه السلاح طوال هذه المدة. كما يمكن للضربات غير المسلحة الاستفادة من هذا التأثير.
actors.hero.spells.holyweapon.desc_paladin=_This spell is more powerful when cast by the Paladin._ The additional magical damage is increased to 6, the spell no longer overrides existing enchantments, and casting other spells while holy weapon is active will extend its duration by 10 turns per charge used.
actors.hero.spells.holyweapon$holywepbuff.name=holy weapon
actors.hero.spells.holyweapon$holywepbuff.desc=The Cleric has imbued their worn weapon with holy energy, temporarily overriding any existing enchantment and causing the weapon to deal an extra 2 magical damage on each attack.\n\nTurns Remaining: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=The Paladin has imbued their worn weapon with holy energy, causing their attacks to deal an extra 6 magical damage.\n\nCasting other spells while holy weapon is active will extend its duration by 10 turns per charge spent.\n\nTurns Remaining: %s.

actors.hero.spells.judgement.name=judgement
actors.hero.spells.judgement.short_desc=Damages all visible enemies.
actors.hero.spells.judgement.desc=يضرب الكاهن الأرض بقبضته، مما يتسبب في انفجار ضوئي يُلحق الضرر بجميع الأعداء الذين يراهم. %1$d - %2$d يُلحق ضررًا أساسيًا، ولكنه يُلحق أيضًا ضررًا إضافيًا قدره 33 %% الضرر لكل تعويذة ألقاها الكاهن منذ دخوله في الشكل الصاعد (أو منذ آخر مرة ألقى فيها تعويذة الحكم).   ستتولى المحكمة حاليًا معالجة القضايا. %3$d - %4$d  ضرر.

actors.hero.spells.layonhands.name=lay on hands
actors.hero.spells.layonhands.short_desc=Instantly heals an adjacent character or shields the Paladin.
actors.hero.spells.layonhands.desc=يقوم الفارس بتوجيه الطاقة المقدسة من خلال يديه، فيشفي أو يحمي أي شيء يلمسه.   يستطيع الفارس المقدّس إلقاء هذه التعويذة على أي شخصية مجاورة ليمنحها %1$d الشفاء، أو على أنفسهم لتحقيق مكاسب %1$d الحماية. يتم تحويل الشفاء الزائد الناتج عن هذه التعويذة إلى حماية.   يتم إلقاء هذه التعويذة على الفور ويمكن إلقاؤها بشكل متكرر، ولكن لا يمكنها منح أكثر من ثلاث تعويذات من الحماية في المرة الواحدة

actors.hero.spells.lifelinkspell.name=life link
actors.hero.spells.lifelinkspell.short_desc=Shares damage with an ally, and reduces their damage taken.
actors.hero.spells.lifelinkspell.desc=                   595      يعزز الكاهن الرابطة بينه وبين حليفه المُعزز. وبفضل هذه الرابطة، سيتم تقاسم أي ضرر يلحق بالبطل وحليفه. %1$d ستزداد قوة تعزيز الدفاع لمهارة "قوة الكثيرين" إلى - %2$d %% الضرر المُتلقى. لاحظ أن الضرر يُوزع بعد تأثير الدرع، ولكن قبل تقليل الضرر بواسطة قوة الكثرة.   أثناء تفعيل هذا التأثير، ستنطبق تعاويذ الكاهن المفيدة من المستوى الثالث أو أقل على كل من الكاهن وحليفه إذا كانت ستنطبق على أحدهما فقط
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=life link protection
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=قام الكاهن مؤخراً بإلقاء تعويذة "رابطة الحياة" على هذا الحليف.   بالإضافة إلى الفوائد المعتادة لـ Life Link، فإن هذه الشخصية تتلقى أيضًا ضررًا أقل، ويتم تطبيق أي تعويذات إيجابية للكاهن على كل من الكاهن وهذا الحليف بدلاً من واحد فقط، ولن تنتهي صلاحية Power of Many أثناء تفعيل هذا التأثير.   عدد الأدوار المتبقية: %s .

actors.hero.spells.mindform.name=mind form
actors.hero.spells.mindform.short_desc=Assigns Trinity to a wand or thrown weapon.
actors.hero.spells.mindform.desc=يختار الكاهن عصا سحرية أو أسلحة رمية قام بتحديدها في هذه الجولة ويمنح الثالوث تأثيرها.   عند استخدام ترينيتي، يستطيع الكاهن شن هجوم واحد كما لو كان يستخدم العنصر المختار عند + %d سيؤدي هذا إلى إطلاق جميع التأثيرات التي يؤدي إليها استخدام هذا النوع من العناصر عادةً.   تحل هذه التعويذة محل أي تأثير عقلي آخر مشبع به ترينيتي حاليًا.

actors.hero.spells.mnemonicprayer.name=mnemonic prayer
actors.hero.spells.mnemonicprayer.short_desc=Extends buffs/debuffs on an ally/enemy, & re-applies illuminated.
actors.hero.spells.mnemonicprayer.desc=يتلو الكاهن صلاةً تُطيل مدة جميع التأثيرات الإيجابية أو السلبية على هدف محدد بواسطة %1$d لا يستغرق إلقاء هذه التعويذة وقتًا. ستدوم التأثيرات الإيجابية لفترة أطول على الحلفاء (بما في ذلك الكاهن نفسه)، وستدوم التأثيرات الضارة لفترة أطول على الأعداء.   لا يمكن لدعاء التذكر أن يمدد إلا حالة محددة من التعزيز أو التثبيط مرة واحدة، ولا يمكنه تمديد التعزيزات الممنوحة من قدرات الدروع.

actors.hero.spells.radiance.name=radiance
actors.hero.spells.radiance.short_desc=Illuminates and briefly stuns visible enemies.
actors.hero.spells.radiance.desc=ينفجر الكاهن بنور مقدس، مُذهلاً جميع الأعداء المرئيين لمدة ثلاث جولات. إذا كان العدو مُضاءً بالفعل، فإنّ الإشعاع سيُفعّل ضرر الإضاءة الإضافي، ثم يُطبّق تأثير الإضاءة السلبي. كما سيُضيء الكاهن لمدة مئة جولة إذا كان الطابق الحالي مُظلمًا.

actors.hero.spells.recallinscription.name=recall inscription
actors.hero.spells.recallinscription.short_desc=Repeats a recently used runestone or scroll.
actors.hero.spells.recallinscription.desc=يستخدم الكاهن السحر المقدس لإعادة صياغة تأثير رونية سحرية موجودة على حجر رونية أو لفافة استخدموها في المرة السابقة %s منعطفات.   لا يمكن استخدام تعويذة "استدعاء النقش" لنسخ لفائف الترقية. تختلف تكلفة شحن هذه التعويذة بناءً على العنصر المستخدم مؤخرًا: 2 للحجر الروني، و3 لللفافة، و4 لللفافة النادرة. تتضاعف تكلفة الشحن عند نسخ لفافة التحويل، أو عناصر الخيمياء التي يجب صنعها باستخدام التحويل أو الترقي
actors.hero.spells.recallinscription$useditemtracker.name=recently used rune
actors.hero.spells.recallinscription$useditemtracker.desc=The Cleric has recently used an item that works with the inscribed recall spell. The Cleric can cast the spell to repeat the item's effect.\n\nItem Used: %1$s.\n\nTurns Remaining: %2$s.

actors.hero.spells.shieldoflight.name=shield of light
actors.hero.spells.shieldoflight.short_desc=Grants temporary armor against a target.
actors.hero.spells.shieldoflight.desc=The Cleric creates a thin barrier of light between themselves and an enemy, increasing their armor's block power against that enemy by %1$d-%2$d for 5 turns.\n\nThis spell takes no time to cast, but cannot be used against multiple targets simultaneously.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=shield of light
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=A thin shield of light is standing between this character and an enemy. It's not strong enough to outright block attacks, but will soften them.\n\nTurns Remaining: %s

actors.hero.spells.spiritform.name=spirit form
actors.hero.spells.spiritform.short_desc=Assigns Trinity to a ring or artifact.
actors.hero.spells.spiritform.desc=يختار الكاهن خاتمًا أو قطعة أثرية قام بتحديدها في هذه الجولة (باستثناء الكتاب المقدس) ويمنح القوه المقدسه تأثيرها.   إذا تم اختيار خاتم، فإن القوه المقدسه يمنح تأثير ذلك الخاتم عند + %1$d لمدة 20 دورة.   إذا تم اختيار قطعة أثرية، فإن ترينيتي تُكرر تأثير تلك القطعة الأثرية عند + %2$d لكل قطعة أثرية سلوكيات محددة مختلفة وتكاليف شحن دروع مختلفة عند استخدامها مع القوه المقدسه.   تحل هذه التعويذة محل أي تأثير روحي آخر تتمتع به ترينيتي حاليًا
actors.hero.spells.spiritform$spiritformbuff.name=spirit form
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity's spirit form is currently granting you the power of an item, as if you had it equipped.\n\nNote that spirit form cannot provide another copy of an effect that you're already benefitting from.\n\nCurrent Effect: %1$s.\n\nTurns Remaining: %2$s.

actors.hero.spells.smite.name=smite
actors.hero.spells.smite.short_desc=Guarantees a hit with bonus damage and enchant power.
actors.hero.spells.smite.desc=يُضفي الفارس المقدس على ضربة الاشتباك قوة تدميرية مقدسة.   إضافةً إلى إلحاق الضرر العادي بالهجمات القريبة، يضمن سحر "الضربة القاضية" إصابة الهجمات غير المحملة، ويمنح +300 %% قوة السحر، والصفقات %1$d - %2$d ضرر سحري إضافي.   يتناسب الضرر السحري الإضافي لمهارة "الضربة القاضية" مع مستوى الفارس، وسوف تسبب دائمًا أقصى ضرر سحري إضافي ضد الأعداء الموتى الأحياء أو الشياطين.

actors.hero.spells.stasis.name=stasis
actors.hero.spells.stasis.short_desc=Removes ally from dungeon and preserves them.
actors.hero.spells.stasis.desc=يركز الكاهن اتصاله بحليفه نحوه، مما يؤدي إلى احتجاز الحليف مؤقتًا في نوع من سكون الطاقة داخل الكاهن. سيتم الحفاظ على الحليف لمدة تصل إلى %d وتتحول، مع عدم تأثر جميع التأثيرات الإيجابية عليها بفترة بقائها في حالة سكون.   سيظهر الحليف بجوار الكاهن عند انتهاء حالة التجميد تلقائيًا، أو يمكنه إعادة إلقاء التعويذة فورًا دون أي تكلفة لإنهاء التأثير مبكرًا. يمكن لحالة التجميد أن تُحرّك الحلفاء غير القادرين على الحركة، لكنها لا تنقلهم بين الطوابق
actors.hero.spells.stasis$stasisbuff.name=ally in stasis
actors.hero.spells.stasis$stasisbuff.left_behind=Your immobile ally is left behind.
actors.hero.spells.stasis$stasisbuff.desc=يملك الكاهن حاليًا حليفًا في حالة سكون. تُحفظ جميع التأثيرات الإيجابية على هذا الحليف، بما في ذلك قوة الكثرة، وسيظهر الحليف مجددًا بجانب الكاهن عند انتهاء التأثير. يمكن أيضًا إنهاء التأثير مبكرًا بإعادة تفعيل حالة السكون.   حليف في حالة الجمود: %1$s .  عدد الأدوار المتبقية: %2$s .

actors.hero.spells.sunray.name=sunray
actors.hero.spells.sunray.short_desc=Deals ranged magic damage and blinds a target once.
actors.hero.spells.sunray.desc=يُطلق الكاهن شعاعًا من الضوء الساطع على الهدف، مُلحقًا به ضررًا بالغًا. %1$d - %2$d تسبب في إلحاق الضرر بهم وإصابتهم بالعمى. %3$d تُلحق أشعة الشمس دائمًا أقصى ضرر بالأهداف من الموتى الأحياء والشياطين.   بعد أن يصيب هذا السحر العدو، ستتكيف رؤيته، مما يمنعه من التعرض للعمى مرة أخرى. مع ذلك، إذا أصيب مرة أخرى وهو أعمى بهذا السحر، فإن الضوء سيكون ساطعًا للغاية ويشل حركته.

actors.hero.spells.walloflight.name=wall of light
actors.hero.spells.walloflight.short_desc=Creates a wall that blocks enemies.
actors.hero.spells.walloflight.desc=يقوم الفارس بإنشاء جدار مصنوع من ألواح من الضوء الصلب أمامه مباشرة، بسمك بلاطة واحدة. %1$d يمتد على مساحة البلاطات، ويستمر لمدة 20 دورة.   يعمل هذا الجدار تمامًا كالجدار العادي، إلا أنه شفاف. الأعداء الذين يُحاصرون داخله عند إنشائه سيُصابون بصدمة مؤقتة ويُدفعون للخلف إن أمكن. أي شيء عالق داخل الجدار سيتمكن من الخروج منه.   يمكن إلقاء تعويذة الجدار في أي من الاتجاهات الأصلية الأربعة أو الاتجاهات القطرية الأربعة. إذا كان الجدار مُفعّلاً بالفعل، فيمكن إعادة استخدام التعويذة مجانًا لإزالته فورًا
actors.hero.spells.walloflight.early_end=You dispel the wall of light.
actors.hero.spells.walloflight$lightwall.desc=Shimmering panels of light are blocking passage here.

##main hero
actors.hero.hero.name=انت
actors.hero.hero.leave=You can't leave yet, the rest of the dungeon awaits below!
actors.hero.hero.level_up=مستوي اعلي
actors.hero.hero.new_level=Level up! +Accuracy, +Evasion, +5 HP!
actors.hero.hero.new_talent=+1 Talent Point!
actors.hero.hero.unspent=You have unspent talent points!
actors.hero.hero.level_cap=You cannot grow stronger, but your experiences do give you a surge of power!
actors.hero.hero.you_now_have=you picked up: %s.
actors.hero.hero.you_cant_have=you can't carry: %s.
actors.hero.hero.locked_chest=This chest is locked and you don't have a matching key.
actors.hero.hero.locked_door=You don't have a matching key.
actors.hero.hero.noticed_smth=You noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=بحث
actors.hero.hero.search_distracted=It's hard to concentrate, searching is exhausting.
actors.hero.hero.key_distracted=You can't quite get the lock open, you'll have to keep trying.
actors.hero.hero.pain_resist=The pain helps you resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes with life-giving energy!

##classes
actors.hero.heroclass.warrior=محارب
actors.hero.heroclass.warrior_desc_short=The Warrior endures extra damage with shielding granted by his _broken seal._ The seal can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=يبدأ المحارب بختم مكسور فريد يمنحه دفعة من الحماية عندما تنخفض صحته إلى أقل من النصف. يمكن نقل الختم بين الدروع، ويمكنه نقل ترقية واحدة معه.   يبدأ المحارب أيضًا بسيف قصير مهترئ، وثلاثة أحجار للرمي، ودرع من القماش، وقربة ماء، وحقيبة مخملية.   يقوم المحارب تلقائيًا بتحديد ما يلي:  لفائف تعريف الهوية  جرعات الشفاء  لفائف الغضب
actors.hero.heroclass.warrior_unlock=The Warrior is automatically unlocked.

actors.hero.heroclass.mage=ساحر
actors.hero.heroclass.mage_desc_short=The Mage is an arcane expert and carries a _magical staff_ that's stronger than a wand. The staff can be _imbued with any wand_ the Mage finds.
actors.hero.heroclass.mage_desc=يبدأ الساحر بعصا فريدة، تُشحن أسرع بكثير من العصا السحرية، ولها شحنة إضافية. ويمكن تزويد هذه العصا بأي عصا سحرية يجدها الساحر في الزنزانة.   يبدأ الساحر أيضًا بعصا سحرية مدمجة في عصاه، ودرع من القماش، وقربة ماء، وحقيبة مخملية.   يقوم الساحر بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات اللهب السائل  لفائف الترقية
actors.hero.heroclass.mage_unlock=To unlock the Mage _use a scroll of upgrade to make an item stronger._

actors.hero.heroclass.rogue=لص
actors.hero.heroclass.rogue_desc_short=The Rogue can evade enemies and strike from invisibility using his _cloak of shadows._ He also _detects secrets and traps_ from a greater distance.
actors.hero.heroclass.rogue_desc=يبدأ المحتال بعباءة فريدة من نوعها تُسمى عباءة الظلال، والتي يمكنه استخدامها ليصبح غير مرئي حسب رغبته.   يستطيع المحتال اكتشاف الأسرار والفخاخ من مسافة أبعد.   يبدأ المحتال أيضًا بخنجر، وثلاثة سكاكين رمي، ودرع من القماش، وقربة ماء، وحقيبة مخملية.   يقوم برنامج Rogue بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات الاختفاء  لفائف الخرائط السحرية
actors.hero.heroclass.rogue_unlock=To unlock the Rogue _perform 10 surprise attacks in one game._

actors.hero.heroclass.huntress=صياده
actors.hero.heroclass.huntress_desc_short=The Huntress is a master of thrown weapons and has a _magical bow_ with infinite arrows. She also travels through tall grass _without trampling it._
actors.hero.heroclass.huntress_desc=تبدأ الصيادة بقوس روحي فريد من نوعه، والذي يمكنه إطلاق عدد لا نهائي من الأسهم المستحضرة.   تستطيع الصيادة التنقل عبر العشب الطويل دون أن تدوسه.   تبدأ الصيادة أيضًا بقفازات مرصعة، ودروع قماشية، وقربة ماء، وحقيبة مخملية.   تقوم الصيادة بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات رؤية العقل  لفائف التهويدة
actors.hero.heroclass.huntress_unlock=To unlock the Huntress _hit enemies with thrown weapons 10 times in one game._

actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc_short=The Duelist is a weapons master who can use her weapon to trigger a _special weapon ability._ This special ability is _different for every weapon._
actors.hero.heroclass.duelist_desc=يبدأ المبارز بسيف رابير فريد من نوعه يتمتع بقدرة خاصة يتم إعادة شحنها بمرور الوقت.   كل سلاح في اللعبة له قدرة خاصة مختلفة يمكن للمبارز استخدامها.   يبدأ المبارز أيضًا بـ _مسمارين للرمي_، ودرع من القماش، وقربة ماء، وحقيبة مخملية.   يقوم المبارز بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات القوة  لفائف صورة معكوسة
actors.hero.heroclass.duelist_unlock=To unlock the Duelist _equip a tier 2 or higher weapon with no strength penalty._

actors.hero.heroclass.cleric=cleric
actors.hero.heroclass.cleric_desc_short=The Cleric is a divine spellcaster who uses their unique _holy tome_ to channel divine magic. They can _learn and upgrade spells_ via talents.
actors.hero.heroclass.cleric_desc=يبدأ الكاهن بكتاب مقدس فريد من نوعه، والذي يمكنه استخدامه لإلقاء تعاويذ متنوعة.   تتركز معظم مواهب الكاهن حول تعلم التعاويذ أو تطويرها.   يبدأ الكاهن أيضًا بعصا، ودرع من القماش، وقربة ماء، وحقيبة مخملية.   يقوم رجل الدين بالتعرف تلقائيًا على:  لفائف تعريف الهوية  جرعات النقاء  لفائف إزالة اللعنة
actors.hero.heroclass.cleric_unlock=To unlock the Cleric _fully cleanse the curse on any piece of cursed equipment._

actors.hero.herosubclass.berserker=بربري
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes damage. Rage increases his damage and can be activated at 100% for bonus shielding.
actors.hero.herosubclass.berserker_desc=يكتسب المحارب الشرس غضباً كلما تلقى ضرراً جسدياً، بما في ذلك الضرر الذي يحجبه درعه! يتلاشى الغضب تدريجياً مع مرور الوقت، ولكنه يتلاشى ببطء أكبر إذا كانت نقاط صحته منخفضة.   يمكن أن يتسبب الغضب في زيادة ضرر المحارب بنسبة تصل إلى 50%. عند بلوغه أقصى درجات الغضب، يمكنه أن ينفجر غضبًا، مكتسبًا دفعة من الدروع، ويحافظ على غضبه طالما بقي لديه درع. تتناسب قوة الدرع طرديًا مع مستوى درع المحارب، ويمكن تعزيزها بشكل كبير إذا كانت صحته منخفضة. يحتاج المحارب إلى وقت للتعافي بعد نوبة غضبه
actors.hero.herosubclass.gladiator=مصارع
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo when he makes successful attacks. He can spend combo to use unique abilities.
actors.hero.herosubclass.gladiator_desc=يكتسب المصارع نقطة واحدة من سلسلة الضربات المتتالية في كل مرة ينجح فيها بهجوم باستخدام سلاح يدوي أو سلاح رمي. إذا لم ينجح المصارع في الهجوم خلال 5 أدوار (15 دورًا بعد القضاء على خصم)، تُعاد سلسلة ضرباته المتتالية إلى الصفر.   أثناء قيامه ببناء سلسلة الضربات، يمكن للمصارع استخدام مجموعة متنوعة من القدرات التي تضمن إصابة الهدف:  الضربة المزدوجة: تدفع العدو للخلف، وتحافظ على سلسلة الضربات.  الضربة الرباعية: تُلحق ضررًا بناءً على قوة الدرع  6- كومبو: صدّ، يحافظ على الكومبو  8 ضربات متتالية: إلحاق الضرر بالهدف والأعداء القريبين  10 ضربات متتالية: هاجم مرة واحدة لكل ضربة متتالية
actors.hero.herosubclass.battlemage=ساحر الحرب
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the wand his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=يكتسب الساحر المحارب تأثيرًا إضافيًا كلما هاجم بعصاه في القتال المباشر، كما لو كانت عصاه تحمل تعويذة إضافية. وتعتمد هذه التأثيرات على نوع العصا السحرية التي تحملها عصاه، فلكل عصا تأثيرها الخاص. إضافةً إلى تأثيرات العصا السحرية، تكتسب عصا الساحر المحارب أيضًا نصف شحنة عند استخدامها في الهجوم.
actors.hero.herosubclass.warlock=ساحراسود
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his wands. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=يملك الساحر فرصة لإلحاق علامة روحية بالشخصيات عند استخدام العصي السحرية عليها. وتزداد فرصة إلحاق العلامة الروحية ومدتها مع مستوى العصا.   عندما يتم وسم العدو بعلامة الروح، سيقوم الساحر بشفاء نقطتي صحة مقابل كل 5 نقاط ضرر يلحقها به، ولكن فقط بالهجمات من الأسلحة القريبة أو المقذوفة، وليس من العصي السحرية!
actors.hero.herosubclass.assassin=مغتال
actors.hero.herosubclass.assassin_short_desc=The _Assassin_ can prepare a deadly strike while he is invisible. The longer he waits, the more powerful the attack will be.
actors.hero.herosubclass.assassin_desc=يستعد القاتل لضربته التالية عندما يصبح غير مرئي. كلما طالت فترة استعداده، زادت قوة هجومه التالي. يستمر الاستعداد لمدة تصل إلى 9 أدوار.   بعد الاستعداد، يلحق القاتل ضررًا إضافيًا في هجومه التالي، ويمكنه الانتقال الفوري إلى هدفه، بل ويمكنه حتى قتل الأعداء الضعفاء على الفور.
actors.hero.herosubclass.freerunner=العداء السريع
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which can be used to start freerunning. This grants him bonus speed and evasion for a short while.
actors.hero.herosubclass.freerunner_desc=أثناء تحرك العداء الحر، يكتسب زخمًا متراكمًا. يمكنه اكتساب ما يصل إلى 10 نقاط زخم بعد الجري لعشر دورات، لكنه يفقدها بسرعة إذا توقف عن الحركة. يستطيع العداء الحر استخدام زخمه لبدء الجري الحر، لمدة دورتين لكل نقطة زخم.   عند ممارسة رياضة الجري الحر، يتحرك اللاعب بسرعة مضاعفة، ويكتسب قدرة إضافية على المراوغة تتناسب مع مستواه. بعد انتهاء الجري الحر، هناك فترة انتظار قبل أن يتمكن من استعادة الزخم مرة أخرى
actors.hero.herosubclass.sniper=قناص
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=القناصة بارعة في القتال عن بُعد، وتخترق هجماتها دروع الأعداء. عندما تهاجم عدوًا بسلاح يُرمى، تضع عليه علامة قناص، مما يسمح لها بمتابعة الهجوم بهجوم خاص من قوسها. يختلف هذا الهجوم الخاص باختلاف مستوى تطوير قوسها.   يُطلق القوس غير المُعزز سهماً سريعاً يُلحق ضرراً أقل، ولكنه يُطلق فوراً. أما القوس السريع، فيُطلق وابلاً من ثلاثة أسهم تُلحق ضرراً أقل، مع إمكانية تفعيل التعويذات، ويستغرق دوراً واحداً لإطلاقها. بينما يُطلق القوس المُعزز للضرر سهماً دقيقاً مضمون الإصابة، يُلحق ضرراً إضافياً بناءً على المسافة، ويستغرق دورين لإطلاقه
actors.hero.herosubclass.warden=حارس
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=تتمتع الحارسة بعلاقة وثيقة مع الطبيعة، مما يمنحها مجموعة متنوعة من التأثيرات الإضافية المتعلقة بالعشب والنباتات. فهي قادرة على الرؤية عبر العشب الطويل والمتجعد كما لو كان فراغًا.   تُنبت الحارسة العشب حول أي بذرة ترميها أو تزرعها، وتكتسب تأثيرات خاصة عند دوسها للنباتات. تحل هذه التأثيرات الخاصة محل تأثيرات النباتات العادية، مما يعني أنه لا يوجد نبات ضار لها عند دوسه
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=البطلة بارعة في استخدام أسلحة الاشتباك المباشر، ويمكنها تجهيز سلاح ثانوي بالإضافة إلى سلاحها الأساسي. تستخدم في هجماتها العادية سلاحها الأساسي، ولكن يمكنها تبديل سلاحها الأساسي فورًا واستخدام قدرات أيٍّ من السلاحين.   كما أنها تحصل على شحنتين إضافيتين لقدرة السلاح القصوى وسرعة إعادة شحن قدرة السلاح بنسبة 50%.
actors.hero.herosubclass.monk=راهب
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=الراهبة بارعة في فنون القتال الجسدي. ومع هزيمتها للأعداء، تكتسب طاقةً يمكن استخدامها في مجموعة متنوعة من القدرات الدفاعية والخدمية. هذه الطاقة لا تتلاشى بمرور الوقت، ولكن لها حد أقصى يعتمد على مستوى الراهبة.   1 الطاقة: اضرب بسرعة بالقبضات  2 الطاقة: التركيز لتفادي الهجوم التالي  3 طاقة: اندفاع فوري بالقرب من المكان  4 طاقة: ركل العدو بعيدًا  ٥- الطاقة: التأمل لتطهير الحالات واستعادة شحنة العصا والأداة
actors.hero.herosubclass.priest=priest
actors.hero.herosubclass.priest_short_desc=The _Priest_ gains new long-range spells and an empowered version of guiding light.
actors.hero.herosubclass.priest_desc=يكتسب الكاهن مجموعة متنوعة من التعاويذ الجديدة والمطورة التي تركز على القتال عن بعد والتناغم مع العناصر السحرية.   يستطيع الكاهن إلقاء تعويذة "الضوء الهادي" مجانًا مرة واحدة كل 50 دورة، ويضيء الأعداء المستهدفين مباشرة بأي من تعاويذه، ويمكنه استهلاك تأثير الإضاءة السلبي مع الحلفاء والعصي وبعض القطع الأثرية للحصول على ضرر إضافي يساوي مستواهم + 5.   يحصل الكاهن أيضًا على تعويذة "الإشعاع"، التي تبدد الظلام وتؤثر على جميع الأعداء المرئيين، مما يؤدي إلى تشغيل وتطبيق الإضاءة وصعقهم لفترة وجيزة على حساب شحنتين
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_short_desc=The _Paladin_ gains new short-range spells and empowered versions of holy weapon and ward.
actors.hero.herosubclass.paladin_desc=يكتسب الفارس مجموعة متنوعة من التعاويذ الجديدة والمطورة التي تركز على القتال المباشر والتناغم مع الأسلحة والدروع.   تمنح تعويذات "السلاح المقدس" و"الحماية المقدسة" الخاصة بالفارس مكافآت أكبر، ولم تعد تتجاوز التعويذات والرموز الموجودة، ويمكن تمديدها عن طريق إلقاء تعويذات أخرى.   كما يحصل الفارس على تعويذة "الضربة القاضية"، والتي تتيح له تنفيذ ضربة قريبة مضمونة مع ضرر إضافي وقوة سحرية.

