actors.hero.hero.name=انت
actors.hero.hero.leave=لا يمكنك المغادرة بعد, فبقية الزنزانة تنتظرك في الأسفل!
actors.hero.hero.level_up=مستوي اعلي
actors.hero.hero.new_level=ارتقاء مستوى! +دقة, +تفادي, +5 نقاط صحة!
