windows.wndandroidlocalbackuprestore.title=النسخ الاحتياطي والاستعادة
windows.wndandroidlocalbackuprestore.intro_body=يمكن لبرنامج Shattered Pixel Dungeon إنشاء نسخة احتياطية محلية من تصنيفاتك وشاراتك ومذكراتك في مساحة تخزين يمكن للمستخدم الوصول إليها.\n\nأولاً, يتطلب برنامج Shattered منك إنشاء مجلد وتحديده في مساحة تخزين المستخدم باستخدام مُحدد ملفات النظام. يمكنك أيضاً تحديد مجلد قمت بإنشائه مسبقاً.\n\nسيستخدم برنامج Shattered هذا المجلد لتخزين ملف النسخ الاحتياطي, لذا فكر في تسمية هذا المجلد باسم فريد, مثل "نسخ Shattered الاحتياطية".
windows.wndandroidlocalbackuprestore.assign_folder=تعيين المجلد
windows.wndandroidlocalbackuprestore.main_body=يمكن للعبة Shattered Pixel Dungeon عمل نسخة احتياطية من تصنيفاتك وشاراتك وسجلاتك أو استعادتها باستخدام ملف باسم _'backup.dat'_ في المجلد الذي اخترته: _'%s'_\n\nهل ترغب في إنشاء نسخة احتياطية أو الاستعادة من نسخة احتياطية موجودة?
windows.wndandroidlocalbackuprestore.backup=إنشاء نسخة احتياطية
windows.wndandroidlocalbackuprestore.backup_confirm_body=هل أنت متأكد من رغبتك في إنشاء نسخة احتياطية جديدة في مجلد النسخ الاحتياطي الذي اخترته?\n\n_سيتم استبدال أي ملف backup.dat موجود في ذلك الموقع!_
windows.wndandroidlocalbackuprestore.backup_success=تم إنشاء ملف النسخة الاحتياطية بنجاح!
windows.wndandroidlocalbackuprestore.backup_fail=حدث خطأ أثناء إنشاء ملف النسخة الاحتياطية.
windows.wndandroidlocalbackuprestore.restore=استعادة النسخة الاحتياطية
windows.wndandroidlocalbackuprestore.restore_confirm_body=هل أنت متأكد من رغبتك في الاستعادة من ملف backup.dat في مجلد النسخ الاحتياطي الذي اخترته?\n\n_سيؤدي هذا إلى استبدال جميع بيانات الحفظ لديك حالياً, بما في ذلك مسح ألعابك قيد التقدم!_
windows.wndandroidlocalbackuprestore.restore_confirm_body_old=_هذه النسخة الاحتياطية من إصدار قديم جداً من لعبة Shattered Pixel Dungeon. قد تواجه النسخ الاحتياطية القديمة أخطاءً عند الاستعادة._
windows.wndandroidlocalbackuprestore.restore_success=تمت الاستعادة من النسخة الاحتياطية بنجاح!
windows.wndandroidlocalbackuprestore.restore_fail=واجهت الأشياء التالية أخطاءً أثناء الاستعادة:
windows.wndandroidlocalbackuprestore.restore_file_error=تعذّر قراءة ملف backup.dat, هل أنت متأكد من وجود ملف من صنع Shattered في المجلد المحدد?

windows.wndblacksmith.prompt=حسنا الصفقه هي الصفقه هذا ما استطيع تقديمه لك انا اعمل مع العناصر المعروفه و العناصر الغير ملعونه \n\n_Current Favor:1%d _
windows.wndblacksmith.pickaxe=_المعول (%d نقطة ميزة):_ أظن أنني أستطيع إعادة المعول إليك إن أردت. لدي الكثير منه.
windows.wndblacksmith.pickaxe_verify=هل انت متاكد من انك تريد هذا الشي القديم الأحجار حولنا ليست لينه مثل التي في المنجم لن تكون قادراً علي التنقيب بها بعد الان
windows.wndblacksmith.pickaxe_free=حسنا لقد قمت بعمل رائع سوف امنحه لك مجانا
windows.wndblacksmith.pickaxe_yes=اجل اريده
windows.wndblacksmith.pickaxe_no=لا تهتم
windows.wndblacksmith.reforge=_Reforge (1%dfavor):_انا استطيع ان ادمج اثنين من نفس الشي الي واحد بجوده اعلي
windows.wndblacksmith.harden=_Harden (1%dfavor):_ حسنا استطيع تقسيه الاسلحه و الدروع مما يجعلها تحافظ علي السحر و النقوش الرونيه
windows.wndblacksmith.upgrade=_ترقية (%d خدمة):_ إذا كان لديك عنصر دون +2 فيمكنني ترقيته لك.
windows.wndblacksmith.smith=_حدادة (%d خدمة):_ يمكنني محاولة صنع سلاح أو درع لك من الصفر. سيكون من طبقة أعلى وغالباً مُرقّى, وسيكون لك بعض الخيار فيما تحصل عليه.
windows.wndblacksmith.smith_verify=حسناً, سأُسخّن الفرن ثم يمكنك اختيار ما تريد.
windows.wndblacksmith.smith_yes=حسناً, سخّن الفرن.
windows.wndblacksmith.smith_no=لا تهتم
windows.wndblacksmith.cashout=_استبدال (كل الخدمة):_ يمكنني ببساطة إعطاءك بعض الذهب العادي الذي أملكه. قطعة واحدة لكل نقطة خدمة.
windows.wndblacksmith.cashout_verify=حسناً, إذن تلك %d قطعة ذهبية. لكنني لن أعمل لك أكثر بعد هذا!
windows.wndblacksmith.cashout_yes=أعطني الذهب.
windows.wndblacksmith.cashout_no=لا تهتم
windows.wndblacksmith$wndreforge.message=حسناً, يمكنني إعادة صياغة عنصرين معروفين من النوع نفسه. سيتم تدمير الأضعف لمنح الأقوى ترقية. إذا كانا في المستوى نفسه, فسأحتفظ بالعنصر الموجود على اليسار.
