windows.wndsadghost.crab=شكراً لك, لقد قتل ذلك السرطان العملاق وأستطيع أخيراً أن أرتاح... أتساءل ما السحر الملتوي الذي سمح له بالعيش طويلاً...
windows.wndsadghost.give_item=تفضل بأخذ أحد هذه الأشياء, فهي عديمة الفائدة بالنسبة لي الآن... ربما تساعدك في رحلتك...\n\nأيضًا... هناك غرض مفقود في هذه الزنزانة عزيز جدًا على قلبي... إذا عثرتَ يومًا... على وردتي...
