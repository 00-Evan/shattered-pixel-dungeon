journal.document.adventurers_guide.title=Tome of Dungeon Mastery
journal.document.adventurers_guide.intro.title=مقدمة
journal.document.adventurers_guide.intro.body=مرحباً أيها المغامر، أنت تقرأ كتاب إتقان الأبراج المحصنة! يُفضل استخدام هذا الدليل كمرجع، وسيخبرك بطريقة سحرية متى يكون من الأفضل قراءة كل صفحة. \n\n(عندما يومض زر اليوميات، حدده لقراءة ما يخبرك به الدليل! بعض الصفحات مفقودة، ربما يمكنك العثور عليها في الزنزانة)؟
journal.document.adventurers_guide.examining.title=فحص
journal.document.adventurers_guide.examining.body=من المهم دراسة الأعداء والمحيط بدلاً من التسرع الأعمى! تعوّد على فحص كل شيء جديد\n\n(يمكنك الفحص باستخدام زر العدسة المكبرة ثم تحديد ما تريد فحصه. يمكنك أيضًا فحص التأثيرات الإيجابية أو السلبية عن طريق تحديد أيقوناتها.)
journal.document.adventurers_guide.surprise_attacks.title=الهجمات المفاجئة
journal.document.adventurers_guide.surprise_attacks.body=ضمن الهجمات المفاجئة إصابة الهدف، مما يجعلها مفيدة بشكل خاص ضد الأعداء المراوغين مثل الثعابين والأشباح.\n\nيمكنك مفاجأة الأعداء مباشرة بعد دخولهم من الباب أثناء مطاردتهم لك، أو عندما يفقدون أثرك
journal.document.adventurers_guide.identifying.title=تحديد العناصر
journal.document.adventurers_guide.identifying.body=تختلف ألوان الجرعات والرموز الموجودة على المخطوطات في كل زنزانة. يمكن ترقية المعدات غير المعروفة أو سحرها إذا حالفك الحظ، أو قد تكون ملعونة! تعتبر لفائف تحديد الهوية أو الترقية أو إزالة اللعنة مفيدة للغاية إذا كنت ترغب في تقليل مخاطر استخدام المعدات غير المعروفة. (يمكنك العثور على قائمة بجميع العناصر التي حددتها في علامة تبويب الكتالوج في دفتر يومياتك)
journal.document.adventurers_guide.food.title=التعامل مع الجوع
journal.document.adventurers_guide.food.body=يُعدّ ترشيد استهلاك الطعام بشكل فعال أحد أفضل الطرق لتحسين فرصك في البقاء على قيد الحياة، فلا تحتاج دائمًا إلى تناول الطعام بشكل صحيح عندما تشعر بالجوع! عندما لا تكون جائعًا، ستستعيد صحتك ببطء، لذلك إذا تناولت الطعام وأنت تتمتع بصحة كاملة، فإن هذا التجدد سيضيع هباءً! إذا قمت بتوزيع وجباتك على فترات تتناسب مع صحتك، فسوف يدوم طعامك لفترة أطول بكثير
journal.document.adventurers_guide.alchemy.title=الخيمياء والحلي
journal.document.adventurers_guide.alchemy.body=إذا لم تجد عنصرًا استهلاكيًا مفيدًا، يمكنك استخدامه كمكون في الخيمياء أو تحويله إلى طاقة خيميائية متعددة الأغراض. كما أن جرعات الطاقة واللفائف تُشير إلى ذلك أيضًا!   الحلي نوع فريد من المعدات يتم صنعها وتطويرها باستخدام الخيمياء. تُصنع هذه الحلي باستخدام محفز سحري خاص بها وقليل من الطاقة الخيميائية.   (يوجد أول وعاء للخيمياء في الطابق الثالث أو الرابع من الزنزانة. كما توجد صفحات من كتاب وصفات الخيمياء بالقرب من هذه الأوعية أيضًا.)
journal.document.adventurers_guide.dieing.title=Handling Defeat
journal.document.adventurers_guide.dieing.body=إن استكشاف الأبراج المحصنة أمر خطير، ومعظم المغامرين يلقون حتفهم في النهاية.   الحظ يساعد، لكن أفضل المغامرين يستخدمون كل حيلة صغيرة لتحسين فرصهم.   (لا تنزعج إذا كنت تموت كثيراً، فهذه اللعبة صعبة! ركز على تعلم اللعبة والتحسن تدريجياً، وليس على الفوز فوراً.)
journal.document.adventurers_guide.searching.title=بحث
journal.document.adventurers_guide.searching.body=تمتلئ الأبراج المحصنة بأبواب سرية وفخاخ تبدو غير مرئية للوهلة الأولى. يمكنك قضاء بعض الوقت والبحث بدقة إذا كنت تشك في وجود باب أو فخ مخفي في مكان قريب.   (يمكنك البحث في جميع المربعات المحيطة بك باستخدام زر العدسة المكبرة مرتين. ربما توجد بعض الأبواب المخفية بالقرب من المكان الذي وجدت فيه هذه الصفحة!)
journal.document.adventurers_guide.strength.title=قوه
journal.document.adventurers_guide.strength.body=ليس هناك وقت للتدرب على الأسلحة والدروع التي تجدها في الزنزانة، لذلك ستحتاج إلى قوة بدنية هائلة لاستخدامها بفعالية.   تُعد جرعات القوة ولفائف الترقية الطريقة الأكثر فعالية لتلبية متطلبات القوة للمعدات ذات المستوى الأعلى.   من المهم البدء في استخدام العناصر عالية المستوى في نهاية المطاف، ولكن لا تتجاهل المعدات التي يمكنك استخدامها الآن.
journal.document.adventurers_guide.upgrades.title=تطويرات
journal.document.adventurers_guide.upgrades.body=كلما توغلت أكثر في الزنزانة، زادت أهمية استخدامك لمعدات عالية المستوى مطورة بطريقة سحرية، ولكنك ستحتاج أيضًا إلى القوة لاستخدامها بشكل صحيح.   لا تحتاج العصي والخواتم والتحف إلى القوة، ولكن استخداماتها محدودة أو لا تساعد بشكل مباشر في القتال.   إن اتخاذ خيارات جيدة بشأن ما تقوم بترقيته أمر بالغ الأهمية للبقاء على قيد الحياة في وقت مبكر من الزنزانة، ولتهيئة نفسك للنجاح لاحقًا في الزنزانة.
journal.document.adventurers_guide.looting.title=Effective Looting
journal.document.adventurers_guide.looting.body=   الغرف التي تقع خلف أبواب مغلقة أو تحتوي على عوائق عادةً ما تحتوي على غنائم أفضل. عندما يعترض عائق طريقك، يمكنك عادةً العثور على عنصر يساعدك في نفس الطابق.   ستجد دائمًا جرعتين من القوة و3 لفائف ترقية في كل منطقة من مناطق الزنزانة المكونة من خمسة طوابق، لذا فهي مؤشر رائع على مدى جودة استكشافك.   (يمكنك الاطلاع على قائمة المعالم والمفاتيح غير المستخدمة في علامة تبويب الملاحظات في نافذة اليوميات.)
journal.document.adventurers_guide.levelling.title=الحصول علي الخبره
journal.document.adventurers_guide.levelling.body= يؤدي رفع المستوى إلى تحسين إحصائياتك ومنحك نقاط موهبة، مما قد يُحدث فرقًا كبيرًا في القتال. من الأفضل أن يكون لديك مستوى واحد على الأقل لكل طابق من الزنزانة.   قد يكون من المغري التسرع وتجنب الاستكشاف أو القتال، لكن القيام بذلك سيحرمك من الإمدادات والخبرة.   (يمكنك الاطلاع على معلومات حول بطلك، بما في ذلك نقاط الخبرة، في لوحة الحالة الموجودة في زاوية واجهة اللعبة. حدد صورة بطلك للحصول على المزيد من المعلومات.)
journal.document.adventurers_guide.positioning.title=Positioning
journal.document.adventurers_guide.positioning.body=لا تقل أهمية الاستراتيجية عن أهمية المعدات. ويمكن عادةً تجنب المواقف السيئة، مثل الحصار، من خلال التمركز الجيد.   فعلى سبيل المثال، تحتوي معظم الأبراج المحصنة على ممرات ضيقة تجبر الأعداء على قتالك واحدًا تلو الآخر. وغالبًا ما تحتوي هذه الممرات على مداخل لشن هجمات مفاجئة أيضًا!   هناك العديد من الطرق الصغيرة لاستخدام خصائص البيئة مثل العشب والماء والحفر والفخاخ لصالحك أيضًا.
journal.document.adventurers_guide.magic.title=هجمات سحريه
journal.document.adventurers_guide.magic.body=تخترق الهجمات السحرية الدروع بسهولة ويصعب تفاديها. هذا يعني أن الضرر الناتج عن العصي السحرية مضمون للغاية، ولكنه يجعل الأعداء السحريين في غاية الخطورة!   لكن الهجمات السحرية لها عيوبها دائماً. فالعصي السحرية لها عدد محدود من الشحنات، وعادةً لا يستطيع الأعداء السحريون استخدام سحرهم في نطاق قريب.   عند مواجهة الأعداء الذين يستخدمون السحر، من المهم تعلم كيفية منعهم من استخدامه ضدك.

journal.document.alchemy_guide.title=ارشادات الخمياء
journal.document.alchemy_guide.potions.title=Intro and Potions
journal.document.alchemy_guide.potions.body=أهلاً بكم في التطبيقات العملية للكيمياء! هذا الكتاب مرجع لوصفات صنع العناصر في وعاء الكيمياء.   سنبدأ بالوصفة الأكثر شهرة: الجرعات السحرية!   استخدم ثلاث بذور لتحضير جرعة عشوائية! لكل بذرة جرعة مقابلة، استخدم عدة بذور من نفس النوع لزيادة فرصة أن تكون الجرعة مرتبطة بالبذور التي استخدمتها
journal.document.alchemy_guide.stones.title=Creating Runestones
journal.document.alchemy_guide.stones.body=Mixing a scroll into an alchemy pot will imbue its magic into two rocks within the pot. This creates runestones and identifies the scroll!
journal.document.alchemy_guide.energy_food.title=Energy and Food
journal.document.alchemy_guide.energy_food.body=تتطلب العديد من الوصفات طاقة كيميائية بلورية، تُصنع عن طريق تفكيك المواد الاستهلاكية في وعاء كيميائي. كما يمكن التعرف عليها من خلال جرعات أو لفائف السحر. بعض الوصفات التي تتطلب طاقة سحرية، لكن هذه الوصفات تشبه الطبخ التقليدي
journal.document.alchemy_guide.exotic_potions.title=جرعات غريبه
journal.document.alchemy_guide.exotic_potions.body=Potions can be mixed with energy to create exotic potions. They have more powerful effects, but are often useful in different ways.
journal.document.alchemy_guide.exotic_scrolls.title=Exotic Scrolls
journal.document.alchemy_guide.exotic_scrolls.body=يمكن صنع لفائف غريبة باستخدام بعض الطاقة ولفافة. وهي أقوى وأغلى ثمناً من الجرعات الغريبة.
journal.document.alchemy_guide.bombs.title=قنابل محسنه
journal.document.alchemy_guide.bombs.body=A standard black powder bomb can be mixed with a specific item to create an enhanced bomb.
journal.document.alchemy_guide.weapons.title=تحسين الاسلحه
journal.document.alchemy_guide.weapons.body=يمكن استخدام بعض الأسلحة الأخف وزناً أو الأكثر سحراً في الخيمياء! كل مجموعة أسلحة تُرمى تُنتج كمية كافية من المعدن السائل لإصلاح مجموعة أخرى من نفس المستوى والفئة بالكامل. لاحظ أن تحويل مجموعة إلى سلاح سحري سيؤدي إلى تدميرها بالكامل، حتى لو لم تكن جميع أجزائها موجودة! ستنتج عصا واحدة ما يكفي من الراتنج السحري لترقية عصاتين من نفس المستوى، ولكن ليس أعلى من +3
journal.document.alchemy_guide.brews_elixirs.title=المشروبات والإكسيرات
journal.document.alchemy_guide.brews_elixirs.body=Brews and elixirs are advanced potions with a variety of effects, usually with a single use.
journal.document.alchemy_guide.spells.title=تعاويذ
journal.document.alchemy_guide.spells.body=Spells are contained in crystals and provide a variety of effects, usually with multiple uses.

journal.document.intros.title=Region Introductions
journal.document.intros.discover_hint=You can find this text when entering a specific region for the first time.
journal.document.intros.dungeon.title=زنزانه
journal.document.intros.dungeon.body=لقد غامر العديد من الأبطال بدخول الزنزانة قبلك من المدينة العلوية، ولم يُسمع عن معظمهم مرة أخرى.   يُقال إن شرًا قديمًا يتربص في الأعماق، يحرس تميمة يندور العظيمة. وحتى الآن، لا تزال الطاقة المظلمة تشع من الأسفل، وتشق طريقها إلى المدينة.   هل ستتغلب على الزنزانة وتحصل على التميمة؟ حان الوقت لبدء مغامرتك الخاصة
journal.document.intros.sewers.title=Sewers
journal.document.intros.sewers.body=تشكل الطوابق العليا من الزنزانة في الواقع نظام الصرف الصحي للمدينة.  مع تسلل الطاقة المظلمة من الأسفل، أصبحت مخلوقات المجاري، التي كانت عاديه وغير مؤذية، أكثر شراسة. واضطرت المدينة إلى إرسال دوريات حراسة إلى الأسفل في محاولة للحفاظ على سلامة من هم في الأعلى.   هذا المكان خطير، لكن على الأقل السحر الشرير الذي يعمل هنا ضعيف
journal.document.intros.prison.title=سجن
journal.document.intros.prison.body=قبل سنوات عديدة، تم بناء سجن هنا لإيواء المجرمين الخطرين. كان السجن يخضع لرقابة صارمة وأمن مشدد، وكان يتم جلب المدنين من جميع أنحاء البلاد إليه لقضاء عقوبتهم.   لكن سرعان ما بدأ الضباب المظلم يتسلل من الأسفل،  وبدا بتشويه عقول الحراس والسجناء على حد سواء.   استجابةً للفوضى المتصاعدة، أغلقت المدينة السجن بالكامل. لا أحد يعلم ما حلّ بمن تُركوا ظنّاً منهم أنهم أموات داخل هذه الجدران
journal.document.intros.caves.title=كهوف
journal.document.intros.caves.body=تمتد هذه الكهوف قليلة السكان أسفل السجن المهجور. كانت هذه الكهوف، الغنية بالمعادن، مركزًا للتجارة والصناعة المزدهرة لمجتمع الأقزام في الأسفل، لكنها هُجرت عندما أصبح الأقزام مهووسين بالسحر الأسود.   أصبحت الكهوف الآن مأهولة في الغالب بالحياة البرية الجوفية، والغول، والآلات المهجورة؛ ومن المحتمل أنها فسدت بفعل نفس القوة التي أثرت على المناطق الموجودة في الأعلى.
journal.document.intros.city.title=Dwarven Metropolis
journal.document.intros.city.body=كانت مدينة الأقزام الكبرى ذات يوم أعظم مدن الأقزام. في أوج ازدهارها، بنى الأقزام آلات رائعة من المعدن والسحر سمحت لمدينتهم بالتوسع بسرعة.   ثم، في أحد الأيام، أُغلقت أبواب المدينة، ولم يُسمع عن الأقزام شيء بعد ذلك. أما القلة الذين نجوا من المدينة عند إغلاقها، فقد رووا قصصًا عن ساحر مجنون سرق العرش، وعن السحر الرهيب الذي تعلم تسخيره.
journal.document.intros.halls.title=Demon Halls
journal.document.intros.halls.body=لقد شوّهت السحر الأسود هذه القاعات العميقة لمدينة الأقزام. في الماضي، كانت هذه المناطق موطنًا لبلاط ملك الأقزام من السحرة النخبة، ولكن يبدو الآن أنها قد استولت عليها قوةٌ أكثر شرًا...   تسكن هذه القاعات شتى أنواع المخلوقات الشيطانية المرعبة، بقيادة قوة مظلمة رهيبة. إذا لم يكن ملك الأقزام مصدر الفساد المستشري، فلا بد أن يكون ما يوجد هنا هو السبب.   توخ الحذر، فقلة قليلة من المغامرين قد نزلوا إلى هذا العمق
journal.document.intros.halls.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.

journal.document.sewers_guard.title=Guard's Letters
journal.document.sewers_guard.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.sewers_guard.new_position.title=My New Position!
journal.document.sewers_guard.new_position.body=الخامس والثمانون من الخريف، 375  أمي وأبي العزيزين،   قلت لكم إن كل هذا الجهد في الحرس المدني سيؤتي ثماره. لقد تمت ترقيتي للتو!   تلقيت دعوة للانضمام إلى فريق متخصص يعمل في المجاري. يبدو أن هناك مشكلة مع القوارض والمجرمين هناك، ومهمتنا هي القضاء عليهم. إنه عمل شاق، لكن المجاري دافئة في الشتاء، وأجره ثلاثة أضعاف أجر الحراسة العادية!   الأمر برمته سري بعض الشيء، لذا لا أستطيع إرسال هذه الرسالة. أشعر بالغرابة لعدم مراسلتك، لذا سأستمر في الكتابة على أي حال. ربما أستطيع إطلاعك عليها يوماً ما.   أفضل،  - سونيا
journal.document.sewers_guard.dangerous.title=A Dangerous Position...
journal.document.sewers_guard.dangerous.body=الثامن والثمانون من الخريف، 375  أمي وأبي العزيزين،   أفهم الآن لماذا أصبح الراتب جيداً جداً، فالمجاري مليئة بالوحوش! "الحشرات" و"الخارجون عن القانون" هم جرذان عملاقة متعطشة للدماء وقطعان من الغنولز الغاضبة.   لحسن الحظ، بقية أعضاء فريقي يعرفون ما يفعلونه جيداً. قائد فريقنا، توماس، خبير في هذا المجال. أحاول التعلم بسرعة حتى لا أكون عبئاً عليهم.   هذه الوظيفة أخطر بكثير مما كنت أظن. أنا سعيد لأنني لا أستطيع إرسال هذه الآن، لا أريدك أن تقلق.   سأحافظ على سلامتي.  - سونيا
journal.document.sewers_guard.crabs.title=Giant Crabs!
journal.document.sewers_guard.crabs.body=الحادي عشر من الشتاء، 376  أمي وأبي العزيزين،   وكأنّ الفئران لم تكن كافية، ففي الأعماق توجد سرطانات عملاقة! اندفع أحدها نحوي مباشرةً وأصاب لي إصابة بالغة قبل أن نقتله. يقول توماس إنّها ليست غلطتي، لكنّني أعلم أنّه يحاول فقط أن يكون لطيفًا معي.   لحسن الحظ، صادفنا في طريقنا للخروج مغامراً كان لديه بعض مرهم عشبة الشمس. ربما لم يكن لي لينجو لولا ذلك المرهم.   رأيتُ المغامر يحدّق في وردة قبل رحيله، وقال إنها هدية. لماذا يُخاطر بحياته هنا إن كان هناك من يهتم لأمره إلى هذا الحد؟ هذا بالضبط ما أفعله، أليس كذلك؟ أشعر وكأنني أتورط في أمر يفوق طاقتي
journal.document.sewers_guard.guild.title=The Thieves' Guild
journal.document.sewers_guard.guild.body=23من فصل الشتاء، 376  أمي وأبي العزيزين،   لم نرَ وحوشاً جديدة هذه المرة، بل صادفنا مجموعة صغيرة من نقابة اللصوص أثناء قيامنا بدورية.   كل ما سمعته عن النقابة كان سيئاً، لكن بقية فريقي بدوا ودودين معهم. تبادل توماس المعلومات والإمدادات مع أحدهم قبل أن نفترق.   لا أفهم، ألم يكن من المفترض أن نتخلص من الخارجين عن القانون؟ حتى أن توماس قال ألا نذكر هذا لأي شخص في القيادة. مع ذلك، كانت معلوماتهم ومؤنهم مفيدة للغاية، ولم نكن لنستطيع تحمل المزيد من القتال.   أظن أننا جميعاً في هذا معاً هنا
journal.document.sewers_guard.lost.title=We're Lost
journal.document.sewers_guard.lost.body=الأربعون من الشتاء، 376   أنا وتوماس تائهان. لقد طُردنا من الفريق أثناء قتالنا لبعض الغيلان. لم يُصب أيٌّ منا بأذى، لكن المجاري السفلية أشبه بالمتاهة.   يقول توماس إنه يعرف طريقًا للخروج، لكنه يبدأ من مدخل السجن القديم في أسفل المجاري. لا أحب النزول إلى الأعماق، لكن ليس لدينا أي مؤن، والنزول أسرع بكثير من التجول بحثًا عن مسار دوريتنا.   سيكون كل شيء على ما يرام. توماس يعرف ما يفعله
journal.document.sewers_guard.not_worth.title=It's Not Worth It
journal.document.sewers_guard.not_worth.body=واجهنا أنا وتوماس وحشًا ضخمًا من مادة لزجة عند مدخل السجن. قبل أن نتمكن من الرد، أطلق علينا وابلاً من السحر. تلقى توماس معظمه. لقد رحل.   لا يُعادل أي مبلغ من المال هذا الوضع. سأغادر عبر الطريق الذي أخبرني به توماس. ثم سأستخدم ما كسبته كحارس لنقل والديّ وأنا بعيدًا عن هذه المدينة الملعونة. جزء مني يتمنى أن يكون للملك خطة لكل هذا، لكنني أشك في ذلك.   أترك هذه الرسائل كتحذير للآخرين. الأمر ليس مجرد وجود فئران وسرطانات عملاقة، بل هناك خطب جلل هنا

journal.document.prison_warden.title=Warden's Journal
journal.document.prison_warden.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.prison_warden.journal.title=Keeping a Journal
journal.document.prison_warden.journal.body=الأول من الربيع، 362   هذه هي أولى تدويناتي في دفتر يوميات مديرة السجن كيانا سميث. مع كل ما يحدث مؤخراً، قررتُ أن أبدأ بتدوين يومياتي لأرتب أفكاري.   إدارة سجن يقع على عمق نصف ميل تحت الأرض لم تكن لتكون مهمة سهلة قط، ولكن يبدو مؤخراً أن نوعاً من الاضطرابات المنظمة قد بدأت. فقد بدأ السجناء بالتصرف بشكل سيء دون سبب واضح، ثم رفضوا تقديم أي تفسير لذلك.   بدأ بعض الحراس يقولون إن المكان مسكون. لا يمكنني السماح لرجالي بنشر الشائعات، لكن لا يمكنني لومهم تمامًا على شعورهم بالقلق.  - سميث
journal.document.prison_warden.recruits.title=New Recruits
journal.document.prison_warden.recruits.body=الثمانون من الربيع، 362   كما وعدنا، وصل اليوم عدد من المجندين الجدد. يبدو الأمر كالمعتاد، قليل منهم واعدون وكثير منهم مجرد جنود عاديين لا يهمهم سوى الراتب. مع ذلك، فإن وجود كل هذه القوة الجديدة سيساعد كثيراً في التعامل مع نزلائنا المشاغبين مؤخراً.   في وظيفة كهذه، من المهم معرفة من يمكنك الوثوق به. يبدو أن الموظف الجديد، توماس، واعدٌ للغاية. أحتاج إلى كل مساعدة ممكنة الآن، لذا إذا كان أداؤه جيدًا، فسأسعى لترقيته سريعًا.  - سميث
journal.document.prison_warden.mines.title=Sealing the Mines
journal.document.prison_warden.mines.body=الرابع والخمسون من فصل الشتاء، 363   وصل اليوم فريق من المهندسين من المدينة، قائلين إنهم جاؤوا لإغلاق المدخل القديم للمناجم في الأسفل. أظن أن المدينة لم تعد ترغب في عناء صيانة الممر. وكالعادة، لم يتم إبلاغي مسبقاً.   أخبرني كبير مهندسيهم أيضاً ببعض الهراء عن تسرب سحر الأقزام من المناجم. لا أصدق كلمة واحدة مما قاله.   أصبح الوضع تحت سيطرة أفضل بكثير مع طاقمنا الجديد، لكن جذور المشكلة لا تزال قائمة. من الواضح أن هناك شيئًا ما يؤثر على النزلاء هنا، ولن يغير هدم بعض الجدران شيئًا.  - سميث
journal.document.prison_warden.rotberry.title=Rotberry Plant
journal.document.prison_warden.rotberry.body=23من الخريف، 363   تلقيت اليوم هدية جميلة من فيليكس. إنها نوع من الشجيرات الحمراء الزاهية تسمى "روتبري".   سبق أن ذكرتُ له مدى كآبة هذا المكان، ويبدو أنه كان يستمع. يقول إن هذه النبتة لا تحب الضوء والماء، لذا عليّ تقليم أوراقها مرةً في الشهر تقريبًا. لا بد أن التقليم مهم، فقد ذكره مرارًا في رسالته.   بالطبع، لا يفعل فيليكس أي شيء مجاناً. يقول إن البذور التي تنتجها هذه النبتة رائعة لصنع العصي السحرية، لذا من الطبيعي أن أدين له ببعضها في كل مرة تنتج فيها النبتة بذوراً.  - سميث
journal.document.prison_warden.no_support.title=No Support
journal.document.prison_warden.no_support.body=الحادي عشر من الربيع، 364   ما الذي تفكر فيه المدينة بحق الجحيم؟ بعد أن طلبت المساعدة بشكل عاجل، لم أتلق أي رد، ولا حتى اعتذار فارغ كما يفعلون عادةً عندما تُرفض طلباتي.   في هذه الأثناء، يزداد وضع النزلاء سوءًا، بل إن بعض الحراس بدأوا بإثارة المشاكل. هل يخططون لترك الوضع يتفاقم حتى نصل إلى مرحلة الشغب؟!   على الأقل، ظل توماس موثوقًا به كعادته. كانت مساعدته التنظيمية لا تُقدّر بثمن، وفكرته بتفعيل وحدات DM-100 القديمة كانت مؤسفة لكنها ضرورية. أنا واثق من قدرتي على السيطرة على هذا الوضع، كل ما أحتاجه هو بعض الدعم!  سميث
journal.document.prison_warden.letter.title=Letter to Thomas
journal.document.prison_warden.letter.body=توماس،   لقد كنت صديقاً رائعاً، لذا فأنا أقدم لك معروفاً.   عندما تبدأ نوبتك الليلة، أغلق زنزانة تينغو بإحكام، وألقِ المفتاح في أي زاوية، ثم اخرج. لا يهم إن كان السجناء الآخرون غير مراقبين، فسرعان ما سيعجز الجميع عن مغادرة هذا المكان. يجب إبقاء ذلك المجنون تحت السيطرة، فإذا هرب فلا أحد يعلم ما سيفعله.   لا تخبر أحداً بهذا، ولا تكلف نفسك عناء البحث عني. فالقائد لا بد أن يغرق مع سفينته.  - كيانا

journal.document.caves_explorer.title=Explorer's Log
journal.document.caves_explorer.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.caves_explorer.expedition.title=Expedition Start!
journal.document.caves_explorer.expedition.body=الأول من الصيف، 308   اليوم تبدأ رحلتنا الاستكشافية التي تستغرق أربعة أسابيع إلى مناجم الأقزام المهجورة! لقد كلفني الملك بنفسه باستكشاف المنطقة. أهدافي الرئيسية هي العثور على أي موارد طبيعية غير مستغلة، ومسح الكهوف تمهيداً لمشروع بناء سجن محتمل.   مع أنني قادر على الدفاع عن نفسي، فقد قبلتُ مرافقة من حرس المدينة بناءً على إصرار الملك. إنهم مجموعة من الحمقى، ولكن طالما أنهم لا يعيقونني، فإن وجودهم مقبول.   من المتوقع أن نقوم بتنظيف المجاري والوصول إلى المناجم بحلول المساء.  - أرشيبالد دروموند. كبير السحرة، معهد السحرة الجنوبي
journal.document.caves_explorer.gold.title=So Much Gold!
journal.document.caves_explorer.gold.body=الرابع من الصيف، 308   كانت أيامنا الأولى مثمرة للغاية! بعد إنشاء معسكرنا، انطلقنا لاستكشاف بعض المناطق العلوية من المنجم المهجور. ورغم وجود الكثير من الخردة عديمة الفائدة التي تركها الأقزام، إلا أن العديد من جدران الكهوف تعج بالذهب!   للأسف، لسنا أول من وصل إلى هنا. الكهوف تعجّ بالحيوانات البرية العدوانية، ويبدو أن قطعان الغيلان مهتمة بالذهب أيضاً. أعترف أنني كنتُ قاسياً على حراسي المرافقين، فقد كانوا مستكشفين وحراساً شخصيين أكثر كفاءة مما توقعت.   على الرغم من هذا النجاح، لا يزال أمامنا الكثير من المناجم لاستكشافها.  - أرشيبالد
journal.document.caves_explorer.troll.title=Met a Troll
journal.document.caves_explorer.troll.body=الحادي عشر من الصيف، 308 بعد أن بدأنا استكشافنا للجزء الأوسط من المناجم، صادفنا وجهًا ودودًا! حسنًا... ودودًا نسبيًا. أقام قزم كهف ورشة حدادة صغيرة هناك. كان فظًا وقليل الكلام، لكنه أصلح معداتنا مقابل بعض الذهب. لسوء الحظ، أخبرنا الحداد المتصيد أيضًا أن كل هذا الذهب الجميل ليس جيدًا كما يبدو. فهو يسميه "الذهب الداكن"، ويبدو أنه يتلف بسرعة تحت أشعة الشمس. وهذا يفسر بالتأكيد سبب عدم وجود أي نزاعات على الموارد هنا. أظن أننا بحاجة إلى التعمق أكثر قليلاً لنرى ما إذا كان هناك أي شيء أكثر قيمة. - أرشيبالد
journal.document.caves_explorer.city.title=The City Entrance
journal.document.caves_explorer.city.body=من الصيف، 308   لقد مرّت ثلاثة أسابيع، وبعد أن أمضينا معظم الأيام العشرة الماضية في استكشاف أعماق المناجم، وصلنا أخيرًا إلى قاعها. وجدنا العديد من الآلات المعدنية وبوابة ضخمة تمنع الدخول إلى مدينة الأقزام القديمة.   حذرنا الحداد من بعض هذه الآلات. يبدو أنها مصممة للدفاع عن المنطقة، ولديها ميل للتشغيل عند العبث بها. ليس لدينا أي عمل في المدينة، وقيمة المعدن ضئيلة للغاية، لذا رأينا أنه من الأفضل أن نأخذ تحذيره على محمل الجد ونعود أدراجنا.   لا بد لي من الاعتراف بأنني كنت فضولياً، لكن التحقيق هناك بالتأكيد لم يكن يستحق المخاطرة.  - أرشيبالد
journal.document.caves_explorer.alive.title=It's Alive!
journal.document.caves_explorer.alive.body=23من الصيف، 308   دبت الحياة في إحدى آلات الأقزام بطريقة ما! كنا نمرّ بجوارها فحسب عندما انقضّت علينا وكادت تسحق اثنين من مجموعتنا بقبضتيها المعدنيتين الضخمتين. لحسن الحظ، كنت أحمل عصا التدمير معي. بضع ضربات دقيقة منها، وتحوّل ذلك الوحش إلى خردة معدنية.   ما يُقلقني هو أننا لم نفعل شيئًا على الإطلاق لاستفزاز الآلة. من المستحيل أن يكون الأقزام قد صمموا الآلات لتكون بهذه العدوانية، وكأنها كانت تحاول نصب كمين لنا!   على الأقل تمكنت من تقديم بعض المساعدة لرفاقي ولو لمرة واحدة.  - أرشيبالد
journal.document.caves_explorer.report.title=Final Report
journal.document.caves_explorer.report.body=28من الصيف، 308   اليوم سننهي حزم أمتعتنا ونستعد للمغادرة. في الوقت المناسب تمامًا، بدأ العديد من أفراد مجموعتنا يعانون من كوابيس مروعة بعد حادثة الآلة العدوانية. ربما يكون الأمر مجرد إرهاق، لكن كوابيسهم متشابهة بشكل مثير للقلق.   باختصار، تُعتبر المناطق العلوية من المنجم آمنة نسبيًا. وإذا ما وُجد استخدامٌ للذهب الداكن، فقد يكون استخراجه مربحًا للغاية. كما أن المساحات المفتوحة الشاسعة ستكون مناسبة جدًا لخطط بناء المدينة. أما المناجم السفلية فهي أكثر خطورة، ويُنصح بتجنبها.   سأكتب كل هذا في تقريري النهائي خلال الأيام القليلة القادمة.  - أرشيبالد

journal.document.city_warlock.title=Warlock's Journal
journal.document.city_warlock.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.city_warlock.old_king.title=The King is Dead
journal.document.city_warlock.old_king.body=اليوم هو الخامس من الشهر الثاني من السنة الثالثة والثلاثين لعصر السحر. إذا كان أحد سكان العالم العلوي يقرأ هذا، فهو في شتاء عام ٢٦٤. اسمي ثيمور زاهر، وعلى حد علمي، أنا آخر الناجين من بلاط الأقزام الملكي. لقد مات ملكنا، وخلفه أحد زملائي السابقين الذي جنّ جنونه بالسلطة. خضع له بقية الحاشية، كالحمقى، وفقدوا إرادتهم الحرة في هذه العملية. أنا وحدي من تنبأ بهذا، وهربت قبل أن يكتمل طقوسه. لقد سقطت الدائرة المقربة، لكن سلطة الملك الجديد لم تصل بعد إلى الجميع. يجب عليّ أن أشنّ مقاومة بأسرع ما يمكن أرفض أن تسقط حضارتنا المجيدة في يد هذا المهووس بالعظمة
journal.document.city_warlock.resistance.title=A Resistance
journal.document.city_warlock.resistance.body=يبدو أن الخبر انتشر بسرعة. لم يمضِ سوى أيام قليلة حتى جمعتُ جيشًا صغيرًا من الموالين للملك العجوز. قليلون هم من يتقنون السحر، لكن معظم الرهبان المحاربين بيننا. سنكون ندًا قويًا للقزم المجنون وحاشيته من العبيد.   في هذه الأثناء، اختبأ الملك الجديد في أروقة مدينتنا الداخلية. لا شك أنه استنفد معظم سلطته ويأمل في استعادة قوته قبل أن يواجه المزيد من المقاومة.   سنشن هجومنا خلال ساعتين. نأمل أن نتمكن من تشكيل مجلس مؤقت وإعادة الاستقرار إلى مدينتنا الرائعة بحلول نهاية الليلة
journal.document.city_warlock.failure.title=فشل
journal.document.city_warlock.failure.body=يبدو أنني كنت مخطئاً أيضاً. كنت أظن أن الملك الجديد يحتاج إلى خضوع البلاط له طواعية، لكنني أرى الآن أنه يملك القدرة على السيطرة حتى على من يقاومونه.   لقد أحضرتُ عن عمدٍ كلَّ معارضيه الأقوياء إلى عتبة داره ليُحوّلهم بنفسه إلى عبيدٍ له. والآن، تجتاح المدينة موجاتٌ من طاقته الفساد، تُحوّل معظمهم على الفور إلى مُتوسّلين له.   القلة الذين ما زالوا يتمتعون بحرية الإرادة يفرون. اخترتُ البقاء لأراقب قدر استطاعتي وأبحث عن فرصة سانحة. بفضل قوتي السحرية، سأتمكن من البقاء مختبئًا وآمنًا لبعض الوقت
journal.document.city_warlock.more_powerful.title=More Powerful
journal.document.city_warlock.more_powerful.body=أصبح تتبع الوقت صعباً، لكن مرّ أسبوع تقريباً منذ آخر تدوينة لي. لقد انهارت حضارتنا تماماً. أُغلقت الأبواب، وتوقفت جميع وظائف مجتمعنا، وتجوب هياكل الأقزام الفارغة القاعات.   وسط كل هذا، بطريقة ما، يزداد الملك الجديد قوة. كل يوم تزداد قوة إرادته، لكنها تتغير أيضاً. لا أستطيع وصف ذلك، لكن يبدو وكأنه لم يعد قزماً على الإطلاق.   بدأت أتقبل أن أفضل ما يمكنني فعله هو توثيق هذه الأحداث. سأبقى هنا قدر ما استطعت، ثم سأنسحب حالما تبدأ إرادتي بالضعف
journal.document.city_warlock.new_power.title=A New Power
journal.document.city_warlock.new_power.body=     ما الذي يحدث هنا؟ إن القوة المنبعثة من الملك الجديد تختلف بالفعل عما كانت عليه في البداية، ولكن هناك شيء آخر أيضاً. يبدو أن هذه القوة الجديدة تشع من أعمق أروقة مدينتنا.   الأمر الأكثر إثارة للحيرة هو انخفاض النشاط في المدينة العليا أيضاً. لا أعرف ما الذي يحدث هناك، لكنه يستحوذ على اهتمام الملك الجديد بالكامل تقريباً.   العودة إلى القاعات العميقة ستكون محفوفة بالمخاطر، لكن عليّ أن أكتشف سبب هذا التغيير. ربما يكون للملك الجديد نقطة ضعف في نهاية المطاف؟
journal.document.city_warlock.seen_it.title=I've Seen It
journal.document.city_warlock.seen_it.body=     لقد رأيت ما يكمن في الأسفل، لكنني لا أستطيع وصفه. ترتجف يداي بشكل لا يمكن السيطرة عليه وأنا أحاول تدوين أفكاري.   لماذا يحدث هذا؟ هل فعلها الملك الجديد؟ لا معنى له. ربما جذبها استخدامه المفرط للسلطة؟ كنتُ آمل أن أنقذ حضارتنا، لكنني أرى الآن أن العالم بأسره في خطر.   بطريقة ما، الملك هو أهون الشرّين. ليس لديّ خيار آخر، فمن أجل الصالح العام سأسلم نفسي. أرجوك يا مولاي، أرشدني، واستخدمني أداةً لصدّ يوغز

journal.document.halls_king.title=???'s Journal
journal.document.halls_king.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.halls_king.rejection.title=الرفض
journal.document.halls_king.rejection.body=عصوم من الخطأ!   على مدى السنوات الثلاث والثلاثين الماضية، ازدهرت مملكتنا بفضل تقنياتنا السحرية الجديدة. لقد تعلمنا كيفية استحضار الأرواح العنصرية وتطويعها لإرادتنا، ولكن لسبب ما، أصبح إجراء المزيد من التجارب الآن "خطيرًا للغاية".   أعرف ما يجري حقاً. رفض نظرياتي لا علاقة له بصحتها، بل بالشخص الذي يطرحها. ربما يسخرون مني جميعاً في غيابي.   حسناً، كفى! لا يهمني ما يقولونه، سأستكشف أقصى حدود كوننا بمفردي، وسأحتفظ بكل ما أكتشفه لنفسي!  - ر
journal.document.halls_king.amulet.title=The Amulet
journal.document.halls_king.amulet.body=         5078      لقد فعلتها!   لم أكن أعرف ما الذي قد أجده بالضبط، لكن ما اكتشفته هناك فاق كل توقعاتي. قوة هائلة، كامنة هناك جاهزة للاستحواذ، وهي كلها لي!   بهذا لن يجرؤ أيٌّ من الحمقى في المحكمة على معارضتي. أشعر بنشوة عارمة وأنا أفكر في كل الطرق التي يمكنني بها إذلالهم. بل لماذا أتوقف عند هذا الحد؟ لديّ من القوة ما يكفي لتدميرهم جميعًا إن أردت! قد يكون هذا مبالغًا فيه، لكن يجب ألا أتردد كثيرًا في اتخاذ القرار وإلا سيشكّون بي.   أعتقد أنني سأطلق على هذه القوة العظيمة اسم تميمة يندور!
journal.document.halls_king.ritual.title=The Ritual
journal.document.halls_king.ritual.body=واجهني ثيمور علنًا في وقت سابق من اليوم وأصرّ على أن أشرح مصدر قوتي الجديد. تجاهلته قدر استطاعتي، لكنني أشعر بنظرات بقية أعضاء المحكمة تلاحقني من جديد.   كنتُ أتمنى أن أستمتع ببعض الهدوء الذي يسبق العاصفة، لكن لا يهم. لقد قررتُ ما أريد فعله. سأدّعي أنني اكتسبتُ قوتي من خلال طقوس جديدة، وسأعرض القيام بها على السحرة الآخرين والملك. وبمجرد انتهاء الطقوس، سأصبح ملكًا!   سيعترض ثيمور بالطبع، ولكن مع كل هذه السلطة المعروضة، أشك في أنهم سيستمعون إليه!   الجميع سيخضعون لي!  سوف اكون ملك الأقزام المستقبلي
journal.document.halls_king.new_king.title=A New King
journal.document.halls_king.new_king.body=أنا الملك، هاهاهاهاهاها!   لقد سمحوا لي بفعل ذلك ببساطة! وبأقل قدر من الإقناع، وافقوا على أن "أشاركهم" هذه القوة في طقوس عظيمة. وفي لحظة، تحولوا من جوقة من الأصوات الساخرة إلى حاشيتي الجديدة من الرعايا الصامتين!   وكما كان متوقعاً، فرّ ثيمور كالجبان عند أول بادرة خطر. أشعر بالفعل بقوة المقاومة التي يُحشدها. أعتقد أنني سأسمح له بالاستمرار، حتى يُحضر جميع شركائه إلى باب منزلي!   من الواضح أن المملكة لا تحترمني أيضاً، وأظن أنني سأصلح ذلك أيضاً.  - ملك الأقزام
journal.document.halls_king.thing.title=The Thing
journal.document.halls_king.thing.body=هناك مشكلة. تم القضاء على ثيمور دون عناء، ولكن يبدو أن بحثي في العوالم الخارجية لم يمر دون أن يلاحظه أحد.   شيء ما... انجذب إلى عالمي وبدأ يتسلل من أسفل القاعات السفلية. ومما يزيد الأمر تعقيدًا، أن هذا هو المكان الذي خزنت فيه التميمة! يا له من مخلوق حقود، لماذا يحاول حرماني من قوتي بينما لا يزال هناك الكثير لأحصل عليه؟   رغم قوتي، لا أعتقد أنني أستطيع ببساطة الاندفاع ومواجهته. قوته الحقيقية لا تُدرك، ولكن لا بد من وجود طريقة للحد منها. سأدافع عن جائزتي
journal.document.halls_king.attrition.title=Attrition
journal.document.halls_king.attrition.body=لديّ خطة للتعامل مع هذا الشيء. قوته لا حدود لها، لكن قدرته على التعدي على هذا العالم محدودة. إنه يعتمد على أتباعه وشخصياته لتنفيذ أوامره بينما يحاول جمع ما يكفي من القوة للاستيلاء على التميمة.   مع أنني لا أملك التميمة جسديًا، إلا أنني ما زلت أتحكم بقوتها تحكمًا كاملًا. وبفضل امتلاكي لمدينة الأقزام بأكملها، أتمتع بتفوق عددي. يمكنني ببساطة الاستمرار في إرسال الجنود لمنعهم من الاستيلاء على التميمة، وبالتالي كسب هذه الحرب تدريجيًا عبر استنزاف العدو!   أنا، رودني، ملك الأقزام، سأبقى على قيد الحياة بعدك يا يوغز

