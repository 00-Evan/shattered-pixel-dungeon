challenges.no_food=في حميه
challenges.no_food_desc=الطعام نادر أصلاً, لكن عليك أن تنتبه إلى حصصك أيضاً!\n\n- الطعام وقرن الوفرة يكفيان الجوع بفعالية ثلث ما كانا عليه\n- المصادر الأخرى للشبع لا تتأثر
challenges.no_armor=الإيمان درعي
challenges.no_armor_desc=ستحتاج إلى الثقة بنفسك, لأن درعك لن يفيدك كثيراً!\n\n- تم تخفيض قوة الحجب الأساسية لجميع أنواع الدروع باستثناء الدروع القماشية.\n- أصبحت جميع الدروع الآن تكتسب قدرة ضئيلة جدًا على الصد عند ترقيتها.\n- كما انخفضت قوة الحماية لدى حارس الأرض بشكل ملحوظ
challenges.no_healing=رهاب الأدوية
challenges.no_healing_desc=إن جرعات الشفاء مفيدة للغاية, ولكن للأسف لديك حساسية منها!\n\n- جرعات الشفاء, والأدوات التي تستخدم جرعات الشفاء في وصفاتها, وفاكهة الشمس, ستسمم البطل بدلاً من شفائه.\n- لا يمكن للمشروبات غير المستقرة أن تسمم البطل أو تشفيه بشكل عشوائي\n- لا تزال هذه العناصر تعمل بشكل طبيعي مع الشخصيات الأخرى.
challenges.no_herbalism=أرض جرداء
challenges.no_herbalism_desc=يبدو أنه لا يوجد ماء نظيف متبقٍ في هذا الزنزان الملعون...\n\n- تم إزالة قطرات الندى\n- تم إزالة النباتات\n- تظهر البذور vẫn, لكنها لن تتجذر
challenges.swarm_intelligence=الذكاء الجماعي
challenges.swarm_intelligence_desc=احذروا, وحوش الأبراج المحصنة تزداد ذكاءً!\n\n- عندما يراك الأعداء أو حلفاؤك, فإنهم سيجذبون أعداء آخرين قريبين إلى موقعك.\n- يبدأ نطاق هذا من مربعين فقط, ولكنه يزداد بمقدار مربعين لكل دور يراك فيه العدو, حتى يصل إلى 12 مربعًا.\n- يؤدي قطع مجال الرؤية إلى إعادة ضبط نطاق الجذب, حتى لفترة وجيزة كما هو الحال مع الباب.
challenges.darkness=إلى الظلام
challenges.darkness_desc=إنها زنزانة في نهاية المطاف!\n\n- يُقلَّل مدى الرؤية المعتاد بشكل كبير\n- يظهر مشعل في كل طابق\n- المصادر الأخرى للضوء تكون فعاليتها 1/5
challenges.no_scrolls=الرموز المحرمة
challenges.no_scrolls_desc=هناك رمز معين يصعب العثور عليه. لسوء الحظ, إنه دائماً الأكثر فائدة.\n\n- يتم إزالة نصف ورقات الترقية في الزنزانة
challenges.champion_enemies=أبطال معادون
challenges.champion_enemies_desc=لستَ الوحيد القادر على الارتقاء بمستواك!\n\nتبلغ فرصة ظهور الأعداء العاديين مع تعزيز خاص للبطل 1/8 في الطابق 1, وتزداد هذه الفرصة لتصل إلى 1/6 في الطابق 21.\n\n- يستيقظ الأبطال إذا ظهروا نائمين عند بدء اللعبة\n- يعرف البطل متى يظهر البطل\n- لا يمكن تحويل الأبطال إلى حلفاء\n\nهناك ستة أنواع من الأعداء الأبطال:\n_مشتعل (برتقالي):_ +25% ضرر اشتباك, يشتعل عند الإصابة, ينشر اللهب عند الموت, لا يمكنه إشعال بلاطات الماء\n_الإسقاط (بنفسجي):_ +25% ضرر الاشتباك, +3 مدى الاشتباك\nمضاد للسحر (أخضر): -50% ضرر متلقى, مناعة ضد التأثيرات السحرية\nالعملاق (الأزرق): -80% ضرر متلقى, +1 مدى هجوم قريب, لا يمكنه التحرك داخل الأنفاق\nمبارك (أصفر): دقة ومراوغة 4 أضعاف\n_متزايد (أحمر):_ +20% دقة, تفادي, ضرر, ونقاط صحة فعالة. تزداد بنسبة 1% كل 4 أدوار
challenges.stronger_bosses=زعماء أشد شراً
challenges.stronger_bosses_desc=الرؤساء أكثر صرامة بكثير في هذا التحدي!\n\n_وحش الوحل:_ +20% صحة\nتزداد فعالية الشفاء في الماء تدريجيًا, لتصل إلى 3 في كل دورة.\n_-_ يضخ في دورة واحدة بدلاً من دورتين\n_تينغو:_ +25% صحة\nالمرحلة الأولى: الفخاخ أكثر فتكًا بكثير\nالمرحلة الثانية: تزداد القدرة بشكل متكرر\nDM-300: +33% صحة\nالأبراج _-_ أكثر صلابة و3 يتم تفعيلها\nالقدرات _-_ أكثر قوة وتكرارًا\nيكون طراز DM-300 أسرع عند شحنه بشاحن توربيني.\nتُعد الأسلاك المكشوفة أكثر شيوعًا بمرتين.\n_ملك الأقزام:_ +50% صحة\nالأتباع _-_ أقوى في جميع المراحل\nالمرحلة الأولى: قدرات واستدعاءات أسرع\nالمرحلة الثانية: إضافة تابعين اثنين لكل جولة\nالمرحلة الثالثة: ضعف الصحة, استدعاءات أسرع\n_yog-Dzewa:_\nيتم استدعاء قبضتين في وقت واحد!\n_-_ +60% تلف الليزر\nأتباع أقوى

