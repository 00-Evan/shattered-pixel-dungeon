plants.blandfruitbush.name=فاكهه بدون طعم
plants.blandfruitbush.desc=ابن عم بعيد لتوت العفن, ثمار شجيرة الفاكهة الباهتة ذات الشكل الكمثري طعمها كالغبار المتراكم. الفواكه كريهة وواهية لكنها ليست سامة. ربما يمكن طبخها.
plants.blandfruitbush.discover_hint=يمكنك العثور على هذا النبات عشوائيا في الدهليز.
plants.blandfruitbush$seed.name=بذرة الفاكهة الباهتة

plants.blindweed.name=عشب العمى
plants.blindweed.desc=عند لمسه يزول عشب العمى في ومضة ضوء ساطعة. الومضة قوية بما يكفي لإرباك المرء لعدة ثوان.
plants.blindweed.warden_desc=_الحارسة_ ستوجه طاقة عشب العمى إلى حجاب خفاء مؤقت بدل أن تصاب بالإرباك.
plants.blindweed$seed.name=بذرة عشب العمى

plants.mageroyal.name=الساحر الملكي
plants.mageroyal.refreshed=تشعر بالانتعاش.
plants.mageroyal.desc=تحتوي أزهار الساحر الملكي الشوكية على مادة كيميائية تعرف بقدرتها كعامل تحييد قوي. أي شيء يخطو في هذا النبات سينقى من العديد من التأثيرات السلبية.
plants.mageroyal.warden_desc=بالإضافة إلى تأثير التحييد, ستصبح _الحارسة_ محصنة مؤقتا ضد جميع تأثيرات المنطقة عندما تخطو فوق الساحر الملكي.
plants.mageroyal$seed.name=بذرة الساحر الملكي

plants.earthroot.name=جزر الارض
plants.earthroot.desc=عندما تلمس مخلوق جذر الأرض, تصنع جذوره نوعا من الدرع الطبيعي الثابت حوله.
plants.earthroot.warden_desc=ستتحرك جذور نبات جذر الأرض مع _الحارسة_, لتوفير درع جلد اللحاء المتحرك لها.
plants.earthroot$seed.name=بذرة جذر الأرض
plants.earthroot$armor.name=درع عشبي
plants.earthroot$armor.desc=نوع من الدروع الطبيعية الثابتة المصنوعة من اللحاء والخيوط.\n\nهذا الدرع العشبي سيحمي %d من أي ضربة مادية, إلى أن ينفد في النهاية من متانته وينهار.\n\nبما أن الدرع ثابت, فإن تحريكه سيؤدي إلى تحطمه وفقدانه.\n\nالدروع المتبقية: %d.

plants.fadeleaf.name=نبات الانتقال
plants.fadeleaf.desc=المس ورقة التلاشي فتنقل أي كائن إلى مكان عشوائي في المستوى الحالي.
plants.fadeleaf.warden_desc=أثر الانتقال الفوري في ورقة التلاشي أقوى بالنسبة إلى _الحارسة_, فينقلها إلى نهاية مستوى الزنزانة السابق.
plants.fadeleaf$seed.name=بذرة ورقة التلاشي

plants.firebloom.name=زهره النار
plants.firebloom.desc=كل شيء يلمس زهرة النار يشتعل فجأة.
plants.firebloom.warden_desc=عندما تدوس _الحارسة_ على زهرة النار, تتخللها النار لبرهة بدل أن تتأذى.
plants.firebloom$seed.name=بذرة زهرة النار

plants.icecap.name=نبات قبعه الجليد
plants.icecap.desc=عند لمسه, تطلق قبعة الجليد سحابة من حبوب لقاح جامدة. يصبح أثر التجميد أقوى بكثير إذا كانت البيئة رطبة.
plants.icecap.warden_desc=عندما تدوس _الحارسة_ على قبعة الجليد, تتخللها الصقيع لبرهة بدل أن تتأذى.
plants.icecap$seed.name=بذرة قبعة الجليد

plants.plant.warden_desc=لا تحدث هذه النبتة أي أثر خاص عند استخدامها من قبل الحارسة.
plants.plant.discover_hint=يمكنك العثور على هذه النبتة عشوائيا في الزنزانة, أو زراعتها من بذرتها المرتبطة بها.
plants.plant$seed.seed_of=بذرة %s
plants.plant$seed.ac_plant=زراعه
plants.plant$seed.info=ارمِ هذه البذرة إلى المكان الذي تريد أن تنبت فيه النبات.\n\n%s
plants.plant$seed$placeholder.name=بذره

plants.rotberry.name=توت فاسد
plants.rotberry.desc=ثمار شجيرة التوت المتعفن الصغيرة طعمها كالموت الحلو. بعد بضع سنوات, ستنمو هذه الشجيرة لتصبح قلبًا متعفنًا آخر. عند دوسها, تُصدر شجيرة التوت المتعفن الصغيرة نفخة صغيرة من الغاز السام
plants.rotberry.warden_desc=في العادة لا تنتج شجيرة التوت الفاسد سوى القليل من الغاز عند دوسها, لكن _الحارسة_ قادرة على استغلال الطاقة منها لتعزيز قوتها مؤقتًا!
plants.rotberry.discover_hint=يمكنك زراعة هذا النبات من بذرته خلال مهمة محددة.
plants.rotberry$seed.name=بذرة التوت الفاسد
plants.rotberry$seed.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

plants.sorrowmoss.name=طحلب الحزن
plants.sorrowmoss.desc=طحلب الحزن هو زهرة (ليس طحلبًا) ذات بتلات حادة كالشفرة, مغطاة بسم قاتل.
plants.sorrowmoss.warden_desc=عندما تدوس _الحارسة_ على طحلب الحزن, سيُسرّب السم إلى جسدها بدلًا من أن يؤذيها.
plants.sorrowmoss$seed.name=بذرة طحلب الحزن

plants.starflower.name=زهره النجميه
plants.starflower.desc=نبات نادر, يُقال إن زهرة النجم تمنح قوة مقدسة لكل من يلمسها.
plants.starflower.warden_desc=إضافة إلى البركة, ستحصل _الحارسة_ على قدر كبير من إعادة شحن العصي عند دوس زهرة النجم.
plants.starflower$seed.name=بذرة زهرة النجم

plants.stormvine.name=نبته الدوار
plants.stormvine.desc=تؤثر الجاذبية على نبات الكرمة العاصفة بطريقة غريبة, مما يسمح لخيوطها الزرقاء الرقيقة بالـ«تعليق» في الهواء. أي شيء يقع في الكرمة يتأثر بذلك ويصبح مرتبكًا.
plants.stormvine.warden_desc=_الحارسة_ قادرة على التحكم في تأثير الجاذبية لكرمة العاصفة, وستطفو في الهواء لفترة قصيرة عند دوس واحدة منها.
plants.stormvine$seed.name=بذرة الكرمة العاصفة

plants.sungrass.name=عشب الشمس
plants.sungrass.desc=يشتهر عشب الشمس بخصائص علاجية بطيئة ولكنها فعالة في عصارته.
plants.sungrass.warden_desc=_الحارسة_ يمكنها الاستفادة من التئام عشب الشمس المدوس حتى لو تباعدت عنه.
plants.sungrass$seed.name=بذرة عشب الشمس
plants.sungrass$health.name=شفاء عشبي
plants.sungrass$health.desc=يتمتع عشب الشمس بخصائص علاجية ممتازة, رغم أنه أبطأ بكثير من جرعة الشفاء.\n\nالتحرك بعيدا عن النبات سيُلغي أثر العلاج.\n\nالشفاء المتبقي: %d.

plants.swiftthistle.name=الشيح السريع
plants.swiftthistle.desc=عند الدوس عليه, يسرع الشيح السريع تدفق الزمن حوله لفترة قصيرة, مما يسمح لداسه بأداء عدة أفعال فورا.
plants.swiftthistle.warden_desc=إضافة إلى الحصول على أفعال فورية, ستحصل _الحارسة_ أيضا على تعزيز سرعة لطيف عند دوس الشيح السريع.
plants.swiftthistle$seed.name=بذرة الشيح السريع
plants.swiftthistle$timebubble.name=فقاعه الزمن
plants.swiftthistle$timebubble.desc=فقاعة صغيرة من الزمن المتسارع, تسمح بأداء الأفعال فورا. غير أن الهجوم أو استخدام السحر سيفكك هذا الأثر.\n\nالأدوار المتبقية: %s.
