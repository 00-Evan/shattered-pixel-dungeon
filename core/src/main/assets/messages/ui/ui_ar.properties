ui.updatenotification$wndupdate.desc=تُحدَّث لعبة Shattered Pixel Dungeon بانتظام بإصلاحات شاملة لمحتوى اللعبة الحالي, أو بمحتوى جديد كليًا!\n\nكما يتم تحسين توازن اللعبة بشكل متكرر في التحديثات, حتى لا تكون عناصر/أبطال/أعداء معينة قوية جدًا أو ضعيفة جدًا.\n\nوتتضمن التحديثات أيضًا إصلاحات للأخطاء وتحسينات متنوعة أخرى للاستقرار.
