items.kindofmisc.unequip_title=اخلع عنصرًا واحدًا
items.kindofmisc.unequip_message=يجب عليك إزالة أحد هذه العناصر أولًا. اختر عنصرًا لتبديله.

items.kindofweapon.swift_equip=تتجهز بسلاحك بسرعة.
items.kindofweapon.equip_cursed=يشتد قبضك حول السلاح دون إرادتك.
items.kindofweapon.which_equip_msg=في أي خانة سلاح ترغب في تجهيز هذا العنصر?\n\nتهاجم البطلة مباشرةً بسلاحها الأساسي, ولكن يمكنها استخدام قدرة أيٍّ من السلاحين. ويشترك كلا السلاحين في نفس عدد الشحنات.\n\nبإمكان البطلة أيضاً تبديل سلاحها الأساسي والثانوي على الفور.
items.kindofweapon.which_equip_primary=الأساسي (%s)
items.kindofweapon.which_equip_secondary=الثانوي (%s)
items.kindofweapon.empty=فارغ

items.kingscrown.name=تاج ملك الأقزام
items.kingscrown.ac_wear=يلبس
items.kingscrown.naked=لسوء الحظ, لا يمكن للتاج تحويل ملابسك الداخلية.
items.kingscrown.upgraded=يلمع التاج بوضوح ثم يتفكك بينما يتحول درعك!
items.kingscrown.ratgraded=تلمع مخالب ملك الفئران بوضوح بينما يتحول درعك!
items.kingscrown.desc=تاج آخر ملوك الأقزام, يتوهج بطاقة سحرية هائلة.\n\nعند ارتدائها, ستتدفق قوة التاج السحرية إلى الدرع الذي ترتديه حاليًا, محولة إياه إلى درع ملحمي فريد من نوعه يتمتع بقدرات خاصة. سيحتفظ الدرع الجديد بجميع خصائص الدرع الأصلي.
items.kingscrown.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من أعداء معينين.

items.liquidmetal.name=فلز سائل
items.liquidmetal.ac_apply=تطبيق
items.liquidmetal.prompt=اختر سلاحًا مرميًا
items.liquidmetal.already_fixed=ذلك السلاح المرمي في حالة مثالية بالفعل!
items.liquidmetal.apply=تستخدم %d من الفلز السائل لإصلاح سلاحك المرمي.
items.liquidmetal.desc=هذا السائل السحري قادر على ملء الشقوق والتمزقات في الأسلحة المرمية, وإعادتها إلى حالتها الأصلية! حتى لو كانت مجموعة الأسلحة تفتقد سلاحًا ولكنها مُصلحة بالكامل, فيمكن استخدام المعدن السائل لاستبدال السلاح المفقود!\n\nيتطلب إصلاح سلاح من المستوى 1 عشرة معادن سائلة, بينما يتطلب إصلاح سلاح من المستوى 5 ثلاثين معدنًا. كما تزيد كل ترقية كمية المعدن المطلوبة بنسبة 35%.\n\nلا يمكن استخدام المعدن السائل لإصلاح رؤوس سهام السهام ذات الرؤوس المدببة.
items.liquidmetal.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.lostbackpack.name=حقيبة ظهر مفقودة
items.lostbackpack.desc=هذه حقيبتك المفقودة. اجمعها لاستعادة كل العناصر التي فقدتها!

items.merchantsbeacon.name=منارة التاجر
items.merchantsbeacon.ac_use=استخدام
items.merchantsbeacon.desc=تتيح لك هذه القطعة الغريبة من تكنولوجيا الأقزام التواصل من مسافات بعيدة.\n\nبعد تفعيل هذا المنارة, ستتيح لك بيع العناصر إلى Pixel Mart من أي مكان في الزنزانة.\n\nومع ذلك, فإن السحر الموجود داخل المنارة لن يدوم إلا لجلسة واحدة, لذا استخدمه بحكمة.

items.stylus.name=قلم سحري
items.stylus.ac_inscribe=نقش
items.stylus.prompt=اختر درعًا
items.stylus.identify=يجب عليك أولًا تحديد ما إذا كان ذلك الدرع ملعونًا.
items.stylus.cursed=لن تعمل سحر القلم على الدرع الملعون.
items.stylus.inscribed=نقشت على درعك بالقلم.
items.stylus.desc=هذا القلم السحري مصنوع من حجر داكن شديد الصلابة. باستخدامه, يمكنك نقش رمز سحري على درعك, لكن ليس لديك أي سيطرة على اختيار الرمز, فالقلم هو من سيختاره.

items.tengusmask.name=قناع تينغو
items.tengusmask.ac_wear=يلبس
items.tengusmask.used=ينفكك القناع بينما تسري قوته فيك!
items.tengusmask.desc=سقط هذا القناع عن وجه تينغو لحظة موته, ويمكنك أن تشعر بقوة سحرية هائلة تنبعث منه. هل كان القناع مصدر قوة تينغو?\n\nعند ارتدائه, ستنتقل إليك القوة الهائلة للقناع, مما يُمكّنك من اختيار فئة فرعية لبطلِك.\n\nأي فئة فرعية ستختار?
items.tengusmask.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من أعداء معينين.

items.torch.name=شعله
items.torch.ac_light=ضوء
items.torch.desc=أداة أساسية في المغامرة, فعندما تُظلم الزنزانة, يمكن للشعلة أن تضيء الطريق.

items.waterskin.name=حقيبه الماء
items.waterskin.ac_drink=يشرب
items.waterskin.collected=تجمع قطرة الندى في قربة الماء.
items.waterskin.full=قربة الماء ممتلئة!
items.waterskin.empty=قربة الماء فارغة!
items.waterskin.desc=حاوية للسائل, مصنوعة من الجلد والخيط, مغلقة بسدس فلّيني.
items.waterskin.desc_water=في الوقت الحالي تحتوي القربة على ماء شرب عادي فحسب. لا بد أن هناك شيئًا في الزنزانة يمكن للقربة تخزينه بدلاً منه.
items.waterskin.desc_heal=تُستخدم القربة حاليًا لتخزين الماء العلاجي. كلما امتلأت القربة, زادت سرعة الشفاء عند الشرب منها. ستشرب فقط ما يكفيك
items.waterskin.desc_full=تبدو القربة الممتلئة مشعّة بالطاقة, ربما يمكن استخدامها لبارك عنصر نجاة آخر?
items.waterskin.discover_hint=يبدأ أحد الأبطال بهذا العنصر.
