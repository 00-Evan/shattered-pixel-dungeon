items.heap.chest_desc=لن تعرف ما بداخله حتى تفتحه!
items.heap.locked_chest=صندوق مغلق
items.heap.locked_chest_desc=لن تعرف ما بداخله حتى تفتحه! لكن لفتحه تحتاج إلى مفتاح ذهبي.
items.heap.crystal_chest=صندوق كريستالي
items.heap.crystal_chest_desc=يمكنك رؤية _%s_ بداخله, لكن لفتح الصندوق تحتاج إلى مفتاح بلوري.
items.heap.artifact=اداه سحريه
items.heap.wand=عصا سحر
items.heap.ring=خاتم
items.heap.tomb=قبر
items.heap.tomb_desc=قد يحتوي هذا القبر القديم على شيء مفيد, لكن صاحبه سيعترض بشدة على فحصه.
items.heap.skeleton=بقايا هيكليّة
items.heap.skeleton_desc=هذا كل ما تبقى من بعض المغامرين التعسيين. ربما يستحق الفحص بحثًا عن أي أشياء ثمينة.
items.heap.remains=بقايا بطل
items.heap.remains_desc=هذا كل ما تبقى من أحد سوابقك. ربما يستحق الفحص بحثًا عن أي أشياء ثمينة.

items.honeypot.name=وعاء العسل
items.honeypot.ac_shatter=تكسير
items.honeypot.desc=هذا الوعاء الكبير ليس مبطناً بالعسل فحسب, بل هو في الواقع مسكن لنحلة عملاقة! عادةً ما تبقى هذه النحلات الضخمة في خلاياها, فربما يكون الوعاء نوعاً من أقفاص الصيد المتخصصة? تبدو النحلة راضية تماماً داخل الوعاء مع عسلها, وتطنّ بحذر عندما تنظر إليها.
items.honeypot$shatteredpot.name=وعاء عسل مكسور
items.honeypot$shatteredpot.desc=لقد تحطم الإناء, ولم يبقَ سوى العسل اللزج الذي يبطن جدرانه هو ما يربط أجزاءه ببعضها, وهو يتفكك ببطء. \n\nعلى الرغم من حالتها المكسورة, يبدو أن النحلة لا تزال ترغب في حماية الإناء

