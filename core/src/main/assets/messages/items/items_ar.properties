items.rings.ringoftenacity.combined_stats=تدمج خواتمك المجهزة قوتها, مما يقلل الضرر الذي تتلقاه بنسبة تصل إلى _%s%%_ في المجموع.
items.rings.ringoftenacity.upgrade_stat_name_1=أقصى مقاومة للضرر
items.rings.ringoftenacity.desc=عند ارتدائه, يمنح هذا الخاتم حامله مناعة ضد الضربات القاتلة. وكلما زادت إصابات المستخدم, زادت مناعته. أما الخاتم الملعون, فيسهل على الأعداء القضاء على حامله.

