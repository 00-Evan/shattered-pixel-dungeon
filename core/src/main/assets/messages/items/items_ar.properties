items.artifacts.masterthievesarmband.steal_shopkeeper=لا يمكنك السرقة من أصحاب المتاجر مباشرة.
items.artifacts.masterthievesarmband.no_steal=ذلك العدو ليس لديه ما يُسرق.
items.artifacts.masterthievesarmband.stole_item=لقد سرقت عنصرًا: %s.
items.artifacts.masterthievesarmband.failed_steal=لم تتمكن من سرقة أي شيء.
items.artifacts.masterthievesarmband.level_up=سوارك يزداد قوة!
items.artifacts.masterthievesarmband.desc=يحمل هذا السوار المخملي الأرجواني علامة سيد اللصوص. هذا لا يخصك, ولكن من المحتمل أنه لم يكن يخص مستخدمه الأخير أيضًا.
items.artifacts.masterthievesarmband.desc_cursed=السوار الملعون مقيد بمعصمك, وبطريقة ما يبدو أن كيس ذهبك يصبح أخف وزنًا ببطء...
items.artifacts.masterthievesarmband.desc_worn=تشعر بقوة تتراكم في سوار معصمك كلما اكتسبت خبرة. يمكنك استخدام هذه القوة للسرقة من المتاجر, أو لنهب الأعداء!\n\nسرقة الأعداء تتم فورًا, وتُربكهم مؤقتًا, وتمنحك فرصة الحصول على أي غنائم بحوزتهم! هذه القدرة أكثر فعالية ضد الأعداء الغافلين. سرقة العدو نفسه عدة مرات لا تزيد من فرص الحصول على الغنائم.

