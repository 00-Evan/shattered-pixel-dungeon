items.artifacts.lloydsbeacon.desc=منارة لويد هي جهاز سحري معقد يمنح مستخدمه القدرة على التحكم في سحر الانتقال الآني. يمكن استخدام المنارة للعودة إلى موقع محدد، كما يمكنها إطلاق دفعات عشوائية من سحر الانتقال الآني بمجرد شحنها بعد تجهيزها. يمكن توجيه هذا السحر نحو هدف أو نحو المستخدم نفسه.
items.artifacts.lloydsbeacon.desc_set=This beacon was set somewhere on the level %d of Pixel Dungeon.

items.artifacts.masterthievesarmband.name=master thieves' armband
items.artifacts.masterthievesarmband.ac_steal=سرقه
items.artifacts.masterthievesarmband.no_charge=Your armband does not have enough charge.
items.artifacts.masterthievesarmband.cursed=You can't use a cursed armband.
