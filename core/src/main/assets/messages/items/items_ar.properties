items.wands.wand.ac_zap=صعق
items.wands.wand.fizzles=تطلق عصاك السحرية أزيزًا وتنطفئ; لا بد أنها لا تمتلك شحنة كافية.
items.wands.wand.no_magic=تطلق عصاك السحرية أزيزًا وتنطفئ; لا يمكنك استخدام العصي السحرية بينما أنت محصن ضد السحر.
items.wands.wand.self_target=لا يمكنك استهداف نفسك!
items.wands.wand.identify=أصبحت الآن على دراية كافية بعصاك السحرية لتحديد هويتها.
items.wands.wand.resin_one=اكتسبت هذه العصا السحرية _مستوى واحد_ من الراتنج الغامض.
items.wands.wand.resin_many=اكتسبت هذه العصا السحرية _%d مستويات_ من الراتنج الغامض.
items.wands.wand.cursed=هذه العصا السحرية ملعونة, مما يجعل سحرها فوضويًا وعشوائيًا.
items.wands.wand.not_cursed=هذه العصا السحرية خالية من السحر الخبيث.
