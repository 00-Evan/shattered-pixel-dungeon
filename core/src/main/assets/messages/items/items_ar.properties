items.rings.ringofsharpshooting.upgrade_stat_name_2=تعزيز المتانة
items.rings.ringofsharpshooting.desc=يعزز هذا الخاتم دقة وتصويب مرتديه, مما سيجعل جميع الأسلحة المقذوفة أكثر ضررًا ومتانة. سيكون للخاتم الملعون تأثير معاكس.

