items.rings.ringofwealth.desc=يعمل هذا الخاتم كمغناطيس للكنوز, مما يزيد من احتمالية أن يحمل الأعداء والحاويات عناصر قيمة. بدلاً من ذلك, سيقلل الخاتم الملعون من فرصتك في تلقي الغنائم.



