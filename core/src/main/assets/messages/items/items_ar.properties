###misc items
items.amulet.name=amulet of yendor
items.amulet.ac_end=END THE GAME
items.amulet.desc=The Amulet of Yendor is the most powerful artifact known to human or dwarf kind. Its shimmering crystals contain incredible and wondrous power.
items.amulet.desc_origins=أصول التميمة مجهولة. تقول الروايات التاريخية إن ملك الأقزام تفاخر باكتشافه لهذه القطعة الأثرية قبل أن تقطع حضارة الأقزام كل صلة لها به. كيف عثر عليها؟ وكيف انتزعها منه يوخز؟ ربما هذه أسئلة لوقت آخر، لكن المهم الآن هو أن التميمة أصبحت ملكك!
items.amulet.desc_ascent=أصول التميمة مجهولة، لكن من الواضح أنها تأثرت بشدة بقوة يوغز. يبدو أن الزنزانة تخضع لإرادة يوغز كلما تقدمت فيها، مما يجعل الأعداء أكثر وفرة وقوة! كما أنك لم تعد قادرًا على تفعيل التميمة أو التخلص منها، كما لو أنها ملعونة.
items.amulet.ascent_title=Ascension
items.amulet.ascent_desc=تبدأ بالشعور بقوة يوغز العظيمة والرهيبة وهي تنبعث من التميمة. قد يكون الصعود عبر الزنزانة كبشري أصعب مما كنت تتصور!   إذا واصلت الصعود بالتميمة، ستصبح الزنزانة أكثر خطورة، وسيتم تعطيل الانتقالات بين الطوابق، ولن تتمكن من الفوز باللعبة إلا من خلال هزيمة الأعداء أثناء صعودك عبر الزنزانة!   يمكنك ترك التميمة هنا في الوقت الحالي إذا كنت ترغب في الصعود دون بدء هذا التحدي، أو تفعيل التميمة قبل الصعود لإنهاء اللعبة بشكل طبيعي
items.amulet.ascent_yes=Continue!
items.amulet.ascent_no=Stop for Now
items.amulet.discover_hint=You can find this item at the bottom of the dungeon...

items.ankh.name=مفتاح الحياه
items.ankh.ac_bless=بركه
items.ankh.bless=You bless the ankh with magical water.
items.ankh.desc=يمنح هذا الرمز القديم للخلود القدرة على العودة إلى الحياة بعد الموت. ستسقط معظم الأشياء في مكان موتك، ولكن يمكنك استعادتها إذا عدت إليه. باستخدام قربة ماء ممتلئة، يمكن مباركة رمز عنخ بقوة إضافية.
items.ankh.desc_blessed=يمنح هذا الرمز القديم للخلود القدرة على العودة إلى الحياة بعد الموت. لقد بُوركت عنخ وأصبحت الآن أقوى بكثير. ستضحي عنخ بنفسها لإنقاذك في لحظة الخطر المميت
items.ankh.discover_hint=You can buy this item in a shop.

items.arcaneresin.name=arcane resin
items.arcaneresin.prompt=Select a wand
items.arcaneresin.ac_apply=تطبيق
items.arcaneresin.level_too_high=That wand is too powerful for resin to improve.
items.arcaneresin.not_enough=You don't have enough resin for that!
items.arcaneresin.apply=You coat your wand with resin, increasing its power!
items.arcaneresin.desc=     يتلألأ هذا المسحوق الناعم بين درجات اللون البنفسجي والأبيض. ويمكنه أن يعمل كمضخم للطاقات السحرية، فيزيد من قوة العصي السحرية عند استخدامه عليها!   يكلف تطوير العصا 1 أو 2 أو 3 من الراتنج، وذلك حسب مستوى العصا الأولي. ويمكن للراتنج تطوير العصي حتى مستوى +3 كحد أقصى.   ومع ذلك، يتم تجاوز ترقيات الراتنج بواسطة مصادر ترقية أخرى (مثل لفائف الترقية)، ولا يتم تطبيقها عند دمج عصا سحرية في عصا الساحر
items.arcaneresin.discover_hint=You can craft this item via alchemy.

items.brokenseal.name=شاره محطمه
items.brokenseal.ac_affix=AFFIX
items.brokenseal.prompt=Select an armor
items.brokenseal.unknown_armor=You must identify whether that armor is cursed or not first.
items.brokenseal.cursed_armor=The seal won't apply to cursed armor.
items.brokenseal.affix=You affix the seal to your armor!
items.brokenseal.desc=ختم شمعي، يُلصق على الدروع كرمز للشجاعة. يحمل في وسطه نقشًا باهتًا للحماية، وهو متصدع إلى نصفين في المنتصف.   يُعدّ هذا الختم تذكارًا من موطنه، ويساعد المحارب على الصمود. فبمجرد ارتدائه، يكتسب المحارب درعًا واقيًا عندما يكون على وشك تلقي ضرر يُقلّل صحته إلى النصف أو أقل.   يمكن تثبيت الختم على الدروع ونقله بينها. ويمكنه حمل ترقية واحدة معه، بشرط أن تكون هذه الترقية قد طُبقت على الدرع أثناء تثبيت الختم عليه
items.brokenseal.inscribed=The seal is inscribed with a _%s._
items.brokenseal.choose_title=Choose a Glyph
items.brokenseal.choose_desc=يحمل كل من هذا الدرع والختم المكسور رمزًا. اختر الرمز الذي يجب الاحتفاظ به.   نقش الدرع: %1$s  رمز الختم المكسور: %2$s   لاحظ أنه إذا اخترت الرمز الموجود حاليًا على الدرع، فلن يتمكن الختم من نقله لاحقًا.
items.brokenseal.discover_hint=One of the heroes starts with this item.
items.brokenseal$warriorshield.name=Warrior Shield
items.brokenseal$warriorshield.desc_active=يساعد الختم المكسور للمحارب حاليًا على الصمود، مانحًا إياه درعًا إضافيًا إلى جانب صحته. يوجد وقت انتظار بعد تفعيل الدرع لأول مرة قبل أن يتمكن من استخدامه مرة أخرى.   لا يتلاشى هذا الدرع بمرور الوقت، ولكنه سينتهي إذا لم يكن هناك أعداء قريبون لعدة أدوار. عند انتهائه، سيؤدي أي درع غير مستخدم إلى تقليل فترة التبريد، بحد أقصى 50 %% .   الدرع المتبقي: %1$d .   فترة الانتظار الحالية: %2$d .
items.brokenseal$warriorshield.desc_cooldown=The Warrior has recently gained shielding from his broken seal, and must wait until he can benefit from its shielding effect again.\n\nTurns Remaining: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=مدة انتظار درع المحارب سالبة حاليًا، ما يعني أن مدة الانتظار عند تفعيل الدرع ستكون أقل من 150 دورة المعتادة. يمكن تقليل مدة انتظار الدرع إلى -150 دورة، ما يعني أنه سيكون متاحًا فور تفعيله.   فترة التبريد الحالية: %d .

