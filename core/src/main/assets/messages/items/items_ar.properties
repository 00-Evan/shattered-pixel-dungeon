items.artifacts.skeletonkey.lock_charges=يتطلب قفل باب شحنتين.
items.artifacts.skeletonkey.wall_charges=يتطلب إنشاء جدار مؤقت شحنتين.
items.artifacts.skeletonkey.crystal_charges=يتطلب فتح قفل بلوري 5 شحنات.
items.artifacts.skeletonkey.wont_open=يرفض المفتاح الدخول في هذا القفل لسبب ما.
items.artifacts.skeletonkey.locked_with_key=تم قفل هذا الباب بواسطة مفتاح الهيكل العظمي الخاص بك.
items.artifacts.skeletonkey.force_lock=ضعف القفل بدون مفتاح الهيكل العظمي الخاص بك. تمكنت من فتحه بالقوة.
items.artifacts.skeletonkey.discard=تتخلص من مفاتيحك الزائدة.
items.artifacts.skeletonkey.levelup=مفتاح الهيكل العظمي الخاص بك يزداد قوة!
items.artifacts.skeletonkey.desc=مفتاح يبدو مهمًا برأس على شكل جمجمة. تبدو أسنانه مختلفة في كل مرة تنظر إليها.
items.artifacts.skeletonkey.desc_worn=يبدو أن هذا المفتاح السحري يكتسب قوةً كلما استخدمته بدلاً من المفاتيح العادية للزنزانة. يمكن إدخاله في أي قفل تقريبًا من أقفال الزنزانة لفتحه أو إغلاقه, بما في ذلك الأبواب التي لم تكن مغلقة من قبل.\n\nيمكن استخدام المفتاح حتى في المساحات الفارغة, سواءً في اتجاه رئيسي أو قطري, لـ"إغلاق" الهواء أمامك, مما يُنشئ جدارًا صلبًا بعرض 3 مربعات يدوم 10 أدوار. سيؤدي الإغلاق إلى إبعاد الأعداء إذا كانت هناك مساحة كافية لذلك
items.artifacts.skeletonkey.desc_cursed=يبدو أن المفتاح الملعون يتجنب بنشاط الدخول في أي قفل, بل ويجعل من الصعب (ولكن ليس مستحيلاً) عليك استخدام مفاتيحك الأخرى.
items.artifacts.skeletonkey$keywall.desc=تم وضع جدار سحري مؤقت هنا بواسطة مفتاح الهيكل العظمي.

items.artifacts.talismanofforesight.name=تميمة البصيرة
items.artifacts.talismanofforesight.ac_scry=استبصار
items.artifacts.talismanofforesight.low_charge=تتطلب التميمة شحنة بنسبة 5% على الأقل للاستبصار.
items.artifacts.talismanofforesight.prompt=اختر موقعًا لمسحه.
items.artifacts.talismanofforesight.levelup=تميمتك تزداد قوة!
items.artifacts.talismanofforesight.full_charge=تميمتك مشحونة بالكامل!
items.artifacts.talismanofforesight.desc=حجر أملس عليه نقوش غريبة. تشعر وكأنه يراقب كل شيء من حولك, مترقبًا أي شيء مخفي.
items.artifacts.talismanofforesight.desc_worn=عندما تمسك بالتميمة, تشعر وكأن حواسك قد ازدادت حدة. تتراكم طاقة التميمة تدريجيًا مع مرور الوقت, وعندما تكتشف أبوابًا مخفية أو فخاخًا.\n\nيمكن للتميمة أن تنفق شحنتها "للاستبصار" على شكل مخروط, مما يكشف جميع البلاطات والأسرار في المنطقة الممسوحة ضوئياً, وسيمنحك رؤية للأعداء والعناصر لفترة قصيرة.
items.artifacts.talismanofforesight.desc_cursed=التميمة الملعونة تحدق فيك بشدة, مما يضعف حواسك.
items.artifacts.talismanofforesight$foresight.name=بصيرة
items.artifacts.talismanofforesight$foresight.uneasy=تشعر بعدم الارتياح.
items.artifacts.talismanofforesight$foresight.desc=تشعر بتوتر شديد, كما لو كان هناك خطر غير مرئي قريب.

items.artifacts.timekeepershourglass.name=الساعة الرملية لحارس الوقت
items.artifacts.timekeepershourglass.ac_activate=تفعيل
items.artifacts.timekeepershourglass.deactivate=تقوم بإلغاء تفعيل تجميد الوقت.
items.artifacts.timekeepershourglass.no_charge=لم يُعد شحن ساعتك الرملية بما يكفي لتكون صالحة للاستخدام بعد.
items.artifacts.timekeepershourglass.cursed=لا يمكنك استخدام ساعة رملية ملعونة.
items.artifacts.timekeepershourglass.onstasis=يبدو أن العالم يتحول من حولك في لحظة.
items.artifacts.timekeepershourglass.onfreeze=يتجمد كل شيء من حولك فجأة.
items.artifacts.timekeepershourglass.stasis=وضع نفسي في حالة سكون
items.artifacts.timekeepershourglass.freeze=تجميد الوقت من حولي
items.artifacts.timekeepershourglass.prompt=كيف ترغب في استخدام سحر الساعة الرملية?\n\nأثناء حالة السكون, سيمر الوقت بشكل طبيعي بينما أنت متجمد وغير قابل للتأثر تمامًا, ويستهلك ما يصل إلى شحنتين في المرة الواحدة.\n\nعندما يتوقف الزمن, يمكنك التحرك كما لو أن أفعالك لا تستغرق وقتًا. ويمكن تعطيل هذه الخاصية في أي وقت باستخدام الساعة الرملية أو بالهجوم.
items.artifacts.timekeepershourglass.desc=تبدو هذه الساعة الرملية الكبيرة المزخرفة بسيطةً للوهلة الأولى, لكنك تشعر بقوةٍ عظيمةٍ في إطارها المنحوت بدقة. وبينما تدير الساعة الرملية وتراقب الرمال وهي تتدفق, تشعر بسحرها يجذبك, ولا شك أن استخدام هذا السحر سيمنحك بعض السيطرة على الوقت.
items.artifacts.timekeepershourglass.desc_hint=يبدو أن الساعة الرملية قد فقدت بعض الرمال, لو استطعت فقط العثور على بعض منها...
items.artifacts.timekeepershourglass.desc_cursed=الساعة الرملية الملعونة مقيدة بجانبك, يمكنك أن تشعر بها تحاول التلاعب بتدفق الوقت لديك.
items.artifacts.timekeepershourglass$timefreeze.name=تجميد الوقت
items.artifacts.timekeepershourglass$timefreeze.desc=يتوقف الزمن من حولك, مما يتيح لك القيام بالأفعال فورًا. يستمر هذا التأثير حتى يتم إلغاؤه أو ينفد شحن ساعتك الرملية. كما أن الهجوم أو استخدام السحر سيُبطل هذا التأثير.\n\nيُدار حتى يتم شحن الاستخدام: %s .
items.artifacts.timekeepershourglass$sandbag.name=كيس الرمل السحري
items.artifacts.timekeepershourglass$sandbag.levelup=تضيف الرمل إلى ساعتك الرملية.
items.artifacts.timekeepershourglass$sandbag.maxlevel=ساعتك الرملية ممتلئة بالرمل السحري!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=ليس لديك ساعة رملية لوضع هذا الرمل فيها.
items.artifacts.timekeepershourglass$sandbag.desc=يجب أن يعمل هذا الكيس الصغير من الرمل الناعم بشكل مثالي مع ساعتك الرملية.\n\nيبدو من الغريب أن يمتلك صاحب المتجر هذا العنصر المحدد في الوقت الذي تحتاجه فيه تمامًا...

items.artifacts.unstablespellbook.name=كتاب تعاويذ غير مستقر
items.artifacts.unstablespellbook.ac_read=قرائه
items.artifacts.unstablespellbook.ac_add=يضيف
items.artifacts.unstablespellbook.blinded=لا يمكنك القراءة من الكتاب وأنت أعمى.
items.artifacts.unstablespellbook.no_charge=نفدت طاقة كتاب التعاويذ الخاص بك في الوقت الحالي.
items.artifacts.unstablespellbook.cursed=لا يمكنك القراءة من كتاب تعاويذ ملعون.
items.artifacts.unstablespellbook.prompt=اختر لفافة
items.artifacts.unstablespellbook.infuse_scroll=تغرس طاقة اللفافة في الكتاب.
items.artifacts.unstablespellbook.unable_scroll=أنت غير قادر على إضافة هذه اللفافة إلى الكتاب.
items.artifacts.unstablespellbook.unknown_scroll=لست متأكدًا من نوع هذه اللفافة بعد.
items.artifacts.unstablespellbook.desc=هذا المجلد في حالة جيدة بشكلٍ مدهش بالنظر إلى عمره. يصدر صوت طقطقة وفرقعة عند تقليب صفحاته, مفعماً بطاقة غير مستقرة. إذا قرأت من هذا الكتاب, فلا يمكن التنبؤ بالسحر الذي قد تُلقيه
items.artifacts.unstablespellbook.desc_cursed=ارتبط الكتاب الملعون بك, وهو يعيق قدرتك على استخدام معظم اللفائف.
items.artifacts.unstablespellbook.desc_index=الكتاب غير مكتمل. يشير فهرسه حاليًا إلى الصفحات الفارغة التالية:
items.artifacts.unstablespellbook.desc_empowered=اللفائف التي أضفتها إلى الكتاب تتوهج بالقوة. ستتمكن من اختيار النسخة النادرة من تأثيرات هذه اللفافة, ولكن بتكلفة شحنة إضافية.
items.artifacts.unstablespellbook.read_empowered=تتدفق الطاقة في اللفافة التي أضفتها إلى كتاب التعاويذ. يمكنك توجيه تأثير هذه اللفافة إما بشكلها العادي أو بشكلها المميزه\n\nاختيار النسخة المميزة سيكلف شحنتين بدلاً من شحنة واحدة



###bags
items.bags.bag.name=حقيبه ظهر
items.bags.bag.discover_hint=يمكنك شراء هذا العنصر من المتجر.

items.bags.potionbandolier.name=حزام الجرعات
items.bags.potionbandolier.desc=هذا الحزام السميك يلتف حول صدرك مثل الوشاح, ويحتوي على العديد من الأشرطة المعزولة لحمل قوارير الجرعات, أو قربة الماء, أو قوارير المعادن السائلة.\n\nيجب حماية جرعاتك من البرد أثناء وجودها داخل الحزام.

items.bags.scrollholder.name=حامل اللفائف
items.bags.scrollholder.desc=تبدو هذه الحاوية الأنبوبية وكأنها مخصصة لأدوات الفلكيين وخرائطهم, لكنها تتسع أيضاً لمخطوطاتك. كما تحتوي على بعض الجيوب الجانبية التي تتسع بشكل مثالي لبلورات التعاويذ, وأقلام الكتابة السحرية, والراتنج السحري.\n\nلا يبدو الحامل قابلاً للاشتعال بشكل كبير, لذا يجب أن تكون لفائفكم آمنة من النار بداخله

items.bags.velvetpouch.name=جراب مخملي
items.bags.velvetpouch.desc=يمكن لهذا الجراب المخملي الصغير تخزين العديد من العناصر الصغيرة بداخله, مثل البذور وأحجار الرون وبعض مكونات الخيمياء.
items.bags.velvetpouch.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.bags.magicalholster.name=حافظة سحرية
items.bags.magicalholster.desc=هذه الحافظة النحيفة مصنوعة من جلد حيوان غريب, وتمتلك سحراً قوياً يسمح لها بتخزين كمية هائلة من الأسلحة بعيدة المدى.\n\nيمكنك ببساطة مد يدك إلى الحقيبة وستجد دائمًا الشيء الذي كنت تبحث عنه.\n\nبسبب سحر الحافظة, سيتم شحن العصي السحرية بشكل أسرع قليلاً وستدوم الأسلحة التي يتم رميها لفترة أطول قليلاً داخلها.



###bombs
items.bombs.arcanebomb.name=قنبلة غامضة
items.bombs.arcanebomb.desc=تم تشبيع هذه القنبلة بخصائص غامضة. ستنفجر في انفجار قوي مشابه لهجوم المادة اللزجة المشحون, مما يلحق _%1$d-%2$d ضررًا سحريًا_ بأي شيء ضمن مربعين.
items.bombs.arcanebomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.bomb.name=قنبله
items.bombs.bomb.ac_lightthrow=إشعال ورمي
items.bombs.bomb.snuff_fuse=تطفئ فتيل القنبلة بسرعة.
items.bombs.bomb.ondeath=قتلك الانفجار...
items.bombs.bomb.rankings_desc=قُتل بواسطة انفجار
items.bombs.bomb.desc=قنبلة بارود أسود ثقيلة إلى حد ما. يلحق انفجار هذه القنبلة _%1$d-%2$d ضررًا_ بأي شيء مجاور لها, وسيدمر بعض التضاريس أو العناصر المجاورة.
items.bombs.bomb.desc_fuse=يبدو أن الفتيل سيستغرق بضع جولات ليحترق بمجرد إشعاله.
items.bombs.bomb.desc_burning=فتيل القنبلة يحترق, حافظ على مسافتك أو أطفئه!
items.bombs.bomb$doublebomb.name=قنبلتين
items.bombs.bomb$doublebomb.desc=كومة من قنبلتي بارود أسود ثقيلتين, يبدو أنك حصلت على واحدة مجانًا!

items.bombs.firebomb.name=قنبله ناريه
items.bombs.firebomb.desc=تم تعديل هذه القنبلة لتنفجر في مساحة أكبر, مما يلحق _%1$d-%2$d ضررًا_ وينشر لهبًا مستمرًا ضمن مربعين.
items.bombs.firebomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.flashbangbomb.name=قنبلة صوتية ضوئية
items.bombs.flashbangbomb.desc=ستنفجر هذه القنبلة المُخصصة مُحدثةً انفجارًا من الضوء والصوت والكهرباء عند انفجارها. أي شيء يقع ضمن نطاق مربعين سيتأثر. %1$d - %2$d الأضرار الناجمة عن الانفجار, 25 إضافية %% سيتعرض للضرر من الكهرباء, وسيصاب بالذهول لمدة 10 أدوار.
items.bombs.flashbangbomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.frostbomb.name=قنبله التجميد
items.bombs.frostbomb.desc=تم تعديل هذه القنبلة لتنفجر في مساحة أكبر, مما يلحق _%1$d-%2$d ضررًا_ وينشر هبة مستمرة من الهواء المتجمد ضمن مربعين.
items.bombs.frostbomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.holybomb.name=قنبله مباركه
items.bombs.holybomb.desc=تم تعديل هذه القنبلة لتومض بضوء ذي قوة خارقة في مساحة أكبر عند انفجارها. أي شيء ضمن نطاق مربعين سيتأثر. %1$d - %2$d سيتعرض الأعداء الموتى الأحياء أو الشياطين لأضرار إضافية قدرها 50, نتيجة الانفجار. %% الضرر الناجم عن النور ذي القوة الخارقة.
items.bombs.holybomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.noisemaker.name=صانع الضوضاء
items.bombs.noisemaker.desc=ستصدر هذه القنبلة المخصصة ضوضاء بشكل متكرر عندما ينفد فتيلها. عندما يلمس شيء ما القنبلة, ستنفجر وتلحق _%1$d-%2$d ضررًا_ بأي شيء ضمن مربعين!
items.bombs.noisemaker.desc_burning=صانع الضوضاء يدق, سينفجر عندما يقترب منه شيء ما!
items.bombs.noisemaker.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.smokebomb.name=قنبلة دخانية
items.bombs.smokebomb.desc=تم تعديل هذه القنبلة لتنفث سحابة كثيفة من الغاز في نفس وقت انفجارها. ستلحق _%1$d-%2$d ضررًا_ وتنشر ضبابًا حاجبًا ضمن مربعين.
items.bombs.smokebomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.regrowthbomb.name=قنبلة إعادة النمو
items.bombs.regrowthbomb.desc=هذه القنبلة المُخصصة ستنشر سائلاً مُحيياً في كل مكان ضمن نطاق ثلاث مربعات بدلاً من الانفجار. المنطقة التي يقع فيها الانفجار ستنبت فيها الأعشاب والنباتات بسرعة. ستُشفى أنت وأي حلفاء لك يقعون في نطاق الانفجار كما لو أنهم شربوا جرعة شفاء.
items.bombs.regrowthbomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.shrapnelbomb.name=قنبلة شظايا
items.bombs.shrapnelbomb.desc=تم تعديل هذه القنبلة بقطع معدنية من قنبلة DM-300, والتي ستتفتت وتتناثر في كل مكان عند انفجارها, مما سيؤدي إلى _ %1$d - %2$d يُلحق هذا السلاح ضرراً بالغاً في نطاق واسع حول القنبلة. من الأفضل أن تختبئ خلف شيء ما عند استخدامه
items.bombs.shrapnelbomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.bombs.woollybomb.name=قنبلة صوفية
items.bombs.woollybomb.desc=ستُحدث هذه القنبلة المُخصصة حقلًا واسعًا من الأغنام السحرية بعد انفجارها. سيُلحق الانفجار ضررًا بـ %1$d - %2$d تُلحق هذه الخراف ضررًا بأي شيء ضمن نطاق مربعين. ستعيق الحركة وتستمر لفترة طويلة جدًا! لكنها لن تدوم طويلًا في وجود أعداء أقوياء, ويمكن إزالتها يدويًا بسرعة أكبر بالتفاعل معها.
items.bombs.woollybomb.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

###food
items.food.berry.name=توت الزنزانة
items.food.berry.eat_msg=كان هذا التوت لذيذًا!
items.food.berry.desc=عثرت الصيادة على هذه التوتة الصغيرة بين نباتات الزنزانة. يمكن أكلها بسرعة, وتستعيد قدرًا ضئيلاً من الشبع, وقد تحتوي على بذرة قابلة للاستخدام!
items.food.berry.discover_hint=يمكنك العثور على هذا العنصر باستخدام موهبة بطل محددة.

items.food.blandfruit.name=فاكهه بدون طعم
items.food.blandfruit.cooked=فاكهة بدون طعم مطبوخة
items.food.blandfruit.sunfruit=عباد الشمس
items.food.blandfruit.rotfruit=فاكهه الفساد
items.food.blandfruit.earthfruit=فاكهه الارض
items.food.blandfruit.blindfruit=فاكهه عمياء
items.food.blandfruit.firefruit=فاكهه اللهب
items.food.blandfruit.icefruit=فاكهه الجليد
items.food.blandfruit.fadefruit=فاكهه الاختفاء
items.food.blandfruit.sorrowfruit=فاكهه الحزن
items.food.blandfruit.stormfruit=فاكهه العاصفه
items.food.blandfruit.dreamfruit=فاكهه السحر
items.food.blandfruit.starfruit=فاكهه النجوم
items.food.blandfruit.swiftfruit=فاكهة السرعة
items.food.blandfruit.raw=لا يمكنك تحمل أكلها نيئة.
items.food.blandfruit.desc=جافة جدًا وعديمة القيمة, ربما يؤدي طهيها مع مكون آخر إلى تحسينها.
items.food.blandfruit.desc_cooked=انتفخت الثمرة بعد نقعها في الإناء, بل وامتصت خصائص البذرة التي طُبخت معها. وسيكون لها تأثير الجرعة التي كانت البذرة تُستخدم فيها
items.food.blandfruit.desc_eat=تبدو جاهزة للأكل!
items.food.blandfruit.desc_throw=تبدو متقلبة جدًا, قد يكون من الأفضل رميها.
items.food.blandfruit$chunks.name=قطع فاكهة بدون طعم
items.food.blandfruit$chunks.desc=انفجرت الفاكهة عديمة الطعم عند الاصطدام, تاركة وراءها قطعًا خاملة.\n\nعلى الرغم من القليل من الأوساخ, تبدو هذه القطع الكبيرة من الفاكهة عديمة الطعم المطبوخة صالحة للأكل تمامًا.

items.food.chargrilledmeat.name=لحم مشوي على الفحم
items.food.chargrilledmeat.desc=تبدو وكأنها شريحة لحم جيدة.
items.food.chargrilledmeat.discover_hint=يمكنك صنع هذا باستخدام عنصر طعام آخر.

items.food.food.name=حصة غذائية
items.food.food.ac_eat=ياكل
items.food.food.eat_msg=كان مذاق هذا الطعام لذيذًا!
items.food.food.desc=لا شيء فاخر هنا: لحم مجفف, وبعض البسكويت - أشياء من هذا القبيل.

items.food.frozencarpaccio.name=كارباتشيو مجمد
items.food.frozencarpaccio.invis=ترى يديك تتحولان إلى غير مرئيتين!
items.food.frozencarpaccio.hard=تشعر بتصلب جلدك!
items.food.frozencarpaccio.refresh=منعش
items.food.frozencarpaccio.better=تشعر بتحسن!
items.food.frozencarpaccio.desc=إنها قطعة من اللحم النيء المجمد. الطريقة الوحيدة لأكلها هي تقطيعها إلى شرائح رقيقة. وبهذه الطريقة يكون مذاقها جيدًا بشكل مدهش.
items.food.frozencarpaccio.discover_hint=يمكنك صنع هذا باستخدام عنصر طعام آخر.

items.food.meatpie.name=فطيره اللحم
items.food.meatpie.eat_msg=كان هذا الطعام رائعًا!
items.food.meatpie.desc=فطيرة لذيذة محشوة باللحم الشهي. ستشبعك هذه الفطيرة أكثر بكثير من أي وجبة أخرى.
items.food.meatpie.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.food.mysterymeat.name=لحم غامض
items.food.mysterymeat.eat_msg=كان مذاق هذا الطعام... غريبًا.
items.food.mysterymeat.hot=أوه إنه ساخن!
items.food.mysterymeat.legs=لا يمكنك الشعور بساقيك!
items.food.mysterymeat.not_well=أنت لا تشعر أنك بخير.
items.food.mysterymeat.stuffed=لقد امتلأت معدتك.
items.food.mysterymeat.desc=كُل على مسؤوليتك الخاصة!
items.food.mysterymeat.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من أعداء معينين.
items.food.mysterymeat$placeholder.name=لحم

items.food.phantommeat.name=لحم شبحي
items.food.phantommeat.desc=شريحة لحم كبيرة لامعة وشفافة, مقطعة من سمكة البيرانا الشبحية. هذا اللحم السحري لا يحتاج إلى طهي, ويمنح فوائد دفاعية عديدة بالإضافة إلى إشباعك تمامًا. عند تناوله, يمنحك القدرة على الاختفاء, وجلدًا صلبًا, وبعض الشفاء, ويعالج العديد من الآثار الضارة.
items.food.phantommeat.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من أعداء معينين.

items.food.pasty.name=فطيره المكرونه
items.food.pasty.fish_name=سمك مطهو على البخار
items.food.pasty.amulet_name=تميمة يندور?
items.food.pasty.egg_name=بيضة عيد الفصح
items.food.pasty.rainbow_name=جرعة قوس قزح
items.food.pasty.shattered_name=كعكة خضراء
items.food.pasty.pie_name=فطيرة اليقطين
items.food.pasty.vanilla_name=كعكة زرقاء
items.food.pasty.cane_name=عصا الحلوى
items.food.pasty.sparkling_name=جرعة فوارة
items.food.pasty.desc=فطيرة كورنيش أصلية بحشوة تقليدية من اللحم البقري والبطاطس. لذيذة!
items.food.pasty.fish_desc=سمكة كاملة مطهوة على البخار, محفوظة بطريقة سحرية على طبقة من الخضار. من التقاليد في هذا الوقت من السنة الاحتفاظ ببعض السمك لوقت لاحق, لذا ستحتفظ ببعض البقايا بدلاً من تناولها كلها دفعة واحدة.\n\nكل عام وأنتم بخير بمناسبة رأس السنة القمرية!
items.food.pasty.amulet_desc=لقد وجدتها أخيرًا, التميمة السحرية لـ - لحظة, هذه مجرد قطعة شوكولاتة مغلفة بورق قصدير مصممة لتبدو كالتميمة! لن تمنحك قوة لا حدود لها, لكنها على الأقل ستشبعك وتمنحك شحنة أثرية صغيرة.\n\nكذبة أبريل!
items.food.pasty.egg_desc=بيضة شوكولاتة كبيرة جدًا, ملفوفة بورق قصدير أصفر ملون. يوجد هنا ما يكفي من الشوكولاتة لإشباعك بسهولة, وقد يمنح السكر أدواتك الأثرية القليل من الشحن الإضافي.\n\nعيد فصح سعيد!
items.food.pasty.rainbow_desc=هذا المشروب الملون نوع من الطعام السائل. إضافةً إلى إشباع جوعك, فهو يحمل في طياته سحراً خفيفاً يُهدئ الأعداء غير الزعماء المجاورين, مما يجعلهم يترددون مؤقتاً في قتالك\n\nعيد فخر سعيد!
items.food.pasty.shattered_desc=هذه القطعة الكبيرة من كعكة الفانيليا مزينة برشات ملونة وكريمة خضراء. صُنعت الكعكة احتفالاً بسنوات من الخبرة, وستمنحك جزءًا بسيطًا من تلك الخبرة عند تناولها.\n\nصدرت لعبة Shattered Pixel Dungeon لأول مرة في 5 أغسطس 2014. عيد ميلاد سعيد يا Shattered Pixel Dungeon!
items.food.pasty.pie_desc=شريحة كبيرة جدًا من فطيرة اليقطين. نكهتها الحلوة والحارة ستشبعك وتمنحك القليل من الشفاء.\n\nعيد هالوين سعيد!
items.food.pasty.vanilla_desc=هذه القطعة الكبيرة من كعكة الفانيليا مزينة برشات ملونة وكريمة زرقاء. صُنعت الكعكة احتفالاً بسنوات من الخبرة, وستمنحك جزءاً بسيطاً من تلك الخبرة عند تناولها.\n\nصدرت لعبة Pixel Dungeon الأصلية لأول مرة في 4 ديسمبر 2012. عيد ميلاد سعيد يا Pixel Dungeon!
items.food.pasty.cane_desc=عصا حلوى سكرية ضخمة. إنها كبيرة بما يكفي لإشباعك, وقد يمنح السكر عصيك السحرية القليل من الشحن الإضافي أيضًا.\n\nأعياد سعيدة!
items.food.pasty.sparkling_desc=هذه الجرعة الفوارة هي نوع من الطعام السائل. إنها تشبع الجوع وتحاكي النبيذ الفوار, ولكنها ليست كحولية في الواقع. الشعور الدافئ في بطنك سيمنحك القليل من الدروع الواقية.\n\nسنة جديدة سعيدة!
items.food.pasty$fishleftover.name=بقايا السمك
items.food.pasty$fishleftover.eat_msg=كان مذاق هذا الطعام مقبولاً.
items.food.pasty$fishleftover.desc=بعض السمك الفائض من وجبتك السابقة. يمكنك أكله في أي وقت تشاء لاستعادة القليل من الشبع.

items.food.smallration.name=حصة غذائية صغيرة
items.food.smallration.eat_msg=كان مذاق هذا الطعام مقبولاً.
items.food.smallration.desc=تبدو تمامًا مثل الحصة الغذائية القياسية ولكنها أصغر حجمًا.
items.food.smallration.discover_hint=يمكنك شراء هذا العنصر من المتجر.

items.food.stewedmeat.name=لحم مطهي
items.food.stewedmeat.eat_msg=كان مذاق هذا الطعام مقبولاً.
items.food.stewedmeat.desc=طهي اللحم قد طهره من أي أمراض أو طفيليات. يجب أن يكون آمنًا للأكل.
items.food.stewedmeat.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.food.supplyration.name=حصة إمدادات
items.food.supplyration.desc=هذه الحصة الغذائية وُضعت في الزنزانة من قِبل أعضاء نقابة اللصوص ولأجلهم. وهي مُصممة خصيصًا ليتم تناولها أثناء التنقل, وللمساعدة في أعمال الخداع والمكر.\n\nعلى الرغم من أنها لا تشبعك بقدر الحصة الغذائية العادية, إلا أنه يمكن تناولها بسرعة, وتوفر القليل من الشفاء المباشر, وستعيد شحنة عباءة الظلال الخاصة باللص.
items.food.supplyration.discover_hint=يمكنك العثور على هذا العنصر باستخدام موهبة بطل محددة.



##journal items
items.journal.documentpage.name=صفحة ممزقة
items.journal.documentpage.desc=صفحة وحيدة, ربما انتُزعت من كتاب من نوع ما. ستحتاج إلى التقاطها لقراءتها.

items.journal.alchemypage.name=صفحة ممزقة من كتاب الخيمياء
items.journal.alchemypage.desc=صفحة ممزقة من دليل إرشادي حول الخيمياء.\n\nمعظم النص صغير جدًا بحيث لا يمكن قراءته عن بُعد, ولكن يمكنك تمييز عنوان الصفحة:\n\n_"%s"_

items.journal.guidebook.name=كتاب القوه لإتقان الزنزانة
items.journal.guidebook.hint_mobile=يحتوي دليلك الإرشادي على نصائح لك! اضغط على زر اليوميات الوامض في أعلى اليمين لقراءته.
items.journal.guidebook.hint_desktop=يحتوي دليلك الإرشادي على نصائح لك! اختر زر اليوميات الوامض (%s) في أعلى اليمين لقراءته.
items.journal.guidebook.hint_status=الدليل الإرشادي
items.journal.guidebook.desc=دليل للمغامرين, تركه هنا شخص قرر أن المغامرة ليست له! هذا الكتاب تحديداً ساحر, ويمكنه أن يحفز المغامرين على قراءة صفحة في اللحظة المناسبة.\n\nعلى الرغم من هذه الوظيفة, فإن الكتاب يحظى بشعبية كبيرة بسبب الكلمات الكبيرة "لا داعي للذعر!" المكتوبة بأحرف كبيرة وودية على الغلاف.

items.journal.guidepage.name=صفحة ممزقة من الدليل الإرشادي
items.journal.guidepage.desc=صفحة ممزقة من دليل إرشادي للمغامرة.\n\nمعظم النص صغير جدًا بحيث لا يمكن قراءته عن بُعد, ولكن يمكنك تمييز عنوان الصفحة:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=رسالة بالية
items.journal.regionlorepage$sewers.desc=ما يبدو أنه رسالة مكتوبة على قطعة ورق ملطخة بالأوساخ. ستحتاج إلى التقاطها لتتمكن من قراءة ما هو مكتوب عليها.

items.journal.regionlorepage$prison.name=تدوينة يوميات بالية
items.journal.regionlorepage$prison.desc=مدونة يومية, أو أي نوع آخر من السجلات, مكتوبة على ورقة قديمة. يبدو أنها صمدت بشكل أفضل من الرسائل التي وجدتها في المجاري, لكنك ستظل بحاجة إلى التقاطها لقراءتها.

items.journal.regionlorepage$caves.name=تدوينة سجل قديمة
items.journal.regionlorepage$caves.desc=ما يبدو أنه تدوينة في سجل مستكشف, محفوظة بشكل جيد بشكل مدهش على الرغم من قدمها. التقطها لقراءتها.

items.journal.regionlorepage$city.name=لوح صدئ
items.journal.regionlorepage$city.desc=لوح معدني صغير صدئ محفور عليه رسالة بطريقة سحرية. لا تزال الحروف واضحة على الرغم من عمر اللوح, ولكن سيتعين عليك التقاطه لقراءته.

items.journal.regionlorepage$halls.name=لوح متوهج
items.journal.regionlorepage$halls.desc=لوح أسود صغير محفور عليه حروف خضراء متوهجة. تتلاشى الحروف المتوهجة معًا في ضباب عن بُعد, سيتعين عليك التقاطه لقراءته.


###keys
items.keys.goldenkey.name=مفتاح ذهبي
items.keys.goldenkey.desc=الثلمات الموجودة على هذا المفتاح الذهبي صغيرة ومعقدة. ربما سيفتح صندوقًا مقفلاً?

items.keys.crystalkey.name=مفتاح كريستالي
items.keys.crystalkey.desc=تتلألأ الأسطح المقطوعة لهذا المفتاح البلوري في الظلام. ربما سيفتح شيئًا مصنوعًا من البلور?

items.keys.ironkey.name=مفتاح حديدي
items.keys.ironkey.desc=الثلمات الموجودة على هذا المفتاح الحديدي القديم مهترئة جيدًا; وحبل الجلد الخاص به متهالك بفعل الزمن. أي باب قد يفتح?

items.keys.wornkey.name=مفتاح بالٍ
items.keys.wornkey.desc=هذا المفتاح بالٍ وباهت اللون, ولكنه يبدو جادًا. من المحتمل أن يفتح بابًا مهمًا قريبًا.



###potions
items.potions.potion.ac_drink=يشرب
items.potions.potion.turquoise=جرعة فيروزية
items.potions.potion.crimson=جرعة قرمزية
items.potions.potion.azure=جرعة لازوردية
items.potions.potion.jade=جرعة يشمية
items.potions.potion.golden=جرعة ذهبية
items.potions.potion.magenta=جرعة أرجوانية
items.potions.potion.charcoal=جرعة فحمية
items.potions.potion.ivory=جرعة عاجية
items.potions.potion.amber=جرعة عنبرية
items.potions.potion.bistre=جرعة بنية داكنة
items.potions.potion.indigo=جرعة نيلية
items.potions.potion.silver=جرعة فضية
items.potions.potion.unknown_desc=تحتوي هذه القارورة على سائل ملون دوار. من يدري ماذا سيفعل عند شربه أو رميه?
items.potions.potion.harmful=جرعة ضارة!
items.potions.potion.beneficial=جرعة مفيدة
items.potions.potion.yes=نعم, أنا أعرف ما أفعله
items.potions.potion.no=لا لقد غيرت راي
items.potions.potion.sure_drink=هل أنت متأكد أنك تريد شربها? في معظم الحالات يجب عليك رمي مثل هذه الجرعات على أعدائك.
items.potions.potion.sure_throw=هل أنت متأكد أنك تريد رميها? في معظم الحالات من المنطقي شربها.
items.potions.potion.shatter=تتحطم القارورة ويتناثر السائل دون ضرر.
items.potions.potion.discover_hint=يمكنك العثور على هذا العنصر عشوائيًا في الزنزانة, أو صنعه عن طريق الخيمياء.
items.potions.potion$placeholder.name=مشروب سحري
items.potions.potion$seedtopotion.name=جرعة عشوائية

items.potions.potionofexperience.name=جرعة الخبرة
items.potions.potionofexperience.desc=الخبرات العريقة لعدد لا يحصى من المعارك مختزلة في شكل سائل, سترفع هذه الجرعة مستوى خبرتك على الفور.

items.potions.potionoffrost.name=جرعة الصقيع
items.potions.potionoffrost.desc=ستتبخر المادة الكيميائية الموجودة في هذه الجرعة إلى سحابة متجمدة عند تعرضها للهواء الطلق.

items.potions.potionofhaste.name=جرعة السرعة
items.potions.potionofhaste.energetic=تشعر بالنشاط!
items.potions.potionofhaste.desc=شرب هذا السائل الحلو بشكل غريب سيمنحك طاقة هائلة لفترة قصيرة, مما يسمح لك بالركض بسرعات عالية.

items.potions.potionofhealing.name=جرعة الشفاء
items.potions.potionofhealing.heal=تبدأ جروحك بالالتئام.
items.potions.potionofhealing.desc=سيستعيد هذا الإكسير صحتك بسرعة ويشفي العديد من الأمراض على الفور.

items.potions.potionofinvisibility.name=جرعة الاختفاء
items.potions.potionofinvisibility.invisible=ترى يديك تتحولان إلى غير مرئيتين!
items.potions.potionofinvisibility.desc=شرب هذه الجرعة سيجعلك غير مرئي مؤقتًا. أثناء الاختفاء, لن يتمكن الأعداء من رؤيتك. الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) ستلغي الاختفاء على الفور.

items.potions.potionoflevitation.name=جرعة الطفو
items.potions.potionoflevitation.float=تطفو في الهواء!
items.potions.potionoflevitation.desc=شرب هذا السائل الغريب سيجعلك تحوم في الهواء, قادرًا على الانجراف دون عناء فوق الفخاخ والحفر. رمي هذه الجرعة سيخلق سحابة من الغاز غير المكرر, مما يربك أي شيء يعلق فيها.

items.potions.potionofliquidflame.name=جرعة اللهب السائل
items.potions.potionofliquidflame.desc=تحتوي هذه القارورة على مركب غير مستقر سينفجر بعنف في شكل لهب عند تعرضه للهواء الطلق.

items.potions.potionofmindvision.name=جرعة الرؤية الذهنية
items.potions.potionofmindvision.see_mobs=يمكنك بطريقة ما الشعور بوجود عقول المخلوقات الأخرى!
items.potions.potionofmindvision.see_none=يمكنك بطريقة ما معرفة أنك وحدك في هذا الطابق في الوقت الحالي.
items.potions.potionofmindvision.desc=بعد شرب هذا المشروب, سيصبح عقلك متناغمًا مع البصمة النفسية للكائنات البعيدة, مما يُمكّنك من استشعار وجود الكائنات الحية عبر الجدران. كما سيسمح لك هذا المشروب بالرؤية عبر الجدران والأبواب القريبة

items.potions.potionofparalyticgas.name=جرعة الغاز المشل
items.potions.potionofparalyticgas.desc=عند تعرض السائل الموجود في هذه القارورة للهواء الطلق, يتبخر متحولًا إلى ضباب أصفر مخدر. أي شخص يستنشق هذا الضباب يُصاب بالشلل فورًا, ويعجز عن الحركة لفترة بعد تبدد الضباب. يمكن رمي هذه القارورة على الأعداء البعيدين لإصابتهم بتأثير الغاز.

items.potions.potionofpurity.name=جرعة النقاء
items.potions.potionofpurity.freshness=تشعر بانتعاش غير عادي في الهواء.
items.potions.potionofpurity.protected=يحيط بك غشاء واقٍ!
items.potions.potionofpurity.desc=سيعمل هذا الكاشف السحري بسرعة على تحييد جميع التأثيرات الضارة المرتبطة بالمنطقة في مساحة واسعة. شربه سيمنحك مناعة مؤقتة ضد هذه التأثيرات.

items.potions.potionofstrength.name=جرعة القوة
items.potions.potionofstrength.msg=تتدفق قوة مكتشفة حديثًا عبر جسدك, لديك الآن %d قوة!
items.potions.potionofstrength.desc=سيسري هذا السائل القوي عبر عضلاتك, مما يزيد من قوتك بشكل دائم بمقدار نقطة واحدة.

items.potions.potionoftoxicgas.name=جرعة الغاز السام
items.potions.potionoftoxicgas.desc=سيؤدي فتح أو تحطيم هذا الزجاج المضغوط إلى انفجار محتوياته وتحولها إلى سحابة قاتلة من الغاز الأخضر السام. يمكنك قذف هذا المشروب على الأعداء البعيدين بدلاً من فتحه باليد



###brews
items.potions.brews.brew.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.potions.brews.aquabrew.name=مشروب الماء
items.potions.brews.aquabrew.desc=عند تحطيم هذا المشروب, سيطلق دفقة من الماء المضغوط في موقعه. قوته كافية فقط لإلحاق الضرر بالأعداء الناريين, ولكنه ينشر الماء أيضًا إلى التضاريس المجاورة, ويعطل الفخاخ, ويخمد النيران, ويدفع الشخصيات القريبة من موقع الانفجار إلى الخلف.

items.potions.brews.blizzardbrew.name=مشروب العاصفة الثلجية
items.potions.brews.blizzardbrew.desc=عند تحطيمه, سيطلق هذا المشروب عاصفة ثلجية دوامة تنتشر بسرعة مثل الغاز.

items.potions.brews.causticbrew.name=مشروب كاوٍ
items.potions.brews.causticbrew.desc=سينشر هذا المشروب مادة لزجة مآكلة في مساحة واسعة حول الموقع الذي يتحطم فيه. أي شيء تعلق به المادة اللزجة سيذوب ببطء إذا لم يتمكن من غسلها في الماء.

items.potions.brews.infernalbrew.name=مشروب جهنمي
items.potions.brews.infernalbrew.desc=عند تحطيمه, سيطلق هذا المشروب جحيمًا مستعرًا ينتشر بسرعة مثل الغاز.

items.potions.brews.shockingbrew.name=مشروب صاعق
items.potions.brews.shockingbrew.desc=عند تحطيمه, سيطلق هذا المشروب عاصفة كهربائية في مساحة واسعة حول الموقع الذي ينكسر فيه.

items.potions.brews.unstablebrew.name=مشروب غير مستقر
items.potions.brews.unstablebrew.desc=هذا المشروب السحري يتوهج بألوان قوس قزح متغيرة.\n\nعند شربها أو رميها, ستُفعّل تأثير جرعة عشوائية. سيكون تأثير الجرعة مفيدًا دائمًا عند شربها, وضارًا دائمًا عند رميها.

###elixirs
items.potions.elixirs.elixir.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.potions.elixirs.elixirofarcanearmor.name=إكسير الدرع الغامض
items.potions.elixirs.elixirofarcanearmor.desc=سيمنح هذا الإكسير للشارب مقاومة طويلة الأمد للضرر السحري.

items.potions.elixirs.elixirofaquaticrejuvenation.name=إكسير التجديد المائي
items.potions.elixirs.elixirofaquaticrejuvenation.desc=يحتوي هذا الإكسير على بقايا المادة اللزجة المعززة بجرعة شفاء. بينما لن يوفر شفاءً فوريًا, إلا أنه سيستعيد بثبات كمية أكبر من الصحة أثناء وقوفك في الماء.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=شفاء مائي
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=لقد اكتسبت مؤقتًا خصائص علاجية مشابهة لخصائص مادة "جو".\n\nأثناء وقوفك في الماء, ستستعيد مقدارًا ضئيلاً من صحتك في كل دور. يتوقف هذا التأثير عندما تكون صحتك كاملة أو عندما تخرج من الماء.\n\nالشفاء المتبقي: %d.

items.potions.elixirs.elixirofdragonsblood.name=إكسير دم التنين
items.potions.elixirs.elixirofdragonsblood.desc=عند تناوله, سيرسل هذا الإكسير قوة نارية تتدفق في عروق الشارب. سيجعل هذا التأثير الشارب محصنًا ضد النار, ويسمح له بإشعال النيران في الأعداء بالهجمات الجسدية.

items.potions.elixirs.elixiroffeatherfall.name=إكسير سقوط الريشة
items.potions.elixirs.elixiroffeatherfall.light=تشعر بأنك خفيف كالريشة!
items.potions.elixirs.elixiroffeatherfall.desc=يوفر هذا الإكسير تأثير طفو أضعف ولكن أكثر تحكمًا, مما يسمح للشارب بالسقوط لمسافات كبيرة دون أذى لفترة قصيرة.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=سقوط الريشة
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=أنت تحت تأثير إكسير سقوط الريشة, مما يسمح لك بالسقوط في الهاويات دون تلقي ضرر!\n\nالأدوار المتبقية: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=إكسير الشفاء بالعسل
items.potions.elixirs.elixirofhoneyedhealing.desc=يجمع هذا الإكسير بين الشفاء وحلاوة العسل. عند شربه, يُعطي نفس تأثير جرعة الشفاء ويُشبع جوعًا طفيفًا, كما يُمكن استخدامه لشفاء حليف.\n\nقد تهدأ المخلوقات التي لديها ميل للعسل إذا تم استخدام هذا العنصر عليها.

items.potions.elixirs.elixiroficytouch.name=إكسير اللمسة الجليدية
items.potions.elixirs.elixiroficytouch.desc=عند تناوله, سيسمح هذا الإكسير للشارب بامتصاص الحرارة من الأعداء الذين يهاجمهم. سيجعل هذا التأثير الشارب محصنًا ضد البرد, ويسمح له بتجميد الأعداء بالهجمات الجسدية.

items.potions.elixirs.elixirofmight.name=إكسير الجبروت
items.potions.elixirs.elixirofmight.msg=تتدفق قوة مكتشفة حديثًا عبر جسدك, لديك الآن %d قوة!
items.potions.elixirs.elixirofmight.desc=سيسري هذا السائل الفعال في عضلاتك, مما يزيد من قوتك بشكل دائم بمقدار نقطة واحدة, ويزيد من صحتك القصوى بشكل مؤقت بمقدار %d نقاط. تتناسب الزيادة في الصحة مع صحتك القصوى, ولكنها ستتلاشى تدريجياً مع اكتسابك للمستويات.
items.potions.elixirs.elixirofmight$htboost.name=تعزيز الصحة القصوى
items.potions.elixirs.elixirofmight$htboost.desc=يشعر جسدك بالقوة والصحة بشكل غير طبيعي.\n\nتم تعزيز صحتك القصوى لفترة طويلة من الزمن. كلما اكتسبت مستويات, سيتلاشى التعزيز بثبات.\n\nمقدار التعزيز الحالي: %d.\nالمستويات المتبقية: %d.

items.potions.elixirs.elixiroftoxicessence.name=إكسير الجوهر السام
items.potions.elixirs.elixiroftoxicessence.desc=عند تناول هذا الإكسير, فإنه يمنح شاربه طاقة سامة. وسينشر الشارب غازًا سامًا باستمرار أثناء تحركه, وسيكون محصنًا ضد الغازات السامة والسموم لفترة أطول بقليل من مدة تأثيره.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=جرعة فيروزية نادرة
items.potions.exotic.exoticpotion.crimson=جرعة قرمزية نادرة
items.potions.exotic.exoticpotion.azure=جرعة لازوردية نادرة
items.potions.exotic.exoticpotion.jade=جرعة يشمية نادرة
items.potions.exotic.exoticpotion.golden=جرعة ذهبية نادرة
items.potions.exotic.exoticpotion.magenta=جرعة أرجوانية نادرة
items.potions.exotic.exoticpotion.charcoal=جرعة فحمية نادرة
items.potions.exotic.exoticpotion.ivory=جرعة عاجية نادرة
items.potions.exotic.exoticpotion.amber=جرعة عنبرية نادرة
items.potions.exotic.exoticpotion.bistre=جرعة بنية داكنة نادرة
items.potions.exotic.exoticpotion.indigo=جرعة نيلية نادرة
items.potions.exotic.exoticpotion.silver=جرعة فضية نادرة
items.potions.exotic.exoticpotion.unknown_desc=تحتوي هذه القارورة المستديرة على سائل ملون محبب. يبدو أنها غريبة عن هذه الأرض, من يدري ماذا قد تفعل عند شربها أو رميها?
items.potions.exotic.exoticpotion.warning=هل تريد حقًا إلغاء استخدام هذه الجرعة? سيتم استهلاكها على أي حال.
items.potions.exotic.exoticpotion.yes=نعم, أنا متأكد
items.potions.exotic.exoticpotion.no=لا لقد غيرت راي
items.potions.exotic.exoticpotion.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.potions.exotic.potionofcleansing.name=جرعة التطهير
items.potions.exotic.potionofcleansing.desc=سيجعل هذا الكاشف القوي الشارب محصنًا ضد جميع تأثيرات الحالة الضارة لبضعة أدوار عند تجرعه. يمكن رميه على هدف لتطهيره أيضًا.
items.potions.exotic.potionofcleansing$cleanse.name=مُطهَّر
items.potions.exotic.potionofcleansing$cleanse.desc=هذه الشخصية محصنة مؤقتًا ضد جميع تأثيرات الحالة الضارة!\n\nالأدوار المتبقية: %s.

items.potions.exotic.potionofcorrosivegas.name=جرعة الغاز المآكل
items.potions.exotic.potionofcorrosivegas.desc=سيؤدي فتح أو تحطيم هذا الزجاج المضغوط إلى انفجار محتوياته وتحولها إلى سحابة قاتلة من غاز صدئ اللون. ينتشر هذا الغاز بسرعة أكبر من الغازات السامة وهو أكثر فتكًا, ولكنه لا يدوم طويلًا

items.potions.exotic.potionofdragonsbreath.name=جرعة أنفاس التنين
items.potions.exotic.potionofdragonsbreath.prompt=اختر موقعًا لحرقه
items.potions.exotic.potionofdragonsbreath.desc=تحتوي هذه القارورة على مركب غير عادي ينفجر في شكل لهب بعد وقت قصير من اختلاطه باللعاب. سيتيح بصق السائل بسرعة للمستخدم نفث اللهب من فمه!

items.potions.exotic.potionofearthenarmor.name=جرعة الدرع الترابي
items.potions.exotic.potionofearthenarmor.desc=بدلاً من الشلل, يمتلك هذا السائل تأثيرًا مصلدًا على الجلد سيحوله إلى درع طبيعي مؤقت.

items.potions.exotic.potionofdivineinspiration.name=جرعة الإلهام الخارق
items.potions.exotic.potionofdivineinspiration.no_more_points=لا يمكنك كسب أي نقاط موهبة إضافية بعد الآن.
items.potions.exotic.potionofdivineinspiration.select_tier=اختر مستوى موهبة لكسب نقطتين إضافيتين فيه. يجب أن تكون قد فتحت المستوى لتتمكن من إنفاق النقاط.
items.potions.exotic.potionofdivineinspiration.bonus=+2 نقاط موهبة!
items.potions.exotic.potionofdivineinspiration.desc=إن قوة الطاقة الخارقة التي تم تحويلها إلى شكل سائل, ستمنح هذه الجرعة الشارب قوة خارقة, مما يمنحه نقطتي موهبة إضافيتين في مستوى من اختياره.\n\nلا يمكن استخدام هذا المشروب إلا مرة واحدة لكل مستوى من مستويات الموهبة.

items.potions.exotic.potionofmagicalsight.name=جرعة البصر السحري
items.potions.exotic.potionofmagicalsight.desc=بعد شرب هذا, ستتعزز حواسك لفترة وجيزة إلى مستويات لا تصدق, مما يسمح لك بالرؤية عبر الجدران في دائرة نصف قطرها 12 مربعًا!

items.potions.exotic.potionofmastery.name=جرعة الإتقان
items.potions.exotic.potionofmastery.prompt=أتقن عنصرًا
items.potions.exotic.potionofmastery.weapon_easier=أصبح سلاحك أسهل في الاستخدام!
items.potions.exotic.potionofmastery.armor_easier=أصبح درعك أسهل في الارتداء!
items.potions.exotic.potionofmastery.desc=بدلاً من منح قوة بدنية هائلة, يعمل هذا المشروب على تهيئة عضلات المستخدم لاستخدام أداة معينة. وهذا بدوره يُسهّل استخدام تلك الأداة, كما لو أن شاربها قد تدرب عليها وبنى ذاكرة عضلية.\n\nسيتطلب استخدام السلاح أو الدرع المختار قوة أقل بمقدار 2. لا يمكن استخدام هذا المشروب إلا مرة واحدة على كل قطعة

items.potions.exotic.potionofshielding.name=جرعة التدريع
items.potions.exotic.potionofshielding.desc=بدلاً من الشفاء, ستقوم هذه الجرعة بدلاً من ذلك بإسقاط درع متين حول جسم المستخدم, مما يصد قدرًا كبيرًا من الضرر.

items.potions.exotic.potionofshroudingfog.name=جرعة الضباب الحاجب
items.potions.exotic.potionofshroudingfog.desc=عند تعرضه للهواء, سينتج السائل الموجود في هذه القارورة ضبابًا دخانيًا كثيفًا ينتشر بسرعة ويحجب رؤية أعدائك.

items.potions.exotic.potionofsnapfreeze.name=جرعة التجميد الفوري
items.potions.exotic.potionofsnapfreeze.desc=ستتفاعل المادة الكيميائية الموجودة في هذه الجرعة بسرعة مع الهواء, مما يؤدي إلى تجميد وتجذير كل ما يقع ضمن تأثيرها على الفور.

items.potions.exotic.potionofstamina.name=جرعة القدرة على التحمل
items.potions.exotic.potionofstamina.desc=شرب هذا السائل الحلو بشكل غريب سيمنحك دفعة طويلة الأمد من الطاقة, مما يسمح لك بالركض بوتيرة سريعة لفترة طويلة من الزمن.

items.potions.exotic.potionofstormclouds.name=جرعة السحب العاصفة
items.potions.exotic.potionofstormclouds.desc=سيؤدي إلقاء هذا المشروب إلى تكوين سحابة سريعة الانتشار من البخار المركز, والتي ستتكثف وتتساقط على البيئة المحيطة. سيتحول معظم التضاريس إلى ماء, وسيتعرض الأعداء الناريون للضرر, وستُخمد النيران, وستُكسر الفخاخ.



###quest items
items.quest.ceremonialcandle.name=شمعة طقوس
items.quest.ceremonialcandle.desc=مجموعة من الشموع, ذابت واندمجت معًا من خلال الاستخدام.\n\nبمفردها لا قيمة لها, ولكن عند استخدامها مع شموع أخرى في نمط معين, يمكنها تركيز الطاقة لطقوس استدعاء.
items.quest.ceremonialcandle.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

items.quest.corpsedust.name=غبار الجثث
items.quest.corpsedust.chill=تسري قشعريرة في عمودك الفقري.
items.quest.corpsedust.desc=لا تختلف كرة غبار الجثة ظاهرياً عن كرة الغبار العادية, لكن يمكنك أن تشعر بطاقة خبيثة كامنة بداخلها.\n\nسيكون التخلص منه في أسرع وقت ممكن فكرة جيدة
items.quest.corpsedust.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.
items.quest.corpsedust&dustwraith.rankings_desc=ملعون بغبار الجثث

items.quest.darkgold.name=خام الذهب الداكن
items.quest.darkgold.you_now_have=لديك الآن %d خام الذهب الداكن.
items.quest.darkgold.desc=يُطلق على هذا المعدن اسم الداكن ليس بسبب لونه (فهو لا يختلف عن الذهب العادي), ولكن لأنه يذوب تحت ضوء النهار, مما يجعله عديم الفائدة على السطح.
items.quest.darkgold.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

items.quest.dwarftoken.name=رمز القزم
items.quest.dwarftoken.discard=تتخلص من الرمز الزائد.
items.quest.dwarftoken.desc=قطعة معدنية غريبة الشكل كان يحملها أحد سكان قبو الأقزام. ربما تكون جزءًا من السحر الذي يربطها بالقبو? من الأفضل الاحتفاظ بها, فقد يكون لها فائدة.
items.quest.dwarftoken.desc_old=يحمل العديد من الأقزام وبعض مخلوقاتهم الأكبر حجمًا هذه القطع المعدنية الصغيرة ذات الغرض غير المعروف. ربما تكون مجوهرات أو ربما نوعًا من بطاقات الهوية. الأقزام شعب غريب.
items.quest.dwarftoken.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

items.quest.embers.name=جمر عنصري
items.quest.embers.desc=جمر خاص لا يمكن حصاده إلا من عنصريي النار الصغار. إنها تشع طاقة حرارية.
items.quest.embers.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

items.quest.escapecrystal.name=بلورة الهروب
items.quest.escapecrystal.ac_use=استخدام
items.quest.escapecrystal.prompt=اختر عنصر
items.quest.escapecrystal.desc=بلورة تعويذة سحرية رقيقة يبدو أنها تحتوي على سحر الانتقال الآني. يمكنك استخدام البلورة في أي وقت لمغادرة خزنة الأقزام, ولكن إذا غادرت مبكرًا فلن تحصل على المكافأة الكاملة!
items.quest.escapecrystal.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.
items.quest.escapecrystal.injure_warning_1=يبدو أن الوقت يتباطأ عندما تسمع صوت العفريت:\n\n"مهلاً, يبدو أنك مصاب بجروح بالغة, هل كل شيء على ما يرام هناك? أريد تمثالي, لكن ليس لدرجة أن تموت وأنت تحاول الحصول عليه!"
items.quest.escapecrystal.injure_warning_2="إذا علقت في موقف سيئ يمكنك استخدام أحد _عناصر الانتقال الآني من غرفة البداية_ للهروب إلى هناك والمحاولة مرة أخرى."
items.quest.escapecrystal.injure_warning_3="إذا بدت الأمور وخيمة حقًا, يمكنك _الهروب باستخدام تلك البلورة التي أعطيتك إياها._ لن أمنحك المكافأة الكاملة ولكنها بالتأكيد أفضل من الموت!"
items.quest.escapecrystal.injure_confirm=حسنًا (لن تظهر هذه الرسالة مرة أخرى في المحاولات المستقبلية)
items.quest.escapecrystal.leaving_start=يبدو أن الوقت يتباطأ عندما تسمع صوت العفريت:\n\nاسمع, أتفهم إن كنت متوتراً, لكن من فضلك على الأقل غادر الغرفة الأولى!\n\nلا داعي للقلق بشأن معداتك, فأنا أفي بوعدي, أعدك بأنها ستكون جميعها في انتظارك عند عودتك. كما أعدك بأنني سأسمح لك باستخدام البلورة للهروب إذا كنت في خطر حقيقي.
items.quest.escapecrystal.leaving_early=يبدو أن الوقت يتباطأ عندما تسمع صوت العفريت:\n\n"حقا, تهربون بالفعل?! ألا تعلمون أنه بإمكانكم الهرب من معظم الأعداء في ذلك المكان?"\n\nاسمع, إذا كانت حياتك في خطر, يمكنني إنقاذك, لكنني لن أسمح لك بأخذ أي شيء معك. كنت أتوقع منك أكثر من ذلك بكثير =("
items.quest.escapecrystal.leaving_minimal_explored=يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\n"أوه, هل ستغادر بالفعل? حسنًا, أعتقد أنك ساعدت في رسم خريطة للمكان قليلاً, وهذا أفضل من لا شيء."\n\n"مع ذلك, كنت أتوقع منك أكثر من ذلك =(. بالطبع سأساعدك إذا احتجت إليّ. سأسمح لك بأخذ شيء مثل جرعة أو لفافة معك على ما أعتقد."
items.quest.escapecrystal.leaving_partly_explored=يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\n"هل تحتاج للمغادرة? حسنًا, لقد استكشفت القبو بشكل لا بأس به على الأقل. كنت آمل أن يكون حظك أفضل في سرقته فعليًا."\n\n"سأسمح لك بإخراج شيء معك, لكن ليس شيئًا مطورًا بطريقة سحرية!"
items.quest.escapecrystal.leaving_mostly_explored=يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\n"هل تحتاج للمغادرة? حسنًا, لقد قمت بعمل جيد في استكشاف القبو على ما أعتقد. لدي الآن فكرة أفضل بكثير عن كيفية عمل المكان."\n\n"اسمع, سأسمح لك بالاحتفاظ بالقطعة طالما لم يتم تحسينها لأكثر من +1, وسأظل أقيم متجري في مكان أبعد داخل الزنزانة. على أي حال, سأحتاج إلى بعض الوقت للتخطيط لخطواتي التالية."
items.quest.escapecrystal.leaving_partial_victory=يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\n"كنت آمل أن تحصل على تمثالي, لكنك قمت بعمل رائع في استكشاف وتطهير معظم القبو!"\n\n"اسمع, سأسمح لك بالاحتفاظ بالقطعة طالما لم يتم تحسينها لأكثر من +2, وسأظل أقيم متجري في مكان أبعد في الزنزانة. على أي حال, سأحتاج إلى بعض الوقت للتخطيط لخطواتي التالية."
items.quest.escapecrystal.leaving_victory=يبدو أن الوقت يتباطأ وتسمع صوت العفريت:\n\n"عمل ممتاز!! هل أنت مستعد للمغادرة? سآخذ التمثال منك عندما تعود."\n\n"كما وعدتكم, سأقيم متجري في مكان أبعد, وسأسمح لكم بأخذ أي شيء ترغبون به معكم! خذوا وقتكم في الاختيار إن أردتم, أما الباقي فسيبقى داخل الخزنة."
items.quest.escapecrystal.leaving_item=هل أنت متأكد أن هذا هو العنصر الذي تريد أخذه معك?
items.quest.escapecrystal.leaving_seal=الختم المكسور المرفق بهذا الدرع مرتبط بالمرآة ولا يمكنك أخذه معك. سيُزال الختم تلقائيًا من الدرع, مما سيقلل مستوى الدرع بمقدار 1, لكنه لن يزيل أي نقش عليه.
items.quest.escapecrystal.leaving_staff=إن عصا الساحر هذه مرتبطة بالمرآة ولا يمكنك أخذها معك, ولكن يمكنك أخذ العصا السحرية المدمجة فيها. سيتم إزالة العصا السحرية تلقائيًا من العصا, وستُمنح لك بمستوى العصا -1
items.quest.escapecrystal.leaving_yes=مغادرة الخزنة
items.quest.escapecrystal.leaving_no=البقاء هنا
items.quest.escapecrystal.error_start=يبدو أنك لست في طابق الخزنة! ربما حدث هذا بسبب خطأ برمجي أو تعطل.
items.quest.escapecrystal.error_no_items=لا يتم تخزين أي من عناصرك, لذا تمت إزالة البلورة من مخزونك.
items.quest.escapecrystal.error_with_items=يتم تخزين عناصرك حاليًا, لذا يجب عليك محاولة النزول إلى الخزنة مرة أخرى لبدء المهمة. ستُعاد إليك عناصرك المخزنة عند انتهاء المهمة.

items.quest.gooblob.name=كتلة من المادة اللزجة
items.quest.gooblob.desc=كتلة لزجة متذبذبة, انفصلت عن المادة اللزجة عند موتها. إنها أشبه بكرة كبيرة من الجيلي, لكنك لن تجرؤ على أكلها.\n\nلا يُحدث أي تأثير بمفرده, لكنه قد يكون مفيدًا عند دمجه مع بعض الجرعات, أو مع قنبلة. على الأقل, من المفترض أن يتحول إلى كمية لا بأس بها من الطاقة
items.quest.gooblob.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من أعداء معينين.

items.quest.impstatue.name=تمثال أوبسيديان صغير
items.quest.impstatue.desc=تمثال صغير أسود قاتم منحوت من حجر الأوبسيديان. يشبه العفريت الذي أرسلك إلى هنا, حتى أنه يحمل عينيه الخضراوين المتوهجتين. يوجد نقش على قاعدة التمثال بلغة لم ترها من قبل.
items.quest.impstatue.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

items.quest.vaultbeacon.name=منارة الخزنة
items.quest.vaultbeacon.desc=يبدو أن تعويذة العودة هذه قد تم تحديد موقعها بالفعل, ربما في غرفة المدخل التي وجدتها فيها.\n\nيمكنك استخدامه لتوفير الوقت أثناء الاستكشاف, أو كوسيلة للهروب إذا كنت في خطر.
items.quest.vaultbeacon.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.

items.quest.metalshard.name=شظية معدنية ملعونة
items.quest.metalshard.desc=شظية من معدن ملعون صدئ, انفصلت عن DM-300 أثناء تدميره. يمكنك أن تشعر بسحر خبيث كامن بداخلها.\n\nلا يُفيد بمفرده, لكنه قد يكون مفيدًا عند دمجه مع بعض اللفائف, أو مع قنبلة. على الأقل, ينبغي أن يُحوّل إلى كمية لا بأس بها من الطاقة.
items.quest.metalshard.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من أعداء معينين.

items.quest.pickaxe.name=معول
items.quest.pickaxe.ability_name=اختراق
items.quest.pickaxe.ability_desc=تستطيع المبارزة _اختراق_ عدو بمعول. هذه الضربة مضمونة الإصابة, وتطبق تأثير الضعف لمدة 3 أدوار, وتلحق _%1$d-%2$d ضررًا_ بالأعداء ذوي الجلد الصلب.
items.quest.pickaxe.upgrade_ability_stat_name=ضرر القدرة
items.quest.pickaxe.desc=هذه أداة متينة وثقيلة لتكسير الصخور. لا تحتاج إلى تجهيز المعول للتعدين به, ولكن يمكن تجهيزه كسلاح في حالات الطوارئ.
items.quest.pickaxe.discover_hint=يمكنك العثور على هذا العنصر خلال مهمة محددة.



###remains
items.remains.remainsitem.ac_use=استخدام
items.remains.remainsitem.discover_hint=يمكنك العثور على هذا العنصر في بقايا بطل محدد من محاولة سابقة مفقودة.

items.remains.bowfragment.name=شظية قوس
items.remains.bowfragment.desc=كانت هذه القطعة الخشبية المكسورة جزءًا من قوس روحي مفقود لصيادة. لا يزال بإمكانك الشعور ببعض طاقة الطبيعة المتبقية فيها, ويمكنك استخدامها لإنماء عشب طويل حولك. لكن القيام بذلك سيؤدي إلى تدميرها.

items.remains.brokenhilt.name=مقبض مكسور
items.remains.brokenhilt.desc=يبدو هذا المقبض المكسور وكأنه سلاح مبارز مهزوم. لا يزال بإمكانك الشعور ببعض القوة القتالية المتبقية فيه, ويمكنك استخدامها للحصول على ضرر إضافي بسيط في المرتين التاليتين اللتين تضرب فيهما عدوًا بهجوم جسدي. لكن القيام بذلك سيؤدي إلى تدمير المقبض.

items.remains.brokenstaff.name=عصا مكسورة
items.remains.brokenstaff.desc=انكسرت عصا هذا الساحر إلى نصفين بعد وفاة صاحبها. لا يزال بإمكانك الشعور ببعض الطاقة السحرية المتبقية في العصا, ويمكنك استخدامها لشحن عصيك السحرية قليلاً. لكن القيام بذلك سيؤدي إلى تدمير العصا.

items.remains.cloakscrap.name=قصاصة قماش
items.remains.cloakscrap.desc=تبدو هذه القطعة من القماش الشفاف وكأنها جزء من عباءة الظلال الخاصة بشخصية روغ متأخرة. لا يزال بإمكانك الشعور ببعض الطاقة السحرية المتبقية فيها, ويمكنك استخدامها لمنح قطعك الأثرية دفعة بسيطة. لكن القيام بذلك سيؤدي إلى تلف القماش.

items.remains.sealshard.name=شظايا ختم
items.remains.sealshard.desc=تبدو هذه الشظايا الصغيرة من الشمع الأحمر وكأنها من ختم محارب سقط في المعركة. لا يزال بإمكانك الشعور ببعض قوة الإرادة عالقة بالختم, ويمكنك استخدامها لتوفير بعض الحماية لنفسك. لكن القيام بذلك سيؤدي إلى تدمير شظايا الختم.

items.remains.tornpage.name=صفحة ممزقة
items.remains.tornpage.desc=تبدو هذه الصفحة وكأنها انتُزعت من كتاب القوه لكاهن منتهي الصلاحية. لا تزال بعض الطاقة الخارقه عالقة بها, يمكنك استخدامها لاستعادة القليل من صحتك. لكن القيام بذلك سيؤدي إلى تدمير الصفحة الممزقة.



