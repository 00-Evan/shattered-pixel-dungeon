items.artifacts.lloydsbeacon.preventing=الهالة السحرية القوية لهذا المكان تمنعك من استخدام منارة لويد!
items.artifacts.lloydsbeacon.creatures=الهالة النفسية للمخلوقات المجاورة لا تسمح لك باستخدام منارة لويد في هذه اللحظة.
items.artifacts.lloydsbeacon.return=تم ضبط منارة لويد بنجاح في موقعك الحالي, يمكنك الآن العودة إلى هنا في أي وقت.
items.artifacts.lloydsbeacon.desc=منارة لويد هي جهاز سحري معقد يمنح مستخدمه القدرة على التحكم في سحر الانتقال الآني. يمكن استخدام المنارة للعودة إلى موقع محدد, كما يمكنها إطلاق دفعات عشوائية من سحر الانتقال الآني بمجرد شحنها بعد تجهيزها. يمكن توجيه هذا السحر نحو هدف أو نحو المستخدم نفسه.
items.artifacts.lloydsbeacon.desc_set=تم ضبط هذه المنارة في مكان ما في المستوى %d من زنزانة البكسل.

