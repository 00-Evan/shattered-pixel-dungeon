items.rings.ringofelements.upgrade_stat_name_1=المقاومة
items.rings.ringofelements.desc=يوفر هذا الخاتم مقاومة لمعظم التأثيرات العنصرية والسحرية, مما يقلل الضرر ومدة التأثيرات السلبية. بطبيعة الحال, سيزيد الخاتم الملعون من سوء هذه التأثيرات.

