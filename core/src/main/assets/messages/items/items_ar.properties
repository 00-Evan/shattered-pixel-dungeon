items.weapon.melee.wornshortsword.typical_ability_desc=يستطيع المبارز أن يشطر عدوه بسيف قصير مهترئ. وهذا عادةً ما يُلحق به ضرراً بالغاً. %1$d - %2$d يُلحق ضررًا مضمونًا ويصيب الهدف حتمًا. إذا قتلت ضربة الشق عدوًا، يكون ذلك فوريًا، ويمكن للمبارز استخدام ضربة الشق مرة أخرى مجانًا خلال 5 أدوار.
