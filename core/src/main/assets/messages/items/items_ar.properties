items.artifacts.etherealchains.desc=تتوهج هذه السلاسل الكبيرة والخفيفة في الوقت نفسه بطاقة روحية. يمكن استخدامها لجذبك نحو التضاريس، أو لجذب الأعداء نحوك. بل إن طبيعتها الأثيرية تسمح لها بالمرور عبر الجدران!
