items.artifacts.driedrose$ghosthero.dialogue_sewers_3=كانت لدي عائلة على السطح, آمل أن يكونوا بخير.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=لم يستطع الحراس هزيمة هذه الوحوش, ولكن ربما نستطيع نحن.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=إذا كانت المجاري خطيرة إلى هذا الحد, أتساءل ما الذي يوجد في الأسفل...
