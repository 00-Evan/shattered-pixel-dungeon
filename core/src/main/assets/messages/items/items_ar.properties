items.wands.wandofblastwave.name=عصا موجة الانفجار
items.wands.wandofblastwave.staff_name=صولجان موجة الانفجار
items.wands.wandofblastwave.ondeath=لقد قتلت نفسك بعصا موجة الانفجار الخاصة بك...
items.wands.wandofblastwave.knockback_ondeath=قتلك الاصطدام...
items.wands.wandofblastwave.desc=هذه العصا مصنوعة من نوع من الحجر الرخامي, مع حواف ذهبية وجوهرة سوداء مستديرة عند الطرف. تبدو ثقيلة جدًا في يدك.
items.wands.wandofblastwave.typical_stats_desc=تطلق هذه العصا صاعقة تنفجر بعنف في موقع مستهدف. عادةً ما تلحق قوة هذا الانفجار _%1$d-%2$d ضررًا_ وتكون قوية بما يكفي لإرسال معظم الأعداء طائرين.
items.wands.wandofblastwave.stats_desc=تطلق هذه العصا صاعقة تنفجر بعنف في موقع مستهدف. تلحق قوة هذا الانفجار _%1$d-%2$d ضررًا_ وتكون قوية بما يكفي لإرسال معظم الأعداء طائرين.
items.wands.wandofblastwave.upgrade_stat_name_2=الدفع للخلف
items.wands.wandofblastwave.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا مشلولاً بصولجان موجة الانفجار, فإنه سيستهلك الشلل لإلحاق دفعة من الضرر السحري الإضافي. هذا له فترة تهدئة قصيرة لكل عدو.
items.wands.wandofblastwave.eleblast_desc=يلحق الانفجار العنصري بصولجان موجة الانفجار 67% ضررًا ويدفع جميع الأعداء خارج منطقة الانفجار.

items.wands.wandofcorrosion.name=عصا التآكل
items.wands.wandofcorrosion.staff_name=صولجان التآكل
items.wands.wandofcorrosion.desc=تمتلك هذه العصا جسمًا رماديًا ينفتح على جوهرة برتقالية رائعة.
items.wands.wandofcorrosion.stats_desc=تطلق هذه العصا صاعقة تنفجر إلى سحابة من الغاز شديد التآكل في موقع مستهدف. أي شيء يعلق داخل هذه السحابة سيتلقى ضررًا متزايدًا بمرور الوقت, بدءًا من _%d ضرر._
items.wands.wandofcorrosion.upgrade_stat_name_1=ضرر التآكل
items.wands.wandofcorrosion.upgrade_stat_name_2=حجم الغاز
items.wands.wandofcorrosion.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان التآكل, يكون لدى العدو فرصة ليُغطى بالمادة اللزجة.
items.wands.wandofcorrosion.eleblast_desc=يصيب الانفجار العنصري بصولجان التآكل الأعداء بـ 4 أدوار من التآكل, بدءًا من 6 ضرر.

items.wands.wandofcorruption.name=عصا الفساد
items.wands.wandofcorruption.staff_name=صولجان الفساد
items.wands.wandofcorruption.already_corrupted=لا يمكن التأثير على تلك الشخصية أكثر من ذلك.
items.wands.wandofcorruption.desc=تشع هذه العصا بطاقة مظلمة فوضوية, إن لم يكن ذلك واضحًا بالفعل من الجمجمة الزخرفية الصغيرة المشكلة على طرفها.
items.wands.wandofcorruption.stats_desc=ستطلق هذه العصا موجة من الطاقة المُفسدة التي ستُضعف الأعداء وتُخضعهم في النهاية لإرادتك. صحيح أن الأعداء قادرون على مقاومة هذا الفساد, إلا أن الأعداء الضعفاء أسهل إفسادًا من الأعداء الأصحاء
items.wands.wandofcorruption.upgrade_stat_name_1=قوة الإفساد
items.wands.wandofcorruption.upgrade_stat_name_2=مدة التأثير السلبي
items.wands.wandofcorruption.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان الفساد, يكون لدى العدو فرصة ليصبح هائجًا.
items.wands.wandofcorruption.eleblast_desc=يصيب الانفجار العنصري بصولجان الفساد الأعداء بـ 5 أدوار من الهياج.

items.wands.wandofdisintegration.name=عصا التفتيت
items.wands.wandofdisintegration.staff_name=صولجان التفتيت
items.wands.wandofdisintegration.desc=هذه العصا مصنوعة من قطعة صلبة ناعمة من حجر الأوبسيديان, مع ضوء أرجواني عميق يمتد على جانبها, وينتهي عند الطرف. تتوهج بطاقة تدميرية, في انتظار الانطلاق للأمام.
items.wands.wandofdisintegration.stats_desc=تُطلق هذه العصا شعاعًا يخترق أي عائق, ويزداد مداه كلما تم تطويره. يُلحق الشعاع ضررًا بـ %1$d - %2$d سيلحق الضرر أيضًا, وسيلحق ضررًا إضافيًا لكل عدو وجدار يخترقه
items.wands.wandofdisintegration.upgrade_stat_name_2=أقصى مدى
items.wands.wandofdisintegration.bmage_desc=عندما يستخدمها _الساحر المحارب_, يمتلك صولجان التفتيت مدى هجوم متزايدًا, كما لو كان يمتلك تعويذة الاختراق.
items.wands.wandofdisintegration.eleblast_desc=يلحق الانفجار العنصري بصولجان التفتيت 100% ضررًا ويخترق الجدران.

items.wands.wandoffireblast.name=عصا انفجار اللهب
items.wands.wandoffireblast.staff_name=صولجان انفجار اللهب
items.wands.wandoffireblast.desc=هذه العصا مصنوعة من خشب مطلي باللون الأحمر مع استخدام أوراق الذهب بسخاء لجعلها تبدو ملكية تمامًا. تطقطق وتفح عند الطرف, متلهفة لإطلاق سحرها القوي.
items.wands.wandoffireblast.stats_desc=تطلق هذه العصا مخروطًا من النار عند استخدامها. سيستهلك هجومها التالي _%1$d شحنات_ ويلحق _%2$d-%3$d ضررًا._ كلما زادت الشحنات التي تستخدمها العصا, زاد حجم التأثير وقوته.
items.wands.wandoffireblast.upgrade_stat_name_1=ضرر شحنة واحدة
items.wands.wandoffireblast.upgrade_stat_name_2=ضرر شحنتين
items.wands.wandoffireblast.upgrade_stat_name_3=ضرر 3 شحنات
items.wands.wandoffireblast.bmage_desc=عندما يضرب الساحر المحارب عدوًا بعصا اللهب, هناك احتمال أن يتسبب ذلك في انفجار يُلحق الضرر بالأعداء ويحرق كل النيران القريبة! ويزداد هذا الاحتمال كلما زادت كمية النيران المحيطة بالعدو.
items.wands.wandoffireblast.eleblast_desc=يلحق الانفجار العنصري بصولجان انفجار اللهب 100% ضررًا, ويفجر الأبواب مفتوحة, ويشعل النار في الأعداء والتضاريس.

items.wands.wandoffrost.name=عصا الصقيع
items.wands.wandoffrost.staff_name=صولجان الصقيع
items.wands.wandoffrost.desc=يبدو أن هذه العصا مصنوعة من نوع من الجليد السحري. تزداد سطوعًا نحو طرفها المستدير. ملمسها بارد جدًا عند الإمساك بها, ولكن بطريقة ما تبقى يدك دافئة.
items.wands.wandoffrost.stats_desc=تطلق هذه العصا دفعات من الطاقة الجليدية نحو خصومك, وتلحق _%1$d-%2$d ضررًا_ وتسبب البرودة. يبدو التأثير أقوى في الماء. الأعداء المصابون بالبرودة أو المتجمدون بالفعل يتلقون ضررًا أقل من هذه العصا.
items.wands.wandoffrost.upgrade_stat_name_2=مدة البرودة
items.wands.wandoffrost.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا مصابًا بالبرودة بصولجان الصقيع, يكون لديهم فرصة للتجمد على الفور. تزداد هذه الفرصة كلما زادت برودتهم.
items.wands.wandoffrost.eleblast_desc=يلحق الانفجار العنصري بصولجان الصقيع 100% ضررًا, ويجمد الأعداء, ويطفئ الحرائق.

items.wands.wandoflightning.name=عصا البرق
items.wands.wandoflightning.staff_name=صولجان البرق
items.wands.wandoflightning.ondeath=لقد قتلت نفسك بعصا البرق الخاصة بك...
items.wands.wandoflightning.desc=هذه العصا مصنوعة من المعدن الصلب, مما يجعلها ثقيلة بشكل مدهش. ينحني شقان معًا عند الطرف, وتتقوس الكهرباء بينهما.
items.wands.wandoflightning.stats_desc=تُطلق هذه العصا برقًا قويًا يخترق أي شيء يُطلق عليه, مُلحقًا به ضررًا بالغًا. %1$d - %2$d ضرر. ستنتقل هذه الكهرباء عبر قوس كهربائي إلى الشخصيات القريبة, وتنتشر بسهولة أكبر في الماء. يمكن أن تُلحق الأقواس الكهربائية الصادرة من هذه العصا الضرر بك, لكنها لن تؤذي حلفاءك.
items.wands.wandoflightning.bmage_desc=عندما يضرب المحارب الساحر عدوًا بعصا البرق, تتاح له فرصة شحن نفسه كهربائيًا لمدة عشر جولات. وخلال فترة الشحن, يكون المحارب الساحر محصنًا ضد أضرار البرق, وسيستمر في إطلاق البرق لمسافات أبعد
items.wands.wandoflightning.eleblast_desc=يلحق الانفجار العنصري بصولجان البرق 100% ضررًا, ويصعق الأعداء لمدة 5 أدوار, ويكهرب الماء.
items.wands.wandoflightning$lightningcharge.name=مشحون كهربائيًا
items.wands.wandoflightning$lightningcharge.desc=الساحر المحارب مشحون حاليًا بالطاقة, مما يمنحه مناعة ضد صولجان البرق الخاص به ويزيد من المدى الذي يمكن أن يتقوس إليه البرق منه.\n\nالأدوار المتبقية: %s.

items.wands.wandoflivingearth.name=عصا الأرض الحية
items.wands.wandoflivingearth.staff_name=صولجان الأرض الحية
items.wands.wandoflivingearth.desc=هذه العصا مصنوعة من صخرة غريبة, مع أشرطة من الطاقة الصفراء المتوهجة. يبدو أن الصخور تتحرك قليلاً وأنت تمسك بالعصا, كما لو كانت تشعر بيدك.
items.wands.wandoflivingearth.stats_desc=تُطلق هذه العصا سهامًا من الصخور السحرية على الأعداء, مُلحقةً بهم ضررًا _ %1$d - %2$d ستتشكل الصخور من جديد حول المستخدم, مانحةً إياه درعًا يتناسب مع الضرر الذي لحق به. إذا تراكم درع كافٍ, فسيتحول إلى حارس صخري عند استخدام العصا مرة أخرى.
items.wands.wandoflivingearth.upgrade_stat_name_2=أقصى صحة للحارس
items.wands.wandoflivingearth.upgrade_stat_name_3=صد الحارس
items.wands.wandoflivingearth.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان الأرض الحية, يُعاد جزء من الضرر الملحق كدرع صخري.
items.wands.wandoflivingearth.eleblast_desc=يلحق الانفجار العنصري بصولجان الأرض الحية 50% ضررًا, ويشفي حارسًا ترابيًا نشطًا لكل عدو يتم إصابته.
items.wands.wandoflivingearth$rockarmor.name=درع صخري
items.wands.wandoflivingearth$rockarmor.desc=تحيط بك صخور سحرية, وعندما تتعرض للهجوم ستحاول صدها لك, ويستهلك الضرر الذي تتلقاه بنسبة 50%%. لكن كل ضرر يتم صده يحتك من الصخر جزءًا.\n\nالدروع المتبقية: %1$d.\n\nإذا تراكم حولك ما يكفي من الصخر, فالصعق التالي من عصاك الحية الأرضية سيجعل الصخور تتشكل في حارسٍ سيقاتل إلى جانبك.\n\nالدروع المطلوبة للحارس: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=يستفيد هذا الحارس الترابي أيضًا من قوة الكثرة. الأدوار المتبقية: %d.
items.wands.wandoflivingearth$earthguardian.name=حارس ترابي
items.wands.wandoflivingearth$earthguardian.desc=لقد تشكّلت الصخور من عصاك المصنوعة من الأرض الحية لتُشكّل حارسًا أرضيًا واقيًا! سيهاجم هذا الحارس الصخري الأعداء القريبين, مما سيجبرهم على مهاجمته بدلًا منك. عندما يزول كل التهديد القريب, سيعود الحارس ليُحيط بك, وسيعود عند استخدامك عصاك مرة أخرى.
items.wands.wandoflivingearth$earthguardian.wand_info=ترتبط القوة الدفاعية للحارس بمستوى عصاك السحرية. إنه يصد حاليًا _%1$d-%2$d ضرر._
items.wands.wandoflivingearth$earthguardian.discover_hint=يمكنك العثور على هذه الشخصية باستخدام عصا سحرية محددة.

items.wands.wandofmagicmissile.name=عصا القذيفة السحرية
items.wands.wandofmagicmissile.staff_name=صولجان القذيفة السحرية
items.wands.wandofmagicmissile.desc=تطلق هذه العصا البسيطة إلى حد ما قذائف من الطاقة السحرية النقية. بينما تفتقر العصا نفسها إلى أي تأثيرات خاصة, إلا أنها تمتلك شحنات متاحة أكثر ويمكنها تعزيز العصي الأخرى لفترة وجيزة عند ترقيتها.
items.wands.wandofmagicmissile.stats_desc=تلحق كل صاعقة من هذه العصا _%1$d-%2$d ضررًا_, وستعزز العصي الأخرى لفترة وجيزة إذا تمت ترقيتها.
items.wands.wandofmagicmissile.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان القذيفة السحرية, ستكتسب جميع عصيه السحرية شحنة بالإضافة إلى صولجانه.
items.wands.wandofmagicmissile.eleblast_desc=يلحق الانفجار العنصري بصولجان القذيفة السحرية 50% ضررًا, ويمنح الساحر 15 دورًا من إعادة الشحن.
items.wands.wandofmagicmissile.discover_hint=يبدأ أحد الأبطال بهذا العنصر.
items.wands.wandofmagicmissile$magiccharge.name=شحنة سحرية
items.wands.wandofmagicmissile$magiccharge.desc=أعادت عصا القذيفة السحرية الخاصة بك تغذية عصيك السحرية بالطاقة, مما يعزز المستوى الفعال للصعقة التالية التي تقوم بها.\n\nتم تعزيز عصيك السحرية إلى: +%d.\n\nأدوار الشحنة السحرية المتبقية: %s.

items.wands.wandofprismaticlight.name=عصا الضوء المنشوري
items.wands.wandofprismaticlight.staff_name=صولجان الضوء المنشوري
items.wands.wandofprismaticlight.desc=هذه العصا مصنوعة من قطعة صلبة من البلور الشفاف, مثل قطعة طويلة من الزجاج الأملس. تتراقص قطع صغيرة من الضوء الملون حول طرف العصا, متلهفة للانفجار.
items.wands.wandofprismaticlight.stats_desc=تُطلق هذه العصا أشعة ضوئية تخترق ظلام الزنزانة, كاشفةً عن المناطق المخفية والفخاخ. يمكن للشعاع أن يُعمي الأعداء, ويُلحق بهم ضررًا _ %1$d - %2$d الضرر._ سيحترق الأعداء الشيطانيون والأحياء الأموات في الضوء الساطع للعصا, مما يؤدي إلى تلقيهم ضررًا إضافيًا.
items.wands.wandofprismaticlight.upgrade_stat_name_2=فرصة الإعماء
items.wands.wandofprismaticlight.upgrade_stat_name_3=مدة الضوء
items.wands.wandofprismaticlight.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان الضوء المنشوري, فسيُصاب بالشلل الجزئي لمدة تتناسب مع مستوى الصولجان.
items.wands.wandofprismaticlight.eleblast_desc=يلحق الانفجار العنصري بصولجان الضوء المنشوري 67% ضررًا, ويكشف عن جميع التضاريس في الانفجار, ويعمي الأعداء لمدة 5 أدوار.

items.wands.wandofregrowth.name=عصا إعادة النمو
items.wands.wandofregrowth.staff_name=صولجان إعادة النمو
items.wands.wandofregrowth.desc=هذه العصا مصنوعة من ساق رفيعة من خشب منحوت ببراعة. بطريقة ما, لا تزال نابضة بالحياة, خضراء زاهية كقلب شجرة صغيرة. "عندما تتوقف الحياة, تبدأ حياة جديدة بالنمو... الدورة الأبدية باقية!"
items.wands.wandofregrowth.stats_desc=عند استخدام هذه العصا, ستطلق طاقة سحرية لإعادة النمو على شكل مخروط, مما يؤدي إلى إنبات العشب والجذور والنباتات النادرة. وستستهلك ضربتها التالية _ %1$d الشحنات. كلما زاد عدد الشحنات التي يستخدمها العصا, زاد حجم وقوة التأثير.
items.wands.wandofregrowth.degradation=بعد _%d شحنات_ أخرى, ستبدأ هذه العصا في الفشل في إنتاج النباتات والعشب الطازج. يزداد هذا الحد عن طريق رفع المستوى أو ترقية العصا.
items.wands.wandofregrowth.upgrade_stat_name_1=عشب لكل شحنة
items.wands.wandofregrowth.upgrade_stat_name_2=الحد الإجمالي للعشب
items.wands.wandofregrowth.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان إعادة النمو, ويكون أي منهما واقفًا على العشب, فسيحصل على شفاء عشبي يتناسب مع الضرر الملحق.
items.wands.wandofregrowth.eleblast_desc=يجذر الانفجار العنصري بصولجان إعادة النمو الأعداء وينمي العشب عشوائيًا فوق منطقة الانفجارات.
items.wands.wandofregrowth$dewcatcher.name=جامع الندي
items.wands.wandofregrowth$dewcatcher.desc=جامعات الندى هي نباتات عجيبة تملأ نفسها بالندى السحري. تحاول التمويه كعشب لتجنب الانتباه, لكن انتفاخات الندى المتجمع تفضحها.
items.wands.wandofregrowth$dewcatcher.discover_hint=يمكنك العثور على هذه النبتة باستخدام عصا سحرية محددة.
items.wands.wandofregrowth$seedpod.name=قرن البذور
items.wands.wandofregrowth$seedpod.desc=قرون البذور هي نباتات سحرية تنتج بذورًا من أنواع نباتات أخرى, بدلاً من أي بذور خاصة بها. إنها تتمكن بطريقة ما من الانتشار على الرغم من عدم امتلاكها بذورًا خاصة بها.
items.wands.wandofregrowth$seedpod.discover_hint=يمكنك العثور على هذه النبتة باستخدام عصا سحرية محددة.
items.wands.wandofregrowth$lotus.name=اللوتس الذهبي
items.wands.wandofregrowth$lotus.desc=اللوتس الذهبي نبتةٌ غامضة لا يمكن استحضارها إلا بعصا قوية لإعادة النمو. هالتها تُعزز جميع النباتات وتأثيراتها, لكنها تستنفد طاقتها وتموت بعد فترة وجيزة
items.wands.wandofregrowth$lotus.wand_info=تم إنتاج هذه الزهرة بواسطة _+ %1$d عصا إعادة النمو. ستنشط جميع النباتات المتأثرة بها فورًا إذا زُرعت على شخصية. كما ستتمتع النباتات بـ %2$d %% فرصة لإسقاط بذورهم, وستستخدم السهام ذات الرؤوس المدببة %3$d %% متانة أقل.
items.wands.wandofregrowth$lotus.discover_hint=يمكنك العثور على هذه النبتة باستخدام عصا سحرية محددة, بعد ترقيتها عدة مرات.

items.wands.wandoftransfusion.name=عصا نقل الدم
items.wands.wandoftransfusion.staff_name=صولجان نقل الدم
items.wands.wandoftransfusion.ondeath=لقد قتلت نفسك بعصا نقل الدم الخاصة بك...
items.wands.wandoftransfusion.charged=صولجانك مشحون بطاقة حياة عدوك!
items.wands.wandoftransfusion.desc=عصا ذات شكل بسيط إلى حد ما, تبرز بسبب لونها الأرجواني وجوهرتها السوداء القاتمة عند الطرف.
items.wands.wandoftransfusion.stats_desc=عند استخدام هذه العصا على الحلفاء أو الأعداء المسحورين, فإنها ستستنزف _ %1$d من صحة المستخدم_ لعلاج أو حماية الحليف من أجل _ %2$d الصحة._ عند استخدامها على الأعداء, تقوم العصا بسحرهم لفترة وجيزة مع تطبيق _ %3$d حماية المستخدم. ستأخذ الموتى الأحياء المعادون _ %4$d - %5$d الضرر_ بدلاً من أن يكون مسحورًا.
items.wands.wandoftransfusion.upgrade_stat_name_1=شفاء الحليف
items.wands.wandoftransfusion.upgrade_stat_name_2=التدريع الذاتي
items.wands.wandoftransfusion.upgrade_stat_name_3=ضرر الموتى الأحياء
items.wands.wandoftransfusion.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا مسحورًا بصولجان نقل الدم, سيكتسب درعًا واقيًا ولن تكلف صعقته التالية بالصولجان أي صحة.
items.wands.wandoftransfusion.eleblast_desc=يسحر الانفجار العنصري بصولجان نقل الدم الأعداء, ويشفي الحلفاء, ويلحق 100% ضررًا بالأعداء الموتى الأحياء.

items.wands.wandofwarding.name=عصا الحماية
items.wands.wandofwarding.staff_name=صولجان الحماية
items.wands.wandofwarding.no_more_wards=لا تستطيع عصاك السحرية الحفاظ على أي حراس إضافيين.
items.wands.wandofwarding.bad_location=لا يمكنك وضع حارس هناك.
items.wands.wandofwarding.desc=تحتوي هذه العصا المعدنية القصيرة على جوهرة أرجوانية ساطعة تطفو فوق طرفها.
items.wands.wandofwarding.stats_desc=بدلاً من إلحاق الضرر المباشر بالعدو, تستدعي هذه العصا أبراجًا وحراسًا ثابتة. يمكن استدعاء الأبراج في أي مكان, حتى من خلال الجدران إذا كان لديك رؤية. يمكن لهذه العصا أن تدعم _ %d طاقة تساوي عدد الحراس في المرة الواحدة
items.wands.wandofwarding.upgrade_stat_name_1=ضرر الحارس
items.wands.wandofwarding.upgrade_stat_name_2=طاقة الحارس
items.wands.wandofwarding.bmage_desc=عندما يضرب _الساحر المحارب_ عدوًا بصولجان الحماية, يكون لدى جميع الحراس والحرس النشطين فرصة للشفاء.
items.wands.wandofwarding.eleblast_desc=يشفي الانفجار العنصري بصولجان الحماية جميع الحراس والحرس في منطقة الانفجار.
items.wands.wandofwarding$ward.desc_generic_ward=سيقوم هذا الحارس تلقائيًا بصعق أي عدو يدخل في نطاق رؤيته.\n\nصعق هذا الحارس بعصا الحماية الخاصة بك سيقوم بترقيته.\n\nيمتلك الحراس عددًا محدودًا من الصعقات قبل أن يتلاشوا.
items.wands.wandofwarding$ward.desc_generic_sentry=يتمتع هذا الحارس بنفس قوة نيران التعويذة, لكنه يمتلك نقاط صحة بدلاً من عدد محدد من الشحنات. وهو يشبه الجوهرة الموجودة في طرف عصا التعويذة.\n\nسيؤدي استخدام عصا الحماية الخاصة بك على هذا الحارس إلى ترقيته وشفائه.\n\nسيستهلك هذا الحارس بعض الصحة في كل مرة يصعق فيها عدوًا, ولكن يمكن علاجه باستخدام عصا الحماية الخاصة بك عليه.
items.wands.wandofwarding$ward.name_1=حارس أصغر
items.wands.wandofwarding$ward.desc_1=سيصعق هذا الحاجز الأساسي تلقائيًا أي عدو يدخل في نطاق رؤيته, ملحقًا _%1$d-%2$d ضررًا._\n\nاستخدام عصا الحماية الخاصة بك على هذا الحاجز سيُرقّيه.\n\nلن يصعق هذا الحاجز إلا مرة واحدة قبل أن يتلاشى.\n\nعصا الحماية الخاصة بك تستخدم _%3$d طاقة_ لدعم هذا الحاجز.
items.wands.wandofwarding$ward.name_2=حارس
items.wands.wandofwarding$ward.desc_2=يتمتع هذا الحاجز المُرقّي بنمط أكثر تعقيدًا, ويمكنه الهجوم عدة مرات. كل صعقة من هذا الحاجز ستلحق _%1$d-%2$d ضررًا._\n\nاستخدام عصا الحماية الخاصة بك على هذا الحاجز سيُرقّيه.\n\nسيصعق هذا الحاجز ثلاث مرات قبل أن يتلاشى.\n\nعصا الحماية الخاصة بك تستخدم _%3$d طاقة_ لدعم هذا الحاجز.
items.wands.wandofwarding$ward.name_3=حارس أكبر
items.wands.wandofwarding$ward.desc_3=هذا الحاجز المُرقّي بالكامل قادر على الهجوم مرات أكثر من سابقيه. كل صعقة من هذا الحاجز ستلحق _%1$d-%2$d ضررًا._\n\nاستخدام عصا الحماية الخاصة بك على هذا الحاجز سيُرقّيه.\n\nسيصعق هذا الحاجز خمس مرات قبل أن يتلاشى.\n\nعصا الحماية الخاصة بك تستخدم _%3$d طاقة_ لدعم هذا الحاجز.
items.wands.wandofwarding$ward.name_4=خفير أصغر
items.wands.wandofwarding$ward.desc_4=يمتلك هذا الحارس الصغير نفس قوة النيران التي يمتلكها الحاجز الأكبر, لكنه يتمتع بصحة بدلاً من عدد محدد من الشحنات. وهو يشبه الجوهرة الموجودة في طرف عصا الحماية الخاصة بك. كل صعقة من هذا الحارس ستلحق _%1$d-%2$d ضررًا._\n\nاستخدام عصا الحماية الخاصة بك على هذا الحارس سيُرقّيه ويشفيه.\n\nسينفق هذا الحارس بعض الصحة في كل مرة يصعق فيها عدوًا, لكن يمكن علاجه باستخدام عصا الحماية الخاصة بك عليه.\n\nعصا الحماية الخاصة بك تستخدم _%3$d طاقة_ لدعم هذا الحارس.
items.wands.wandofwarding$ward.name_5=خفير
items.wands.wandofwarding$ward.desc_5=هذا الحارس المُرقّي أكبر حجمًا وأكثر متانة من الحارس الأدنى. كل صعقة من هذا الحارس ستلحق _%1$d-%2$d ضررًا._\n\nاستخدام عصا الحماية الخاصة بك على هذا الحارس سيُرقّيه ويشفيه.\n\nسينفق هذا الحارس بعض الصحة في كل مرة يصعق فيها عدوًا, لكن يمكن علاجه باستخدام عصا الحماية الخاصة بك عليه.\n\nعصا الحماية الخاصة بك تستخدم _%3$d طاقة_ لدعم هذا الحارس.
items.wands.wandofwarding$ward.name_6=خفير أكبر
items.wands.wandofwarding$ward.desc_6=هذا الحارس المُرقّي بالكامل أكثر متانة بشكل ملحوظ من سابقيه. كل صعقة من هذا الحارس ستلحق _%1$d-%2$d ضررًا._\n\nاستخدام عصا الحماية الخاصة بك على هذا الحارس سيشفيه.\n\nسينفق هذا الحارس بعض الصحة في كل مرة يصعق فيها عدوًا, لكن يمكن علاجه باستخدام عصا الحماية الخاصة بك عليه.\n\nعصا الحماية الخاصة بك تستخدم _%3$d طاقة_ لدعم هذا الحارس.
items.wands.wandofwarding$ward.discover_hint=يمكنك العثور على هذه الشخصية باستخدام عصا سحرية محددة.
items.wands.wandofwarding$ward.dismiss_title=صرف هذا الحارس?
items.wands.wandofwarding$ward.dismiss_body=يمكنك تبديد هذا الحارس إذا لم تعد ترغب في أن تحافظ عصاك السحرية عليه. القيام بذلك يدمر الحارس على الفور.\n\nصرف هذا الحارس?
items.wands.wandofwarding$ward.dismiss_confirm=اجل
items.wands.wandofwarding$ward.dismiss_cancel=لا

###weapon curses
items.weapon.curses.annoying.name=%s مزعج
items.weapon.curses.annoying.msg_1=أوه, هل نقاتل شيئًا ما?!
items.weapon.curses.annoying.msg_2=نعم, انل منهم!
items.weapon.curses.annoying.msg_3=حسنا اسمع
items.weapon.curses.annoying.msg_4=هل وصلنا إلى الزعيم بعد?!
items.weapon.curses.annoying.msg_5=آه, لا تلوّح بي بقوة هكذا!
items.weapon.curses.annoying.msg_6=مُت أيتها الحشرة!
items.weapon.curses.annoying.msg_7=ويييييييييييييي!
items.weapon.curses.annoying.msg_8=هل يمكننا أخذ استراحة?!
items.weapon.curses.annoying.msg_9=باو, هاها!
items.weapon.curses.annoying.msg_10=ضربة موفقة!
items.weapon.curses.annoying.msg_11=لم أرد أن أكون سلاحًا, أردت أن أكون فأس حطاب.
items.weapon.curses.annoying.msg_12=تذكر, الثقة المفرطة قاتل بطيء وماكر.
items.weapon.curses.annoying.msg_13=جميع قواعدكم أصبحت ملكًا لنا!
items.weapon.curses.annoying.desc=الأسلحة المزعجة قادرة على الكلام, لكنها نشيطة أكثر من اللازم. غالبًا ما تجذب الانتباه إليك دون قصد.
items.weapon.curses.annoying.elestrike_desc=الضربة العنصرية بلعنة مزعجة لديها فرصة 20% لإثارة هياج كل عدو في النطاق لمدة 6 أدوار.

items.weapon.curses.dazzling.name=%s مبهر
items.weapon.curses.dazzling.desc=تومض الأسلحة المبهرة أحيانًا بضوء مبهر, مما يعمي كل شيء يمكنه رؤيتها.
items.weapon.curses.dazzling.elestrike_desc=الضربة العنصرية بلعنة مبهرة لديها فرصة 50% لإعماء كل عدو في النطاق لمدة 6 أدوار.

items.weapon.curses.displacing.name=%s الإزاحة
items.weapon.curses.displacing.desc=تُشبع أسلحة الإزاحة بسحر انتقال آني فوضوي, وتمتلك القدرة على نقل الأعداء في أنحاء الطابق عشوائيًا.
items.weapon.curses.displacing.elestrike_desc=الضربة العنصرية بلعنة الإزاحة لديها فرصة 50% لنقل كل عدو في النطاق آنيًا.

items.weapon.curses.explosive.name=%s متفجر
items.weapon.curses.explosive.warm=حار
items.weapon.curses.explosive.hot=ساخن
items.weapon.curses.explosive.desc=تبني الأسلحة المتفجرة القوة بثبات وتنفجر, مما يلحق الضرر بأي شيء قريب.
items.weapon.curses.explosive.desc_cool=سلاحك بارد الملمس حاليًا.
items.weapon.curses.explosive.desc_warm=سلاحك يبني الطاقة ويزداد سخونة...
items.weapon.curses.explosive.desc_hot=سلاحك ساخن! إنه على وشك الانفجار!
items.weapon.curses.explosive.elestrike_desc=الضربة العنصرية بلعنة متفجرة لديها فرصة 50% لإحداث انفجار يظهر على عدو عشوائي في النطاق.

items.weapon.curses.friendly.name=%s ودود
items.weapon.curses.friendly.desc=الأسلحة الودودة هي الأنسب للمسالمين, حيث تفعل أحيانًا سحرًا يجعل القتال مستحيلاً.
items.weapon.curses.friendly.elestrike_desc=الضربة العنصرية بلعنة ودودة لديها فرصة 50% لسحر كل عدو في النطاق لمدة 6 أدوار.

items.weapon.curses.polarized.name=%s مستقطب
items.weapon.curses.polarized.desc=يتأثر السلاح المستقطب بسحر يجعل هجومه إما يلحق ضررًا أكبر بنسبة 50%, أو لا يلحق أي ضرر على الإطلاق.
items.weapon.curses.polarized.elestrike_desc=الضربة العنصرية بلعنة مستقطبة لديها فرصة 50% لإلحاق 24-36 ضررًا بكل عدو في النطاق.

items.weapon.curses.pressurized.name=%s مضغوط
items.weapon.curses.pressurized.desc=الأسلحة المضغوطة قادرة على الانفجار بنبع ماء قوي يدفع كل شيء بعيدًا, بما في ذلك أنت.
items.weapon.curses.pressurized.elestrike_desc=ستخلق الضربة العنصرية بلعنة مضغوطة موجة من الماء تدمر التضاريس وتدفع كل عدو في النطاق للخلف.

items.weapon.curses.sacrificial.name=%s تضحوي
items.weapon.curses.sacrificial.desc=ستطلب الأسلحة التضحوية الدم من مرتديها مقابل مهاجمة الخصوم. كلما كان مرتديها أكثر صحة, زاد الدم الذي ستأخذه اللعنة.
items.weapon.curses.sacrificial.elestrike_desc=تتسبب الضربة العنصرية بلعنة تضحوية في نزيف البطل وكل عدو في النطاق بمقدار 12 نقطة صحة.

items.weapon.curses.wayward.name=%s ضال
items.weapon.curses.wayward.desc=تصبح الأسلحة الضالة أحيانًا غير دقيقة للغاية. يستمر هذا السحر لفترة قصيرة عند تفعيله, ولكن يمكن تبديده بتوجيه ضربة بالسلاح الضال.
items.weapon.curses.wayward.elestrike_desc=الضربة العنصرية بلعنة ضالة لديها فرصة 50% لإصابة كل عدو في النطاق بالنحس لمدة 6 أدوار.
items.weapon.curses.wayward$waywardbuff.name=ضال
items.weapon.curses.wayward$waywardbuff.desc=تم تفعيل سحر سلاحك الضال, مما يجعله غير دقيق للغاية لفترة وجيزة. لاحظ أن هذا لا يؤثر على الهجمات المضمونة الإصابة, مثل الهجمات المفاجئة. سيؤدي الهجوم الناجح بالسلاح الضال إلى إزالة هذا التأثير فورًا.\n\nعدد الأدوار المتبقية: %s .

items.weapon.curses.wondrous.name=%s عجيب
items.weapon.curses.wondrous.desc=تحتوي الأسلحة العجيبة على نفس السحر الفوضوي الموجود في العصي السحرية الملعونة. لا يمكن التنبؤ بما سيحدث عندما تتفعل هذه اللعنة!
items.weapon.curses.wondrous.elestrike_desc=الضربة العنصرية بلعنة عجيبة لديها فرصة لتطبيق تأثير عصا سحرية ملعونة مختلف على كل عدو في النطاق.

###enchantments
items.weapon.enchantments.blazing.name=%s مشتعل
items.weapon.enchantments.blazing.desc=تتسبب هذه التعويذة في انبعاث اللهب من السلاح, مما يشعل الأعداء ويلحق ضررًا إضافيًا بالأعداء المشتعلين بالفعل.
items.weapon.enchantments.blazing.elestrike_desc=تنشر الضربة العنصرية بتعويذة مشتعلة النار في كل مربع في النطاق, وتستمر لمدة 8 أدوار.

items.weapon.enchantments.blocking.name=%s صادّ
items.weapon.enchantments.blocking.desc=تمتلك الأسلحة الصادة فرصة لتدريعك لفترة وجيزة بعد الهجوم بها.
items.weapon.enchantments.blocking.elestrike_desc=تمنح الضربة العنصرية بتعويذة صادة المبارزة 6 دروع واقية إضافية لكل عدو في النطاق.
items.weapon.enchantments.blocking$blockbuff.name=منع
items.weapon.enchantments.blocking$blockbuff.desc=منحتك تعويذة الصد في سلاحك دفعة وجيزة لقوتك الدفاعية!\n\nالدروع الواقية المتبقية: %d\n\nالأدوار المتبقية: %s.

items.weapon.enchantments.blooming.name=%s مزهر
items.weapon.enchantments.blooming.desc=تحتوي الأسلحة المزهرة على سحر يتسبب في إنبات النباتات على أو حول من يُضرب بها.
items.weapon.enchantments.blooming.elestrike_desc=تنشر الضربة العنصرية بتعويذة مزهرة العشب في ما يصل إلى 8 مربعات في النطاق, وتجذر جميع الأعداء في النطاق لمدة 6 أدوار.

items.weapon.enchantments.chilling.name=%s مبرّد
items.weapon.enchantments.chilling.desc=الأعداء الذين يُضربون بهذه التعويذة يُصابون بالبرودة, مما يبطئ حركتهم وهجماتهم.
items.weapon.enchantments.chilling.elestrike_desc=تنشر الضربة العنصرية بتعويذة مبرّدة هواءً باردًا في كل مربع في النطاق, ويستمر لمدة 8 أدوار.

items.weapon.enchantments.crystal.name=%s بلوري
items.weapon.enchantments.crystal.alert_fixed=تم إصلاح سلاحك البلوري بالكامل!
items.weapon.enchantments.crystal.alert_fixed_ghost=تم إصلاح سلاح الشبح البلوري بالكامل!
items.weapon.enchantments.crystal.alert_noflaw=لم يعد سلاحك البلوري معيبًا.
items.weapon.enchantments.crystal.alert_noflaw_ghost=لم يعد سلاح الشبح البلوري معيبًا.
items.weapon.enchantments.crystal.alert_nocrack=لم يعد سلاحك البلوري مشروخًا.
items.weapon.enchantments.crystal.alert_nocrack_ghost=لم يعد سلاح الشبح البلوري مشروخًا.
items.weapon.enchantments.crystal.alert_flawed=أصبح سلاحك البلوري تالفًا قليلاً.
items.weapon.enchantments.crystal.alert_flawed_ghost=أصبح سلاح الشبح البلوري تالفًا قليلاً.
items.weapon.enchantments.crystal.alert_cracked=تتشقق البلورات الموجودة على سلاحك, إنها على وشك الانكسار!
items.weapon.enchantments.crystal.alert_cracked_ghost=تتشقق البلورات الموجودة على سلاح الشبح, إنها على وشك الانكسار!
items.weapon.enchantments.crystal.alert_shattered=تتحطم البلورات الموجودة على سلاحك إلى قطع!
items.weapon.enchantments.crystal.alert_shattered_ghost=تتحطم البلورات الموجودة على سلاح الشبح إلى قطع!
items.weapon.enchantments.crystal.desc=تلحق هذه التعويذة القوية ضررًا سحريًا إضافيًا وتعزز قيمة السلاح. ومع ذلك, يمكن أن تتحطم البلورات المسحورة إذا لم يتم إصلاحها أو إعطاؤها وقتًا للإصلاح الذاتي.
items.weapon.enchantments.crystal.desc_thrown=تمتلك الأسلحة البلورية المرمية متانة أقل بكثير, ولكنها تستعيدها ببطء بمرور الوقت.
items.weapon.enchantments.crystal.desc_perfect=هذا السلاح البلوري في حالة ممتازة حاليًا.
items.weapon.enchantments.crystal.desc_fine=هذا السلاح البلوري في حالة جيدة حاليًا.
items.weapon.enchantments.crystal.desc_flawed=البلورات الموجودة على هذا السلاح بها عيب, ولكنها ليست على وشك الانكسار.
items.weapon.enchantments.crystal.desc_cracked=البلورات الموجودة على هذا السلاح تتشقق, وهي معرضة لخطر الانكسار الدائم!
items.weapon.enchantments.crystal.elestrike_desc=تلحق الضربة العنصرية بتعويذة بلورية 10-20 ضررًا وتصلح السلاح لكل عدو في النطاق, باستثناء الهدف الأساسي.

items.weapon.enchantments.kinetic.name=%s حركي
items.weapon.enchantments.kinetic.desc=عندما يُقتل عدو بسلاح حركي, يتم تخزين أي قوة زائدة في السلاح وسيتم تطبيقها على الهجوم الناجح التالي.
items.weapon.enchantments.kinetic.elestrike_desc=تطبق الضربة العنصرية بتعويذة حركية 40% من الضرر المخزن على كل عدو في النطاق, باستثناء الهدف الأساسي.
items.weapon.enchantments.kinetic$conserveddamage.name=ضرر محفوظ
items.weapon.enchantments.kinetic$conserveddamage.desc=خزّن سلاحك القوة الزائدة من ضربة قاتلة سابقة, وسيطبقها كضرر إضافي على هجومك التالي. ومع ذلك, ستتلاشى الطاقة ببطء بمرور الوقت.\n\nالضرر المحفوظ: %d.

items.weapon.enchantments.corrupting.name=%s مفسد
items.weapon.enchantments.corrupting.desc=تمتلك هذه التعويذة القوية القدرة على إخضاع الأعداء لإرادتك. عندما يُقتل عدو بهذا السلاح, هناك فرصة لأن يصبح فاسدًا بدلاً من أن يموت.
items.weapon.enchantments.corrupting.elestrike_desc=الضربة العنصرية بتعويذة مفسدة لديها فرصة 5-25% (بناءً على الصحة المفقودة) لإفساد كل عدو في النطاق, باستثناء الهدف الأساسي.

items.weapon.enchantments.eldritch.name=%s مرعب
items.weapon.enchantments.eldritch.desc=تثير الأسلحة المرعبة الخوف في نفوس الأعداء القريبين الذين يشهدون ضرباتها, مما يجعلهم يهربون من المهاجم.
items.weapon.enchantments.eldritch.elestrike_desc=تطبق الضربة العنصرية بتعويذة مرعبة خوفًا ممتدًا على كل عدو في النطاق, بما في ذلك الهدف الأساسي.

items.weapon.enchantments.elastic.name=%s مرن
items.weapon.enchantments.elastic.desc=تمتلك الأسلحة المرنة فرصة لإرسال الأعداء طائرين لمسافات قصيرة.
items.weapon.enchantments.elastic.elestrike_desc=تدفع الضربة العنصرية بتعويذة مرنة جميع الأعداء في النطاق للخلف 5 مربعات.

items.weapon.enchantments.grim.name=%s قاتم
items.weapon.enchantments.grim.desc=تمتلك هذه التعويذة القوية القدرة على إعدام عدو على الفور. يزداد احتمال حدوث التأثير كلما كان العدو أضعف.
items.weapon.enchantments.grim.elestrike_desc=الضربة العنصرية بتعويذة قاتمة لديها فرصة 6-30% (بناءً على الصحة المفقودة) لقتل كل عدو في النطاق, باستثناء الهدف الأساسي.

items.weapon.enchantments.lucky.name=%s محظوظ
items.weapon.enchantments.lucky.desc=الأعداء الذين يُقتلون بسلاح محظوظ لديهم فرصة لإسقاط غنائم إضافية.
items.weapon.enchantments.lucky.elestrike_desc=الضربة العنصرية بتعويذة محظوظة لديها فرصة 12.5% لتوليد غنائم تحت كل عدو في النطاق. يمكن أن يتفعل هذا التأثير مرة واحدة فقط لكل عدو.

items.weapon.enchantments.projecting.name=%s مخترق
items.weapon.enchantments.projecting.desc=مع هذه التعويذة ستكتسب أسلحة الاشتباك مدى إضافيًا. ستخترق الأسلحة بعيدة المدى الجدران عند تصويبها نحو أهداف قريبة.
items.weapon.enchantments.projecting.elestrike_desc=تلحق الضربة العنصرية بتعويذة مخترقة 30% ضررًا بكل عدو في النطاق, باستثناء الهدف الأساسي.

items.weapon.enchantments.shocking.name=%s صاعق
items.weapon.enchantments.shocking.desc=تتقوس الكهرباء من سلاح صاعق, مما يلحق ضررًا إضافيًا بجميع الأعداء القريبين.
items.weapon.enchantments.shocking.elestrike_desc=تنشر الضربة العنصرية بتعويذة صاعقة الكهرباء في كل مربع في النطاق, وتستمر لمدة 8 أدوار.

items.weapon.enchantments.unstable.name=%s غير مستقر
items.weapon.enchantments.unstable.desc=تشع هذه التعويذة بطاقة فوضوية, وتعمل كتعويذة مختلفة مع كل ضربة.
items.weapon.enchantments.unstable.elestrike_desc=تطبق الضربة العنصرية بتعويذة غير مستقرة تأثير تعويذة عشوائي على كل عدو في النطاق, باستثناء الهدف الأساسي.

items.weapon.enchantments.vampiric.name=%s مصاص دماء
items.weapon.enchantments.vampiric.desc=تمتص هذه التعويذة القوية قوة الحياة من الأعداء مع كل ضربة, وتعيد توجيهها إلى مرتديها. يكون التأثير أقوى كلما انخفضت صحة مرتديها.
items.weapon.enchantments.vampiric.elestrike_desc=تشفي الضربة العنصرية بتعويذة مصاص دماء المبارزة بمقدار 2.5 نقطة صحة لكل عدو في النطاق.

items.weapon.enchantments.venomous.name=%s سام
items.weapon.enchantments.venomous.desc=تلحق الأسلحة السامة سمًا متأخرًا ولكنه مميت, ويصبح أكثر حدة في كل مرة يتم تطبيقه فيها.
items.weapon.enchantments.venomous.elestrike_desc=تطبق الضربة العنصرية بتعويذة سامة سمًا متأخرًا إضافيًا على كل عدو في النطاق, باستثناء الهدف الأساسي.

items.weapon.enchantments.vorpal.name=%s قاطع
items.weapon.enchantments.vorpal.desc=الأسلحة القاطعة مميتة بشكل خاص, لديها فرصة للضرب بنظافة شديدة بحيث تسبب النزيف بدلاً من الضرر للأعداء الذين يمكنهم النزيف.
items.weapon.enchantments.vorpal.elestrike_desc=تطبق الضربة العنصرية بتعويذة قاطعة نزيفًا إضافيًا على كل عدو في النطاق, باستثناء الهدف الأساسي.


###melee weapons
items.weapon.melee.assassinsblade.name=نصل القاتل
items.weapon.melee.assassinsblade.stats_desc=هذا السلاح أقوى ضد الأعداء الغافلين.
items.weapon.melee.assassinsblade.ability_name=تسلل
items.weapon.melee.assassinsblade.typical_ability_desc=تستطيع المبارزة _التسلل_ أثناء حمل نصل القاتل. تتيح هذه القدرة للمبارزة الانتقال الفوري لمسافة تصل إلى 3 مربعات بعيدًا وتمنحها عادةً _%d أدوار من الاختفاء._
items.weapon.melee.assassinsblade.ability_desc=تستطيع المبارزة _التسلل_ أثناء حمل نصل القاتل. تتيح هذه القدرة للمبارزة الانتقال الفوري لمسافة تصل إلى 3 مربعات بعيدًا وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.assassinsblade.desc=نصل مموج صغير مصنوع من حجر الأوبسيديان, صعب الاستخدام على الرغم من خفة وزنه, ولكنه مميت إذا أصاب الهدف الصحيح.

items.weapon.melee.battleaxe.name=فاس المعركه
items.weapon.melee.battleaxe.stats_desc=هذا سلاح دقيق إلى حد ما.
items.weapon.melee.battleaxe.ability_name=ضربة ثقيلة
items.weapon.melee.battleaxe.typical_ability_desc=تستطيع المبارزة تنفيذ _ضربة قوية_ بفأس المعركة. عادةً ما تلحق هذه الضربة المركزة _%1$d-%2$d ضررًا_ إذا فاجأت العدو, وتذهله لمدة 5 أدوار مخفضًا دقته وتفاديه بنسبة 50%%. تصيب الضربة القوية الهدف دائمًا, لكنها تلحق ضررًا عاديًا إذا لم تفاجئ العدو.
items.weapon.melee.battleaxe.ability_desc=تستطيع المبارزة تنفيذ _ضربة قوية_ بفأس المعركة. تلحق هذه الضربة المركزة _%1$d-%2$d ضررًا_ إذا فاجأت العدو, وتذهله لمدة 5 أدوار مخفضًا دقته وتفاديه بنسبة 50%%. تصيب الضربة القوية الهدف دائمًا, لكنها تلحق ضررًا عاديًا إذا لم تفاجئ العدو.
items.weapon.melee.battleaxe.desc=الرأس الفولاذي الضخم لفأس المعركة هذا يضع ثقلاً كبيرًا خلف كل ضربة واسعة.

items.weapon.melee.crossbow.name=قوس السهام
items.weapon.melee.crossbow.typical_stats_desc=عادةً ما يعزز هذا السلاح السهام المرمية لتلحق _%1$d-%2$d ضررًا_ عند تجهيزه, بل وسيمنحها تعويذته.
items.weapon.melee.crossbow.stats_desc=يعزز هذا السلاح السهام المرمية لتلحق _%1$d-%2$d ضررًا_ عند تجهيزه, بل وسيمنحها تعويذته.
items.weapon.melee.crossbow.ability_name=طلقة مشحونة
items.weapon.melee.crossbow.typical_ability_desc=تستطيع المبارزة شحن قوسها, مما يجعل هجومها العادي التالي يصيب الهدف دائمًا ويطبق أحد التأثيرات الثلاثة التالية: الهجمات القريبة تدفع الأعداء بعيدًا, والسهام غير المدببة عادةً ما تُلحق ضررًا إضافيًا. %1$d تُلحق السهام ذات الرؤوس المدببة ضررًا, وستُطبق تأثيرها في منطقة 7x7, وعادةً ما يستمر لمدة _ %2$d استخدامات أخرى_.
items.weapon.melee.crossbow.ability_desc=تستطيع المبارزة شحن قوسها, مما يجعل هجومها العادي التالي يصيب الهدف دائمًا ويطبق أحد التأثيرات الثلاثة التالية: الهجمات القريبة تدفع الأعداء بعيدًا, والسهام غير المدببة تُلحق ضررًا إضافيًا. %1$d الضرر, وستطبق السهام ذات الرؤوس المدببة تأثيرها في منطقة 7x7 وتستمر لمدة _ %2$d استخدامات أخرى_.
items.weapon.melee.crossbow.desc=سلاح معقد إلى حد ما يطلق السهام بسرعات استثنائية. بينما لم يتم تصميمه لذلك, فإن ثقل قوس السهام هذا وبنيته المتينة يجعلان منه سلاح اشتباك جيدًا أيضًا.
items.weapon.melee.crossbow.upgrade_ability_stat_name=تعزيز القدرة
items.weapon.melee.crossbow$chargedshot.name=مشحون
items.weapon.melee.crossbow$chargedshot.desc=تُركّز المبارزة قوتها في قوسها. الهجوم التالي الذي تُنفّذه به سيصيب الهدف حتماً ويُطبّق أحد التأثيرات الثلاثة التالية:\n- ستؤدي الهجمات القريبة إلى إبعاد الأعداء بضع مربعات.\n- ستلحق السهام غير المدببة ضرراً إضافياً.\n- ستكتسب السهام ذات الرؤوس المدببة استخدامات إضافية, وسيُطبَّق تأثيرها في منطقة 7x7. ستؤثر التأثيرات الإيجابية للسهام على الحلفاء فقط, بينما ستؤثر التأثيرات الضارة على الأعداء فقط. لا يمكن للمبارز استخدام هذه القدرة لتطبيق التأثيرات الإيجابية للسهام على نفسه.

items.weapon.melee.cudgel.name=هراوة
items.weapon.melee.cudgel.stats_desc=هذا سلاح دقيق إلى حد ما.
items.weapon.melee.cudgel.ability_name=ضربة ثقيلة
items.weapon.melee.cudgel.typical_ability_desc=تستطيع المبارزة تنفيذ _ضربة قوية_ بالهراوة. عادةً ما تلحق هذه الضربة المركزة _%1$d-%2$d ضررًا_ إذا فاجأت العدو, وتذهله لمدة 5 أدوار مخفضًا دقته وتفاديه بنسبة 50%%. تصيب الضربة القوية الهدف دائمًا, لكنها تلحق ضررًا عاديًا إذا لم تفاجئ العدو.
items.weapon.melee.cudgel.ability_desc=تستطيع المبارزة تنفيذ _ضربة قوية_ بالهراوة. تلحق هذه الضربة المركزة _%1$d-%2$d ضررًا_ إذا فاجأت العدو, وتذهله لمدة 5 أدوار مخفضًا دقته وتفاديه بنسبة 50%%. تصيب الضربة القوية الهدف دائمًا, لكنها تلحق ضررًا عاديًا إذا لم تفاجئ العدو.
items.weapon.melee.cudgel.desc=صولجان نحاسي صغير, صُنع كأداة دفاع عن النفس للنبلاء أكثر من كونه سلاح مغامرة.
items.weapon.melee.cudgel.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.melee.dagger.name=خنجر
items.weapon.melee.dagger.stats_desc=هذا السلاح أقوى ضد الأعداء الغافلين.
items.weapon.melee.dagger.ability_name=تسلل
items.weapon.melee.dagger.typical_ability_desc=تستطيع المبارزة _التسلل_ أثناء حمل خنجر. تتيح هذه القدرة للمبارزة الانتقال الفوري لمسافة تصل إلى 5 مربعات بعيدًا وتمنحها عادةً _%d أدوار من الاختفاء._
items.weapon.melee.dagger.ability_desc=تستطيع المبارزة _التسلل_ أثناء حمل خنجر. تتيح هذه القدرة للمبارزة الانتقال الفوري لمسافة تصل إلى 5 مربعات بعيدًا وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.dagger.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dagger.desc=خنجر حديدي بسيط بمقبض خشبي مهترئ.
items.weapon.melee.dagger.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.melee.dirk.name=خنجر طويل
items.weapon.melee.dirk.stats_desc=هذا السلاح أقوى ضد الأعداء الغافلين.
items.weapon.melee.dirk.ability_name=تسلل
items.weapon.melee.dirk.typical_ability_desc=تستطيع المبارزة _التسلل_ أثناء حمل خنجر طويل. تتيح هذه القدرة للمبارزة الانتقال الفوري لمسافة تصل إلى 4 مربعات بعيدًا وتمنحها عادةً _%d أدوار من الاختفاء._
items.weapon.melee.dirk.ability_desc=تستطيع المبارزة _التسلل_ أثناء حمل خنجر طويل. تتيح هذه القدرة للمبارزة الانتقال الفوري لمسافة تصل إلى 4 مربعات بعيدًا وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.dirk.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dirk.desc=خنجر طعن أطول, يمنح المزيد من الفولاذ لغرسه في الخصوم.

items.weapon.melee.flail.name=مذبة
items.weapon.melee.flail.stats_desc=هذا سلاح غير دقيق إلى حد ما.\nلا يمكن لهذا السلاح تنفيذ هجوم مفاجئ.
items.weapon.melee.flail.ability_name=يدور
items.weapon.melee.flail.spin_warn=لا يمكنك تدوير المذبة أكثر من ذلك.
items.weapon.melee.flail.typical_ability_desc=يستطيع المبارز تدوير المذبة لتجميع القوة لفترة وجيزة. في كل دور تُدار فيه المذبة, فإنها عادةً ما تُلحق ضررًا إضافيًا. %d يُلحق ضررًا في هجومه العادي التالي, بحد أقصى 3 مرات. كما أن استخدام المطرقة الدوارة يضمن إصابة الهدف. ويتطلب بدء تدوير المطرقة شحنة واحدة.
items.weapon.melee.flail.ability_desc=يستطيع المبارز تدوير المذبة لتجميع القوة لفترة قصيرة. في كل دور تُدار فيه المذبة, ستُلحق ضررًا إضافيًا. %d يُلحق ضررًا في هجومه العادي التالي, بحد أقصى 3 مرات. كما أن استخدام المطرقة الدوارة يضمن إصابة الهدف. ويتطلب بدء تدوير المطرقة شحنة واحدة.
items.weapon.melee.flail.desc=كرة مسننة متصلة بمقبض بواسطة سلسلة. صعبة الاستخدام للغاية, ولكنها مدمرة إذا وجهت ضربة قوية.
items.weapon.melee.flail$spinabilitytracker.name=يدور
items.weapon.melee.flail$spinabilitytracker.desc=تُدير المبارزة سوطها, مُراكمةً الضرر لهجومها العادي التالي. كل دورة تستغرق دورًا واحدًا, لكنها تزيد الضرر, بحد أقصى ثلاث دورات. كما أن السوط مضمون الإصابة أثناء الدوران.\n\nالدورات الحالية: %1$d %% .\nعدد الأدوار المتبقية: %2$s .

items.weapon.melee.gauntlet.name=قفاز حجري
items.weapon.melee.gauntlet.stats_desc=هذا سلاح سريع جدًا.
items.weapon.melee.gauntlet.ability_name=ضربة مركبة
