items.artifacts.holytome.cursed=You cannot use a cursed tome.
items.artifacts.holytome.levelup=Your tome grows stronger!
items.artifacts.holytome.desc=كتاب مقدس يُستخدم كمركز لسحر الكاهن الإلهي. وباستخدام هذا الكتاب، يستطيع الكاهن إلقاء مجموعة متنوعة من التعاويذ السحرية.   سيصبح الكتاب أكثر قوة بشكل مطرد كلما استخدمه الكاهن، مما يمنح الكاهن المزيد من الشحنات القصوى ويزيد من سرعة إعادة الشحن قليلاً.
items.artifacts.holytome.discover_hint=One of the heroes starts with this item.

items.artifacts.hornofplenty.name=horn of plenty
