items.rings.ringofhaste.desc=يقلل هذا الخاتم من إجهاد الحركة على مرتديه, مما يسمح له بالركض بسرعات خارقة. بدلاً من ذلك, سيثقل الخاتم الملعون كاهل مرتديه.

