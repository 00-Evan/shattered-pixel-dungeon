items.weapon.melee.rapier.typical_ability_desc=تستطيع المبارزة _الاندفاع_ بسيف مبارزة نحو عدو على بعد مربع واحد. يتحرك هذا نحو العدو, ويلحق عادةً _%1$d-%2$d ضررًا_, ومضمون الإصابة.
items.weapon.melee.rapier.ability_desc=تستطيع المبارزة _الاندفاع_ بسيف مبارزة نحو عدو على بعد مربع واحد. يتحرك هذا نحو العدو, ويلحق _%1$d-%2$d ضررًا_, ومضمون الإصابة.
items.weapon.melee.rapier.desc=سيف رفيع الحواف, صُنع للطعن والصد بدلاً من التلويح الواسع.
items.weapon.melee.rapier.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.melee.roundshield.name=درع دائري
items.weapon.melee.roundshield.typical_stats_desc=عادةً ما يصد هذا السلاح 0-%d ضرر. يتناسب هذا الصد مع الترقيات.
items.weapon.melee.roundshield.stats_desc=يصد هذا السلاح 0-%d ضرر. يتناسب هذا الصد مع الترقيات.
items.weapon.melee.roundshield.ability_name=حارس
items.weapon.melee.roundshield.typical_ability_desc=تستطيع المبارزة حماية نفسها بدرع دائري, مما يبطل تمامًا جميع الهجمات الجسدية أو السحرية الموجهة ضدها, وعادةً ما يكون ذلك لمدة %d بمجرد أن يصد المبارز هجومًا, فإن الهجوم المضاد أو استخدام السحر سينهي الحماية
items.weapon.melee.roundshield.ability_desc=بإمكان المبارزة حماية نفسها بدرع دائري, مما يُبطل تمامًا جميع الهجمات الجسدية أو السحرية الموجهة ضدها لمدة %d بمجرد أن يصد المبارز هجومًا, فإن الهجوم المضاد أو استخدام السحر سينهي الحماية
items.weapon.melee.roundshield.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.roundshield.desc=درع خشبي صغير مقوى بالحديد, يمكنه أن يعمل كسلاح ارتجالي عند الضرورة.
items.weapon.melee.roundshield$guardtracker.name=يحرس
items.weapon.melee.roundshield$guardtracker.guarded=محروسه
items.weapon.melee.roundshield$guardtracker.desc=تحمي المبارزة نفسها بدرعها, وستمنع تمامًا الضرر أو التأثيرات من الهجوم الجسدي أو السحري التالي. الهجوم أو إلقاء السحر سينهي الحراسة فورًا.\n\nالأدوار المتبقية: %s.

items.weapon.melee.runicblade.name=نصل روني
items.weapon.melee.runicblade.stats_desc=يتناسب هذا السلاح بشكل أفضل مع الترقيات.
items.weapon.melee.runicblade.ability_name=ضربة رونية
items.weapon.melee.runicblade.typical_ability_desc=تستطيع المبارزة توجيه _ضربة رونية_ بنصل روني, مما يطبق تعويذة السلاح مع قوة معززة بنسبة _%d%%._ الضربة الرونية مضمونة الإصابة.
items.weapon.melee.runicblade.ability_desc=تستطيع المبارزة توجيه _ضربة رونية_ بنصل روني, مما يطبق تعويذة السلاح مع قوة معززة بنسبة _%d%%._ الضربة الرونية مضمونة الإصابة.
items.weapon.melee.runicblade.upgrade_ability_stat_name=تعزيز القدرة
items.weapon.melee.runicblade.desc=سيف ذو تصميم غريب, خفيف الوزن, وتنبعث منه طاقة غامضة عند التلويح به.

items.weapon.melee.sai.name=ساي
items.weapon.melee.sai.stats_desc=هذا سلاح سريع جدًا.
items.weapon.melee.sai.ability_name=ضربة مركبة
items.weapon.melee.sai.typical_ability_desc=تستطيع المبارزة توجيه ضربة متتالية باستخدام ساي. هذه الضربة مضمونة الإصابة وعادةً ما تُلحق ضررًا إضافيًا. %d يُلحق المبارز ضررًا في كل مرة يصيب فيها خصمه بهجوم عادي من سلاح قريب أو سلاح مقذوف. عدم إصابة الخصم لمدة 5 أدوار (15 دورًا بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة
items.weapon.melee.sai.ability_desc=تستطيع المبارزة توجيه ضربة متتالية باستخدام ساي. هذه الضربة مضمونة الإصابة وتُلحق ضررًا إضافيًا. %d يُلحق المبارز ضررًا في كل مرة يصيب فيها خصمه بهجوم عادي من سلاح قريب أو سلاح مقذوف. عدم إصابة الخصم لمدة 5 أدوار (15 دورًا بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة.
items.weapon.melee.sai.desc=زوج من الخناجر المعدنية الثلاثية, غير مصممة لاختراق الدروع, ولكنها رائعة للتلويح السريع وإرباك الأعداء.
items.weapon.melee.sai$combostriketracker.name=ضربة مركبة
items.weapon.melee.sai$combostriketracker.desc=يقوم المبارز ببناء سلسلة ضربات يمكن استخدامها لزيادة قوة ضربة السلسلة. تُحتسب كل هجمة ناجحة بالأسلحة العادية أو المقذوفة, ولكن عدم الهجوم بنجاح لمدة 5 أدوار (15 بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة.\n\nأحدث المشاهدات: %1$d .\n\nيستمر اللعب حتى يتم خسارة الضربات: %2$s

items.weapon.melee.scimitar.name=سيف معقوف
items.weapon.melee.scimitar.stats_desc=هذا سلاح سريع إلى حد ما.
items.weapon.melee.scimitar.ability_name=رقصة السيف
items.weapon.melee.scimitar.typical_ability_desc=تستطيع المبارزة أداء _رقصة السيف_ بسيف معقوف. يستغرق هذا الوضع وقتًا صفرًا للتفعيل ويمنح المبارزة +60%% سرعة هجوم و+50%% دقة عادةً لمدة _%d أدوار._
items.weapon.melee.scimitar.ability_desc=تستطيع المبارزة أداء _رقصة السيف_ بسيف معقوف. يستغرق هذا الوضع وقتًا صفرًا للتفعيل ويمنح المبارزة +60%% سرعة هجوم و+50%% دقة لمدة _%d أدوار._
items.weapon.melee.scimitar.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.scimitar.desc=سيف عريض ذو نصل منحني, يسمح بضربات أسرع.
items.weapon.melee.scimitar$sworddance.name=رقصة السيف
items.weapon.melee.scimitar$sworddance.desc=تقوم المبارزة بهجمات سريعة مستعجلة على شكل رقصة. طالما هذا الوضع نشط, تهاجم بسرعة أكبر بنسبة 60%% (تكفي للهجوم مرتين بالضبط في كل دور بسيف معقوف) ولديها دقة أعلى بنسبة +50%%.\n\nالأدوار المتبقية: %s.

items.weapon.melee.sickle.name=منجل
items.weapon.melee.sickle.stats_desc=هذا سلاح غير دقيق إلى حد ما.
items.weapon.melee.sickle.ability_name=حصاد
items.weapon.melee.sickle.typical_ability_desc=تستطيع المبارزة تنفيذ هجوم _حصاد_ بمنجل, مما يلحق عادةً _%d نزيفًا_ للعدو. هذه الضربة مضمونة الإصابة.
items.weapon.melee.sickle.ability_desc=تستطيع المبارزة تنفيذ هجوم _حصاد_ بمنجل, مما يلحق _%d نزيفًا_ للعدو. هذه الضربة مضمونة الإصابة.
items.weapon.melee.sickle.desc=شفرة منحنية وحادة ومثبتة على مقبض قصير, صُممت لقطع النباتات ولكنها خطيرة بالقدر نفسه ضد اللحوم.

items.weapon.melee.spear.name=رمح
items.weapon.melee.spear.stats_desc=هذا سلاح بطيء إلى حد ما.\nيمتلك هذا السلاح مدى إضافيًا.
items.weapon.melee.spear.ability_name=شوكه
items.weapon.melee.spear.typical_ability_desc=تستطيع المبارزة استخدام طرف الرمح لـ _طعن_ عدو في النطاق ولكنه غير مجاور. يلحق هذا عادةً _%1$d-%2$d ضررًا_, ويدفع العدو للخلف, ومضمون الإصابة.
items.weapon.melee.spear.ability_desc=تستطيع المبارزة استخدام طرف الرمح لـ _طعن_ عدو في النطاق ولكنه غير مجاور. يلحق هذا _%1$d-%2$d ضررًا_, ويدفع العدو للخلف, ومضمون الإصابة.
items.weapon.melee.spear.desc=عصا خشبية طويلة ذات طرف معدني حاد.

items.weapon.melee.sword.name=سيف
items.weapon.melee.sword.ability_name=شق
items.weapon.melee.sword.typical_ability_desc=تستطيع المبارزة أن تشق عدواً بسيف. وهذا عادةً ما يُلحق ضرراً كبيراً. %1$d - %2$d يُلحق ضررًا مضمونًا ويصيب الهدف حتمًا. إذا قتلت ضربة الشق عدوًا, يكون ذلك فوريًا, ويمكن للمبارز استخدام ضربة الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.sword.ability_desc=يستطيع المبارز أن يشق عدوه بسيف. وهذا يُلحق ضررًا كبيرًا. %1$d - %2$d يُلحق ضررًا مضمونًا ويصيب الهدف حتمًا. إذا قتلت ضربة الشق عدوًا, يكون ذلك فوريًا, ويمكن للمبارز استخدام ضربة الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.sword.desc=يعد هذا النصل الفولاذي الحاد أحد أكثر الخيارات موثوقية وتنوعًا للمغامرين.
items.weapon.melee.sword$cleavetracker.name=شق مجاني
items.weapon.melee.sword$cleavetracker.desc=قضت المبارزة على عدو بهجوم شق, ويمكنها الآن تنفيذ شق آخر دون تكلفة طاقة.\n\nالأدوار المتبقية: %s.

items.weapon.melee.warhammer.name=مطرقة حرب
items.weapon.melee.warhammer.stats_desc=هذا سلاح دقيق إلى حد ما.
items.weapon.melee.warhammer.ability_name=ضربة ثقيلة
items.weapon.melee.warhammer.typical_ability_desc=تستطيع المبارزة تنفيذ _ضربة قوية_ بمطرقة حربية. عادةً ما تلحق هذه الضربة المركزة _%1$d-%2$d ضررًا_ إذا فاجأت العدو, وتذهله لمدة 5 أدوار مخفضًا دقته وتفاديه بنسبة 50%%. تصيب الضربة القوية الهدف دائمًا, لكنها تلحق ضررًا عاديًا إذا لم تفاجئ العدو.
items.weapon.melee.warhammer.ability_desc=تستطيع المبارزة تنفيذ _ضربة قوية_ بمطرقة حربية. تلحق هذه الضربة المركزة _%1$d-%2$d ضررًا_ إذا فاجأت العدو, وتذهله لمدة 5 أدوار مخفضًا دقته وتفاديه بنسبة 50%%. تصيب الضربة القوية الهدف دائمًا, لكنها تلحق ضررًا عاديًا إذا لم تفاجئ العدو.
items.weapon.melee.warhammer.desc=قلة من المخلوقات تستطيع الصمود أمام الضربة الساحقة لهذه الكتلة المعدنية الضخمة المثبتة على مقبض.

items.weapon.melee.warscythe.name=منجل حرب
items.weapon.melee.warscythe.stats_desc=هذا سلاح غير دقيق إلى حد ما.
items.weapon.melee.warscythe.ability_name=حصاد
items.weapon.melee.warscythe.typical_ability_desc=تستطيع المبارزة تنفيذ هجوم _حصاد_ بمنجل حرب, مما يلحق عادةً _%d نزيفًا_ للعدو. هذه الضربة مضمونة الإصابة.
items.weapon.melee.warscythe.ability_desc=تستطيع المبارزة تنفيذ هجوم _حصاد_ بمنجل حرب, مما يلحق _%d نزيفًا_ للعدو. هذه الضربة مضمونة الإصابة.
items.weapon.melee.warscythe.desc=أُعيد تشكيل هذا المنجل ليُستخدم في القتال, بشفرة معدلة ومقبض طويل. يتطلب استخدام هذا السلاح مهارتين متساويتين, إذ يصعب توجيهه بدقة, ولكنه يُلحق ضررًا بالغًا إذا أصاب الهدف.

items.weapon.melee.whip.name=سوط
items.weapon.melee.whip.stats_desc=يمتلك هذا السلاح مدى طويلًا جدًا.
items.weapon.melee.whip.ability_name=ضربة جلد
items.weapon.melee.whip.typical_ability_desc=تستطيع المبارزة توجيه ضربات متتالية بسوطها. يهاجم هذا الفعل كل عدو على بعد 3 مربعات, ويُلحق عادةً ضررًا إضافيًا. %1$d - %2$d الضرر, وإرجاع الأعداء المجاورين. هذا الهجوم مضمون الإصابة
items.weapon.melee.whip.ability_desc=تستطيع المبارزة توجيه ضربات متتالية بسوطها. يهاجم هذا الفعل كل عدو على بعد 3 مربعات, مُلحقًا ضررًا بـ %1$d - %2$d الضرر, وإرجاع الأعداء المجاورين. هذا الهجوم مضمون الإصابة
items.weapon.melee.whip.desc=حبل كبير مضفور بمقبض متين. بينما لا يمتلك السوط حافة قاطعة, فإنه يمتلك مدى استثنائيًا, ويمكن أن يكون مؤلمًا للغاية.

items.weapon.melee.wornshortsword.name=سيف قصير متهالك
items.weapon.melee.wornshortsword.ability_name=شق
items.weapon.melee.wornshortsword.typical_ability_desc=يستطيع المبارز أن يشطر عدوه بسيف قصير مهترئ. وهذا عادةً ما يُلحق به ضرراً بالغاً. %1$d - %2$d يُلحق ضررًا مضمونًا ويصيب الهدف حتمًا. إذا قتلت ضربة الشق عدوًا, يكون ذلك فوريًا, ويمكن للمبارز استخدام ضربة الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.wornshortsword.ability_desc=يستطيع المبارز أن يشطر عدوه بسيف قصير مهترئ. وهذا يُلحق به ضرراً بالغاً. %1$d - %2$d يُلحق ضررًا مضمونًا ويصيب الهدف حتمًا. إذا قتلت ضربة الشق عدوًا, يكون ذلك فوريًا, ويمكن للمبارز استخدام ضربة الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.wornshortsword.desc=سيف قصير إلى حد ما, تآكل بسبب الاستخدام المكثف. إنه أضعف وأخف قليلاً من السيف القصير في حالة أفضل.
items.weapon.melee.wornshortsword.discover_hint=يبدأ أحد الأبطال بهذا العنصر.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=سهم الأدرينالين
items.weapon.missiles.darts.adrenalinedart.desc=يرتفع الأدرينالين بسرعة عبر أي شخص يُصاب بهذا السهم. سيزيد من سرعته وقوة هجومه, ولكن فقط لفترة قصيرة. ستتلقى الشخصيات المعادية قدرًا ضئيلاً من الضرر وسترُصاب بالشلل بدلاً من ذلك.

items.weapon.missiles.darts.blindingdart.name=سهم الإعماء
items.weapon.missiles.darts.blindingdart.desc=الغلاف الموجود على هذا السهم سيجعل الهدف يفقد بصره فورًا, مما يعميه لفترة قصيرة.

items.weapon.missiles.darts.chillingdart.name=سهم التبريد
items.weapon.missiles.darts.chillingdart.desc=الغلاف الجليدي الموجود على هذا السهم سيجمد الأهداف عند الاصطدام, مما يبطئ جميع أفعالها. الأهداف الموجودة في الماء ستتجمد لفترة أطول.

items.weapon.missiles.darts.cleansingdart.name=سهم التطهير
items.weapon.missiles.darts.cleansingdart.desc=هذه الرصاصات مطلية بمادة مستخلصة من نبات ملكة الأعشاب, مما يجعل الحلفاء محصنين مؤقتًا ضد جميع التأثيرات السلبية, أو يزيل التأثيرات الإيجابية من الأعداء. وقد ينسى الأعداء لبرهة أنهم يهاجمونك أو يهربون منك. الرصاصة نفسها ما تزال ضارة بالأعداء, لكنها لا تؤذي الحلفاء.

items.weapon.missiles.darts.dart.name=سهم
items.weapon.missiles.darts.dart.ac_tip=نصيحه
items.weapon.missiles.darts.dart.prompt=اختر بذرة
items.weapon.missiles.darts.dart.tip_title=تغطية الرصاصات
items.weapon.missiles.darts.dart.tip_desc=يمكن دمج بذرة واحدة مع سهم أو سهمين لإضفاء رأس مدبب عليها. ينتج كل نوع من البذور نوعًا خاصًا به من السهام ذات الرؤوس المدببة, بتأثير فريد للاستخدام لمرة واحدة.\n\nوضع هذه البذور على رأس السهم سينتج _ %s ._
items.weapon.missiles.darts.dart.tip_all=غطِّ %1$d رصاصة بـ %2$d بذرة
items.weapon.missiles.darts.dart.tip_two=غطِّ رصاصتين ببذرة واحدة
items.weapon.missiles.darts.dart.tip_one=غطِّ رصاصة واحدة ببذرة واحدة
items.weapon.missiles.darts.dart.tip_cancel=الغاء
items.weapon.missiles.darts.dart.desc=هذه الأسهم البسيطة ذات الرأس المعدني ليست قوية جدًا بمفردها, ولكن يمكن تغليفها بمجموعة متنوعة من السوائل المفيدة والخطيرة.
items.weapon.missiles.darts.dart.unlimited_uses=بفضل بساطتها, ستدوم الرصاصات فعليًا إلى الأبد.

items.weapon.missiles.darts.displacingdart.name=سهم الإزاحة
items.weapon.missiles.darts.displacingdart.desc=تنبض مقدمة هذا السهم بطاقة فوضوية, فتنقل من يصيبه إلى مكان عشوائي في الطابق. ولا يمكن استخدام هذه القدرة إلا ضد الأعداء.

items.weapon.missiles.darts.healingdart.name=سهم الشفاء
items.weapon.missiles.darts.healingdart.desc=الترياق المركز الموجود على رأس هذا السهم سيشفي الهدف عند الاصطدام. ستتعرض الأعداء الموتى الأحياء والشيطانية للضرر بدلاً من ذلك.

items.weapon.missiles.darts.holydart.name=سهم مقدس
items.weapon.missiles.darts.holydart.desc=يُبارك رأس هذا السهم بقوة خارقة, مما يُمكّنه من إلحاق ضرر جسيم بالأعداء الموتى الأحياء والشياطين. أما بالنسبة للأهداف الأخرى, فسيكون تأثيره مُشابهًا لتأثير السهم العادي.

items.weapon.missiles.darts.incendiarydart.name=سهم حارق
items.weapon.missiles.darts.incendiarydart.desc=يلتهب هذا السهم فور ملامسته للهدف, مما يُشعل النار في الهدف وأي أرضية قابلة للاشتعال تحته. ولا يتسبب هذا التأثير بأي ضرر في الماء.

items.weapon.missiles.darts.paralyticdart.name=سهم مشل
items.weapon.missiles.darts.paralyticdart.desc=السم الموجود على رأس هذا السهم سيشل الهدف بالكامل, مما يمنعه من القيام بأي أفعال لفترة قصيرة.

items.weapon.missiles.darts.poisondart.name=سهم سام
items.weapon.missiles.darts.poisondart.desc=تم غمس رأس هذا السهم في سم خفيف, سيسري عبر مجرى دم الهدف ويلحق ضررًا بمرور الوقت.

items.weapon.missiles.darts.rotdart.name=رصاصة عفنة
items.weapon.missiles.darts.rotdart.desc=هذه السهام الخبيثة مطلية بمركب حمضي مستخلص من نبات التوت المتعفن, والذي يُسبب تآكلًا شديدًا لأي شيء يلامسه السهم. يقاوم الأعداء الأقوياء معظم هذا التأثير, لكن التآكل قوي بما يكفي للقضاء بسهولة على معظم الأعداء العاديين. تدوم هذه السهام لفترة أطول من السهام الأخرى المطلية, لكن لا يمكن زيادة متانتها.
items.weapon.missiles.darts.rotdart.discover_hint=يمكنك إنشاء هذا العنصر باستخدام بذرة من مهمة محددة.

items.weapon.missiles.darts.shockingdart.name=سهم صاعق
items.weapon.missiles.darts.shockingdart.desc=يتدفق تيار مستمر من الكهرباء على طرف هذا السهم, مما يلحق ضررًا صاعقًا بالهدف عند الاصطدام.

items.weapon.missiles.darts.tippeddart.ac_clean=تنظيف
items.weapon.missiles.darts.tippeddart.clean_title=تنظيف الرصاصات
items.weapon.missiles.darts.tippeddart.clean_desc=ستزيل هذه العملية تغطية البذور من رصاصاتك, مع إعادتها إلى رصاصات عادية.
items.weapon.missiles.darts.tippeddart.clean_all=تنظيف الكل
items.weapon.missiles.darts.tippeddart.clean_one=تنظيف 1
items.weapon.missiles.darts.tippeddart.cancel=الغاء
items.weapon.missiles.darts.tippeddart.uses_left=لديك _%d/%d_ استخدام متبقي لهذه الرصاصات قبل أن يزول تغطية إحداها.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_لكن هذه الرصاصات عالية الجودة لدرجة أنها ستدوم فعليًا إلى الأبد._
items.weapon.missiles.darts.tippeddart.about_to_break=رأس رصاصتك على وشك الانتهاء.
items.weapon.missiles.darts.tippeddart.has_broken=انتهى رأس رصاصتك.
items.weapon.missiles.darts.tippeddart.discover_hint=يمكنك صنع هذا العنصر باستخدام السهام والبذور.


items.weapon.missiles.bolas.name=بولاس
items.weapon.missiles.bolas.stats_desc=يُلحق هذا السلاح بالشلل هدفه.
items.weapon.missiles.bolas.desc=مجموعة من الأوزان متصلة بحبل رفيع. لا تلحق هذه الأوزان ضررًا كبيرًا عند رميها, ولكنها ستتشابك حول ساقي الهدف, مما يبطئه بشدة لفترة وجيزة.

items.weapon.missiles.boomerang.name=بوميرانج
items.weapon.missiles.boomerang.desc=عند رميه نحو العدو, سيعود هذا المقذيف الخشبي المفلطح إلى يد الرامي.
items.weapon.missiles.boomerang.durability=بفضل بنيته المتينة, لن يتكسر هذا البوميرانج من الاستخدام.

items.weapon.missiles.fishingspear.name=رمح الصيد
items.weapon.missiles.fishingspear.desc=رماح رمية صغيرة تعمل جيدًا كسلاح احتياطي رغم أنها مصممة للصيد.

items.weapon.missiles.forcecube.name=مكعب القوة
items.weapon.missiles.forcecube.ondeath=لقد قتلت نفسك بمكعب القوة الخاص بك...
items.weapon.missiles.forcecube.stats_desc=يوزع هذا السلاح قوة ارتطامه على منطقة صغيرة, مصيبًا كل ما حوله.
items.weapon.missiles.forcecube.desc=مكعب مدمج ثقيل من حجر مغناطيسي, يمتلك حوافًا مدببة ومتشابكة, مصمم للرمي. لا يمتلك المكعب أي ديناميكية هوائية على الإطلاق, ولكن عندما يهبط بقوة, فإن وزنه وسحره الخفي يولدان موجة ارتجاجية مذهلة تلحق الضرر بجميع الأعداء المجاورين.

items.weapon.missiles.heavyboomerang.name=بوميرانج ثقيل
items.weapon.missiles.heavyboomerang.stats_desc=يعود هذا السلاح إلى موقع رميه بعد خمسة أدوار.
items.weapon.missiles.heavyboomerang.desc=سلاح خشبي ثقيل منحني مصمم للرمي. على عكس البوميرانج العادي, تم وزن هذه النسخة الحربية لتكون أكثر ضررًا عند الاصطدام. لا يزال بإمكانه الطيران والعودة إلى راميه, ولكن قد يستغرق بضع جولات للعودة.

items.weapon.missiles.javelin.name=حربة
items.weapon.missiles.javelin.desc=تم موازنة هذا العمود الخشبي بدقة ليكون رمحًا قتاليًا قابلاً للرمي. يتم إلحاق أضرار جسيمة بأي شيء يُصاب بحربة.

items.weapon.missiles.kunai.name=كوناي
items.weapon.missiles.kunai.stats_desc=هذا السلاح أقوى ضد الأعداء الغافلين.
items.weapon.missiles.kunai.desc=هذا النصل الصغير المدبب مصنوع من قطعة صلبة من المعدن. يتم تثبيته أحيانًا على حبل, ولكنه يستخدم هنا كأداة للرمي. سيكون للكوناي تأثير مدمر إذا تم استخدامه لمفاجأة العدو.

items.weapon.missiles.missileweapon.stats_known=يلحق هذا السلاح المرمي من _المستوى %1$d_ _%2$d-%3$d ضررًا_ ويتطلب _%4$d قوة_ لاستخدامه بشكل صحيح.
items.weapon.missiles.missileweapon.stats_unknown=عادةً ما يلحق هذا السلاح المرمي من _المستوى %1$d_ _%2$d-%3$d ضررًا_ ويتطلب _%4$d قوة_ لاستخدامه بشكل صحيح.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=ربما يكون هذا السلاح ثقيلاً جداً بالنسبة لك.
items.weapon.missiles.missileweapon.distance=الأسلحة المرمية أكثر دقة على بعد بعيد, وأقل دقة من قريب.
items.weapon.missiles.missileweapon.durability=تفتك الأسلحة المرمية وتتكسر مع الاستخدام المتكرر.
items.weapon.missiles.missileweapon.uses_left=لدى هذا الطقم من الأسلحة المرمية _%d/%d_ استخدامات متبقية قبل أن ينكسر أحدها.
items.weapon.missiles.missileweapon.unlimited_uses=هذا العنصر متين بما يكفي ليدوم إلى الأبد!
items.weapon.missiles.missileweapon.unknown_uses=عادةً ما يكون لهذا الطقم من الأسلحة المرمية _%d_ استخدامات قبل أن يُكسر واحد.
items.weapon.missiles.missileweapon.curse_discover=هذا السلاح المرمي ملعون!
items.weapon.missiles.missileweapon.about_to_break=سلاحك المرمي على وشك التكسر.
items.weapon.missiles.missileweapon.has_broken=تكسر أحد أسلحتك المرمية.
items.weapon.missiles.missileweapon.dust=تتفتت السلاح المرمي إلى غبار عند لمسه.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=إذا تكسر آخر سلاح مرمي في طقمك المرمي المُطوَّر, فسيُفقد الطقم نهائيًا. هل أنت متأكد أنك تريد رميه?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=اجل
items.weapon.missiles.missileweapon.break_upgraded_warn_no=لا
items.weapon.missiles.missileweapon$placeholder.name=سلاح مرمي

items.weapon.missiles.shuriken.name=شوريكين
items.weapon.missiles.shuriken.stats_desc=يمكن رمي الشوريكين فورًا مع فترة انتظار 20 دورًا.
items.weapon.missiles.shuriken.desc=نجمة معدنية مسطحة ذات حواف بارزة حادة كالموس. يمكن إطلاق الشوريكين بسرعة فائقة بعد الحركة.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=انتظار الشوريكين
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=لقد رميت شوريكين فورًا مؤخرًا, ويجب عليك الانتظار قبل فعل ذلك مرة أخرى. لا يزال يمكن رمي الشوريكين, لكن بسرعة السلاح العادية.\n\nالأدوار المتبقية: %s.

items.weapon.missiles.throwingclub.name=هراوة رمي
items.weapon.missiles.throwingclub.stats_desc=لا يتشبث هذا السلاح بالأعداء ويمكن جمعه فورًا.
items.weapon.missiles.throwingclub.desc=عصا خشبية بسيطة ذات رأس ثقيل, متوازنة بشكل جيد للرمي. هذا السلاح البسيط سيلحق ضررًا خفيفًا ويستمر لعدة استخدامات.

items.weapon.missiles.throwinghammer.name=مطرقة رمي
items.weapon.missiles.throwinghammer.stats_desc=لا يتشبث هذا السلاح بالأعداء ويمكن جمعه فورًا.
items.weapon.missiles.throwinghammer.desc=مطرقة صغيرة متوازنة بشكل خاص للرمي. بينما يفتقر هذا السلاح إلى الحدة أو المدى الاستثنائي, فإنه يمتلك متانة لا تصدق ويلحق ضررًا كبيرًا عند الاصطدام.

items.weapon.missiles.throwingknife.name=سكين رمي
items.weapon.missiles.throwingknife.stats_desc=هذا السلاح أقوى ضد الأعداء الغافلين.
items.weapon.missiles.throwingknife.desc=سكاكين معدنية بسيطة مصممة للرمي بدقة. سيكون لسكاكين الرمي تأثير مدمر إذا تم استخدامها لمفاجأة العدو.
items.weapon.missiles.throwingknife.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.missiles.throwingspear.name=رمح رمي
items.weapon.missiles.throwingspear.desc=قضيب خشبي بسيط برأس معدني حاد, متوازن بشكل جيد للرمي.

items.weapon.missiles.throwingspike.name=وتد رمي
items.weapon.missiles.throwingspike.desc=قطعة حديدية سميكة مدببة, من السهل صياغتها بكميات كبيرة. غير متوازنة بشكل خاص للرمي, ولكن لا يزال من المؤلم جدًا أن تُصاب بها.
items.weapon.missiles.throwingspike.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.missiles.throwingstone.name=حجر رمي
items.weapon.missiles.throwingstone.desc=هذه الحجارة مشطوفة لتمكنيها من الرمي بقوة أكبر من الحجر العادي.
items.weapon.missiles.throwingstone.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.missiles.tomahawk.name=فأس توماهوك
items.weapon.missiles.tomahawk.stats_desc=يُلحق هذا السلاح _%1$d-%2$d نزيف_ بهدفه.
items.weapon.missiles.tomahawk.typical_stats_desc=عادةً ما يُلحق هذا السلاح _%1$d-%2$d نزيف_ بهدفه.
items.weapon.missiles.tomahawk.desc=يُعد فأس الرمي هذا سلاحًا فعالًا جدًا في القتال عن بُعد, ولكنه يتطلب قوة هائلة لإلقائه بشكل صحيح. يُسبب الفأس جروحًا غائرة تُسبب نزيفًا حادًا للأعداء.

items.weapon.missiles.trident.name=رمح ثلاثي الشعب
items.weapon.missiles.trident.desc=رأس هذا الرمح الثقيل ذو ثلاث شعب يمزق لحم الخصم ويسبب نزيفًا حادًا.


items.weapon.spiritbow.name=قوس الروح
items.weapon.spiritbow.ac_shoot=اطلاق
items.weapon.spiritbow.prompt=اختر هدفًا
items.weapon.spiritbow.stats=لا يمكن ترقية القوس مباشرةً, بل سيزداد قوةً تدريجيًا مع تقدمك في المستويات. في مستواك الحالي, ستُلحق الأسهم التي تُطلق من القوس ضررًا قدره _ %1$d - %2$d الضرر_ ويتطلب_ %3$d القوة لاستخدامها بشكل صحيح
items.weapon.spiritbow.desc=قوس مصنوع من خشب سحري قديم. يتوهج وتر القوس ونقوشه بضوء أزرق باهت. عند سحب الوتر, يستحضر هذا القوس سهمًا سحريًا يمكن إطلاقه على العدو
items.weapon.spiritbow.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.weapon.identify=أصبحت الآن على دراية كافية بسلاحك لتحديد هويته.
items.weapon.weapon.too_heavy=بسبب قوتك غير الكافية, سيُعيق هذا السلاح من سرعة هجومك ودقتك وقدرتك على الهجوم المفاجئ.
items.weapon.weapon.excess_str=بفضل قوتك الزائدة, سيلحق _ضررًا إضافيًا 0-%d_ بهذا السلاح.
items.weapon.weapon.hardening_gone=لقد زال التصليد عن هذا السلاح!
items.weapon.weapon.incompatible=تفاعل أنواع مختلفة من السحر قد محا التعويذة الموجودة على هذا السلاح!
items.weapon.weapon.cursed_worn=لأن هذا السلاح ملعون, فأنت عاجز عن تركه.
items.weapon.weapon.cursed=يمكنك أن تشعر بسحر خبيث كامن داخل هذا السلاح.
items.weapon.weapon.weak_cursed=على الرغم من اللعنة, يمكنك إغمال هذا السلاح.
items.weapon.weapon.not_cursed=هذا السلاح خالٍ من السحر الخبيث.
items.weapon.weapon.faster=تم تحسينه لتعزيز _السرعة._
items.weapon.weapon.stronger=تم تحسينه لتعزيز _الضرر._
items.weapon.weapon.enchanted=سحري: _%s._
items.weapon.weapon.enchant_hardened=لقد تم _تصليده._
items.weapon.weapon.hardened_no_enchant=تم _تصليد_ هذا السلاح, ولكنه غير مسحور حاليًا.
items.weapon.weapon$enchantment.enchant=تطوير
items.weapon.weapon$enchantment.rankings_desc=قُتل بواسطة تعويذة
items.weapon.weapon$enchantment.discover_hint=يمكنك العثور على عنصر بهذا التأثير عشوائيًا في الزنزانة, أو محاولة تطبيقه على عنصر بنفسك.


###misc items
items.amulet.name=تميمة يندور
items.amulet.ac_end=إنهاء اللعبة
items.amulet.desc=تميمة يندور هي أقوى أثر معروف للبشر أو الأقزام. بلوراتها المتلألئة تحتوي على قوة مذهلة وعجيبة.
items.amulet.desc_origins=أصول التميمة مجهولة. تقول الروايات التاريخية إن ملك الأقزام تفاخر باكتشافه لهذه القطعة الأثرية قبل أن تقطع حضارة الأقزام كل صلة لها به. كيف عثر عليها? وكيف انتزعها منه يوخز? ربما هذه أسئلة لوقت آخر, لكن المهم الآن هو أن التميمة أصبحت ملكك!
items.amulet.desc_ascent=أصول التميمة مجهولة, لكن من الواضح أنها تأثرت بشدة بقوة يوغز. يبدو أن الزنزانة تخضع لإرادة يوغز كلما تقدمت فيها, مما يجعل الأعداء أكثر وفرة وقوة! كما أنك لم تعد قادرًا على تفعيل التميمة أو التخلص منها, كما لو أنها ملعونة.
items.amulet.ascent_title=الصعود
items.amulet.ascent_desc=تبدأ بالشعور بقوة يوغز العظيمة والرهيبة وهي تنبعث من التميمة. قد يكون الصعود عبر الزنزانة كبشري أصعب مما كنت تتصور!\n\nإذا واصلت الصعود بالتميمة, ستصبح الزنزانة أكثر خطورة, وسيتم تعطيل الانتقالات بين الطوابق, ولن تتمكن من الفوز باللعبة إلا من خلال هزيمة الأعداء أثناء صعودك عبر الزنزانة!\n\nيمكنك ترك التميمة هنا في الوقت الحالي إذا كنت ترغب في الصعود دون بدء هذا التحدي, أو تفعيل التميمة قبل الصعود لإنهاء اللعبة بشكل طبيعي
items.amulet.ascent_yes=تابع!
items.amulet.ascent_no=توقف الآن
items.amulet.discover_hint=يمكنك العثور على هذا العنصر في قاع الزنزانة...

items.ankh.name=مفتاح الحياه
items.ankh.ac_bless=بركه
items.ankh.bless=تبارك عقد الحياة بالماء السحري.
items.ankh.desc=يمنح هذا الرمز القديم للخلود القدرة على العودة إلى الحياة بعد الموت. ستسقط معظم الأشياء في مكان موتك, ولكن يمكنك استعادتها إذا عدت إليه. باستخدام قربة ماء ممتلئة, يمكن مباركة رمز عنخ بقوة إضافية.
items.ankh.desc_blessed=يمنح هذا الرمز القديم للخلود القدرة على العودة إلى الحياة بعد الموت. لقد بُوركت عنخ وأصبحت الآن أقوى بكثير. ستضحي عنخ بنفسها لإنقاذك في لحظة الخطر المميت
items.ankh.discover_hint=يمكنك شراء هذا العنصر من المتجر.

items.arcaneresin.name=راتنج سحري
items.arcaneresin.prompt=اختر عصا سحرية
items.arcaneresin.ac_apply=تطبيق
items.arcaneresin.level_too_high=تلك العصا قوية جدًا لتحسينها بالراتنج.
items.arcaneresin.not_enough=ليس لديك ما يكفي من الراتنج لهذا!
items.arcaneresin.apply=تغلّف عصاك بالراتنج, مما يزيد قوتها!
items.arcaneresin.desc=يتلألأ هذا المسحوق الناعم بين درجات اللون البنفسجي والأبيض, ويمكنه أن يعمل كمضخم للطاقة السحرية, فيزيد من مستوى العصي السحرية عند تطبيقه عليها!\n\nيكلف تطوير عصا 1 أو 2 أو 3 من الراتنج حسب مستوى العصا الأولي. يمكن للراتنج تطوير العصي حتى مستوى +3 كحد أقصى.\n\nومع ذلك, فإن ترقيات الراتنج _تتجاوزها مصادر الترقية الأخرى_ (مثل لفائف الترقية), ولا يتم تطبيقها عند دمج عصا سحرية في عصا الساحر.
items.arcaneresin.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.brokenseal.name=شاره محطمه
items.brokenseal.ac_affix=تثبيت
items.brokenseal.prompt=اختر درعًا
items.brokenseal.unknown_armor=يجب عليك أولًا تحديد ما إذا كان ذلك الدرع ملعونًا أم لا.
items.brokenseal.cursed_armor=لن يُطبق الختم على الدرع الملعون.
items.brokenseal.affix=تثبّت الختم على درعك!
items.brokenseal.desc=ختم شمعي, يُلصق على الدروع كرمز للشجاعة. يحمل في وسطه نقشًا باهتًا للحماية, وهو متصدع إلى نصفين في المنتصف.\n\nيُعدّ هذا الختم تذكارًا من موطنه, ويساعد المحارب على الصمود. فبمجرد ارتدائه, يكتسب المحارب درعًا واقيًا عندما يكون على وشك تلقي ضرر يُقلّل صحته إلى النصف أو أقل.\n\nيمكن تثبيت الختم على الدروع ونقله بينها. ويمكنه حمل ترقية واحدة معه, بشرط أن تكون هذه الترقية قد طُبقت على الدرع أثناء تثبيت الختم عليه
items.brokenseal.inscribed=الختم محفور بـ _%s._
items.brokenseal.choose_title=اختر رمزًا
items.brokenseal.choose_desc=يحمل كل من هذا الدرع والختم المكسور رمزًا. اختر الرمز الذي يجب الاحتفاظ به.\n\nنقش الدرع: %1$s\nرمز الختم المكسور: %2$s\n\nلاحظ أنه إذا اخترت الرمز الموجود حاليًا على الدرع, فلن يتمكن الختم من نقله لاحقًا.
items.brokenseal.discover_hint=يبدأ أحد الأبطال بهذا العنصر.
items.brokenseal$warriorshield.name=درع المحارب
items.brokenseal$warriorshield.desc_active=يساعد الختم المكسور للمحارب حاليًا على الصمود, مانحًا إياه درعًا إضافيًا إلى جانب صحته. يوجد وقت انتظار بعد تفعيل الدرع لأول مرة قبل أن يتمكن من استخدامه مرة أخرى.\n\nلا يتلاشى هذا الدرع بمرور الوقت, ولكنه سينتهي إذا لم يكن هناك أعداء قريبون لعدة أدوار. عند انتهائه, سيؤدي أي درع غير مستخدم إلى تقليل فترة التبريد, بحد أقصى 50 %% .\n\nالدرع المتبقي: %1$d .\n\nفترة الانتظار الحالية: %2$d .
items.brokenseal$warriorshield.desc_cooldown=حصل المحارب مؤخرًا على درع من ختمه المكسور, ويجب أن ينتظر حتى يتمكن من الاستفادة من تأثير درعه مرة أخرى.\n\nالأدوار المتبقية: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=مدة انتظار درع المحارب سالبة حاليًا, ما يعني أن مدة الانتظار عند تفعيل الدرع ستكون أقل من 150 دورة المعتادة. يمكن تقليل مدة انتظار الدرع إلى -150 دورة, ما يعني أنه سيكون متاحًا فور تفعيله.\n\nفترة التبريد الحالية: %d .

items.dewdrop.name=قطرة ندى
items.dewdrop.already_full=لديك بالفعل صحة كاملة.
items.dewdrop.desc=قطرة ندى شفافة.\n\nبفضل سحر هذا المكان, يمتلك الماء النقي خواصًا استشفائية طفيفة.

items.equipableitem.curse_detected=تشعر بأن هذا العنصر ملعون قبل أن تجهّزه تمامًا!
items.equipableitem.unequip_cursed=لا يمكنك إزالة عنصر ملعون!
items.equipableitem.ac_equip=استخدام
items.equipableitem.ac_unequip=الغاء الاستخدام

items.energycrystal.name=بلورة طاقة
items.energycrystal.desc=مجموعة من البلورات السحرية الصغيرة, مملوءة بالطاقة الكيميائية.\n\nهذه البلورات هي المكون الأكثر شيوعًا في وصفات الخيمياء ويمكن إنتاجها في وعاء الخيمياء عن طريق تفكيك العناصر المستهلكة.

items.gold.name=ذهب
items.gold.desc=كومة من عملات الذهب. اجمع عملات الذهب لإنفاقها لاحقًا في متجر.

