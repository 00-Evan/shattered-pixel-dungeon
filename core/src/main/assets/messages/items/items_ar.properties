items.weapon.melee.sai.ability_name=combo strike
items.weapon.melee.sai.typical_ability_desc=يستطيع المبارز تنفيذ ضربة متتالية باستخدام الساي. هذه الضربة مضمونة الإصابة وعادةً ما تُلحق ضررًا إضافيًا. %d يُلحق المبارز ضررًا في كل مرة يصيب فيها خصمه بهجوم عادي من سلاح قريب أو سلاح مقذوف. عدم إصابة الخصم لمدة 5 أدوار (15 دورًا بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة.
items.weapon.melee.sai.ability_desc=يستطيع المبارز تنفيذ ضربة متتالية باستخدام الساي. هذه الضربة مضمونة الإصابة وتُلحق ضررًا إضافيًا. %d يُلحق المبارز ضررًا في كل مرة يصيب فيها خصمه بهجوم عادي من سلاح قريب أو سلاح مقذوف. عدم إصابة الخصم لمدة 5 أدوار (15 دورًا بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة.
items.weapon.melee.sai.desc=Two thin blades meant to be wielded in one hand each. Excellent for tearing down enemies with a flurry of cuts.
items.weapon.melee.sai$combostriketracker.name=combo strike
items.weapon.melee.sai$combostriketracker.desc=يقوم المبارز ببناء سلسلة ضربات يمكن استخدامها لزيادة قوة ضربة السلسلة. تُحتسب كل هجمة ناجحة بالأسلحة العادية أو المقذوفة، ولكن عدم الهجوم بنجاح لمدة 5 أدوار (15 بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة.   أحدث المشاهدات: %1$d .   يستمر اللعب حتى يتم خسارة الضربات: %2$s

