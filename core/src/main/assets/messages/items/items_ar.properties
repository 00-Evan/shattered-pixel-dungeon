###armor curses
items.armor.curses.antientropy.name=%s مضاد للإنتروبيا
items.armor.curses.antientropy.desc=تعمل لعنة مضاد الإنتروبيا ضد قوى الكون, حيث تسحب الطاقة إلى مرتديها وتبعدها عن محيطه. يؤدي هذا إلى اشتعال النيران في مرتديها لفترة وجيزة, ولكنه يجمد كل شيء من حوله!

items.armor.curses.bulk.name=%s ضخم
items.armor.curses.bulk.desc=يبدو الدرع الضخم أكبر حجمًا وأكثر هيبة, لكنه في الواقع لا يمتلك دفاعًا معززًا. والأسوأ من ذلك, أن الحجم الإضافي يجعل التحرك عبر المداخل صعبًا للغاية.

items.armor.curses.corrosion.name=%s مآكل
items.armor.curses.corrosion.desc=الدرع المآكل قادر على الانفجار بسائل مآكل, مما يغطي كل شيء في المنطقة بمادة حمضية لزجة.

items.armor.curses.displacement.name=%s الإزاحة
items.armor.curses.displacement.desc=تحاول لعنة الإزاحة نقل مرتديها إلى بر الأمان عند تعرضه للهجوم. ومع ذلك, فهي فعالة أكثر من اللازم, حيث تنقل المستخدم عشوائيًا في أنحاء الطابق.

items.armor.curses.metabolism.name=%s الأيض
items.armor.curses.metabolism.desc=تحول لعنة الأيض الشبع مباشرة إلى صحة عند إصابة مرتديها, مما يوفر دفعة من الشفاء, ولكنها تسبب الجوع الشديد بسرعة.

items.armor.curses.multiplicity.name=%s التعدد
items.armor.curses.multiplicity.desc=يحتوي الدرع الملعون بالتعدد على سحر استنساخ خطير. سيخلق أحيانًا صورة طبق الأصل لمرتديه, ولكن من المحتمل بنفس القدر أن يستنسخ المهاجم!

items.armor.curses.overgrowth.name=%s النمو المفرط
items.armor.curses.overgrowth.desc=درع النمو المفرط مغطى بنباتات مزهرة مختلفة. بينما يبدو هذا التأثير مثيرًا للاهتمام بالتأكيد, إلا أنه لا يفيد الدفاع بشيء, وستتفاعل هذه النباتات عشوائيًا في القتال!

items.armor.curses.stench.name=%s النتنة
items.armor.curses.stench.desc=الدرع الملعون بالنتنة سيطلق سحبًا من الغاز الضار, وهو أمر خطير على كل ما يعلق في السحابة.


###glyphs
items.armor.glyphs.affection.name=%s المودة
items.armor.glyphs.affection.desc=يتلاعب هذا النقش القوي بعقول المهاجمين, ويسحرهم مؤقتًا.

items.armor.glyphs.antimagic.name=%s مضاد للسحر
items.armor.glyphs.antimagic.desc=يسمح هذا النقش القوي للدرع بالدفاع عن مرتديه ضد الهجمات السحرية وكذلك الجسدية. لا يتأثر هذا الدفاع السحري بمستوى الدرع.

items.armor.glyphs.brimstone.name=%s الكبريت
items.armor.glyphs.brimstone.desc=يحمي هذا النقش مرتديه وممتلكاته من النار, ويلغي تمامًا أضرارها وآثارها السلبية.

items.armor.glyphs.camouflage.name=%s التمويه
items.armor.glyphs.camouflage.desc=يسمح هذا النقش لمرتديه بالاندماج في العشب الطويل, مما يمنحه اختفاءً مؤقتًا.

items.armor.glyphs.entanglement.name=%s التشابك
items.armor.glyphs.entanglement.desc=ينمي هذا النقش درعًا ترابيًا حول مرتديه لامتصاص الضرر, ولكن هذا الدرع سينكسر إذا تحرك مرتديه.

items.armor.glyphs.flow.name=%s التدفق
items.armor.glyphs.flow.desc=يتلاعب هذا النقش بتدفق الماء حول مرتديه, مما يجعله أسرع بكثير عند التحرك عبره.

items.armor.glyphs.obfuscation.name=%s التعتيم
items.armor.glyphs.obfuscation.desc=يخفي هذا النقش مرتديه, مما يجعل اكتشافه أكثر صعوبة.

items.armor.glyphs.potential.name=%s الإمكانات
items.armor.glyphs.potential.desc=يبني هذا النقش الطاقة عند التعرض للضرب, مما يمنح شحنة لعصا مرتديه السحرية عند تفعيله.

items.armor.glyphs.repulsion.name=%s التنافر
items.armor.glyphs.repulsion.desc=يرد هذا النقش القوة ضد المهاجمين, ويرسلهم طائرين إلى الخلف.

items.armor.glyphs.stone.name=%s الحجر
items.armor.glyphs.stone.desc=يحيط هذا النقش الدرع بحجر سحري ثقيل يجعل المراوغة مستحيلة, ولكنه يصد الضرر بما يتناسب مع التفادي.

items.armor.glyphs.swiftness.name=%s السرعة
items.armor.glyphs.swiftness.desc=يعزز هذا النقش سرعة مرتديه كلما لم يكن بالقرب من عدو.

items.armor.glyphs.thorns.name=%s الأشواك
items.armor.glyphs.thorns.desc=يؤذي هذا النقش القوي المهاجمين, مما يجعلهم ينزفون ببطء عندما يهاجمون مرتديه.

items.armor.glyphs.viscosity.name=%s اللزوجة
items.armor.glyphs.viscosity.deferred=مؤجل %d
items.armor.glyphs.viscosity$defereddamage.name=ضرر مؤجل
items.armor.glyphs.viscosity$defereddamage.ondeath=الضرر المؤجل قتلك...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=قُتل بسبب الضرر المؤجل
items.armor.glyphs.viscosity$defereddamage.desc=يتم إلحاق الضرر ببطء مع مرور الوقت بدلاً من إلحاقه على الفور.\n\nالضرر المؤجل المتبقي: %d.
items.armor.glyphs.viscosity.desc=هذا النقش قادر على تخزين الضرر الذي يلحق بمرتديه, وإلحاقه به ببطء بدلاً من دفعة واحدة.



###armor
items.armor.armor.ac_detach=فصل
items.armor.armor.detach_seal=لقد فصلت الختم عن درعك.
items.armor.armor.equip_cursed=يضيق الدرع حولك بشكل مؤلم.
items.armor.armor.identify=أصبحت الآن على دراية كافية بدرعك لتحديد هويته.
items.armor.armor.hardening_gone=لقد زال التصليد عن هذا الدرع!
items.armor.armor.incompatible=تفاعل أنواع مختلفة من السحر قد محا النقش الموجود على هذا الدرع!
items.armor.armor.curr_absorb=هذا الدرع من _المستوى %1$d_ يصد _%2$d-%3$d ضرر_ ويتطلب _%4$d قوة_ لاستخدامه بشكل صحيح.
items.armor.armor.avg_absorb=عادةً ما يصد هذا الدرع من _المستوى %1$d_ _%2$d-%3$d ضرر_ ويتطلب _%4$d قوة_ لاستخدامه بشكل صحيح.
items.armor.armor.too_heavy=بسبب قوتك غير الكافية, فإن ارتداء هذا الدرع سيقلل من قدرتك على الحركة والتفادي والدفاع.
items.armor.armor.probably_too_heavy=ربما يكون هذا الدرع ثقيلاً جداً بالنسبة لك.
items.armor.armor.excess_str=بسبب قوتك الزائدة, أصبحت _أكثر قدرة على التفادي_ أثناء ارتداء هذا الدرع.
items.armor.armor.evasion=تم تعزيزه لتحسين _التفادي._
items.armor.armor.defense=تم تعزيزه لتحسين _الدفاع._
items.armor.armor.inscribed=منقوش عليه _%s._
items.armor.armor.glyph_hardened=لقد تم _تصليده._
items.armor.armor.hardened_no_glyph=تم _تصليد_ هذا الدرع, ولكنه غير منقوش حاليًا بأي رمز.
items.armor.armor.cursed_worn=لأن هذا الدرع ملعون, فأنت عاجز عن خلعه.
items.armor.armor.cursed=يمكنك أن تشعر بسحر خبيث كامن داخل هذا الدرع.
items.armor.armor.weak_cursed=على الرغم من اللعنة, يمكنك خلع هذا الدرع.
items.armor.armor.not_cursed=هذا الدرع خالٍ من السحر الخبيث.
items.armor.armor.seal_attached=ختم المحارب المكسور مثبت على هذا الدرع. عندما يكون على وشك الإصابة بأقل من نصف صحته, سيمنحه _%d درعًا واقيًا_.
items.armor.armor.seal_transfer=يجب تثبيت ختم المحارب المكسور على درعه الحالي ليستفيد منه. هل ترغب في فصل الختم تلقائيًا عن الدرع الذي تخلعه وتثبيته على الدرع الذي ترتديه?
items.armor.armor.seal_transfer_yes=اجل
items.armor.armor.seal_transfer_no=لا
items.armor.armor$glyph.glyph=نقش
items.armor.armor$glyph.killed=%s قتلك...
items.armor.armor$glyph.rankings_desc=قُتل بواسطة نقش
items.armor.armor$glyph.discover_hint=يمكنك العثور على عنصر بهذا التأثير عشوائيًا في الزنزانة, أو محاولة تطبيقه على عنصر بنفسك.

items.armor.classarmor.ac_ability=اختر القدرة
items.armor.classarmor.ac_transfer=ينقل
items.armor.classarmor.no_ability=درعك لا يمتلك أي قدرة حاليًا, يجب عليك اختيار واحدة!
items.armor.classarmor.not_equipped=تحتاج إلى ارتداء هذا الدرع لاستخدام قوته الخاصة!
items.armor.classarmor.low_charge=لا يمتلك الدرع شحنة كافية لاستخدام قوته الخاصة!
items.armor.classarmor.charge_use=استخدام القدرة الآن سيستهلك _%s_ شحنة.
items.armor.classarmor.transfer_title=نقل الدرع
items.armor.classarmor.transfer_desc=يمكن نقل سحر تاج ملك الأقزام إلى مجموعة دروع أخرى. لاحظ أنه سيتم تدمير الدرع الأصلي في هذه العملية.
items.armor.classarmor.transfer_prompt=اختر درعًا
items.armor.classarmor.transfer_cancel=الغاء
items.armor.classarmor.transfer_complete=تم نقل خصائص درعك البطولي!
items.armor.classarmor.discover_hint=يمكنك العثور على هذا العنصر بعد هزيمة زعيم الطابق 20 ببطل محدد.

items.armor.clericarmor.name=أثواب البطل
items.armor.clericarmor.desc=أثناء ارتداء هذا المزيج من القماش والصفائح, يستطيع الكاهن أداء قدرة خاصة.

items.armor.clotharmor.name=درع قماشي
items.armor.clotharmor.desc=يوفر هذا الدرع خفيف الوزن حماية أساسية.
items.armor.clotharmor.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.armor.duelistarmor.name=درع صدر البطل
items.armor.duelistarmor.desc=أثناء ارتداء درع الصدر والعباءة هذا, تستطيع المبارزة أداء قدرة خاصة.

items.armor.huntressarmor.name=عباءة البطل
items.armor.huntressarmor.no_enemies=لا يوجد أعداء في مرمى البصر
items.armor.huntressarmor.desc=أثناء ارتداء هذه العباءة, تستطيع الصيادة أداء قدرة خاصة.

items.armor.leatherarmor.name=درع جلدي
items.armor.leatherarmor.desc=درع مصنوع من جلد الوحوش المدبوغ. ليس بخفة الدرع القماشي ولكنه يوفر حماية أفضل.

items.armor.magearmor.name=رداء البطل
items.armor.magearmor.desc=أثناء ارتداء هذا الرداء الرائع, يستطيع الساحر أداء قدرة خاصة.

items.armor.mailarmor.name=درع زردي
items.armor.mailarmor.desc=حلقات معدنية متشابكة تشكل بدلة درع متينة ولكنها مرنة.

items.armor.platearmor.name=درع صفائحي
items.armor.platearmor.desc=تم ربط ألواح معدنية ضخمة معًا لتشكل بدلة توفر حماية لا مثيل لها لأي مغامر قوي بما يكفي لتحمل وزنها الهائل.

items.armor.roguearmor.name=زي البطل
items.armor.roguearmor.desc=أثناء ارتداء هذا الزي الداكن, يستطيع اللص أداء قدرة خاصة.

items.armor.scalearmor.name=درع حرشفي
items.armor.scalearmor.desc=تخلق الحراشف المعدنية المخيطة على سترة جلدية درعًا مرنًا وواقيًا في نفس الوقت.

items.armor.warriorarmor.name=درع البطل الصفائحي
items.armor.warriorarmor.desc=أثناء ارتداء هذا الدرع الصفائحي الثقيل, يستطيع المحارب أداء قدرة خاصة.



###artifacts
items.artifacts.alchemiststoolkit.name=أدوات الخيميائي
items.artifacts.alchemiststoolkit.ac_brew=تحضير
items.artifacts.alchemiststoolkit.ac_energize=شحن بالطاقة
items.artifacts.alchemiststoolkit.not_ready=لم تنتهِ مجموعة أدواتك من التسخين بعد.
items.artifacts.alchemiststoolkit.cursed=تمنعك مجموعة أدواتك الملعونة من استخدام الخيمياء!
items.artifacts.alchemiststoolkit.need_energy=تحتاج إلى 6 طاقة على الأقل لذلك.
items.artifacts.alchemiststoolkit.energize_desc=كل 6 بلورات طاقة ستمنح مجموعة الأدوات طاقة كافية لاكتساب مستوى, مما يزيد من معدل توليد مجموعة الأدوات للطاقة بمرور الوقت, وسرعة تسخينها.\n\nما مقدار الطاقة التي ترغب في استخدامها?
items.artifacts.alchemiststoolkit.energize_1=6 طاقة: +1 مستوى
items.artifacts.alchemiststoolkit.energize_all=%1$d طاقة: +%2$d مستويات
items.artifacts.alchemiststoolkit.desc=تحتوي مجموعة الأدوات هذه على عدد من الكواشف والأعشاب بالإضافة إلى قارورة خلط صغيرة, مما يسمح بالخيمياء أثناء التنقل. تحتوي القارورة على ما يبدو أنه بلورات طاقة خيميائية في صورة سائلة.
items.artifacts.alchemiststoolkit.desc_cursed=ارتبطت مجموعة الأدوات الملعونة بجانبك, وترفض السماح لك باستخدام الخيمياء.
items.artifacts.alchemiststoolkit.desc_warming=مجموعة الأدوات قيد التسخين حاليًا, وستكون جاهزة للاستخدام بعد قليل.
items.artifacts.alchemiststoolkit.desc_hint=تولد مجموعة الأدوات المجهزة طاقة خيميائية ببطء كلما اكتسبت خبرة. يبدو أن الخليط الموجود في القارورة يمكن تعزيزه بإضافة بلورات الطاقة إليه.

items.artifacts.artifact.cannot_wear_two=لا يمكنك ارتداء قطعتين من نفس الأداة الأثرية.
items.artifacts.artifact.cannot_wear_vault=سحر الخزنة يمنعك من استخدام تلك الأداة الأثرية الآن.
items.artifacts.artifact.equip_cursed=تربط الأداة الأثرية نفسها بك بشكل مؤلم.
items.artifacts.artifact.curse_known=يمكنك أن تشعر بسحر خبيث كامن داخل الأداة الأثرية.
items.artifacts.artifact.not_cursed=هذه الأداة الأثرية خالية من السحر الخبيث.
items.artifacts.artifact.need_to_equip=تحتاج إلى تجهيز أداتك الأثرية للقيام بذلك.

items.artifacts.capeofthorns.name=عباءة الأشواك
items.artifacts.capeofthorns.desc=تجمعت هذه الصفائح المعدنية المنهارة من DM-300 معًا لتشكل عباءة صلبة. يبدو أنها تخزن طاقة عميقة, ربما تمتلك بعضًا من قوة DM-300?
items.artifacts.capeofthorns.desc_inactive=تبدو العباءة ثقيلة بشكل مطمئن على كتفيك, ويبدو أنها تكتسب طاقة من الضرر الذي تتلقاه.
items.artifacts.capeofthorns.desc_active=يبدو أن العباءة تطلق الطاقة المخزنة, وهي تشع بقوة وقائية.
items.artifacts.capeofthorns$thorns.inert=أصبحت عباءتك خاملة مرة أخرى.
items.artifacts.capeofthorns$thorns.radiating=بدأت عباءتك تشع بالطاقة, تشعر بالحماية!
items.artifacts.capeofthorns$thorns.levelup=عباءتك تزداد قوة!
items.artifacts.capeofthorns$thorns.name=اشواك
items.artifacts.capeofthorns$thorns.desc=عباءتك تشع طاقة, وتحيط بك في مجال من القوة العاكسة!\n\nيتم تقليل جميع الأضرار التي تتلقاها أثناء تفعيل تأثير الأشواك. بالإضافة إلى ذلك, إذا كان المهاجم بجوارك, فإن مقدار الضرر المخفّض يُردّ إليه.\n\nعدد المنعطفات المتبقية من الأشواك: %s .

items.artifacts.chaliceofblood.name=كأس الدم
items.artifacts.chaliceofblood.ac_prick=وخز
items.artifacts.chaliceofblood.yes=نعم, أنا أعرف ما أفعله
items.artifacts.chaliceofblood.no=لا لقد غيرت راي
items.artifacts.chaliceofblood.prick_warn=في كل مرة تستخدم فيها الكأس, سيستنزف ذلك المزيد من طاقتك الحيوية, ولكنه سيعزز في المقابل تجديد صحتك الطبيعية.\n\nسيؤدي وخز نفسك حاليًا إلى التعامل مع _ %1$d - %2$d الضرر, على الرغم من إمكانية تقليل هذا الضرر عن طريق الحجب المادي والسحري أو تقليل الضرر. وبغض النظر عن تأثيرات تقليل الضرر, فإن وخز نفسك حاليًا له تأثير سلبي. %3$s %% فرصة لاستنزاف طاقتك الحيوية بالكامل.\n\nهل أنت متأكد من رغبتك في منح الكأس المزيد من طاقة الحياة?
items.artifacts.chaliceofblood.onprick=تخز نفسك, ويُستنزف جوهر حياتك في الكأس.
items.artifacts.chaliceofblood.ondeath=يمتص الكأس جوهر حياتك حتى الجفاف...
items.artifacts.chaliceofblood.desc=هذا الكأس الفضي اللامع مزين بشكل غريب بأحجار كريمة حادة عند الحافة.
items.artifacts.chaliceofblood.desc_cursed=ارتبط الكأس الملعون بيدك, وهو يعيق قدرتك على تجديد الصحة.
items.artifacts.chaliceofblood.desc_1=بينما تمسك بالكأس, تشعر برغبة غريبة تدفعك لوخز نفسك بالأحجار الكريمة الحادة.
items.artifacts.chaliceofblood.desc_2=يتجمع بعض دمك في الكأس, وتشعر بشكل خفي بأن الكأس يغذيك بطاقة الحياة, مما يعزز تجدد صحتك الطبيعية. ومع ذلك, ما زلت ترغب في جرح نفسك بالكأس, رغم علمك بأنه سيؤلمك.
items.artifacts.chaliceofblood.desc_3=الكأس ممتلئ حتى الحافة بجوهر حياتك. يمكنك أن تشعر بالكأس وهو يصب طاقة الحياة مرة أخرى في داخلك.

items.artifacts.cloakofshadows.name=عباءة الظلال
items.artifacts.cloakofshadows.ac_stealth=تخفي
items.artifacts.cloakofshadows.cooldown=تحتاج عباءتك إلى %d جولات أخرى لإعادة الشحن.
items.artifacts.cloakofshadows.cursed=لا يمكنك استخدام عباءة ملعونة.
