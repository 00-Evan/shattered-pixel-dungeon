items.artifacts.sandalsofnature.levelup=يزداد حجم حذائك بشكل مفاجئ!
items.artifacts.sandalsofnature.absorb_seed=يمتص الحذاء البذرة, ويبدو أكثر صحة.
items.artifacts.sandalsofnature.no_effect=يجب عليك إطعام بذرة لحذائك أولاً.
items.artifacts.sandalsofnature.low_charge=لا يمتلك حذاؤك طاقة كافية لذلك.
items.artifacts.sandalsofnature.prompt_target=اختر موقعًا
items.artifacts.sandalsofnature.out_of_range=هذا الموقع خارج النطاق.
items.artifacts.sandalsofnature.desc_1=ما يبدو في البداية وكأنه صنادل مصنوعة من الخيوط هما في الواقع نبتتان! تبدوان ضعيفتين وشاحبتين للغاية, ربما تحتاجان إلى العناصر الغذائية?
items.artifacts.sandalsofnature.desc_2=نما الحذاء وأصبح الآن يشبه حذاءين مفصلين. عاد إليهما بعض اللون, ربما لا يزال بإمكانهما النمو أكثر?
items.artifacts.sandalsofnature.desc_3=نمت النباتات مرة أخرى وأصبحت تشبه الآن زوجًا من الأحذية الصلبة المصنوعة من اللحاء. يبدو أن النباتات قد استعادت قوتها, ولكن ربما لا يزال بإمكانها النمو أكثر?
items.artifacts.sandalsofnature.desc_4=يبدو أن النباتات قد وصلت إلى أقصى حجم لها, وهي تشبه زوجًا من واقيات الساق المدرعة. الواقيات ذات لون بني غامق وتشبه شجرة متينة للغاية.
items.artifacts.sandalsofnature.desc_hint=تشعر بانسجام أكبر مع الطبيعة أثناء ارتداء هذه الأداة الأثرية.
items.artifacts.sandalsofnature.desc_cursed=تمنع الصنادل الملعونة أي انسجام مع الطبيعة.
items.artifacts.sandalsofnature.desc_ability=تتموج الأحذية بلون آخر بذرة زرعتها بها. يمكنها أن تتجذر لفترة وجيزة في الأرض وتُنتج تأثير تلك النبتة في أي مكان ضمن دائرة نصف قطرها 3 مربعات.\nالبذرة: _ %s _\nالشحن المطلوب: _ %d %% _
items.artifacts.sandalsofnature.desc_seeds=لقد أطعمت الحذاء %d بذور.

items.artifacts.skeletonkey.name=مفتاح الهيكل العظمي
items.artifacts.skeletonkey.ac_insert=إدخال
items.artifacts.skeletonkey.cursed=لا يمكنك استخدام مفتاح هيكل عظمي ملعون.
