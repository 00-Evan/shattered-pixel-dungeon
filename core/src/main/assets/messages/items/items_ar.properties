items.kingscrown.desc=تاج آخر ملوك الأقزام، يتوهج بطاقة سحرية هائلة.   عند ارتدائها، ستتدفق قوة التاج السحرية إلى الدرع الذي ترتديه حاليًا، محولة إياه إلى درع ملحمي فريد من نوعه يتمتع بقدرات خاصة. سيحتفظ الدرع الجديد بجميع خصائص الدرع الأصلي.
items.kingscrown.discover_hint=You can get this item as a drop from certain enemies.

items.liquidmetal.name=liquid metal
items.liquidmetal.ac_apply=تطبيق
items.liquidmetal.prompt=Select a thrown weapon
items.liquidmetal.already_fixed=That thrown weapon is already in perfect condition!
items.liquidmetal.apply=You use %d liquid metal to repair your thrown weapon.
items.liquidmetal.desc=هذا السائل السحري قادر على ملء الشقوق والتمزقات في الأسلحة المرمية، وإعادتها إلى حالتها الأصلية! حتى لو كانت مجموعة الأسلحة تفتقد سلاحًا ولكنها مُصلحة بالكامل، فيمكن استخدام المعدن السائل لاستبدال السلاح المفقود!   يتطلب إصلاح سلاح من المستوى 1 عشرة معادن سائلة، بينما يتطلب إصلاح سلاح من المستوى 5 ثلاثين معدنًا. كما تزيد كل ترقية كمية المعدن المطلوبة بنسبة 35%.   لا يمكن استخدام المعدن السائل لإصلاح رؤوس سهام السهام ذات الرؤوس المدببة.
items.liquidmetal.discover_hint=You can craft this item via alchemy.

