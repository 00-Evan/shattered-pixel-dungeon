items.rings.ringoffuror.upgrade_stat_name_1=تعزيز سرعة الهجوم
items.rings.ringoffuror.desc=يمنح هذا الخاتم مرتديه غضبًا داخليًا, مما يسمح له بالهجوم بسرعة أكبر. بدلاً من ذلك, سيبطئ الخاتم الملعون سرعة هجوم مرتديه.

