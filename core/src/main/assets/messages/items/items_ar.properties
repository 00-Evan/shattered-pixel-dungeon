items.artifacts.cloakofshadows$cloakstealth.desc=تمنحك عباءة الظلال خاصتك القدرة على الاختفاء طالما أنت مختبئٌ بها. وستبقى مختبئًا حتى يتم إلغاء تأثيرها أو حتى تنفد طاقة عباءتك.\n\nأثناء اختفاءك, لا يستطيع الأعداء مهاجمتك أو ملاحقتك. الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) ستلغي الاختفاء فورًا.\n\nيُدار حتى يتم شحن الاستخدام: %d .

