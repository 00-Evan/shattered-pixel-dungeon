items.rings.ringofsharpshooting.combined_stats=تدمج خواتمك المجهزة قوتها, مما يعزز المستوى الفعال للأسلحة المرمية بمقدار _%1$d_ ويزيد من متانتها بنسبة _%2$s%%_ في المجموع.
