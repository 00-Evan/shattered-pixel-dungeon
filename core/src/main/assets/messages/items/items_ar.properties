items.artifacts.driedrose$ghosthero.hello=مرحبًا مجددًا يا %s.
items.artifacts.driedrose$ghosthero.introduce=روحي مرتبطة بهذه الوردة, لقد كانت ثمينة جداً بالنسبة لي, هدية من حبيبي الذي تركته على السطح.\n\nلا أستطيع العودة إليه, ولكن بفضلك أتيحت لي فرصة ثانية لإكمال رحلتي. عندما أستطيع, سأستجيب لندائك وأقاتل معك.\n\nطالما أن لديك الوردة, يمكنني سماع صوتك, لذا يمكنك استخدامها لتوجيهي من بعيد.\n\nأتمنى أن تنجح حيث فشلت أنا

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=كانت هذه المجاري آمنة في السابق, حتى أن الناس كانوا يعيشون هنا في الشتاء.
