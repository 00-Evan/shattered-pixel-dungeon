items.wands.cursedwand.supernova=تبدأ كرة متوهجة من الطاقة في النمو. قد ترغب في الركض!
items.wands.cursedwand.supernova_positive=تبدأ كرة متوهجة من الطاقة في النمو, لكنها تبدو آمنة بطريقة ما.
items.wands.cursedwand.sinkhole=تبدأ الأرضية في الانهيار من حولك!
items.wands.cursedwand.sinkhole_positive=تبدأ الأرضية في الانهيار, ولكنها تبدو صلبة بما يكفي تحتك.
items.wands.cursedwand.gravity=تبدأ الجاذبية فجأة في السحب في اتجاهات عشوائية!
items.wands.cursedwand.gravity_positive=تبدأ الجاذبية فجأة في السحب في اتجاهات عشوائية, ولكن لا يبدو أن هذا يؤثر عليك.
items.wands.cursedwand.gravity_end=تنتهي فوضى الجاذبية.

