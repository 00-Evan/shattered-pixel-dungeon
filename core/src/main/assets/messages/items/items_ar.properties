items.artifacts.cloakofshadows.no_charge=Your cloak hasn't recharged enough to be usable yet.
items.artifacts.cloakofshadows.desc=عباءة سحرية لا تقدر بثمن، سرقها المحتال من مستودع الأسلحة الملكي منذ سنوات عديدة. عند ارتدائها، يمكن استخدامها للاختفاء تمامًا لفترة وجيزة.   كلما زاد استخدام العباءة، كلما أصبحت أقوى، مما يسمح للمحتال بأن يصبح غير مرئي بشكل متكرر ولفترات أطول.
items.artifacts.cloakofshadows.discover_hint=One of the heroes starts with this item.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Your cloak has run out of energy.
items.artifacts.cloakofshadows$cloakstealth.levelup=Your cloak grows stronger!
items.artifacts.cloakofshadows$cloakstealth.name=cloaked
items.artifacts.cloakofshadows$cloakstealth.desc=يمنحك عباءة الظلال خاصتك القدرة على الاختفاء طالما أنت مختبئٌ بها. وستبقى مختبئًا حتى يتم إلغاء تأثيرها أو حتى تنفد طاقة عباءتك.   أثناء اختفاءك، لا يستطيع الأعداء مهاجمتك أو ملاحقتك. الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) ستلغي الاختفاء فورًا.   يُدار حتى يتم شحن الاستخدام: %d .

