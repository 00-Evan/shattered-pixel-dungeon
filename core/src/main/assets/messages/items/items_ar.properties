items.rings.ringofforce.name=خاتم القوة
items.rings.ringofforce.stats=عندما تكون أعزل, بقوتك الحالية, سيلحق هذا الخاتم _%1$d-%2$d ضررًا._ مع تجهيز سلاح, سيزيد هذا الخاتم الضرر بمقدار _%3$d_.
items.rings.ringofforce.typical_stats=عندما تكون أعزل, بقوتك الحالية, عادةً ما سيلحق هذا الخاتم _%1$d-%2$d ضررًا._ مع تجهيز سلاح, عادةً ما سيزيد هذا الخاتم الضرر بمقدار _%3$d_.
items.rings.ringofforce.combined_stats=تعمل خواتمك المجهزة على دمج قوتها, فتلحق ما مجموعه _%1$d-%2$d ضررًا_ بدون سلاح, أو تزيد الضرر بمقدار _%3$d_ مع سلاح.
items.rings.ringofforce.upgrade_stat_name_1=ضرر الأعزل
items.rings.ringofforce.upgrade_stat_name_2=تعزيز ضرر المسلح
items.rings.ringofforce.upgrade_stat_name_3=ضرر القدرة
items.rings.ringofforce.ability_name=وضعية المشاكس
items.rings.ringofforce.typical_ability_desc=يمكن للمبارزة اتخاذ _وضعية المبارزة_ باستخدام هذا الخاتم, مما يجعل هجماتها العادية تستخدم هذا الخاتم دائمًا حتى مع تجهيز سلاح. عادةً ما تلحق هذه الهجمات _%1$d-%2$d ضررًا_ وتكتسب أيضًا سحر السلاح وتعزيزاته. كما أن هذا الوضع يبطئ سرعة إعادة شحن السلاح بنسبة 50%%.
items.rings.ringofforce.ability_desc=يمكن للمبارزة اتخاذ _وضعية المبارزة_ باستخدام هذا الخاتم, مما يجعل هجماتها العادية تستخدم هذا الخاتم دائمًا حتى مع تجهيز سلاح. تلحق هذه الهجمات _%1$d-%2$d ضررًا_ وتكتسب أيضًا سحر السلاح وتعزيزاته. كما أن هذا الوضع يبطئ سرعة إعادة شحن السلاح بنسبة 50%%.
items.rings.ringofforce.desc=يعزز هذا الخاتم قوة الهجمات الجسدية لمرتديه. تقل هذه القوة الإضافية عند استخدام الأسلحة أو رميها, لكنها تصبح أقوى بكثير عند الهجوم الأعزل. أما الخاتم الملعون فيضعف ضربات مرتديه
items.rings.ringofforce$brawlersstance.name=وضعية المشاكس
items.rings.ringofforce$brawlersstance.desc=في هذا الوضع, ستستخدم المبارزة خاتم القوة المُجهز في هجماتها العادية حتى لو كانت مجهزة بسلاح. تكتسب هذه الهجمات ضررًا إضافيًا وستظل تستخدم تعزيزات السلاح وسحره.\n\nلكن الحفاظ على هذا الوضع يتطلب تركيزًا, مما يقلل سرعة إعادة شحن قدرات السلاح بنسبة 50%.\n\nيمكن تفعيل هذا الوضع أو إيقافه باستخدام خاتم القوة, لكن انخفاض سرعة الشحن سيستمر لبرهة إذا تم تفعيل الوضع وإلغاؤه بسرعة.

items.rings.ringoffuror.name=خاتم الغضب
