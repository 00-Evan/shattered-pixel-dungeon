items.weapon.melee.flail.name=flail
items.weapon.melee.flail.stats_desc=This is a rather inaccurate weapon.\nThis weapon cannot surprise attack.
items.weapon.melee.flail.ability_name=يدور
items.weapon.melee.flail.spin_warn=You can't spin the flail any more.
items.weapon.melee.flail.typical_ability_desc= يستطيع المبارز تدوير المذبة لتجميع القوة لفترة وجيزة. في كل دور تُدار فيه المذبة، فإنها عادةً ما تُلحق ضررًا إضافيًا. %d يُلحق ضررًا في هجومه العادي التالي، بحد أقصى 3 مرات. كما أن استخدام المطرقة الدوارة يضمن إصابة الهدف. ويتطلب بدء تدوير المطرقة شحنة واحدة.
items.weapon.melee.flail.ability_desc=   يستطيع المبارز تدوير المذبة لتجميع القوة لفترة قصيرة. في كل دور تُدار فيه المذبة، ستُلحق ضررًا إضافيًا. %d يُلحق ضررًا في هجومه العادي التالي، بحد أقصى 3 مرات. كما أن استخدام المطرقة الدوارة يضمن إصابة الهدف. ويتطلب بدء تدوير المطرقة شحنة واحدة.
items.weapon.melee.flail.desc=A spiked ball attached to a handle by a length of chain. Very unwieldy, but devastating if it lands a solid hit.
items.weapon.melee.flail$spinabilitytracker.name=يدور
items.weapon.melee.flail$spinabilitytracker.desc=تُدير المبارزة سوطها، مُراكمةً الضرر لهجومها العادي التالي. كل دورة تستغرق دورًا واحدًا، لكنها تزيد الضرر، بحد أقصى ثلاث دورات. كما أن السوط مضمون الإصابة أثناء الدوران.   الدورات الحالية: %1$d %% .  عدد الأدوار المتبقية: %2$s .

items.weapon.melee.gauntlet.name=stone gauntlet
items.weapon.melee.gauntlet.stats_desc=This is a very fast weapon.
items.weapon.melee.gauntlet.ability_name=combo strike
items.weapon.melee.gauntlet.typical_ability_desc=يستطيع المبارز تنفيذ ضربة مركبة باستخدام قفاز حجري. هذه الضربة مضمونة الإصابة وعادةً ما تُلحق ضررًا إضافيًا. %d يُلحق المبارز ضررًا في كل مرة يصيب فيها خصمه بهجوم عادي من سلاح قريب أو سلاح مقذوف. عدم إصابة الخصم لمدة 5 أدوار (15 دورًا بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة.
items.weapon.melee.gauntlet.ability_desc=يستطيع المبارز تنفيذ ضربة مركبة باستخدام قفاز حجري. هذه الضربة مضمونة الإصابة وتُلحق ضررًا إضافيًا. %d يُلحق المبارز ضررًا في كل مرة يصيب فيها خصمه بهجوم عادي من سلاح قريب أو سلاح مقذوف. عدم إصابة الخصم لمدة 5 أدوار (15 دورًا بعد القضاء على الخصم) يُعيد ضبط هذه السلسلة
items.weapon.melee.gauntlet.desc=هذا القفاز الضخم مصنوع من قماش قرمزي اللون، ومُغطى بطبقات من الأحجار السحرية الثقيلة. يلتف القماش حولك بإحكام، مما يجعل ألواح الحجر السميكة أشبه بجلد ثانٍ. يتطلب استخدام هذا السلاح الثقيل قوةً هائلة، ولكنه يُضفي قوةً جبارةً على ضرباتك.

