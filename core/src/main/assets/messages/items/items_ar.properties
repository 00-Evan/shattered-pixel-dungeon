items.scrolls.scrolloflullaby.name=لفافة التهويدة
items.scrolls.scrolloflullaby.sooth=تطلق اللفافة لحنًا مهدئًا. تشعر بالنعاس الشديد.
items.scrolls.scrolloflullaby.desc=تطلق قراءة هذه اللفافة لحنًا مهدئًا يغرق كل من يسمعه في نوم سحري عميق. بالنسبة للقارئ وحلفائه يكون النوم مرممًا للصحة.

items.scrolls.scrollofmagicmapping.name=لفافة رسم الخرائط السحرية
items.scrolls.scrollofmagicmapping.layout=أصبحت الآن على دراية بتصميم الطابق.
items.scrolls.scrollofmagicmapping.desc=عند قراءة هذه المخطوطة, ستُحفر صورة فائقة الوضوح في ذاكرتك, تُنبهك إلى التصميم الدقيق للمستوى وتكشف لك جميع الأسرار الخفية. وستبقى مواقع العناصر والمخلوقات مجهولة.

items.scrolls.scrollofmirrorimage.name=لفافة الصورة المعكوسة
items.scrolls.scrollofmirrorimage.copies=تشكل اللفافة صورًا معكوسة لك.
items.scrolls.scrollofmirrorimage.no_copies=تحاول اللفافة إنشاء صور معكوسة لك, ولكن ليس لديها مكان تذهب إليه.
items.scrolls.scrollofmirrorimage.desc=ستخلق التعويذة المكتوبة على هذه اللفافة توأمين وهميين للقارئ. تعمل هذه الصور المتطابقة كنسخ أضعف من القارئ, وستطارد أعداءه. إلا أنها لا تتمتع بأي متانة, وستتلاشى عند تعرضها للضرر.

items.scrolls.scrollofretribution.name=لفافة القصاص
items.scrolls.scrollofretribution.blast=تتفجر طاقة سحرية قوية من اللفافة!
items.scrolls.scrollofretribution.desc=تحتوي هذه اللفافة على طاقة مدمرة تُحوّل معاناة قارئها إلى انفجار هائل من القوة. كلما كان القارئ أضعف, زاد الضرر الذي يُلحقه. عند انخفاض مستوى صحته إلى أدنى حد, تستطيع هذه اللفافة القضاء على معظم الأعداء فورًا.\n\nإلا أن استخدام المخطوطة يؤثر سلباً على المستخدم, إذ يُعميه ويُضعفه.

items.scrolls.scrollofrage.name=لفافة الغضب
items.scrolls.scrollofrage.roar=تطلق اللفافة زئيرًا مغضبًا يتردد صداه في جميع أنحاء الزنزانة!
items.scrolls.scrollofrage.desc=عند قراءتها بصوت عالٍ, ستطلق هذه اللفافة زئيرًا عظيمًا يجذب جميع الأعداء إلى القارئ, ويثير غضب القريبين منهم.

items.scrolls.scrollofrecharging.name=لفافة إعادة الشحن
items.scrolls.scrollofrecharging.surge=تتدفق موجة من الطاقة عبر جسدك, مما ينشط عصيك السحرية!
items.scrolls.scrollofrecharging.desc=ستقوم القوة السحرية الخام المقيدة في هذا الرق بشحن جميع عصي المستخدم السحرية بمرور الوقت عند إطلاقها.

items.scrolls.scrollofremovecurse.name=لفافة إزالة اللعنة
items.scrolls.scrollofremovecurse.inv_title=تطهير عنصر
items.scrolls.scrollofremovecurse.cleansed=يتوهج عنصرك بضوء مطهر, وتتبدد طاقة خبيثة!
items.scrolls.scrollofremovecurse.not_cleansed=يتوهج عنصرك بضوء مطهر, ولكن لا يحدث شيء.
items.scrolls.scrollofremovecurse.spirit=تحرر لفافاتك الروح المعذبة!
items.scrolls.scrollofremovecurse.desc=ستزيل التعويذة الموجودة على هذه اللفافة على الفور أي لعنات من سلاح واحد أو خاتم أو عصا أو درع أو أداة أثرية.

items.scrolls.scrollofteleportation.name=لفافة الانتقال الآني
items.scrolls.scrollofteleportation.tele=في غمضة عين تم نقلك آنيًا إلى موقع آخر في الطابق.
items.scrolls.scrollofteleportation.no_tele=فشل سحر الانتقال الآني.
items.scrolls.scrollofteleportation.cant_reach=لا يمكنك الانتقال آنيًا إلى هناك.
items.scrolls.scrollofteleportation.prompt=اختر موقعًا للانتقال الآني
items.scrolls.scrollofteleportation.desc=تنقل التعويذة المكتوبة على هذه الرقاقة قارئها فورًا إلى موقع مختلف في مستوى الزنزانة. تُعطي الرقاقة الأولوية للمناطق التي لم يزرها القارئ من قبل, مع أنها لا تستطيع الانتقال الفوري عبر الأبواب المغلقة أو الحواجز. لكنها تستطيع, مع ذلك, كشف أبواب مخفية تؤدي إلى مناطق جديدة

items.scrolls.scrollofterror.name=لفافة الرعب
items.scrolls.scrollofterror.none=تصدر اللفافة ومضة ساطعة من الضوء الأحمر.
items.scrolls.scrollofterror.one=تصدر اللفافة ومضة ساطعة من الضوء الأحمر ويهرب %s!
items.scrolls.scrollofterror.many=تصدر اللفافة ومضة ساطعة من الضوء الأحمر وتهرب الوحوش!
items.scrolls.scrollofterror.desc=عند قراءة هذه اللفافة, ستصدر ومضة ضوء أحمر تُصيب جميع الأعداء في مجال رؤيتك بالرعب, فيلتفتون هاربين. مهاجمة عدو هارب تُقلل من مدة تأثيرها

items.scrolls.scrolloftransmutation.name=لفافة التحويل
items.scrolls.scrolloftransmutation.inv_title=تحويل عنصر
items.scrolls.scrolloftransmutation.nothing=لا يحدث شيء مثير للاهتمام.
items.scrolls.scrolloftransmutation.morph=يتحول عنصرك إلى شيء مختلف!
items.scrolls.scrolloftransmutation.desc=تحتوي هذه اللفافة على سحر تحويل قوي. عند استخدامها على عنصر مؤهل, ستحوله إلى عنصر آخر من نفس النوع. سيحافظ السحر حتى على الترقيات والتعويذات والرموز. سيتم تحويل اللفائف والجرعات إلى نظيراتها النادرة, والعكس صحيح.

items.scrolls.scrollofupgrade.name=لفافة الترقية
items.scrolls.scrollofupgrade.inv_title=ترقية عنصر
items.scrolls.scrollofupgrade.weaken_curse=تضعف لفافة الترقية اللعنة الموجودة على عنصرك.
items.scrolls.scrollofupgrade.remove_curse=تطهر لفافة الترقية اللعنة الموجودة على عنصرك!
items.scrolls.scrollofupgrade.desc=ستُحسّن هذه اللفافة عنصرًا واحدًا أو مجموعة من الأسلحة المقذوفة. ستزداد قوة العصي وعدد شحناتها, وستُلحق الأسلحة والدروع ضررًا أكبر وتصدّه بشكل أفضل, وستُصلح مجموعات الأسلحة المقذوفة بالكامل وتصبح أكثر متانة, وستتعزز تأثيرات الخواتم.\n\nبل ويمكنه إضعاف اللعنات أو إزالتها تمامًا في بعض الأحيان, مع أنه ليس بقوة لفافة إزالة اللعنات. لسوء الحظ, قد يؤدي سحر الترقية أيضًا إلى محو التعويذات أو النقوش الموجودة على المعدات ذات المستوى الأعلى



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=لفافة KAUNAN نادرة
items.scrolls.exotic.exoticscroll.sowilo=لفافة SOWILO نادرة
items.scrolls.exotic.exoticscroll.laguz=لفافة LAGUZ نادرة
items.scrolls.exotic.exoticscroll.yngvi=لفافة YNGVI نادرة
items.scrolls.exotic.exoticscroll.gyfu=لفافة GYFU نادرة
items.scrolls.exotic.exoticscroll.raido=لفافة RAIDO نادرة
items.scrolls.exotic.exoticscroll.isaz=لفافة ISAZ نادرة
items.scrolls.exotic.exoticscroll.mannaz=لفافة MANNAZ نادرة
items.scrolls.exotic.exoticscroll.naudiz=لفافة NAUDIZ نادرة
items.scrolls.exotic.exoticscroll.berkanan=لفافة BERKANAN نادرة
items.scrolls.exotic.exoticscroll.odal=لفافة ODAL نادرة
items.scrolls.exotic.exoticscroll.tiwaz=لفافة TIWAZ نادرة
items.scrolls.exotic.exoticscroll.unknown_desc=رونة سحرية متوهجة غير قابلة لفك التشفير مكتوبة على هذا الرق الأسود. يبدو أنها غريبة عن هذه الأرض, من يدري ماذا ستفعل عند قراءتها بصوت عالٍ?
items.scrolls.exotic.exoticscroll.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.scrolls.exotic.scrollofsirenssong.name=لفافة أغنية السيرين
items.scrolls.exotic.scrollofsirenssong.prompt=اختر هدفًا
items.scrolls.exotic.scrollofsirenssong.no_target=تتفاعل اللفافة بدون هدف.
items.scrolls.exotic.scrollofsirenssong.cancel=يجب عليك اختيار هدف.
items.scrolls.exotic.scrollofsirenssong.desc=إن قراءة هذه المخطوطة تُصدر لحنًا ساحرًا يأسر العدو المستهدف, ويحوله إلى حليف بشكل دائم! أما الأعداء الآخرون الذين يسمعونه فسيُفتنون به مؤقتًا.\n\nيمكن للأعداء الأقوياء بشكل خاص مقاومة تأثير الإغواء, وسيتم سحرهم بدلاً من ذلك.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=مأسور
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=لقد سُحر هذا المخلوق بسحر لفافة أغنية السيرين.\n\nالشخصية المأسورة هي حليفتك بشكل دائم, وستقاتل أي أعداء تواجههم.

items.scrolls.exotic.scrollofantimagic.name=لفافة مضادة للسحر
items.scrolls.exotic.scrollofantimagic.desc=ستحيطك التعويذة المكتوبة على هذه اللفافة بهالة سحرية تحجب مؤقتًا جميع التأثيرات السحرية, سواءً كانت ضارة أم نافعة. يشمل ذلك معظم تأثيرات العناصر السحرية مثل العصي واللفائف والخواتم والتحف والتعاويذ واللعنات. مع ذلك, فإن قدرات الدروع البطولية قوية بما يكفي لتعمل بغض النظر عن ذلك.

items.scrolls.exotic.scrollofchallenge.name=لفافة التحدي
items.scrolls.exotic.scrollofchallenge.desc=عند قراءة هذه اللفافة بصوت عالٍ, ستنطلق زئير عظيم يجذب الأعداء إلى القارئ مع إنشاء ساحة صغيرة حوله في الوقت نفسه.\n\nطالما بقي القارئ في هذه الساحة, فسيتلقى ضررًا أقل بنسبة 33% من جميع المصادر (يتم تطبيق ذلك قبل أشكال تقليل الضرر الأخرى), ولن يفقد شعوره بالشبع.\n\nسيتناسب حجم الساحة مع حجم المنطقة التي يتواجد فيها القارئ. وستكون صغيرة بشكل خاص في بعض مناطق الزعماء.
items.scrolls.exotic.scrollofchallenge$challengearena.name=ساحة التحدي
items.scrolls.exotic.scrollofchallenge$challengearena.desc=لقد ظهرت ساحة سحرية من حولك, ويشير إليها ضباب أحمر كثيف.\n\nأثناء وقوفك في الضباب, لن يزداد جوعك وستتلقى ضررًا أقل بنسبة 33%% من جميع المصادر. إذا كان لديك أي مصادر أخرى لتقليل الضرر (مثل الدروع), فستُطبق بعد تخفيض الـ 33%%.\n\nعدد الأدوار المتبقية: %d.

items.scrolls.exotic.scrollofdivination.name=لفافة العرافة
items.scrolls.exotic.scrollofdivination.nothing_left=لم يتبق شيء لتحديد هويته!
items.scrolls.exotic.scrollofdivination.desc=ستحدد هذه اللفافة عشوائيًا أربعة أنواع من العناصر التي لا تعرفها حاليًا. قد تكون هذه الأنواع لون جرعة, أو نقشًا على لفافة, أو جوهرة خاتم. ليست بالضرورة العناصر التي تحملها معك
items.scrolls.exotic.scrollofdivination$wnddivination.desc=حددت لفافة العرافة الخاصة بك العناصر التالية:

items.scrolls.exotic.scrollofdread.name=لفافة الفزع
items.scrolls.exotic.scrollofdread.desc=عند قراءة هذه المخطوطة, ستصدر ومضة ضوء أحمر تُثير رعبًا شديدًا في قلوب جميع الأعداء في مجال رؤيتك. سيكون تأثيرها قويًا لدرجة أنهم سيحاولون الفرار بسرعة من الزنزانة بأكملها, ولن يُروا بعدها أبدًا!\n\nوكما هو الحال مع الإرهاب, يمكن أن يزول هذا التأثير بمرور الوقت, أو إذا تعرض العدو للهجوم.\n\nأما الأعداء ذوو الإرادة القوية, مثل الزعماء, فسوف يصابون بالرعب العادي بدلاً من ذلك.

items.scrolls.exotic.scrollofenchantment.name=لفافة التعويذ
items.scrolls.exotic.scrollofenchantment.inv_title=تعويذ عنصر
items.scrolls.exotic.scrollofenchantment.weapon=اختر تعويذة لتطبيقها على سلاحك.
items.scrolls.exotic.scrollofenchantment.armor=اختر نقشًا لتطبيقه على درعك.
items.scrolls.exotic.scrollofenchantment.cancel=الغاء
items.scrolls.exotic.scrollofenchantment.cancel_warn=سيظل الإلغاء يستهلك لفافة التعويذ الخاصة بك, هل أنت متأكد?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=اجل انا متاكد
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=لا لقد غيرت راي
items.scrolls.exotic.scrollofenchantment.desc=ستغرس هذه اللفافة طاقة سحرية قوية في سلاح أو درع. بل إن القارئ لديه درجة معينة من التحكم في السحر الذي يتم غرسه.

items.scrolls.exotic.scrollofforesight.name=لفافة البصيرة
items.scrolls.exotic.scrollofforesight.desc=بعد قراءة هذه المخطوطة, ستُعرض تفاصيل التضاريس المحيطة بوضوح تام في ذهن القارئ. يستمر هذا التأثير لفترة طويلة, ويكشف جميع الأبواب أو الفخاخ المخفية, مما يجعل البحث غير ضروري.

items.scrolls.exotic.scrollofmetamorphosis.name=لفافة التحول الشكلي
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=اختر موهبة لتحويلها.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=اختر موهبة جديدة لاستبدال موهبتك المتحولة بها.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=سيظل الإلغاء يستهلك لفافة التحول الشكلي الخاصة بك, هل أنت متأكد?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=تحويل الموهبة
items.scrolls.exotic.scrollofmetamorphosis.desc=تحتوي هذه اللفافة على سحر تحويل قوي, يُطبّق على المُلقي بدلاً من العنصر. يُمكّنك سحر هذه اللفافة من اختيار موهبة واحدة, واستبدالها بواحدة من خمس مواهب من نفس المستوى من فئات أبطال مختلفة!\n\nلا ينطبق هذا التأثير إلا على مواهب الفئة, وليس على المواهب المكتسبة من الفئات الفرعية أو قدرات الدروع. لن تُعرض لك المواهب التي لا يمكنك استخدامها كخيارات

items.scrolls.exotic.scrollofmysticalenergy.name=لفافة الطاقة الغامضة
items.scrolls.exotic.scrollofmysticalenergy.desc=ستقوم القوة السحرية الخام المقيدة في هذا الرق, عند إطلاقها, بشحن الأدوات الأثرية المجهزة للمستخدم بمرور الوقت.

items.scrolls.exotic.scrollofpassage.name=لفافة العبور
items.scrolls.exotic.scrollofpassage.desc=تنقل التعويذة الموجودة على هذا الرق القارئ على الفور إلى أقرب طابق أول للمنطقة فوقه. مفيدة جدًا للوصول السريع إلى المتجر.

items.scrolls.exotic.scrollofprismaticimage.name=لفافة الصورة المنشورية
items.scrolls.exotic.scrollofprismaticimage.desc=ستخلق التعويذة المكتوبة على هذه اللفافة نسخةً وهميةً ملونةً للقارئ. تعمل هذه الصورة المنشورية كنسخةٍ أضعف من القارئ, بدفاعٍ مماثل ولكن بنقاط صحةٍ وضررٍ أقل.\n\nستظهر الصورة المنشورية عند وجود الأعداء, وستحاول الدفاع عن القارئ.\n\nإذا كانت الصورة المنشورية موجودة بالفعل, فإن استخدام هذه اللفافة سيشفيها تمامًا

items.scrolls.exotic.scrollofpsionicblast.name=لفافة الانفجار الذهني
items.scrolls.exotic.scrollofpsionicblast.ondeath=يمزق الانفجار الذهني عقلك إربًا...
items.scrolls.exotic.scrollofpsionicblast.desc=تحتوي هذه اللفافة على طاقة تدميرية هائلة يمكن توجيهها لتدمير عقول جميع المخلوقات المرئية.\n\nمع ذلك, توجد ردود فعل قوية, وسيتعرض القارئ أيضًا للأذى والعمى والضعف. كلما زاد عدد الأهداف التي تصيبها المخطوطة, قلّ الضرر الذي سيلحق به.



###spells
items.spells.alchemize.name=خيمياء
items.spells.alchemize.prompt=خيمياء عنصر
items.spells.alchemize.desc=تحتوي هذه التعويذة على قوى تحويلية مشابهة لتلك الموجودة في وعاء الخيمياء. كل استخدام يسمح للمستخدم بتحويل عنصر (أو مجموعة عناصر) إلى ذهب أو طاقة خيميائية. بل إن تحويل الجرعات أو اللفائف إلى طاقة سيكشف عنها!\n\nتُباع بعض استخدامات Alchemize من المتاجر, ولكن يمكن صنع العديد منها باستخدام الخيمياء عن طريق الجمع بين بذرة وحجر رون وقليل من الطاقة الخيميائية.
items.spells.alchemize$wndalchemizeitem.sell=تحويل إلى %dg
items.spells.alchemize$wndalchemizeitem.sell_1=تحويل 1 إلى %dg
items.spells.alchemize$wndalchemizeitem.sell_all=تحويل الكل إلى %dg
items.spells.alchemize$wndalchemizeitem.energize=تحويل إلى %d طاقة
items.spells.alchemize$wndalchemizeitem.energize_1=تحويل 1 إلى %d طاقة
items.spells.alchemize$wndalchemizeitem.energize_all=تحويل الكل إلى %d طاقة

items.spells.beaconofreturning.name=منارة العودة
items.spells.beaconofreturning.preventing=الهالة السحرية القوية لهذا المكان تمنعك من استخدام التعويذة!
items.spells.beaconofreturning.creatures=الهالة النفسية للمخلوقات المجاورة لا تسمح لك بالانتقال الآني في هذه اللحظة.
items.spells.beaconofreturning.set=تم ضبط المنارة في موقعك الحالي.
items.spells.beaconofreturning.wnd_body=سيتجاوز الضبط الموقع الذي تم ضبط المنارة عليه مسبقًا.\n\nستعيدك العودة إلى آخر موقع تم ضبطه وتستهلك استخدامًا واحدًا للتعويذة.
items.spells.beaconofreturning.wnd_set=وضع
items.spells.beaconofreturning.wnd_return=عوده
items.spells.beaconofreturning.desc_set=تم ضبط هذه المنارة في مكان ما في الطابق %d.
items.spells.beaconofreturning.desc=تمنح هذه التعويذة المعقدة المستخدم القدرة على العودة إلى موقع محدد, بغض النظر عن المسافة. لا تُستهلك التعويذة إلا بالعودة, ويمكن تفعيلها عدة مرات كما تشاء, ولكنها ستتذكر فقط آخر موقع تم ضبطها عليه.

items.spells.curseinfusion.name=حقن اللعنة
items.spells.curseinfusion.inv_title=لعن عنصر
items.spells.curseinfusion.desc=تُضفي هذه التعويذة على قطعة من المعدات نفس السحر الخبيث القوي الموجود في DM-300. ستُلعن القطعة التي تُستخدم عليها على الفور, وسيتم استبدال أي سحر أو نقش كان موجودًا عليها.\n\nفي حالة الأسلحة والدروع والعصي السحرية, ستكتسب هذه العناصر ترقيات بالإضافة إلى كونها ملعونة. لا تتراكم ترقيات اللعنة, وتُفقد هذه الترقيات إذا زالت اللعنة عن العنصر.\n\nيمكن أيضًا استخدام عمليات حقن اللعنات المتعددة لتغيير اللعنة الموجودة على السلاح أو الدرع

items.spells.spell.ac_cast=القاء
items.spells.spell.no_magic=لا يمكنك إلقاء التعاويذ بينما أنت محصن ضد السحر.
items.spells.spell.discover_hint=يمكنك صنع هذا العنصر عن طريق الخيمياء.

items.spells.magicalinfusion.name=حقن سحري
items.spells.magicalinfusion.inv_title=حقن عنصر
items.spells.magicalinfusion.infuse=تم حقن عنصرك بالطاقة الغامضة!
items.spells.magicalinfusion.desc=تمتلك هذه التعويذة نفس القوة السحرية للفافة الترقية, ولكن في شكل أكثر استقرارًا.\n\nبالإضافة إلى ترقية العنصر كالمعتاد, فإنها لن تمحو أبدًا تعويذة أو نقشًا أو لعنة.

items.spells.magicalporter.name=ناقل سحري
items.spells.magicalporter.inv_title=نقل عنصر
items.spells.magicalporter.nowhere=لا يوجد مكان لنقل العنصر إليه.
items.spells.magicalporter.desc=ستنقل هذه التعويذة بطريقة سحرية أي عنصر تُلقى عليه. على عكس منارة التاجر, سيتم نقل العناصر إلى مدخل طابق الزعيم التالي.

items.spells.phaseshift.name=تحول الطور
items.spells.phaseshift.no_target=لا يوجد شيء للانتقال الآني إليه هناك.
items.spells.phaseshift.desc=ستنقل هذه التعويذة الفوضوية أي شخصية تُستهدف إلى موقع عشوائي في الطابق الحالي, وتُصيبها بالذهول لفترة طويلة. يستطيع الأعداء الأقوياء مقاومة تأثير الذهول. يمكن توجيه هذه التعويذة إلى هدف أو إلى المستخدم نفسه.

items.spells.reclaimtrap.name=استعادة الفخ
items.spells.reclaimtrap.no_trap=لا يوجد فخ هناك.
items.spells.reclaimtrap.desc_trap=التعويذة جاهزة حاليًا لتفعيل _%s._
items.spells.reclaimtrap.desc=تحتوي هذه التعويذة على بقايا الطاقة الميكانيكية لـ DM-300. عند إلقائها على فخ نشط, ستلتصق قوة الفخ بك, مما يسمح لك باستخدام التعويذة مرة أخرى لطرد هذه القوة وتفعيل تأثير الفخ في أي مكان تريده.\n\nومع ذلك, قد لا تعمل بعض المصائد في جميع الأماكن, ولا يمكن تخزين سوى مصيدة واحدة في كل مرة.

items.spells.recycle.name=إعادة تدوير
items.spells.recycle.inv_title=إعادة تدوير عنصر
items.spells.recycle.recycled=تمت إعادة تدوير عنصرك إلى: %s.
items.spells.recycle.desc=تحتوي هذه التعويذة على شكل أقل من سحر التحويل. بينما لن تعمل على المعدات, ستحول هذه التعويذة لفافة أو جرعة أو بذرة أو حجر رون أو سهمًا ذا رأس مدبب إلى عنصر عشوائي من نفس النوع.

items.spells.summonelemental.name=استدعاء عنصري
items.spells.summonelemental.ac_imbue=تشبيع
items.spells.summonelemental.imbue_prompt=تشبيع عنصر
items.spells.summonelemental.desc=تستغل هذه التعويذة طاقة الجمرات العنصرية المستخدمة في صنعها, وتتيح لك استدعاء عنصر حليف ليقاتل إلى جانبك! لا يمكن استدعاء سوى عنصر واحد في كل مرة, ولكن يمكن إعادة إلقاء التعويذة لإعادة العنصر إليك مجانًا
items.spells.summonelemental.desc_newborn=التعويذة غير مُفعّلة حاليًا, وستستدعي عنصرًا جديدًا دون هجوم بعيد المدى. يمكنك تفعيلها باستخدام جرعة مُحددة من اللهب السائل, أو جرعة الصقيع, أو لفافة إعادة الشحن, أو لفافة التحويل, لزيادة قوة التعويذة, مما يجعل الاستدعاءات اللاحقة عناصر كاملة القوة!
items.spells.summonelemental.desc_fire=التعويذة ساخنة الملمس حاليًا, وستستدعي _عنصري نار_. يمكنك تشبيع عنصر مختلف, ولكن ستفقد التعويذة تشبيعها الحالي.
items.spells.summonelemental.desc_frost=التعويذة باردة الملمس حاليًا, وستستدعي _عنصري صقيع_. يمكنك تشبيع عنصر مختلف, ولكن ستفقد التعويذة تشبيعها الحالي.
items.spells.summonelemental.desc_shock=التعويذة تشع حاليًا بطاقة ساكنة, وستستدعي _عنصري صدمة_. يمكنك تشبيع عنصر مختلف, ولكن ستفقد التعويذة تشبيعها الحالي.
items.spells.summonelemental.desc_chaos=التعويذة تشع حاليًا بطاقة فوضوية, وستستدعي _عنصري فوضى_. يمكنك تشبيع عنصر مختلف, ولكن ستفقد التعويذة تشبيعها الحالي.

items.spells.targetedspell.prompt=اختر هدفًا
items.spells.targetedspell.inv_title=تشبيع عنصر

items.spells.telekineticgrab.name=التقاط تحريكي ذهني
items.spells.telekineticgrab.cant_grab=لا يمكنك التقاط ذلك.
items.spells.telekineticgrab.no_target=لا يوجد شيء لالتقاطه هناك.
items.spells.telekineticgrab.desc=تسمح هذه التعويذة لملقيها بالتقاط جميع العناصر الموجودة في موقع ما عن بعد, أو جميع الأسلحة المرمية العالقة بالعدو!\n\nلا يمكن استخدامه للاستيلاء على العناصر التي يملكها شخص آخر, أو للاستيلاء على الحاويات مثل الصناديق

items.spells.unstablespell.name=تعويذة غير مستقرة
items.spells.unstablespell.desc=تحتوي هذه البلورة المربعة السوداء الصغيرة على رموز رونية متغيرة على كل سطح من أسطحها.\n\nعند تفعيلها, ستُفعّل تأثير لفافة عشوائية. سيكون تأثير اللفافة مُركّزًا على القتال دائمًا إذا كان هناك أعداء في مجال رؤيتك, وسيكون غير مُركّز على القتال في غير ذلك.

items.spells.wildenergy.name=طاقة جامحة
items.spells.wildenergy.desc=تحتوي هذه التعويذة على بعض الطاقة الملعونة التي كانت تُشغّل DM-300. عند إلقائها, ستُعيد شحن عصيك السحرية وقطعك الأثرية البالية, مع إطلاق تأثير عشوائي للعصا الملعونة. يمكنك اختيار اتجاه هذه الطاقة السحرية الملعونة.


###runestones
items.stones.inventorystone.ac_use=استخدام

items.stones.runestone$placeholder.name=حجر رون
items.stones.runestone.discover_hint=يمكنك العثور على هذا العنصر عشوائيًا في الزنزانة, أو صنعه عن طريق الخيمياء.

items.stones.stoneofaggression.name=حجر العدوان
items.stones.stoneofaggression.desc=عندما يتم إلقاء هذا الحجر على حليف أو عدو, فإن جميع الأعداء القريبين سيفضلون مهاجمة تلك الشخصية لفترة قصيرة.\n\nلا يمكن استهداف الأعداء الرئيسيين بهذا التأثير بشكل مباشر, ولكنه يعمل على أتباعهم.
items.stones.stoneofaggression$aggression.name=مستهدف
items.stones.stoneofaggression$aggression.desc=يجعل السحر التلاعبي جميع الأعداء القريبين يفضلون مهاجمة هذه الشخصية.\n\nالأدوار المتبقية: %s.

items.stones.stoneofaugmentation.name=حجر التعزيز
items.stones.stoneofaugmentation.inv_title=تعزيز عنصر
items.stones.stoneofaugmentation.desc=يمتلك هذا الحجر الروني سحراً قوياً يمكنه تعزيز المعدات لتحسين خاصية واحدة على حساب خاصية أخرى.\n\nاستخدام هذه الميزة على السلاح سيُمكّنك من تحسين سرعته أو قوته. كما أن متانة الأسلحة التي تُرمى ستزداد أو تنقص تبعًا لسرعتها.\n\nسيسمح لك استخدامها على الدروع بتحسين الدفاع أو المراوغة.
items.stones.stoneofaugmentation.discover_hint=يمكنك شراء هذا العنصر من المتجر, أو صنعه عن طريق الخيمياء.
items.stones.stoneofaugmentation$wndaugment.choice=التعزيز لخاصية واحدة سيقلل من الأخرى. ما الخاصية التي ترغب في تحسينها?
items.stones.stoneofaugmentation$wndaugment.already=هذا العنصر معزز بالفعل, يمكنك تبديل التعزيز أو إزالته.
items.stones.stoneofaugmentation$wndaugment.speed=+سرعة -ضرر
items.stones.stoneofaugmentation$wndaugment.damage=+ضرر -سرعة
items.stones.stoneofaugmentation$wndaugment.evasion=+تفادي -دفاع
items.stones.stoneofaugmentation$wndaugment.defense=+دفاع -تفادي
items.stones.stoneofaugmentation$wndaugment.none=إزالة التعزيز
items.stones.stoneofaugmentation$wndaugment.cancel=لا يهم

items.stones.stoneofblast.name=حجر الانفجار
items.stones.stoneofblast.desc=سينفجر حجر الرون هذا على الفور في الموقع الذي يُرمى إليه. تمامًا مثل القنبلة, سيلحق الانفجار ضررًا بأي شيء قريب.

items.stones.stoneofblink.name=حجر الوميض
items.stones.stoneofblink.desc=سينقل حجر الرون هذا المستخدم آنيًا إلى الموقع الذي يُرمى إليه.

items.stones.stoneofclairvoyance.name=حجر الاستبصار
items.stones.stoneofclairvoyance.desc=سيكشف هذا الحجر على الفور عن جميع البلاطات في مساحة واسعة جدًا حول المكان الذي يُرمى فيه. سيصل تأثيره حتى عبر الجدران.

items.stones.stoneofdeepsleep.name=حجر النوم العميق
items.stones.stoneofdeepsleep.desc=عندما يُرمى هذا الحجر على عدو, سيُدخله في نوم سحري عميق. سينام الأعداء المنومون سحريًا إلى الأبد حتى يتم إزعاجهم.

items.stones.stoneofdetectmagic.name=حجر كشف السحر
items.stones.stoneofdetectmagic.inv_title=كشف عنصر
items.stones.stoneofdetectmagic.detected_none=لا تكتشف أي سحر يؤثر على هذا العنصر.
items.stones.stoneofdetectmagic.detected_both=تكتشف كلاً من السحر الإيجابي والخبيث الذي يؤثر على هذا العنصر!
items.stones.stoneofdetectmagic.detected_good=تكتشف سحرًا إيجابيًا يؤثر على هذا العنصر!
items.stones.stoneofdetectmagic.detected_bad=تكتشف سحرًا خبيثًا يؤثر على هذا العنصر!
items.stones.stoneofdetectmagic.desc=يستطيع هذا الحجر الروني كشف السحر المؤثر على أي عنصر. باستخدام هذا الحجر على عنصر غير معروف, ستعرف ما إذا كان متأثرًا بلعنة خبيثة, وما إذا كان متأثرًا بسحر إيجابي كالسحر أو التحسينات.

items.stones.stoneofdisarming.name=حجر نزع السلاح
items.stones.stoneofdisarming.desc=يحمل حجر الرون هذا سحرًا يمكنه تعطيل الفخاخ الخبيثة المخفية في جميع أنحاء الزنزانة. سيعطل ما يصل إلى 9 فخاخ حول المنطقة التي يُرمى إليها.

items.stones.stoneofenchantment.name=حجر التعويذ
items.stones.stoneofenchantment.inv_title=تعويذ عنصر
items.stones.stoneofenchantment.weapon=يتوهج سلاحك في الظلام!
items.stones.stoneofenchantment.armor=يتوهج درعك في الظلام!
items.stones.stoneofenchantment.desc=يمتلك هذا الحجر الروني سحرًا آسرًا. على عكس لفافة الترقية, فهو لا يزيد من القوة المباشرة للعنصر, بل يمنح السلاح أو الدرع سحرًا, مما يمنحه قوة جديدة

items.stones.stoneoffear.name=حجر الخوف
items.stones.stoneoffear.desc=عندما يُرمى هذا الحجر على شخصية ما, سيغمرها الرعب, وستستدير وتهرب. مهاجمة شخصية هاربة ستقصر من مدة التأثير.

items.stones.stoneofflock.name=حجر القطيع
items.stones.stoneofflock.desc=يستدعي حجر الرون هذا أغنامًا سحرية لفترة قصيرة حول الموقع الذي يُرمى إليه.

items.stones.stoneofintuition.name=حجر الحدس
items.stones.stoneofintuition.inv_title=اختر عنصر
items.stones.stoneofintuition.desc=يحمل هذا الحجر الروني نسخةً أضعف من السحر الموجود في لفائف التعريف. فبدلاً من تحديد هوية الشيء مباشرةً, سيعتمد على حدسك, مما يسمح لك بمحاولة تحديد نوع جرعة أو لفافة أو خاتم عن طريق التخمين.
items.stones.stoneofintuition.break_info=يمكنك استخدام أحجار الحدس مرتين قبل أن ينكسر واحد, _استخدامك التالي لن يستهلك حجرًا_.
items.stones.stoneofintuition.break_warn=لقد استخدمت حجر الحدس مسبقًا, لذا _سيستهلك استخدامك التالي حجرًا_.
items.stones.stoneofintuition$wndguess.text=خمّن ما هو نوع العنصر غير المعروف. إذا خمنت بشكل صحيح, فسيتم تحديد نوع العنصر!
items.stones.stoneofintuition$wndguess.correct=صحيح. تم تحديد نوع العنصر!
items.stones.stoneofintuition$wndguess.incorrect=كان تخمينك غير صحيح.
items.stones.stoneofintuition$wndguess.break=يتفتت حجر الحدس الخاص بك إلى غبار...

items.stones.stoneofshock.name=حجر الصدمة
items.stones.stoneofshock.desc=يطلق حجر الرون هذا انفجارًا من الطاقة الكهربائية يصعق جميع الأهداف القريبة لفترة وجيزة, ويمنح الرامي شحنة عصا لكل هدف يتم إصابته.


###trinkets
items.trinkets.chaoticcenser.name=مبخرة فوضوية
items.trinkets.chaoticcenser.spew=مبخرتك على وشك أن تنفث: %s.
items.trinkets.chaoticcenser.desc=بعد مرور بعض الوقت في وعاء الخيمياء, يبدو أن هذه المبخرة تُصدر دخانًا من تلقاء نفسها! تتراكم هذه الغازات وتندفع من المبخرة باتجاه الأعداء على فترات شبه عشوائية. يبدو أنها قادرة على إنتاج جميع أنواع الغازات, ولكن ستتلقى تحذيرًا قبل لحظات من تفعيلها.
items.trinkets.chaoticcenser.typical_stats_desc=عادةً ما تولد هذه الزينة غازًا ضارًا بالقرب من عدو كل _%d_ أدوار تقريبًا. لن تظهر الغازات إلا عند وجود أعداء. في المستويات الأعلى, من المرجح أن تكون هذه الغازات نادرة وقوية.
items.trinkets.chaoticcenser.stats_desc=في مستواها الحالي, ستطلق هذه الزينة غازًا ضارًا بالقرب من العدو كل _ تقريبًا %d _ دورات. لن تظهر الغازات إلا عند وجود الأعداء. في المستويات الأعلى, من المرجح أن تكون هذه الغازات غريبة وقوية.

items.trinkets.crackedspyglass.name=منظار مشروخ
items.trinkets.crackedspyglass.desc=كان هذا التلسكوب اليدوي ليُظهر براعة فائقة ودقة متناهية في الصنع, لولا وجود شرخ على طول عدسته الأمامية. يبدو أن المنظار يساعدك في الكشف عن عناصر جديدة في الزنزانة, ولكن بسبب عيبه, يصعب رؤية هذه العناصر بوضوح!
items.trinkets.crackedspyglass.typical_stats_desc=عادةً ما تمتلك هذه الزينة _فرصة %1$s%%_ لإنشاء عنصر مخفي إضافي في كل طابق لا يحتوي على زعيم.
items.trinkets.crackedspyglass.stats_desc=في مستواها الحالي, تمتلك هذه الزينة _فرصة %1$s%%_ لإنشاء عنصر مخفي إضافي في كل طابق لا يحتوي على زعيم.
items.trinkets.crackedspyglass.stats_desc_upgraded=في مستواها الحالي, تمتلك هذه الزينة _فرصة 100%%_ لإنشاء عنصر مخفي إضافي في كل طابق لا يحتوي على زعيم, و _فرصة %1$s%%_ لإنشاء عنصر مخفي إضافي ثانٍ.

items.trinkets.dimensionalsundial.name=مزولة شمسية بُعدية
items.trinkets.dimensionalsundial.warning=لا تلقي مزولتك الشمسية بظلها, تشعر بعدم الارتياح.
items.trinkets.dimensionalsundial.desc=تستطيع هذه الساعة الشمسية الصغيرة المحمولة باليد, بطريقة ما, أن تُلقي بظلالها في أعماق الزنزانة, حتى لو لم تكن في وضع مستقيم. والأغرب من ذلك, أن موضع الظل لا يبدو مرتبطًا بالشمس في هذا العالم. وعندما لا تُلقي الساعة بظلالها, يبدو أنها تجذب الخطر.
items.trinkets.dimensionalsundial.typical_stats_desc=عادةً ما تقلل هذه الزينة من معدل ظهور الأعداء بنسبة _%1$d%%_ خلال النهار في الحياة الواقعية (8 صباحًا - 8 مساءً), وتزيد من معدل ظهور الأعداء بنسبة _%2$d%%_ في الليل (8 مساءً - 8 صباحًا).
items.trinkets.dimensionalsundial.stats_desc=في مستواها الحالي, ستقلل هذه الزينة من معدل ظهور الأعداء بنسبة _%1$d%%_ خلال النهار في الحياة الواقعية (8 صباحًا - 8 مساءً), وتزيد من معدل ظهور الأعداء بنسبة _%2$d%%_ في الليل (8 مساءً - 8 صباحًا).

items.trinkets.exoticcrystals.name=بلورات نادرة
items.trinkets.exoticcrystals.desc=تتمتع هذه البلورات الوردية الصغيرة بنفس شكل بلورات الطاقة الخيميائية. بينما لا يمكن استخدامها للطاقة مباشرة, يبدو أنها تؤثر بطريقة ما على الجرعات واللفائف التي تجدها.
items.trinkets.exoticcrystals.typical_stats_desc=عادةً ما تستبدل هذه الزينة _%s%%_ من إسقاطات الجرعات أو اللفائف بنظائرها الغريبة. لا يؤثر ذلك على جرعات القوة أو لفائف الترقية أو العناصر المولَّدة للمساعدة في حل غرف المخاطر.
items.trinkets.exoticcrystals.stats_desc=بمستواها الحالي, تستبدل هذه الزينة _%s%%_ من إسقاطات الجرعات أو اللفائف بنظائرها الغريبة. لا يؤثر ذلك على جرعات القوة أو لفائف الترقية أو العناصر المولَّدة للمساعدة في حل غرف المخاطر.

items.trinkets.eyeofnewt.name=عين السمندل
items.trinkets.eyeofnewt.desc=عين السمندل الذهبية والسوداء هذه هي مكون شائع, تم تعزيزها الآن لتصبح زينة. يبدو أن العين تقلل من رؤيتك مقابل السماح لك برؤية الأشياء بطرق أخرى.
items.trinkets.eyeofnewt.typical_stats_desc=عادةً ما تقلل هذه الزينة من مدى رؤيتك بنسبة _%1$s%%_, ولكنها ستمنحك أيضًا رؤية ذهنية للأعداء ضمن _%2$d_ مربعات.
items.trinkets.eyeofnewt.stats_desc=في مستواها الحالي, ستقلل هذه الزينة من مدى رؤيتك بنسبة _%1$s%%_, ولكنها ستمنحك أيضًا رؤية ذهنية للأعداء ضمن _%2$d_ مربعات.

items.trinkets.ferrettuft.name=خصلة ابن عرس
items.trinkets.ferrettuft.desc=خصلة من فرو ابن عرس أبيض ناعم كالحرير, مربوطة بشريط أخضر ليموني على شكل فيونكة. تُعرف حيوانات ابن عرس بخفة حركتها, وشقاوتها, وعدم التزامها بالقواعد. ويبدو أن بعضًا من هذه القوة ينبعث من هذه الزينة, مما يُعزز قدرتها على التخفي من أي شيء قريب.
items.trinkets.ferrettuft.typical_stats_desc=عادةً ما تزيد هذه الزينة من تفادي جميع الشخصيات بنسبة _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=في مستواها الحالي, ستزيد هذه الزينة من تفادي جميع الشخصيات بنسبة _%1$s%%_.

items.trinkets.mimictooth.name=سن المقلد
items.trinkets.mimictooth.desc=لا بد أن هذا السن الحاد الكبير قد انتُزع من مقلد غير سعيد للغاية. يبدو أنه يؤثر على المقلدين في الزنزانة, مما يجعلهم أكثر تكرارًا وخطورة.
items.trinkets.mimictooth.typical_stats_desc=عادةً ما تقوم هذه الزينة بتقليد جميع أنواع %1$s x_ أكثر شيوعًا وأصعب بكثير في اكتشافها, لكنها ستزيد أيضًا من كمية الغنائم التي تسقطها. سيحتوي كل طابق من طابق الزنزانة أيضًا على _ %2$s %% فرصة لاحتواء تقليد إضافي متخفٍ من خشب الأبنوس.
items.trinkets.mimictooth.stats_desc=بمستواها الحالي, ستُقلّد هذه الحُلي جميع أنواع _ %1$s x_ أكثر شيوعًا وأصعب بكثير في اكتشافها, لكنها ستزيد أيضًا من كمية الغنائم التي تسقطها. سيحتوي كل طابق من طابق الزنزانة أيضًا على _ %2$s %% فرصة لاحتواء تقليد إضافي متخفٍ من خشب الأبنوس.

items.trinkets.mossyclump.name=كتلة طحلبية
items.trinkets.mossyclump.desc=يبدو أن هذه الكتلة من الطحلب الرطب تحتفظ برطوبتها مهما ضغطت عليها بقوة. يبدو أنها مرتبطة سحريًا بالزنزانة نفسها, مما يزيد من احتمالية ظهور العشب والماء.
items.trinkets.mossyclump.typical_stats_desc=عادةً ما تجعل هذه الزينة _%d%%_ من الطوابق غير ذات الطابع المحدد مليئة إما بالماء أو العشب بدلاً من ذلك.\n\nتكلف هذه الزينة كمية أكبر من الطاقة لترقيتها.
items.trinkets.mossyclump.stats_desc=في مستواها الحالي, ستجعل هذه الزينة _%d%%_ من الطوابق غير ذات الطابع المحدد مليئة إما بالماء أو العشب بدلاً من ذلك.\n\nتكلف هذه الزينة كمية أكبر من الطاقة لترقيتها.

items.trinkets.parchmentscrap.name=قصاصة رق
items.trinkets.parchmentscrap.desc=تبدو قصاصة الرق الصغيرة هذه وكأنها جاءت من لفافة. لقد احتفظت ببعض من سحرها, ويبدو أنها تؤثر على الأسلحة والدروع الموجودة في الزنزانة.
items.trinkets.parchmentscrap.typical_stats_desc=عادةً ما تقوم هذه الزينة بصنع التعويذات والرموز _ %d x_ شائع, واللعنات على الأسلحة والدروع _ %s x_ شائع. لا تتأثر اللعنات الموجودة على العصي أو الخواتم أو القطع الأثرية.\n\nتتطلب هذه الزينة كمية أكبر من الطاقة لترقيتها.
items.trinkets.parchmentscrap.stats_desc=بمستواها الحالي, ستصنع هذه الزينة تعويذات ورموزًا _ %d x_ شائع, واللعنات على الأسلحة والدروع _ %s x_ شائع. لا تتأثر اللعنات الموجودة على العصي أو الخواتم أو القطع الأثرية.\n\nتتطلب هذه الزينة كمية أكبر من الطاقة لترقيتها.

items.trinkets.petrifiedseed.name=بذرة متحجرة
items.trinkets.petrifiedseed.desc=تحجرت هذه البذرة, إما عن طريق العمليات الجيولوجية البطيئة أو عن طريق السحر. يبدو أن البذرة تؤثر سحريًا على نباتات الزنزانة, وتستبدل أحيانًا بذور النباتات بأحجار الرون.
items.trinkets.petrifiedseed.typical_stats_desc=عادةً ما تتسبب هذه الزينة في إسقاط العشب المدوس لأحجار الرون بدلاً من البذور _%1$s%%_ من الوقت, وستتسبب أيضًا في إسقاط العشب الطويل للعناصر _%2$s%%_ في كثير من الأحيان.
items.trinkets.petrifiedseed.stats_desc=في مستواها الحالي, ستتسبب هذه الزينة في إسقاط العشب المدوس لأحجار الرون بدلاً من البذور _%1$s%%_ من الوقت, وستتسبب أيضًا في إسقاط العشب الطويل للعناصر _%2$s%%_ في كثير من الأحيان.

items.trinkets.ratskull.name=جمجمة فأر
items.trinkets.ratskull.desc=هذه الحُليّ المُرعبة ليست أكبر بكثير من جمجمة فأر عادي, وهو أمر نادر في هذا الزنزانة. ويبدو أن التأثير السحري للجمجمة يجذب سكان الزنزانة النادرين, مما يجعلهم يظهرون بشكل متكرر.
items.trinkets.ratskull.typical_stats_desc=عادةً ما تجعل هذه الزينة الأعداء النادرين _%dx_ أكثر عرضة للظهور. ومع ذلك, فإن الجمجمة فعالة بنسبة النصف فقط في جذب المقلدين البلوريين والتماثيل المدرعة.
items.trinkets.ratskull.stats_desc=في مستواها الحالي, ستجعل هذه الزينة الأعداء النادرين _%dx_ أكثر عرضة للظهور. ومع ذلك, فإن الجمجمة فعالة بنسبة النصف فقط في جذب المقلدين البلوريين والتماثيل المدرعة.

items.trinkets.saltcube.name=مكعب ملح
items.trinkets.saltcube.desc=قُطّع هذا البلور الملحي الكبير إلى شكل مكعب شبه مثالي, وبطريقة ما, استطاع أن يسحب نصف الماء من وعاء الخيمياء بدلاً من أن يذوب. يبدو أنه يُجفف الطعام ويحفظه بطريقة سحرية, مما يُطيل الشعور بالشبع, ولكنه في الوقت نفسه يُقلل من استعادة الصحة عند عدم الشعور بالجوع الشديد.
items.trinkets.saltcube.typical_stats_desc=عادةً ما تزيد هذه الزينة من مقدار الوقت قبل أن تشعر بالجوع بنسبة _%1$s%%_, ولكنها ستقلل أيضًا من معدل تجديد صحتك بنسبة _%2$s%%_ ما لم يكن الطابق مقفلاً.
items.trinkets.saltcube.stats_desc=في مستواها الحالي, ستزيد هذه الزينة من مقدار الوقت قبل أن تشعر بالجوع بنسبة _%1$s%%_, ولكنها ستقلل أيضًا من معدل تجديد صحتك بنسبة _%2$s%%_ ما لم يكن الطابق مقفلاً.

items.trinkets.shardofoblivion.name=شظية النسيان
items.trinkets.shardofoblivion.desc=بعد أن نضجت هذه الشظية الصغيرة من المعدن الملعون في قدر الخيمياء, تحولت إلى... لا شيء? يبدو أن الضوء ينحني حولها, وتحوم في مكانها عندما لا تمسكها. يبدو أن الشظية تستمد قوتها بطريقة سحرية من جهلك, لذا من الأفضل ألا تفكر فيها كثيرًا.
items.trinkets.shardofoblivion.typical_stats_desc=عادةً ما تزيد هذه الزينة من معدل سقوط الغنائم من الأعداء بنسبة 20%% عن كل قطعة من المعدات غير المحددة التي قمت بتجهيزها أو استخدامها مؤخرًا, بحد أقصى _%d عنصر._ ستمنعك الشظية أيضًا من تحديد المعدات, لكن يمكن استخدامها لتحديد العناصر الجاهزة لذلك يدويًا.
items.trinkets.shardofoblivion.stats_desc=بمستواها الحالي, تزيد هذه الزينة من معدل سقوط الغنائم من الأعداء بنسبة 20%% عن كل قطعة من المعدات غير المحددة التي قمت بتجهيزها أو استخدامها مؤخرًا, بحد أقصى _%d عنصر._ ستمنعك الشظية أيضًا من تحديد المعدات, لكن يمكن استخدامها لتحديد العناصر الجاهزة لذلك يدويًا.
items.trinkets.shardofoblivion.ac_identify=تحديد الهوية
items.trinkets.shardofoblivion.identify_prompt=تحديد هوية عنصر
items.trinkets.shardofoblivion.identify_ready=عنصر جاهز لتحديد الهوية: %s. استخدم شظية النسيان عليه لتحديد هويته.
items.trinkets.shardofoblivion.identify_ready_worn=عناصرك الملبوسة جاهزة الآن جميعها لتحديد الهوية. استخدم شظية النسيان على العناصر لتحديد هويتها.
items.trinkets.shardofoblivion.identify_not_yet=هذا العنصر ليس جاهزًا لتحديد هويته بعد.
items.trinkets.shardofoblivion.identify=لقد حددت هوية العنصر!
items.trinkets.shardofoblivion$wandusetracker.name=تم استخدام عصا سحرية غير محددة
items.trinkets.shardofoblivion$wandusetracker.desc=لقد استخدمت مؤخرًا عصا سحرية غير محددة, والتي تُحتسب كقطعة واحدة من المعدات غير المحددة المستخدمة لشظية النسيان لفترة قصيرة.\n\nالأدوار المتبقية: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=تم استخدام سلاح مرمي غير محدد
items.trinkets.shardofoblivion$thrownusetracker.desc=لقد استخدمت مؤخرًا سلاحًا مرميًا غير محدد, والذي يُحتسب كقطعة واحدة من المعدات غير المحددة المستخدمة لشظية النسيان لفترة قصيرة.\n\nالأدوار المتبقية: %s.

items.trinkets.thirteenleafclover.name=برسيم ذو ثلاث عشرة ورقة
items.trinkets.thirteenleafclover.desc=بطريقة ما, تسبب غلي البرسيم في قدر الخيمياء في نموّ عدد كبير من الأوراق الإضافية! ليس من الواضح حقًا ما إذا كانت هذه التميمة تجلب الحظ أم النحس, ربما تجعل حظك أكثر فوضوية?
items.trinkets.thirteenleafclover.typical_stats_desc=عادةً ما تجعلك هذه الزينة تلحق أقصى ضرر _%1$d%%_ من الوقت, وأدنى ضرر _%2$d%%_ من الوقت.
items.trinkets.thirteenleafclover.stats_desc=في مستواها الحالي, ستجعلك هذه الزينة تلحق أقصى ضرر _%1$d%%_ من الوقت, وأدنى ضرر _%2$d%%_ من الوقت.

items.trinkets.trapmechanism.name=آلية الفخ
items.trinkets.trapmechanism.desc=الآلية الأساسية لأحد فخاخ الحفر في الزنزانة, منحوتة بعناية من الأرضية ليسهل حملها. يبدو أنها مرتبطة بالزنزانة نفسها بطريقة سحرية, مما يجعل التضاريس الخطرة أكثر شيوعًا, ولكنه يزيد أيضًا من انجذابك إليها.
items.trinkets.trapmechanism.typical_stats_desc=عادةً ما تجعل هذه الزينة _%1$d%%_ من الطوابق غير ذات الطابع المحدد مليئة إما بالفخاخ أو الهاويات بدلاً من ذلك. بالإضافة إلى ذلك, سيكون _%2$d%%_ من فخاخ الزنزانة المخفية مرئيًا بدلاً من ذلك.
items.trinkets.trapmechanism.stats_desc=في مستواها الحالي, ستجعل هذه الزينة _%1$d%%_ من الطوابق غير ذات الطابع المحدد مليئة إما بالفخاخ أو الهاويات بدلاً من ذلك. بالإضافة إلى ذلك, سيكون _%2$d%%_ من فخاخ الزنزانة المخفية مرئيًا بدلاً من ذلك.

items.trinkets.vialofblood.name=قارورة دم
items.trinkets.vialofblood.desc=تحتوي هذه القارورة الرقيقة على دم أحد سكان الزنزانة, وهو يتحرك ببطء أثناء تدوير القارورة. يبدو أنها تعزز سحريًا تأثيرات الشفاء الأقوى, ولكنها تؤخرها أيضًا.
items.trinkets.vialofblood.typical_stats_desc=عادةً ما تزيد هذه الزينة من الصحة العامة التي تحصل عليها من شرب جرعات الشفاء أو قرب الماء أو ينابيع الصحة عن طريق _ %1$s %% ومع ذلك, ستحدث هذه التأثيرات العلاجية ببطء أكبر, مما يؤدي إلى تجديد الحد الأقصى من _ %2$s _ نقاط الصحة لكل دور (يتناسب هذا مع مستوى البطل).
items.trinkets.vialofblood.stats_desc=في مستواها الحالي, ستزيد هذه الزينة من الصحة العامة التي تحصل عليها من شرب جرعات الشفاء, أو قرب الماء, أو ينابيع الصحة عن طريق _ %1$s %% ومع ذلك, ستحدث هذه التأثيرات العلاجية ببطء أكبر, مما يؤدي إلى تجديد الحد الأقصى من _ %2$s _ نقاط الصحة لكل دور (يتناسب هذا مع مستوى البطل).

items.trinkets.wondrousresin.name=راتنج عجيب
items.trinkets.wondrousresin.desc=يبدو أن هذا الراتنج الأزرق المتلألئ يحتوي على الجوهر المقطر لسحر العصا الملعونة. يبدو أن السحر الناتج عن وعاء الخيمياء قد جعله مستقرًا إلى حد ما, وهو يؤثر الآن على عصيك السحرية.
items.trinkets.wondrousresin.typical_stats_desc=عادةً ما تُجبر هذه الحلية تأثيرات العصا الملعونة على أن تصبح محايدة أو إيجابية. %1$s %% _ من الوقت, وسيؤدي ذلك إلى إطلاق العصي غير الملعونة صاعقة ملعونة إضافية محايدة أو إيجابية _ %2$s %% _ من الوقت.\n\nتتطلب هذه الزينة كمية أكبر من الطاقة لترقيتها.
items.trinkets.wondrousresin.stats_desc=بمستواها الحالي, ستجبر هذه الحلية تأثيرات العصا الملعونة على أن تصبح محايدة أو إيجابية. %1$s %% _ من الوقت, وسيؤدي ذلك إلى إطلاق العصي غير الملعونة صاعقة ملعونة إضافية محايدة أو إيجابية _ %2$s %% _ من الوقت.\n\nتتطلب هذه الزينة كمية أكبر من الطاقة لترقيتها.

items.trinkets.trinketcatalyst.name=محفز سحري
items.trinkets.trinketcatalyst.window_title=إنشاء حُليّة
items.trinkets.trinketcatalyst.window_text=يبدأ الماء بالتوهج عندما تضيف المحفز. هناك بعض العناصر القريبة التي يمكنك تشبيعها بالطاقة لتحويلها إلى حُليّة سحرية.
items.trinkets.trinketcatalyst.desc=تتألق هذه الكرة من الغبار الذهبي السحري في ظلام الزنزانة. يمكن استخدام هذا المحفز في وعاء الخيمياء مع القليل من الطاقة الخيميائية لإنتاج قطعة حلي فريدة.\n\nتُضفي الحلي تأثيرات متنوعة تُغيّر الزنزانة أو سكانها بشكل طفيف. يُمكن ترقية الحلي بمزيد من الطاقة لزيادة قوة تأثيرها, أو التخلص منها لإلغاء التأثير تمامًا.
items.trinkets.trinketcatalyst$randomtrinket.name=حُليّة عشوائية
items.trinkets.trinketcatalyst$randomtrinket.desc=أحد العناصر القريبة عالق داخل جراب لا يمكنك فتحه.\n\nستذيب عملية الخيمياء الجراب بعيدًا, لكنك لن تعرف ما هي الحُليّة التي ستحصل عليها حتى تفعل ذلك!

items.trinkets.trinket.discover_hint=يمتلك هذا العنصر فرصة ليكون خيارًا كلما صنعت حُليّة عبر الخيمياء.
items.trinkets.trinket$placeholder.name=حليه

