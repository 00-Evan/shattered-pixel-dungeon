scenes.heroselectscene.daily=الجولة اليومية
scenes.heroselectscene.daily_desc=تتوفر كل يوم لعبة جديدة وهي نفسها للجميع! هذه "الجولة اليومية" تولد نفس الزنزانة لكل شخص يلعبها (طالما أنهم يلعبون نفس إصدار اللعبة).\n\nيمكنك قضاء الوقت الذي تريده لإكمال الجري اليومي, ولكن لا يمكنك تفعيل سوى جري واحد في كل مرة. لا تُؤهلك الجريات اليومية للحصول على شارات, ولها صفحة تصنيف منفصلة خاصة بها.\n\nهل ترغب في بدء مهام اليوم اليومية مع البطل والتحديات التي اخترتها حاليًا?
scenes.heroselectscene.daily_yes=اجل
scenes.heroselectscene.daily_no=لا
scenes.heroselectscene.daily_repeat=لقد لعبتَ التحدي اليومي بالفعل. يمكنك إعادة لعبه إذا أردت, ولكن فقط كتدريب غير مصنف.\n\nبعد إكمال إعادة التشغيل, ستتمكن من مشاهدتها من نافذة التصنيفات اليومية لفترة قصيرة قبل حذف السجل.\n\nهل ترغب في إعادة لعب تحديات اليوم اليومية باستخدام بطلك المختار حاليًا?
scenes.heroselectscene.daily_unavailable_long=يبدو أنك بدأت جولة يومية تخص المستقبل! يمكن أن يحدث هذا إذا غيرت المنطقة الزمنية مؤخراً أو إذا غيرت ساعة النظام. _ستكون جولتك اليومية التالية متاحة بعد %d أيام._
scenes.heroselectscene.daily_existing=لديك بالفعل جولة يومية جارية. يجب أن تنهيها قبل بدء جولة يومية أخرى.
scenes.heroselectscene.daily_nowin=تتوفر كل يوم لعبة جديدة وهي نفسها للجميع! هذه "الجولة اليومية" تولد نفس الزنزانة لكل شخص يلعبها (طالما أنهم يلعبون نفس إصدار اللعبة).\n\nيجب عليك الفوز بمباراة واحدة على الأقل قبل أن تتمكن من لعب الجولات اليومية.
scenes.heroselectscene.custom_seed_title=أدخل بذرة مخصصة
scenes.heroselectscene.custom_seed_desc=تستخدم اللعبة رمزًا أساسيًا لتوليد الأبراج المحصنة, حيث يؤدي استخدام نفس الرمز الأساسي ونفس إصدار اللعبة دائمًا إلى توليد نفس البرج المحصن! _لا يمكن للألعاب ذات الرموز الأساسية المخصصة الحصول على شارات أو المساهمة في الألعاب التي تم لعبها, وتظهر في أسفل صفحة الترتيب._
scenes.heroselectscene.custom_seed_duplicate=لديك بالفعل لعبة عادية جارية بهذه البذرة. يجب أن تنهيها قبل استخدام هذه البذرة المخصصة.
scenes.heroselectscene.custom_seed_nowin=تستخدم اللعبة رمز بذرة لتوليد الزنزانة, وستولّد البذرة نفسها وإصدار اللعبة نفسه دائماً الزنزانة نفسها!\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من إدخال بذرات مخصصة._
scenes.heroselectscene.custom_seed_set=وضع
scenes.heroselectscene.custom_seed_clear=مسح
scenes.heroselectscene.challenges_nowin=التحديات هي تعديلات اختيارية تجعل اللعبة أكثر صعوبة. بعض التحديات تجعل الزنزانة أكثر خطورة, بينما يقلل البعض الآخر من قوة قدراتك أو عناصرك.\n\nيجب عليك الفوز بمباراة واحدة على الأقل قبل أن تتمكن من تفعيل التحديات.
