scenes.supporterscene.title=دعم اللعبة
scenes.supporterscene.intro=أريد أن تكون لعبة Shattered Pixel Dungeon خالية من الإعلانات والمعاملات الدقيقة التطفلية, التي تُفسد الكثير من الألعاب المجانية. بدلاً من ذلك, أفضّل أن أطلب من اللاعبين دعم اللعبة مباشرة!
scenes.supporterscene.patreon_msg=إذا كنت تستمتع بـ Shattered وترغب في مساعدتي على الاستمرار في إنتاجه, فيرجى التفكير في دعمي على Patreon! يحتوي Patreon على مجموعة من المزايا الحصرية!\n_- الوصول المبكر_ إلى النسخ التجريبية من التحديثات المستقبلية.\n_- مدونات قصيرة أسبوعية_ تتضمن معلومات حول ما أعمل عليه.\n_- استطلاعات الرأي الشهرية_ التي تؤثر بشكل مباشر على المحتوى الذي أقوم بتطويره.\n_- دبابيس مكافأة مادية_ بعد سنة وسنتين وثلاث سنوات من الرعاية.\n- خادم ديسكورد مجتمعي يحتوي على سجل للمطورين وقنوات دردشة.\n\nوالمزيد! يمكنك زيارة صفحة باتريون للمزيد من المعلومات. شكرًا لوقتكم, ونتمنى لكم مغامرات ممتعة في الأبراج المحصنة
scenes.supporterscene.patreon_english=(لاحظ أن مكافآت Patreon متاحة باللغة الإنجليزية فقط.)
scenes.supporterscene.supporter_link=انتقل إلى صفحة Patreon

