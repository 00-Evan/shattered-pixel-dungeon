scenes.supporterscene.title=Support the Game
scenes.supporterscene.intro=I want Shattered Pixel Dungeon to be free of ads and invasive microtransactions, which ruin so many free games. Instead, I'd rather ask players to support the game directly!
scenes.supporterscene.patreon_msg=إذا كنت تستمتع بـ Shattered وترغب في مساعدتي على الاستمرار في إنتاجه، فيرجى التفكير في دعمي على Patreon! يحتوي Patreon على مجموعة من المزايا الحصرية!  _- الوصول المبكر_ إلى النسخ التجريبية من التحديثات المستقبلية.  _- مدونات قصيرة أسبوعية_ تتضمن معلومات حول ما أعمل عليه.  _- استطلاعات الرأي الشهرية_ التي تؤثر بشكل مباشر على المحتوى الذي أقوم بتطويره.  _- دبابيس مكافأة مادية_ بعد سنة وسنتين وثلاث سنوات من الرعاية.  - خادم ديسكورد مجتمعي يحتوي على سجل للمطورين وقنوات دردشة.   والمزيد! يمكنك زيارة صفحة باتريون للمزيد من المعلومات. شكرًا لوقتكم، ونتمنى لكم مغامرات ممتعة في الأبراج المحصنة
scenes.supporterscene.patreon_english=(Note that Patreon rewards are only available in English.)
scenes.supporterscene.supporter_link=Go to Patreon Page

