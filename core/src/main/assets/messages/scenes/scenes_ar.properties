scenes.amuletscene.text=وأخيرًا، ها هي بين يديك، تميمة يندور! بقوة هذه التميمة، لن يقف شيء في طريقك! لقد اجتزت الزنزانة ونجحت في مهمتك! أو ربما لستَ مستعدًا بعد؟ يمكنك أيضًا أن تقرر الاحتفاظ بالتميمة، والبقاء مجرد إنسان لفترة أطول، وربما مغادرة الزنزانة بالطريقة التقليدية

