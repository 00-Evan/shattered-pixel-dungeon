scenes.titlescene$changesbutton.title=تحديث متاح!
scenes.titlescene$changesbutton.versioned_title=%sتحديث متاح
scenes.titlescene$changesbutton.desc=يتم تحديث لعبة Shattered Pixel Dungeon بانتظام من خلال إصلاحات شاملة لمحتوى اللعبة الحالي, أو محتوى جديد كليًا!\n\nكما يتم تحسين توازن اللعبة بشكل متكرر في تحديثات اللعبة, بحيث لا تكون عناصر/أبطال/أعداء معينة قوية جدًا أو ضعيفة جدًا.\n\nتتضمن التحديثات أيضًا إصلاحات للأخطاء وتحسينات أخرى متنوعة في الاستقرار.
scenes.titlescene$changesbutton.update=انتقل إلى صفحة التحديث
scenes.titlescene$changesbutton.changes=شاشة التغييرات الحالية
scenes.titlescene.patreon_body=لعبة Shattered Pixel Dungeon هي لعبة مجانية تمامًا, مما يعني أنني أعتمد على دعم اللاعبين الكرماء من أجل الاستمرار في تطويرها.\n\nإذا كنت ترغب في دعمي, فإن أفضل طريقة هي عبر منصة باتريون. توفر هي باتريون مصدر دخل ثابت, وتتيح لي رد الجميل لمن يدعمونني!\n\nيحصل الداعمون على منشورات مدونة حصرية كل أسبوع تُطلعهم على ما أعمل عليه قبل أي شخص آخر!\n\nيمكنكم الاطلاع على صفحتي على باتريون للحصول على أحدث المعلومات حول المزايا, شكرًا لكم على اهتمامكم!\n\n(مكافآت باتريون متوفرة باللغة الإنجليزية فقط)
scenes.titlescene.patreon_button=صفحة Patreon

scenes.welcomescene.update_intro=تم تحديث لعبة Shattered Pixel Dungeon!
scenes.welcomescene.update_msg=يُعد الإصدار v4.0 على الأرجح أكبر تحديثات Shattered حتى الآن! هناك مهمة جديدة ضخمة, ومجموعة من الرسوم الجديدة داخل اللعبة, و6 تعويذات سحرية جديدة, والكثير من التغييرات والتعديلات الأصغر.
scenes.welcomescene.patch_intro=تم تثبيت تصحيح للعبة Shattered Pixel Dungeon!
scenes.welcomescene.patch_bugfixes=يحتوي هذا التصحيح على إصلاحات للأخطاء.
scenes.welcomescene.patch_translations=يحتوي هذا التصحيح على تحديثات للترجمات.
scenes.welcomescene.patch_balance=يحتوي هذا التصحيح على تعديلات على توازن اللعبة.
scenes.welcomescene.patch_msg=يحتوي هذا التصحيح أيضاً على بعض التعديلات الصغيرة وتحسينات في الأداء.
scenes.welcomescene.what_msg=يبدو أن ملفات الحفظ الحالية لديك مأخوذة من إصدار مستقبلي من لعبة Shattered Pixel Dungeon!\n\nتوخ الحذر! قد تحتوي ملفات الحفظ الخاصة بك على أشياء غير موجودة في هذا الإصدار, وهذا قد يتسبب في حدوث بعض الأخطاء الغريبة للغاية
scenes.welcomescene.lang_warning_title=ترجمه غير مكتمله
scenes.welcomescene.lang_warning_msg=لم تتم ترجمة بعض المحتويات الجديدة من هذا التحديث بعد.\n\nقد تكون بعض العبارات مكتوبة باللغة الإنجليزية.\n\nتعمل فرق الترجمة على حل هذه المشكلة, ومن المتوقع إضافة ترجمة كاملة قريباً.\n\nشكراً لصبركم.
scenes.welcomescene.continue=اكمل
scenes.welcomescene.changelist=قائمة التغييرات
scenes.welcomescene.save_warning=تعرّضت لعبة Shattered Pixel Dungeon لانقطاع أثناء محاولتها حفظ بيانات اللعبة مؤخرًا. تتمتع اللعبة بحماية مدمجة ضد هذا النوع من المشاكل, لذا من المفترض أن تكون بيانات لعبتك سليمة.\n\nيحدث هذا عادةً عندما ينقطع التيار الكهربائي عن جهازك فجأة, أو إذا توقف تطبيق Shattered عن العمل دون إغلاقه بشكل صحيح. غالبًا ما تتسبب ميزات توفير الطاقة في حدوث ذلك على الأجهزة المحمولة. قد يساعد إعادة تشغيل جهازك أيضًا إذا كنت تواجه هذا الخطأ بشكل متكرر.
scenes.welcomescene.controller_title=إدخال وحدة التحكم
scenes.welcomescene.controller_body=تلعب باستخدام وحدة تحكم? استخدم العصا اليمنى للتحكم في مؤشر على الشاشة.\n\nاضغط RT/R2 أو العصا اليمنى للتحديد باستخدام المؤشر.
scenes.welcomescene.controller_okay=حسنا
